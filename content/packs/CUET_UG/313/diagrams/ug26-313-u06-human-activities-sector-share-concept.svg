<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Arial, Helvetica, sans-serif">
  <title>Illustrative change in sector shares</title>
  <text x="320" y="28" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">Share of workers by sector (illustrative, not real data)</text>
  <text x="160" y="92" font-size="14" text-anchor="end" fill="#1f2937">Early stage</text>
  <rect x="170" y="60" width="252.0" height="48" rx="0" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
  <text x="296.0" y="90" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">60</text>
  <rect x="422.0" y="60" width="63.0" height="48" rx="0" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
  <text x="453.5" y="90" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">15</text>
  <rect x="485.0" y="60" width="105.0" height="48" rx="0" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>
  <text x="537.5" y="90" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">25</text>
  <text x="160" y="162" font-size="14" text-anchor="end" fill="#1f2937">Industrial stage</text>
  <rect x="170" y="130" width="105.0" height="48" rx="0" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
  <text x="222.5" y="160" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">25</text>
  <rect x="275.0" y="130" width="168.0" height="48" rx="0" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
  <text x="359.0" y="160" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">40</text>
  <rect x="443.0" y="130" width="147.0" height="48" rx="0" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>
  <text x="516.5" y="160" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">35</text>
  <text x="160" y="232" font-size="14" text-anchor="end" fill="#1f2937">Advanced stage</text>
  <rect x="170" y="200" width="33.6" height="48" rx="0" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
  <text x="186.8" y="230" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">8</text>
  <rect x="203.6" y="200" width="113.4" height="48" rx="0" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
  <text x="260.3" y="230" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">27</text>
  <rect x="317.0" y="200" width="273.0" height="48" rx="0" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>
  <text x="453.5" y="230" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">65</text>
  <line x1="170" y1="265" x2="590" y2="265" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="170.0" y1="265" x2="170.0" y2="272" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="170.0" y="290" font-size="14" text-anchor="middle" fill="#1f2937">0</text>
  <line x1="275.0" y1="265" x2="275.0" y2="272" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="275.0" y="290" font-size="14" text-anchor="middle" fill="#1f2937">25</text>
  <line x1="380.0" y1="265" x2="380.0" y2="272" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="380.0" y="290" font-size="14" text-anchor="middle" fill="#1f2937">50</text>
  <line x1="485.0" y1="265" x2="485.0" y2="272" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="485.0" y="290" font-size="14" text-anchor="middle" fill="#1f2937">75</text>
  <line x1="590.0" y1="265" x2="590.0" y2="272" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="590.0" y="290" font-size="14" text-anchor="middle" fill="#1f2937">100</text>
  <text x="380.0" y="312" font-size="14" text-anchor="middle" fill="#1f2937">Share of workers (%)</text>
  <rect x="40" y="330" width="16" height="16" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
  <text x="62" y="343" font-size="14" text-anchor="start" fill="#1f2937">Primary</text>
  <rect x="140" y="330" width="16" height="16" rx="2" fill="#d97706" stroke="#d97706" stroke-width="2"/>
  <text x="162" y="343" font-size="14" text-anchor="start" fill="#1f2937">Secondary</text>
  <rect x="260" y="330" width="16" height="16" rx="2" fill="#059669" stroke="#059669" stroke-width="2"/>
  <text x="282" y="343" font-size="14" text-anchor="start" fill="#1f2937">Tertiary + quaternary</text>
</svg>
