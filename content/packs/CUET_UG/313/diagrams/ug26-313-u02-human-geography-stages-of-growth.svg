<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 490" font-family="Arial, Helvetica, sans-serif">
  <text x="40" y="28" font-size="15" fill="#1f2937" font-weight="bold">Stages in the growth of the subject (earlier to later)</text>
  <line x1="46" y1="70" x2="46" y2="418" stroke="#6b7280" stroke-width="2"/>
  <circle cx="46" cy="70" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="46" y="75" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">1</text>
  <text x="78" y="67" font-size="15" fill="#1f2937" font-weight="bold">Early colonial period</text>
  <text x="78" y="87" font-size="14" fill="#6b7280">explorers and traders collect information on new lands</text>
  <circle cx="46" cy="128" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="46" y="133" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">2</text>
  <text x="78" y="125" font-size="15" fill="#1f2937" font-weight="bold">Regional analysis</text>
  <text x="78" y="145" font-size="14" fill="#6b7280">study of a region as a whole, with all its elements</text>
  <circle cx="46" cy="186" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="46" y="191" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">3</text>
  <text x="78" y="183" font-size="15" fill="#1f2937" font-weight="bold">Areal differentiation</text>
  <text x="78" y="203" font-size="14" fill="#6b7280">how and why places differ from one another</text>
  <circle cx="46" cy="244" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="46" y="249" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">4</text>
  <text x="78" y="241" font-size="15" fill="#1f2937" font-weight="bold">Spatial organisation (about the 1960s)</text>
  <text x="78" y="261" font-size="14" fill="#6b7280">quantitative revolution: statistics, models and laws</text>
  <circle cx="46" cy="302" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="46" y="307" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">5</text>
  <text x="78" y="299" font-size="15" fill="#1f2937" font-weight="bold">Humanistic approach</text>
  <text x="78" y="319" font-size="14" fill="#6b7280">human experience, perception and values</text>
  <circle cx="46" cy="360" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="46" y="365" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">6</text>
  <text x="78" y="357" font-size="15" fill="#1f2937" font-weight="bold">Radical approach</text>
  <text x="78" y="377" font-size="14" fill="#6b7280">poverty, inequality and social structure</text>
  <circle cx="46" cy="418" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="46" y="423" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">7</text>
  <text x="78" y="415" font-size="15" fill="#1f2937" font-weight="bold">Behavioural approach</text>
  <text x="78" y="435" font-size="14" fill="#6b7280">how people see and respond to their surroundings</text>
  <text x="330" y="478" font-size="14" fill="#6b7280" text-anchor="middle">The lesson gives a date only for the quantitative revolution (about the 1960s).</text>
</svg>
