<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="Arial, Helvetica, sans-serif">
  <title>Railway gauges</title>
  <text x="320" y="26" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">Track gauge = distance between the rails</text>
  <text x="320" y="48" font-size="14" text-anchor="middle" fill="#6b7280">(gap drawn in proportion to the metres given in the lesson)</text>
  <text x="40" y="79" font-size="15" text-anchor="start" fill="#059669" font-weight="bold">Broad gauge: 1.676 m</text>
  <rect x="35" y="95" width="10" height="28" rx="2" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>
  <rect x="537.8" y="95" width="10" height="28" rx="2" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>
  <rect x="20" y="123" width="542.8" height="6" rx="1" fill="#6b7280" stroke="#6b7280" stroke-width="2"/>
  <line x1="58.0" y1="109.0" x2="524.8" y2="109.0" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <polygon points="535.8,109.0 524.8,115.0 524.8,103.0" fill="#059669"/>
  <polygon points="47.0,109.0 58.0,103.0 58.0,115.0" fill="#059669"/>
  <text x="40" y="159" font-size="15" text-anchor="start" fill="#2563eb" font-weight="bold">Metre gauge: 1.000 m</text>
  <rect x="35" y="175" width="10" height="28" rx="2" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>
  <rect x="335.0" y="175" width="10" height="28" rx="2" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>
  <rect x="20" y="203" width="340.0" height="6" rx="1" fill="#6b7280" stroke="#6b7280" stroke-width="2"/>
  <line x1="58.0" y1="189.0" x2="322.0" y2="189.0" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <polygon points="333.0,189.0 322.0,195.0 322.0,183.0" fill="#2563eb"/>
  <polygon points="47.0,189.0 58.0,183.0 58.0,195.0" fill="#2563eb"/>
  <text x="40" y="239" font-size="15" text-anchor="start" fill="#d97706" font-weight="bold">Narrow gauge: 0.762 m</text>
  <rect x="35" y="255" width="10" height="28" rx="2" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>
  <rect x="263.6" y="255" width="10" height="28" rx="2" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>
  <rect x="20" y="283" width="268.6" height="6" rx="1" fill="#6b7280" stroke="#6b7280" stroke-width="2"/>
  <line x1="58.0" y1="269.0" x2="250.60000000000002" y2="269.0" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <polygon points="261.6,269.0 250.6,275.0 250.6,263.0" fill="#d97706"/>
  <polygon points="47.0,269.0 58.0,263.0 58.0,275.0" fill="#d97706"/>
  <text x="40" y="319" font-size="15" text-anchor="start" fill="#dc2626" font-weight="bold">Narrow gauge (smaller): 0.610 m</text>
  <rect x="35" y="335" width="10" height="28" rx="2" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>
  <rect x="218.0" y="335" width="10" height="28" rx="2" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>
  <rect x="20" y="363" width="223.0" height="6" rx="1" fill="#6b7280" stroke="#6b7280" stroke-width="2"/>
  <line x1="58.0" y1="349.0" x2="205.0" y2="349.0" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <polygon points="216.0,349.0 205.0,355.0 205.0,343.0" fill="#dc2626"/>
  <polygon points="47.0,349.0 58.0,343.0 58.0,355.0" fill="#dc2626"/>
  <text x="40" y="408" font-size="14" text-anchor="start" fill="#6b7280">Gauge conversion programme: replace the others by broad gauge</text>
</svg>
