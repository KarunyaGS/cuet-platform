<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" font-family="Arial, Helvetica, sans-serif">
  <title>Shifting cultivation cycle</title>
  <text x="320" y="26" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">Shifting cultivation (slash and burn): the cycle</text>
  <rect x="210" y="45" width="220" height="70" rx="6" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="320.0" y="75.82" font-size="15" text-anchor="middle" fill="#059669" font-weight="bold">1 Clear and burn</text>
  <text x="320.0" y="94.82" font-size="15" text-anchor="middle" fill="#1f2937">a patch of forest</text>
  <rect x="420" y="170" width="210" height="80" rx="6" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="525.0" y="205.82" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold">2 Cultivate crops</text>
  <text x="525.0" y="224.82" font-size="15" text-anchor="middle" fill="#1f2937">for a few years</text>
  <rect x="210" y="300" width="220" height="80" rx="6" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="320.0" y="326.32" font-size="15" text-anchor="middle" fill="#dc2626" font-weight="bold">3 Fertility falls</text>
  <text x="320.0" y="345.32" font-size="15" text-anchor="middle" fill="#1f2937">farmer abandons the plot</text>
  <text x="320.0" y="364.32" font-size="15" text-anchor="middle" fill="#1f2937">and moves on</text>
  <rect x="10" y="170" width="200" height="80" rx="6" fill="none" stroke="#d97706" stroke-width="2"/>
  <text x="110.0" y="196.32" font-size="15" text-anchor="middle" fill="#d97706" font-weight="bold">4 Land recovers</text>
  <text x="110.0" y="215.32" font-size="15" text-anchor="middle" fill="#1f2937">the abandoned plot is</text>
  <text x="110.0" y="234.32" font-size="15" text-anchor="middle" fill="#1f2937">left to recover</text>
  <line x1="430" y1="90" x2="511.7784974944797" y2="162.69199777287088" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="520.0,170.0 507.8,167.2 515.8,158.2" fill="#1f2937"/>
  <line x1="520" y1="250" x2="438.2215025055203" y2="322.6919977728709" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="430.0,330.0 434.2,318.2 442.2,327.2" fill="#1f2937"/>
  <line x1="210" y1="340" x2="118.17623560871883" y2="257.3586120478469" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="110.0,250.0 122.2,252.9 114.2,261.8" fill="#1f2937"/>
  <line x1="110" y1="170" x2="201.61866750464594" y2="92.12413262105095" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="210.0,85.0 205.5,96.7 197.7,87.6" fill="#1f2937"/>
  <text x="75" y="100" font-size="14" text-anchor="middle" fill="#6b7280">then a new patch</text>
  <text x="75" y="120" font-size="14" text-anchor="middle" fill="#6b7280">is cleared</text>
  <text x="320" y="205" font-size="14" text-anchor="middle" fill="#6b7280">Needs low population</text>
  <text x="320" y="225" font-size="14" text-anchor="middle" fill="#6b7280">density and plenty of land</text>
  <text x="320" y="418" font-size="14" text-anchor="middle" fill="#6b7280">Names: jhum (India), milpa, conuco, roca, ladang</text>
</svg>
