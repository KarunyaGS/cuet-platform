<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" font-family="Arial, Helvetica, sans-serif">
  <text x="330" y="28" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">How the Census decides that a place is urban</text>
  <rect x="20" y="50" width="250" height="230" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="145" y="78" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">Statutory town</text>
  <text x="145" y="106" font-size="14" fill="#1f2937" text-anchor="middle">It has a municipality,</text>
  <text x="145" y="126" font-size="14" fill="#1f2937" text-anchor="middle">corporation, cantonment</text>
  <text x="145" y="146" font-size="14" fill="#1f2937" text-anchor="middle">board or notified town</text>
  <text x="145" y="166" font-size="14" fill="#1f2937" text-anchor="middle">area committee</text>
  <text x="145" y="222" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="middle">No further test needed</text>
  <text x="145" y="242" font-size="14" fill="#6b7280" text-anchor="middle">(legal status decides)</text>
  <text x="300" y="168" font-size="17" fill="#6b7280" font-weight="bold" text-anchor="middle">OR</text>
  <rect x="330" y="50" width="310" height="230" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="485" y="78" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">Census town: must pass all three</text>
  <rect x="345" y="96" width="280" height="46" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="485" y="124" font-size="14" fill="#1f2937" text-anchor="middle">Population of 5,000 or more</text>
  <rect x="345" y="152" width="280" height="46" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="485" y="180" font-size="14" fill="#1f2937" text-anchor="middle">Density of 400 or more persons per km²</text>
  <rect x="345" y="208" width="280" height="46" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="485" y="228" font-size="14" fill="#1f2937" text-anchor="middle">75 per cent or more of male main</text>
  <text x="485" y="246" font-size="14" fill="#1f2937" text-anchor="middle">workers in non-agricultural work</text>
  <text x="485" y="296" font-size="14" fill="#6b7280" text-anchor="middle">(tests 1 AND 2 AND 3)</text>
  <line x1="145" y1="282" x2="145" y2="331.2" stroke="#1f2937" stroke-width="2.5"/>
  <polygon points="145,340 140.1,329 149.9,329" fill="#1f2937"/>
  <line x1="485" y1="304" x2="485" y2="331.2" stroke="#1f2937" stroke-width="2.5"/>
  <polygon points="485,340 480.1,329 489.9,329" fill="#1f2937"/>
  <rect x="130" y="342" width="400" height="56" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/>
  <text x="330" y="376" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="middle">Place is counted as URBAN</text>
  <text x="330" y="430" font-size="15" fill="#1f2937" text-anchor="middle">A place that is neither is treated as rural.</text>
  <text x="330" y="456" font-size="14" fill="#6b7280" text-anchor="middle">Schematic flow chart of the tests given in the lesson.</text>
</svg>
