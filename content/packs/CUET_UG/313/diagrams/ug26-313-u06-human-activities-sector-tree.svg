<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Arial, Helvetica, sans-serif">
  <title>Classification of economic activities</title>
  <rect x="170" y="10" width="300" height="50" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
  <text x="320.0" y="31.04" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">Economic activities</text>
  <text x="320.0" y="49.04" font-size="14" text-anchor="middle" fill="#1f2937">(any activity that earns an income)</text>
  <line x1="320" y1="60" x2="82" y2="100" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
  <rect x="10" y="100" width="145" height="130" rx="6" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="82.5" y="134.04" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">Primary</text>
  <text x="82.5" y="152.04" font-size="14" text-anchor="middle" fill="#1f2937">Extract from</text>
  <text x="82.5" y="170.04" font-size="14" text-anchor="middle" fill="#1f2937">nature</text>
  <text x="82.5" y="188.04" font-size="14" text-anchor="middle" fill="#1f2937">mining, farming,</text>
  <text x="82.5" y="206.04" font-size="14" text-anchor="middle" fill="#1f2937">fishing, gathering</text>
  <line x1="155" y1="165" x2="159.0" y2="165.0" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
  <polygon points="170.0,165.0 159.0,171.0 159.0,159.0" fill="#6b7280"/>
  <line x1="320" y1="60" x2="242" y2="100" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
  <rect x="170" y="100" width="145" height="130" rx="6" fill="none" stroke="#d97706" stroke-width="2"/>
  <text x="242.5" y="134.04" font-size="14" text-anchor="middle" fill="#d97706" font-weight="bold">Secondary</text>
  <text x="242.5" y="152.04" font-size="14" text-anchor="middle" fill="#1f2937">Make goods</text>
  <text x="242.5" y="170.04" font-size="14" text-anchor="middle" fill="#1f2937">manufacturing,</text>
  <text x="242.5" y="188.04" font-size="14" text-anchor="middle" fill="#1f2937">agro-processing,</text>
  <text x="242.5" y="206.04" font-size="14" text-anchor="middle" fill="#1f2937">construction</text>
  <line x1="315" y1="165" x2="319.0" y2="165.0" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
  <polygon points="330.0,165.0 319.0,171.0 319.0,159.0" fill="#6b7280"/>
  <line x1="320" y1="60" x2="402" y2="100" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
  <rect x="330" y="100" width="145" height="130" rx="6" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="402.5" y="134.04" font-size="14" text-anchor="middle" fill="#059669" font-weight="bold">Tertiary</text>
  <text x="402.5" y="152.04" font-size="14" text-anchor="middle" fill="#1f2937">Provide services</text>
  <text x="402.5" y="170.04" font-size="14" text-anchor="middle" fill="#1f2937">trade, transport,</text>
  <text x="402.5" y="188.04" font-size="14" text-anchor="middle" fill="#1f2937">banking, health,</text>
  <text x="402.5" y="206.04" font-size="14" text-anchor="middle" fill="#1f2937">tourism</text>
  <line x1="475" y1="165" x2="479.0" y2="165.0" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
  <polygon points="490.0,165.0 479.0,171.0 479.0,159.0" fill="#6b7280"/>
  <line x1="320" y1="60" x2="562" y2="100" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
  <rect x="490" y="100" width="145" height="130" rx="6" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="562.5" y="134.04" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">Quaternary</text>
  <text x="562.5" y="152.04" font-size="14" text-anchor="middle" fill="#1f2937">Knowledge work</text>
  <text x="562.5" y="170.04" font-size="14" text-anchor="middle" fill="#1f2937">research, IT,</text>
  <text x="562.5" y="188.04" font-size="14" text-anchor="middle" fill="#1f2937">consultancy,</text>
  <text x="562.5" y="206.04" font-size="14" text-anchor="middle" fill="#1f2937">data processing</text>
  <line x1="562" y1="230" x2="562" y2="278" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/>
  <rect x="300" y="278" width="330" height="70" rx="6" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="465.0" y="300.04" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">Quinary (a higher level)</text>
  <text x="465.0" y="318.04" font-size="14" text-anchor="middle" fill="#1f2937">top decision makers in government</text>
  <text x="465.0" y="336.04" font-size="14" text-anchor="middle" fill="#1f2937">and business</text>
  <text x="150" y="300" font-size="14" text-anchor="middle" fill="#6b7280">Arrows: the chain of use</text>
  <text x="150" y="320" font-size="14" text-anchor="middle" fill="#6b7280">e.g. wheat grown, milled,</text>
  <text x="150" y="340" font-size="14" text-anchor="middle" fill="#6b7280">sold, then improved by research</text>
  <text x="320" y="385" font-size="14" text-anchor="middle" fill="#6b7280" font-style="italic">Schematic classification, not to scale</text>
</svg>
