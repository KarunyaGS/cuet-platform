<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="Arial, Helvetica, sans-serif">
  <text x="30" y="30" font-size="16" fill="#1f2937" font-weight="bold">Ten plots of land (illustrative)</text>
  <rect x="30" y="52" width="60" height="76" rx="0" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="60" y="74" font-size="14" fill="#059669" font-weight="bold" text-anchor="middle">crop 1</text>
  <rect x="98" y="52" width="60" height="76" rx="0" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="128" y="74" font-size="14" fill="#059669" font-weight="bold" text-anchor="middle">crop 1</text>
  <rect x="104" y="86" width="48" height="34" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="128" y="108" font-size="14" fill="#d97706" font-weight="bold" text-anchor="middle">crop 2</text>
  <rect x="166" y="52" width="60" height="76" rx="0" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="196" y="74" font-size="14" fill="#059669" font-weight="bold" text-anchor="middle">crop 1</text>
  <rect x="234" y="52" width="60" height="76" rx="0" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="264" y="74" font-size="14" fill="#059669" font-weight="bold" text-anchor="middle">crop 1</text>
  <rect x="240" y="86" width="48" height="34" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="264" y="108" font-size="14" fill="#d97706" font-weight="bold" text-anchor="middle">crop 2</text>
  <rect x="302" y="52" width="60" height="76" rx="0" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="332" y="74" font-size="14" fill="#059669" font-weight="bold" text-anchor="middle">crop 1</text>
  <rect x="30" y="138" width="60" height="76" rx="0" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="60" y="160" font-size="14" fill="#059669" font-weight="bold" text-anchor="middle">crop 1</text>
  <rect x="98" y="138" width="60" height="76" rx="0" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="128" y="160" font-size="14" fill="#059669" font-weight="bold" text-anchor="middle">crop 1</text>
  <rect x="104" y="172" width="48" height="34" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="128" y="194" font-size="14" fill="#d97706" font-weight="bold" text-anchor="middle">crop 2</text>
  <rect x="166" y="138" width="60" height="76" rx="0" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="196" y="160" font-size="14" fill="#059669" font-weight="bold" text-anchor="middle">crop 1</text>
  <rect x="234" y="138" width="60" height="76" rx="0" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="264" y="160" font-size="14" fill="#059669" font-weight="bold" text-anchor="middle">crop 1</text>
  <rect x="240" y="172" width="48" height="34" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="264" y="194" font-size="14" fill="#d97706" font-weight="bold" text-anchor="middle">crop 2</text>
  <rect x="302" y="138" width="60" height="76" rx="0" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="332" y="160" font-size="14" fill="#059669" font-weight="bold" text-anchor="middle">crop 1</text>
  <text x="30" y="242" font-size="14" fill="#6b7280">Every plot is sown once; 4 plots are sown a second time in the year.</text>
  <rect x="390" y="40" width="245" height="175" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="402" y="68" font-size="15" fill="#059669" font-weight="bold">Net sown area (NSA)</text>
  <text x="402" y="88" font-size="14" fill="#1f2937">= 10 plots (each counted once)</text>
  <text x="402" y="115" font-size="15" fill="#d97706" font-weight="bold">Sown more than once</text>
  <text x="402" y="135" font-size="14" fill="#1f2937">= 4 plots</text>
  <text x="402" y="162" font-size="15" fill="#1f2937" font-weight="bold">Gross cropped area (GCA)</text>
  <text x="402" y="182" font-size="14" fill="#1f2937">= 10 + 4 = 14 plots</text>
  <rect x="30" y="262" width="605" height="78" rx="8" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="332" y="292" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">Cropping intensity = GCA / NSA x 100</text>
  <text x="332" y="322" font-size="14" fill="#1f2937" text-anchor="middle">= 14 / 10 x 100 = 140 per cent (more than 100: some land is cropped twice)</text>
  <text x="330" y="368" font-size="14" fill="#6b7280" text-anchor="middle">Illustrative numbers only; schematic, not to scale.</text>
</svg>
