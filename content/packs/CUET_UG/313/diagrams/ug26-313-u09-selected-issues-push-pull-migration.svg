<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="Arial, Helvetica, sans-serif">
  <title>Push and pull migration</title>
  <text x="320" y="26" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">Rural-urban migration: push and pull</text>
  <rect x="10" y="50" width="230" height="230" rx="6" fill="none" stroke="#d97706" stroke-width="2"/>
  <text x="125.0" y="120.28" font-size="14" text-anchor="middle" fill="#d97706" font-weight="bold">VILLAGE: push factors</text>
  <text x="125.0" y="146.28" font-size="14" text-anchor="middle" fill="#1f2937">poverty, unemployment</text>
  <text x="125.0" y="172.28" font-size="14" text-anchor="middle" fill="#1f2937">small, fragmented holdings</text>
  <text x="125.0" y="198.28" font-size="14" text-anchor="middle" fill="#1f2937">drought, floods</text>
  <text x="125.0" y="224.28" font-size="14" text-anchor="middle" fill="#1f2937">few schools, hospitals</text>
  <rect x="400" y="50" width="230" height="230" rx="6" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="515.0" y="120.28" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">CITY: pull factors</text>
  <text x="515.0" y="146.28" font-size="14" text-anchor="middle" fill="#1f2937">jobs and higher incomes</text>
  <text x="515.0" y="172.28" font-size="14" text-anchor="middle" fill="#1f2937">better education,</text>
  <text x="515.0" y="198.28" font-size="14" text-anchor="middle" fill="#1f2937">better health care</text>
  <text x="515.0" y="224.28" font-size="14" text-anchor="middle" fill="#1f2937">attraction of city life</text>
  <line x1="245" y1="120" x2="384.0" y2="120.0" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
  <polygon points="395.0,120.0 384.0,126.0 384.0,114.0" fill="#1f2937"/>
  <text x="320" y="100" font-size="14" text-anchor="middle" fill="#1f2937">migrants</text>
  <text x="320" y="142" font-size="14" text-anchor="middle" fill="#1f2937">(labour for the city)</text>
  <line x1="395" y1="220" x2="256.0" y2="220.0" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <polygon points="245.0,220.0 256.0,214.0 256.0,226.0" fill="#059669"/>
  <text x="320" y="200" font-size="14" text-anchor="middle" fill="#059669">remittances</text>
  <text x="320" y="242" font-size="14" text-anchor="middle" fill="#059669">(money sent home)</text>
  <line x1="515" y1="280" x2="515" y2="320" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="515" y1="300" x2="515.0" y2="319.0" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="515.0,330.0 509.0,319.0 521.0,319.0" fill="#dc2626"/>
  <rect x="250" y="330" width="380" height="80" rx="6" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="440.0" y="357.04" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">Strain on the city</text>
  <text x="440.0" y="375.04" font-size="14" text-anchor="middle" fill="#1f2937">cities grow faster than houses,</text>
  <text x="440.0" y="393.04" font-size="14" text-anchor="middle" fill="#1f2937">water, transport and services</text>
</svg>
