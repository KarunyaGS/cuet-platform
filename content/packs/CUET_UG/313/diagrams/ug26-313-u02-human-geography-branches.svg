  <text x="447" y="42" font-size="15" fill="#1f2937" font-weight="bold">Economic geography</text>
  <text x="447" y="64" font-size="14" fill="#1f2937">resources, agriculture,</text>
  <text x="447" y="83" font-size="14" fill="#1f2937">industry, trade, transport</text>
