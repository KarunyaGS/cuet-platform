<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450" font-family="Arial, Helvetica, sans-serif">
  <rect x="8" y="15" width="215" height="84" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="18" y="42" font-size="15" fill="#1f2937" font-weight="bold">Social geography</text>
