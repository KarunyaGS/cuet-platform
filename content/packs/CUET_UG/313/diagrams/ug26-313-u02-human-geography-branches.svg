  <text x="447" y="172" font-size="14" fill="#1f2937">boundaries, states,</text>
  <text x="447" y="191" font-size="14" fill="#1f2937">territory and power</text>
  <line x1="437" y1="165" x2="394.6" y2="188.8" stroke="#2563eb" stroke-width="1.8"/>
