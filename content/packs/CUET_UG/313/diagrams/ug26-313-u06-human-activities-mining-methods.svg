<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" width="640" height="450" font-family="Arial, Helvetica, sans-serif">
  <title>Surface mining and underground mining</title>
  <text x="320" y="26" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">Two ways to reach a mineral (schematic, not to scale)</text>
  <rect x="10" y="120" width="620" height="310" rx="0" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="10" y1="120" x2="630" y2="120" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="320" y1="50" x2="320" y2="430" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5" stroke-linecap="round"/>
  <polygon points="30.0,120.0 110.0,200.0 210.0,200.0 290.0,120.0" fill="#ffffff" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <rect x="30" y="200" width="260" height="26" rx="0" fill="#dc2626" stroke="#dc2626" stroke-width="2"/>
  <text x="160" y="68" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold">Surface (open-cast)</text>
  <text x="160" y="90" font-size="14" text-anchor="middle" fill="#1f2937">open pit, mineral near surface</text>
  <text x="160" y="262" font-size="14" text-anchor="middle" fill="#1f2937">Cheapest and quickest;</text>
  <text x="160" y="282" font-size="14" text-anchor="middle" fill="#1f2937">high output, less equipment</text>
  <text x="160" y="302" font-size="14" text-anchor="middle" fill="#1f2937">and lower safety measures</text>
  <rect x="468" y="100" width="24" height="230" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="350" y="318" width="260" height="14" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="468" y="318" width="24" height="14" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
  <rect x="340" y="332" width="280" height="28" rx="0" fill="#dc2626" stroke="#dc2626" stroke-width="2"/>
  <text x="480" y="68" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold">Underground (shaft)</text>
  <text x="480" y="90" font-size="14" text-anchor="middle" fill="#1f2937">vertical shaft and galleries, deep mineral</text>
  <text x="458" y="220" font-size="14" text-anchor="end" fill="#1f2937">vertical shaft</text>
  <text x="480" y="386" font-size="14" text-anchor="middle" fill="#1f2937">Costlier; risks of roof fall, flooding,</text>
  <text x="480" y="406" font-size="14" text-anchor="middle" fill="#1f2937">fire and poisonous gases</text>
  <text x="350" y="300" font-size="14" text-anchor="start" fill="#1f2937">gallery</text>
  <rect x="20" y="404" width="16" height="12" rx="0" fill="#dc2626" stroke="#dc2626" stroke-width="2"/>
  <text x="42" y="415" font-size="14" text-anchor="start" fill="#1f2937">mineral</text>
</svg>
