<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="Arial, Helvetica, sans-serif">
  <line x1="49.6" y1="62" x2="610.4" y2="62" stroke="#1f2937" stroke-width="2.5"/>
  <polygon points="620,62 608,67.4 608,56.6" fill="#1f2937"/>
  <polygon points="40,62 52,56.6 52,67.4" fill="#1f2937"/>
  <text x="40" y="38" font-size="15" fill="#1f2937" font-weight="bold">Necessity: nature decides</text>
  <text x="620" y="38" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="end">Freedom: humans choose</text>
  <rect x="14" y="90" width="200" height="290" rx="8" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="114" y="118" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">Environmental</text>
  <text x="114" y="138" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">determinism</text>
  <text x="114" y="163" font-size="14" fill="#6b7280" text-anchor="middle">Ratzel, Semple</text>
  <text x="114" y="192" font-size="14" fill="#1f2937" text-anchor="middle">Nature controls</text>
  <text x="114" y="211" font-size="14" fill="#1f2937" text-anchor="middle">human life;</text>
  <text x="114" y="230" font-size="14" fill="#1f2937" text-anchor="middle">humans are passive.</text>
  <line x1="24" y1="300" x2="204" y2="300" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="230" y="90" width="200" height="290" rx="8" fill="none" stroke="#d97706" stroke-width="2.5"/>
  <text x="330" y="118" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">Neo-determinism</text>
  <text x="330" y="163" font-size="14" fill="#6b7280" text-anchor="middle">Griffith Taylor</text>
  <text x="330" y="192" font-size="14" fill="#1f2937" text-anchor="middle">A middle path:</text>
  <text x="330" y="211" font-size="14" fill="#1f2937" text-anchor="middle">"stop and go".</text>
  <line x1="240" y1="300" x2="420" y2="300" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="446" y="90" width="200" height="290" rx="8" fill="none" stroke="#059669" stroke-width="2.5"/>
  <text x="546" y="118" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">Possibilism</text>
  <text x="546" y="163" font-size="14" fill="#6b7280" text-anchor="middle">Vidal de la Blache</text>
  <text x="546" y="192" font-size="14" fill="#1f2937" text-anchor="middle">Nature offers</text>
  <text x="546" y="211" font-size="14" fill="#1f2937" text-anchor="middle">possibilities;</text>
  <text x="546" y="230" font-size="14" fill="#1f2937" text-anchor="middle">humans choose and</text>
  <text x="546" y="249" font-size="14" fill="#1f2937" text-anchor="middle">are active.</text>
  <line x1="456" y1="300" x2="636" y2="300" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="114" y="322" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="middle">Example:</text>
  <text x="114" y="342" font-size="14" fill="#1f2937" text-anchor="middle">Arctic snow houses</text>
  <text x="114" y="361" font-size="14" fill="#1f2937" text-anchor="middle">and furs</text>
  <text x="546" y="322" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="middle">Example:</text>
  <text x="546" y="342" font-size="14" fill="#1f2937" text-anchor="middle">Terraces cut on</text>
  <text x="546" y="361" font-size="14" fill="#1f2937" text-anchor="middle">hill slopes</text>
  <rect x="244" y="236" width="36" height="54" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="262" cy="254" r="9" fill="#dc2626"/>
  <circle cx="262" cy="274" r="9" fill="#059669"/>
  <text x="290" y="259" font-size="14" fill="#dc2626">red: not possible</text>
  <text x="290" y="279" font-size="14" fill="#059669">green: possible</text>
  <text x="330" y="322" font-size="14" fill="#1f2937" text-anchor="middle">Humans may go ahead</text>
  <text x="330" y="342" font-size="14" fill="#1f2937" text-anchor="middle">only within limits</text>
  <text x="330" y="361" font-size="14" fill="#1f2937" text-anchor="middle">set by nature.</text>
  <text x="330" y="418" font-size="14" fill="#6b7280" text-anchor="middle">Schematic comparison of three ideas about the human-nature relationship.</text>
</svg>
