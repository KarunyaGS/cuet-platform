<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial, Helvetica, sans-serif">
  <text x="360" y="28" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">Cropping seasons in one agricultural year (schematic)</text>
  <text x="40" y="70" font-size="14" fill="#1f2937" font-weight="bold">Kharif: sown at the onset of the south-west monsoon, harvested in autumn</text>
  <rect x="40" y="80" width="260" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="40" y="128" font-size="14" fill="#6b7280">rice, jowar, bajra, maize,</text>
  <text x="40" y="147" font-size="14" fill="#6b7280">cotton, jute, groundnut</text>
  <text x="330" y="160" font-size="14" fill="#1f2937" font-weight="bold">Rabi: sown in winter, harvested in summer</text>
  <rect x="330" y="170" width="230" height="26" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="330" y="218" font-size="14" fill="#6b7280">wheat, barley, gram, mustard</text>
  <text x="690" y="250" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="end">Zaid: the short period between rabi and kharif, mostly irrigated</text>
  <rect x="575" y="260" width="115" height="26" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="690" y="308" font-size="14" fill="#6b7280" text-anchor="end">vegetables, melons, fodder</text>
  <line x1="30" y1="340" x2="690.4" y2="340" stroke="#1f2937" stroke-width="2.2"/>
  <polygon points="700,340 688,345.4 688,334.6" fill="#1f2937"/>
  <text x="700" y="330" font-size="14" fill="#1f2937" text-anchor="end">time</text>
  <text x="30" y="330" font-size="14" fill="#6b7280">Bar position shows the order in the year, not exact months.</text>
</svg>
