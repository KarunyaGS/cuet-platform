<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="Arial, Helvetica, sans-serif">
  <rect x="290" y="14" width="120" height="36" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
  <text x="350" y="37" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">Minerals</text>
  <rect x="100" y="100" width="200" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="125" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">Metallic</text>
  <rect x="430" y="100" width="130" height="40" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="495" y="125" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">Non-metallic</text>
  <rect x="585" y="100" width="105" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="637.5" y="125" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="middle">Mineral fuels</text>
  <line x1="350" y1="50" x2="350" y2="76" stroke="#1f2937" stroke-width="2"/>
  <line x1="200" y1="76" x2="637" y2="76" stroke="#1f2937" stroke-width="2"/>
  <line x1="200" y1="76" x2="200" y2="100" stroke="#1f2937" stroke-width="2"/>
  <line x1="495" y1="76" x2="495" y2="100" stroke="#1f2937" stroke-width="2"/>
  <line x1="637" y1="76" x2="637" y2="100" stroke="#1f2937" stroke-width="2"/>
  <line x1="200" y1="140" x2="200" y2="152" stroke="#1f2937" stroke-width="2"/>
  <line x1="100" y1="152" x2="300" y2="152" stroke="#1f2937" stroke-width="2"/>
  <line x1="100" y1="152" x2="100" y2="170" stroke="#1f2937" stroke-width="2"/>
  <line x1="300" y1="152" x2="300" y2="170" stroke="#1f2937" stroke-width="2"/>
  <rect x="10" y="170" width="180" height="122" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="207.5" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="middle">Ferrous</text>
  <text x="100" y="226.5" font-size="14" fill="#1f2937" text-anchor="middle">(contain iron)</text>
  <text x="100" y="245.5" font-size="14" fill="#1f2937" text-anchor="middle">iron ore, manganese,</text>
  <text x="100" y="264.5" font-size="14" fill="#1f2937" text-anchor="middle">chromite</text>
  <rect x="210" y="170" width="180" height="122" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="207.5" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="middle">Non-ferrous</text>
  <text x="300" y="226.5" font-size="14" fill="#1f2937" text-anchor="middle">(no iron)</text>
  <text x="300" y="245.5" font-size="14" fill="#1f2937" text-anchor="middle">bauxite, copper,</text>
  <text x="300" y="264.5" font-size="14" fill="#1f2937" text-anchor="middle">lead, zinc, gold</text>
  <line x1="495" y1="140" x2="495" y2="170" stroke="#1f2937" stroke-width="2"/>
  <rect x="410" y="170" width="170" height="122" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="495" y="217" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="middle">Examples</text>
  <text x="495" y="236" font-size="14" fill="#1f2937" text-anchor="middle">mica, limestone,</text>
  <text x="495" y="255" font-size="14" fill="#1f2937" text-anchor="middle">gypsum, dolomite</text>
  <line x1="637" y1="140" x2="637" y2="170" stroke="#1f2937" stroke-width="2"/>
  <rect x="590" y="170" width="100" height="122" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="640" y="198" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="middle">Examples</text>
  <text x="640" y="217" font-size="14" fill="#1f2937" text-anchor="middle">coal,</text>
  <text x="640" y="236" font-size="14" fill="#1f2937" text-anchor="middle">petroleum</text>
  <text x="640" y="255" font-size="14" fill="#1f2937" text-anchor="middle">(sources of</text>
  <text x="640" y="274" font-size="14" fill="#1f2937" text-anchor="middle">energy)</text>
  <text x="350" y="330" font-size="14" fill="#1f2937" text-anchor="middle">Ferrous and non-ferrous are the two kinds of metallic minerals.</text>
  <text x="350" y="352" font-size="14" fill="#1f2937" text-anchor="middle">Mineral fuels are the sources of energy.</text>
  <text x="350" y="400" font-size="14" fill="#6b7280" text-anchor="middle">Schematic classification as given in the lesson; lists are examples, not complete.</text>
</svg>
