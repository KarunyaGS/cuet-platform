<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 382" font-family="Arial, Helvetica, sans-serif">
  <rect x="230" y="14" width="200" height="40" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
  <text x="330" y="39" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">Energy sources</text>
  <line x1="330" y1="54" x2="330" y2="80" stroke="#1f2937" stroke-width="2"/>
  <line x1="170" y1="80" x2="490" y2="80" stroke="#1f2937" stroke-width="2"/>
  <line x1="170" y1="80" x2="170" y2="104" stroke="#1f2937" stroke-width="2"/>
  <line x1="490" y1="80" x2="490" y2="104" stroke="#1f2937" stroke-width="2"/>
  <rect x="60" y="104" width="220" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="127.5" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="middle">Conventional</text>
  <text x="170" y="146.5" font-size="14" fill="#1f2937" text-anchor="middle">used for long; mostly exhaustible</text>
  <rect x="380" y="104" width="230" height="56" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="495" y="127.5" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="middle">Non-conventional</text>
  <text x="495" y="146.5" font-size="14" fill="#1f2937" text-anchor="middle">mostly renewable, less polluting</text>
  <line x1="170" y1="160" x2="170" y2="184" stroke="#1f2937" stroke-width="2"/>
  <line x1="490" y1="160" x2="490" y2="184" stroke="#1f2937" stroke-width="2"/>
  <rect x="20" y="184" width="300" height="115" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="218" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="middle">Examples</text>
  <text x="170" y="237" font-size="14" fill="#1f2937" text-anchor="middle">firewood, cattle dung cake,</text>
  <text x="170" y="256" font-size="14" fill="#1f2937" text-anchor="middle">coal, petroleum, natural gas,</text>
  <text x="170" y="275" font-size="14" fill="#1f2937" text-anchor="middle">electricity (hydro and thermal)</text>
  <rect x="340" y="184" width="300" height="115" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="490" y="218" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="middle">Examples</text>
  <text x="490" y="237" font-size="14" fill="#1f2937" text-anchor="middle">nuclear (uranium, thorium),</text>
  <text x="490" y="256" font-size="14" fill="#1f2937" text-anchor="middle">solar, wind, tidal, geothermal,</text>
  <text x="490" y="275" font-size="14" fill="#1f2937" text-anchor="middle">biogas, biomass</text>
  <text x="330" y="328" font-size="14" fill="#1f2937" text-anchor="middle">Non-conventional sources are being promoted to reduce dependence on fossil fuels.</text>
  <text x="330" y="364" font-size="14" fill="#6b7280" text-anchor="middle">Schematic classification as given in the lesson.</text>
</svg>
