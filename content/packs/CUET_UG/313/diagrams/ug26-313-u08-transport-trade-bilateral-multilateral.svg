<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Arial, Helvetica, sans-serif">
  <title>Bilateral and multilateral trade</title>
  <text x="320" y="26" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">Bilateral and multilateral trade (schematic)</text>
  <text x="150" y="70" font-size="16" text-anchor="middle" fill="#2563eb" font-weight="bold">Bilateral</text>
  <text x="150" y="92" font-size="14" text-anchor="middle" fill="#1f2937">between two countries</text>
  <line x1="111.0" y1="190.0" x2="189.0" y2="190.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="200.0,190.0 189.0,196.0 189.0,184.0" fill="#2563eb"/>
  <polygon points="100.0,190.0 111.0,184.0 111.0,196.0" fill="#2563eb"/>
  <circle cx="80" cy="190" r="18" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="80" y="195" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">A</text>
  <circle cx="220" cy="190" r="18" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="220" y="195" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">B</text>
  <text x="480" y="70" font-size="16" text-anchor="middle" fill="#059669" font-weight="bold">Multilateral</text>
  <text x="480" y="92" font-size="14" text-anchor="middle" fill="#1f2937">among many countries</text>
  <line x1="480.0" y1="146.0" x2="557.9866343362025" y2="202.6606064612543" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="480.0" y1="146.0" x2="528.1983906879827" y2="294.3393935387457" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="480.0" y1="146.0" x2="431.8016093120172" y2="294.3393935387457" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="480.0" y1="146.0" x2="402.0133656637974" y2="202.66060646125433" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="557.9866343362025" y1="202.6606064612543" x2="528.1983906879827" y2="294.3393935387457" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="557.9866343362025" y1="202.6606064612543" x2="431.8016093120172" y2="294.3393935387457" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="557.9866343362025" y1="202.6606064612543" x2="402.0133656637974" y2="202.66060646125433" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="528.1983906879827" y1="294.3393935387457" x2="431.8016093120172" y2="294.3393935387457" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="528.1983906879827" y1="294.3393935387457" x2="402.0133656637974" y2="202.66060646125433" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="431.8016093120172" y1="294.3393935387457" x2="402.0133656637974" y2="202.66060646125433" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="480.0" cy="146.0" r="15" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="480.0" y="151.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">A</text>
  <circle cx="557.9866343362025" cy="202.6606064612543" r="15" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="557.9866343362025" y="207.6606064612543" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">B</text>
  <circle cx="528.1983906879827" cy="294.3393935387457" r="15" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="528.1983906879827" y="299.3393935387457" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">C</text>
  <circle cx="431.8016093120172" cy="294.3393935387457" r="15" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="431.8016093120172" y="299.3393935387457" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">D</text>
  <circle cx="402.0133656637974" cy="202.66060646125433" r="15" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="402.0133656637974" y="207.66060646125433" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">E</text>
  <line x1="320" y1="50" x2="320" y2="330" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5" stroke-linecap="round"/>
  <text x="320" y="345" font-size="14" text-anchor="middle" fill="#6b7280">Lines show trade links, not amounts</text>
</svg>
