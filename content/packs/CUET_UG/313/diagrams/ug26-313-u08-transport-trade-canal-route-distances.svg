<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Arial, Helvetica, sans-serif">
  <title>Distance saved by a canal</title>
  <text x="320" y="26" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">Route distance: Cape route and canal route</text>
  <text x="320" y="48" font-size="14" text-anchor="middle" fill="#6b7280">(distances from the worked problem only, not real route lengths)</text>
  <text x="178" y="117" font-size="14" text-anchor="end" fill="#1f2937">Round the Cape</text>
  <rect x="190" y="85" width="320.0" height="48" rx="0" fill="#d97706" stroke="#d97706" stroke-width="2"/>
  <text x="520.0" y="116" font-size="15" text-anchor="start" fill="#1f2937" font-weight="bold">21,000 km</text>
  <text x="178" y="187" font-size="14" text-anchor="end" fill="#1f2937">Through the canal</text>
  <rect x="190" y="155" width="182.85714285714286" height="48" rx="0" fill="#059669" stroke="#059669" stroke-width="2"/>
  <text x="382.8571428571429" y="186" font-size="15" text-anchor="start" fill="#1f2937" font-weight="bold">12,000 km</text>
  <line x1="190" y1="75" x2="190" y2="225" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="372.8571428571429" y1="235" x2="499.0" y2="235.0" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="510.0,235.0 499.0,241.0 499.0,229.0" fill="#dc2626"/>
  <text x="441.42857142857144" y="262" font-size="15" text-anchor="middle" fill="#dc2626" font-weight="bold">saving: 9,000 km</text>
</svg>
