<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" font-family="Arial, Helvetica, sans-serif">
  <text x="150" y="30" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">Added to the population</text>
  <text x="490" y="30" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">Removed from the population</text>
  <rect x="235" y="80" width="170" height="150" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
  <text x="320" y="140" font-size="15" fill="#1f2937" text-anchor="middle">Population of</text>
  <text x="320" y="162" font-size="15" fill="#1f2937" text-anchor="middle">an area</text>
  <text x="320" y="184" font-size="15" fill="#1f2937" text-anchor="middle">(during one period)</text>
  <line x1="40" y1="125" x2="226.2" y2="125" stroke="#059669" stroke-width="3.5"/>
  <polygon points="235,125 224,129.9 224,120" fill="#059669"/>
  <text x="137" y="112" font-size="15" fill="#059669" font-weight="bold" text-anchor="middle">Births (B)</text>
  <line x1="40" y1="190" x2="226.2" y2="190" stroke="#059669" stroke-width="3.5"/>
  <polygon points="235,190 224,194.9 224,185.1" fill="#059669"/>
  <text x="137" y="177" font-size="15" fill="#059669" font-weight="bold" text-anchor="middle">In-migrants (I)</text>
  <line x1="405" y1="125" x2="591.2" y2="125" stroke="#dc2626" stroke-width="3.5"/>
  <polygon points="600,125 589,129.9 589,120" fill="#dc2626"/>
  <text x="503" y="112" font-size="15" fill="#dc2626" font-weight="bold" text-anchor="middle">Deaths (D)</text>
  <line x1="405" y1="190" x2="591.2" y2="190" stroke="#dc2626" stroke-width="3.5"/>
  <polygon points="600,190 589,194.9 589,185.1" fill="#dc2626"/>
  <text x="503" y="177" font-size="15" fill="#dc2626" font-weight="bold" text-anchor="middle">Out-migrants (E)</text>
  <rect x="40" y="262" width="170" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="288" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">Natural increase</text>
  <text x="125" y="310" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">B - D</text>
  <rect x="235" y="262" width="170" height="70" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="320" y="288" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">Net migration</text>
  <text x="320" y="310" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">I - E</text>
  <rect x="430" y="262" width="170" height="70" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="515" y="288" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">Total change</text>
  <text x="515" y="310" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">(B - D) + (I - E)</text>
  <text x="222.5" y="305" font-size="24" fill="#1f2937" font-weight="bold" text-anchor="middle">+</text>
  <text x="417.5" y="305" font-size="24" fill="#1f2937" font-weight="bold" text-anchor="middle">=</text>
  <text x="320" y="366" font-size="14" fill="#6b7280" text-anchor="middle">Change is positive when B + I is greater than D + E. Schematic, not to scale.</text>
</svg>
