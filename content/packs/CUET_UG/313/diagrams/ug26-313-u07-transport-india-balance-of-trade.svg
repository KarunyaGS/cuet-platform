<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Arial, Helvetica, sans-serif">
  <title>Trade surplus, balance and deficit</title>
  <text x="320" y="26" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">Balance of trade = value of exports - value of imports</text>
  <text x="320" y="48" font-size="14" text-anchor="middle" fill="#6b7280">(bar heights illustrative)</text>
  <text x="107" y="80" font-size="16" text-anchor="middle" fill="#059669" font-weight="bold">Trade surplus</text>
  <rect x="45" y="100" width="50" height="150" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
  <rect x="119" y="160" width="50" height="90" rx="0" fill="#d97706" stroke="#d97706" stroke-width="2"/>
  <line x1="32" y1="250" x2="182" y2="250" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="70" y="272" font-size="14" text-anchor="middle" fill="#1f2937">Exports</text>
  <text x="144" y="272" font-size="14" text-anchor="middle" fill="#1f2937">Imports</text>
  <text x="107" y="298" font-size="14" text-anchor="middle" fill="#059669">exports > imports</text>
  <text x="320" y="80" font-size="16" text-anchor="middle" fill="#6b7280" font-weight="bold">Balanced</text>
  <rect x="258" y="140" width="50" height="110" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
  <rect x="332" y="140" width="50" height="110" rx="0" fill="#d97706" stroke="#d97706" stroke-width="2"/>
  <line x1="245" y1="250" x2="395" y2="250" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="283" y="272" font-size="14" text-anchor="middle" fill="#1f2937">Exports</text>
  <text x="357" y="272" font-size="14" text-anchor="middle" fill="#1f2937">Imports</text>
  <text x="320" y="298" font-size="14" text-anchor="middle" fill="#6b7280">exports = imports</text>
  <text x="533" y="80" font-size="16" text-anchor="middle" fill="#dc2626" font-weight="bold">Trade deficit</text>
  <rect x="471" y="170" width="50" height="80" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
  <rect x="545" y="100" width="50" height="150" rx="0" fill="#d97706" stroke="#d97706" stroke-width="2"/>
  <line x1="458" y1="250" x2="608" y2="250" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="496" y="272" font-size="14" text-anchor="middle" fill="#1f2937">Exports</text>
  <text x="570" y="272" font-size="14" text-anchor="middle" fill="#1f2937">Imports</text>
  <text x="533" y="298" font-size="14" text-anchor="middle" fill="#dc2626">exports &lt; imports</text>
</svg>
