<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Arial, Helvetica, sans-serif">
  <title>Waste hierarchy</title>
  <text x="320" y="26" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">Waste hierarchy: reduce, reuse, recycle, then dispose</text>
  <polygon points="50.0,55.0 590.0,55.0 530.0,131.0 110.0,131.0" fill="#ffffff" stroke="#059669" stroke-width="3" stroke-linejoin="round"/>
  <text x="320" y="87" font-size="16" text-anchor="middle" fill="#059669" font-weight="bold">1 Reduce</text>
  <text x="320" y="110" font-size="14" text-anchor="middle" fill="#1f2937">make less waste at the source</text>
  <polygon points="110.0,137.0 530.0,137.0 470.0,213.0 170.0,213.0" fill="#ffffff" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
  <text x="320" y="169" font-size="16" text-anchor="middle" fill="#2563eb" font-weight="bold">2 Reuse</text>
  <text x="320" y="192" font-size="14" text-anchor="middle" fill="#1f2937">use items again</text>
  <polygon points="170.0,219.0 470.0,219.0 410.0,295.0 230.0,295.0" fill="#ffffff" stroke="#d97706" stroke-width="3" stroke-linejoin="round"/>
  <text x="320" y="251" font-size="16" text-anchor="middle" fill="#d97706" font-weight="bold">3 Recycle</text>
  <text x="320" y="274" font-size="14" text-anchor="middle" fill="#1f2937">turn waste into new material</text>
  <polygon points="230.0,301.0 410.0,301.0 350.0,377.0 290.0,377.0" fill="#ffffff" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/>
  <text x="320" y="333" font-size="16" text-anchor="middle" fill="#dc2626" font-weight="bold">4 Dispose</text>
  <text x="320" y="356" font-size="14" text-anchor="middle" fill="#1f2937">last resort</text>
</svg>
