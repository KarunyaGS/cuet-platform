<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 490" font-family="Arial, Helvetica, sans-serif">
  <text x="330" y="28" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">Town size classes (by population)</text>
  <rect x="20" y="52" width="610" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="32" y="78" font-size="15" fill="#1f2937" font-weight="bold">Class I</text>
  <text x="130" y="78" font-size="15" fill="#1f2937">1,00,000 or more</text>
  <rect x="20" y="104" width="550" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="32" y="130" font-size="15" fill="#1f2937" font-weight="bold">Class II</text>
  <text x="130" y="130" font-size="15" fill="#1f2937">50,000 to 99,999</text>
  <rect x="20" y="156" width="490" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="32" y="182" font-size="15" fill="#1f2937" font-weight="bold">Class III</text>
  <text x="130" y="182" font-size="15" fill="#1f2937">20,000 to 49,999</text>
  <rect x="20" y="208" width="430" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="32" y="234" font-size="15" fill="#1f2937" font-weight="bold">Class IV</text>
  <text x="130" y="234" font-size="15" fill="#1f2937">10,000 to 19,999</text>
  <rect x="20" y="260" width="370" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="32" y="286" font-size="15" fill="#1f2937" font-weight="bold">Class V</text>
  <text x="130" y="286" font-size="15" fill="#1f2937">5,000 to 9,999</text>
  <rect x="20" y="312" width="310" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="32" y="338" font-size="15" fill="#1f2937" font-weight="bold">Class VI</text>
  <text x="130" y="338" font-size="15" fill="#1f2937">fewer than 5,000</text>
  <rect x="20" y="376" width="620" height="100" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="32" y="402" font-size="15" fill="#1f2937" font-weight="bold">Class I town = a city</text>
  <text x="32" y="425" font-size="14" fill="#1f2937">A city of 1 million (10,00,000) or more is a million-plus city.</text>
  <text x="32" y="452" font-size="14" fill="#6b7280">Bar lengths show rank only; not to scale.</text>
</svg>
