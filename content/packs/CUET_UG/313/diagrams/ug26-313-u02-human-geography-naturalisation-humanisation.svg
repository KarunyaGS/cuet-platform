<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 385" font-family="Arial, Helvetica, sans-serif">
  <rect x="20" y="15" width="300" height="290" rx="8" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="170" y="42" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">Naturalisation of humans</text>
  <text x="170" y="62" font-size="14" fill="#6b7280" text-anchor="middle">Early societies, simple technology</text>
  <rect x="110" y="82" width="120" height="40" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="170" y="108" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">Nature</text>
  <rect x="110" y="200" width="120" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="226" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">People</text>
  <rect x="340" y="15" width="300" height="290" rx="8" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="490" y="42" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">Humanisation of nature</text>
  <text x="490" y="62" font-size="14" fill="#6b7280" text-anchor="middle">Later, advanced technology</text>
  <rect x="430" y="82" width="120" height="40" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="490" y="108" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">Nature</text>
  <rect x="430" y="200" width="120" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="490" y="226" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">People</text>
  <line x1="130" y1="126" x2="130" y2="183.2" stroke="#059669" stroke-width="6"/>
  <polygon points="130,196 122.8,180 137.2,180" fill="#059669"/>
  <text x="118" y="164" font-size="14" fill="#1f2937" text-anchor="end">dominates</text>
  <line x1="210" y1="196" x2="210" y2="133.2" stroke="#059669" stroke-width="1.8"/>
  <polygon points="210,126 214.1,135 205.9,135" fill="#059669"/>
  <text x="222" y="164" font-size="14" fill="#1f2937">small changes</text>
  <text x="170" y="266" font-size="14" fill="#1f2937" text-anchor="middle">People adapt: they use forest, game</text>
  <text x="170" y="285" font-size="14" fill="#1f2937" text-anchor="middle">and water as they find them.</text>
  <line x1="450" y1="126" x2="450" y2="188.8" stroke="#2563eb" stroke-width="1.8"/>
  <polygon points="450,196 445.9,187 454.1,187" fill="#2563eb"/>
  <text x="438" y="164" font-size="14" fill="#1f2937" text-anchor="end">sets limits</text>
  <line x1="530" y1="196" x2="530" y2="138.8" stroke="#2563eb" stroke-width="6"/>
  <polygon points="530,126 537.2,142 522.8,142" fill="#2563eb"/>
  <text x="542" y="164" font-size="14" fill="#1f2937">reshapes</text>
  <text x="490" y="266" font-size="14" fill="#1f2937" text-anchor="middle">People build dams, level land, clear</text>
  <text x="490" y="285" font-size="14" fill="#1f2937" text-anchor="middle">forest and create cities.</text>
  <line x1="40" y1="350" x2="609.6" y2="350" stroke="#1f2937" stroke-width="2.5"/>
  <polygon points="620,350 607,355.9 607,344.1" fill="#1f2937"/>
  <text x="330" y="338" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">More knowledge, tools and power over time</text>
  <text x="330" y="376" font-size="14" fill="#6b7280" text-anchor="middle">Schematic: arrow thickness shows which side has more influence.</text>
</svg>
