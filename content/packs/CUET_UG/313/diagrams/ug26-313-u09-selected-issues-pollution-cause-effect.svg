<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="Arial, Helvetica, sans-serif">
  <title>Pollution cause and effect</title>
  <text x="320" y="26" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">Pollution: sources, type and effects</text>
  <text x="110" y="62" font-size="15" text-anchor="middle" fill="#6b7280" font-weight="bold">Sources</text>
  <text x="320" y="62" font-size="15" text-anchor="middle" fill="#6b7280" font-weight="bold">Pollution</text>
  <text x="530" y="62" font-size="15" text-anchor="middle" fill="#6b7280" font-weight="bold">Effects</text>
  <rect x="10" y="80" width="200" height="120" rx="6" fill="none" stroke="#6b7280" stroke-width="2"/>
  <text x="110.0" y="127.04" font-size="14" text-anchor="middle" fill="#1f2937">Vehicles, industries,</text>
  <text x="110.0" y="145.04000000000002" font-size="14" text-anchor="middle" fill="#1f2937">thermal power plants,</text>
  <text x="110.0" y="163.04000000000002" font-size="14" text-anchor="middle" fill="#1f2937">open burning, dust</text>
  <rect x="255" y="110" width="130" height="60" rx="6" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="320.0" y="145.6" font-size="16" text-anchor="middle" fill="#2563eb" font-weight="bold">Air</text>
  <rect x="430" y="80" width="200" height="120" rx="6" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="530.0" y="127.04" font-size="14" text-anchor="middle" fill="#1f2937">Respiratory and heart</text>
  <text x="530.0" y="145.04000000000002" font-size="14" text-anchor="middle" fill="#1f2937">disease, smog, acid rain,</text>
  <text x="530.0" y="163.04000000000002" font-size="14" text-anchor="middle" fill="#1f2937">harm to crops, monuments</text>
  <line x1="210" y1="140" x2="244.0" y2="140.0" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="255.0,140.0 244.0,146.0 244.0,134.0" fill="#1f2937"/>
  <line x1="385" y1="140" x2="419.0" y2="140.0" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="430.0,140.0 419.0,146.0 419.0,134.0" fill="#1f2937"/>
  <rect x="10" y="245" width="200" height="120" rx="6" fill="none" stroke="#6b7280" stroke-width="2"/>
  <text x="110.0" y="292.04" font-size="14" text-anchor="middle" fill="#1f2937">Untreated sewage,</text>
  <text x="110.0" y="310.04" font-size="14" text-anchor="middle" fill="#1f2937">industrial effluents,</text>
  <text x="110.0" y="328.04" font-size="14" text-anchor="middle" fill="#1f2937">farm run-off</text>
  <rect x="255" y="275" width="130" height="60" rx="6" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="320.0" y="310.6" font-size="16" text-anchor="middle" fill="#059669" font-weight="bold">Water</text>
  <rect x="430" y="245" width="200" height="120" rx="6" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="530.0" y="292.04" font-size="14" text-anchor="middle" fill="#1f2937">Less dissolved oxygen,</text>
  <text x="530.0" y="310.04" font-size="14" text-anchor="middle" fill="#1f2937">fish die; cholera,</text>
  <text x="530.0" y="328.04" font-size="14" text-anchor="middle" fill="#1f2937">typhoid, dysentery</text>
  <line x1="210" y1="305" x2="244.0" y2="305.0" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="255.0,305.0 244.0,311.0 244.0,299.0" fill="#1f2937"/>
  <line x1="385" y1="305" x2="419.0" y2="305.0" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="430.0,305.0 419.0,311.0 419.0,299.0" fill="#1f2937"/>
  <text x="320" y="408" font-size="14" text-anchor="middle" fill="#6b7280">Remedies: cleaner fuels, treatment before discharge, laws, awareness</text>
</svg>
