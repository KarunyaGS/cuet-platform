  <text x="170" y="43" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">Clustered (compact, nucleated)</text>
  <text x="170" y="237" font-size="14" fill="#1f2937" text-anchor="middle">Houses close together,</text>
  <text x="170" y="256" font-size="14" fill="#1f2937" text-anchor="middle">fields around the village</text>
  <rect x="340" y="15" width="300" height="270" rx="8" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="490" y="43" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">Semi-clustered (fragmented)</text>
  <text x="490" y="237" font-size="14" fill="#1f2937" text-anchor="middle">One part is separated from</text>
  <text x="490" y="256" font-size="14" fill="#1f2937" text-anchor="middle">the main cluster</text>
  <rect x="20" y="295" width="300" height="270" rx="8" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="170" y="323" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">Hamleted</text>
  <text x="170" y="517" font-size="14" fill="#1f2937" text-anchor="middle">Several hamlets with the same name</text>
  <text x="170" y="536" font-size="14" fill="#1f2937" text-anchor="middle">as the parent village, wide apart</text>
  <rect x="340" y="295" width="300" height="270" rx="8" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="490" y="323" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">Dispersed (isolated)</text>
  <text x="490" y="517" font-size="14" fill="#1f2937" text-anchor="middle">Houses far apart, each in its</text>
  <text x="490" y="536" font-size="14" fill="#1f2937" text-anchor="middle">own field; no village centre</text>
