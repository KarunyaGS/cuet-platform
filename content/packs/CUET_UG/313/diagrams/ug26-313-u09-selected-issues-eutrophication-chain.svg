<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="Arial, Helvetica, sans-serif">
  <title>Eutrophication chain</title>
  <text x="320" y="26" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">Eutrophication: how farm run-off harms a water body</text>
  <rect x="120" y="50" width="400" height="58" rx="6" fill="none" stroke="#d97706" stroke-width="2"/>
  <text x="320.0" y="75.04" font-size="14" text-anchor="middle" fill="#d97706" font-weight="bold">Fertilisers on farms</text>
  <text x="320.0" y="93.04" font-size="14" text-anchor="middle" fill="#1f2937">washed into a river or pond by run-off</text>
  <line x1="320" y1="108" x2="320.0" y2="129.0" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="320.0,140.0 314.0,129.0 326.0,129.0" fill="#1f2937"/>
  <rect x="120" y="140" width="400" height="58" rx="6" fill="none" stroke="#d97706" stroke-width="2"/>
  <text x="320.0" y="165.04" font-size="14" text-anchor="middle" fill="#d97706" font-weight="bold">Excess nutrients</text>
  <text x="320.0" y="183.04" font-size="14" text-anchor="middle" fill="#1f2937">build up in the water</text>
  <line x1="320" y1="198" x2="320.0" y2="219.0" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="320.0,230.0 314.0,219.0 326.0,219.0" fill="#1f2937"/>
  <rect x="120" y="230" width="400" height="58" rx="6" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="320.0" y="255.04" font-size="14" text-anchor="middle" fill="#059669" font-weight="bold">Algae overgrow</text>
  <text x="320.0" y="273.03999999999996" font-size="14" text-anchor="middle" fill="#1f2937">a dense growth of algae</text>
  <line x1="320" y1="288" x2="320.0" y2="309.0" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="320.0,320.0 314.0,309.0 326.0,309.0" fill="#1f2937"/>
  <rect x="120" y="320" width="400" height="58" rx="6" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="320.0" y="345.04" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">Algae take the oxygen</text>
  <text x="320.0" y="363.04" font-size="14" text-anchor="middle" fill="#1f2937">dissolved oxygen of the water falls</text>
  <line x1="320" y1="378" x2="320.0" y2="399.0" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="320.0,410.0 314.0,399.0 326.0,399.0" fill="#1f2937"/>
  <rect x="120" y="410" width="400" height="58" rx="6" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="320.0" y="435.04" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">Fish die</text>
  <text x="320.0" y="453.04" font-size="14" text-anchor="middle" fill="#1f2937">too little oxygen is left</text>
</svg>
