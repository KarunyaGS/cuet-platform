<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Arial, Helvetica, sans-serif">
  <title>Port hinterland</title>
  <text x="320" y="26" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">A port and its hinterland (schematic, not to scale)</text>
  <rect x="10" y="50" width="400" height="290" rx="40" fill="#ecfdf5" stroke="#059669" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="410" y="50" width="220" height="290" rx="0" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <line x1="410" y1="50" x2="410" y2="340" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <text x="210" y="80" font-size="16" text-anchor="middle" fill="#059669" font-weight="bold">HINTERLAND</text>
  <text x="210" y="100" font-size="14" text-anchor="middle" fill="#059669">the area the port serves</text>
  <line x1="70" y1="190" x2="392" y2="195" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 4" stroke-linecap="round"/>
  <line x1="110" y1="270" x2="392" y2="195" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="230" y1="150" x2="392" y2="195" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="290" y1="280" x2="392" y2="195" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="190" y1="230" x2="392" y2="195" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 4" stroke-linecap="round"/>
  <circle cx="70" cy="190" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <circle cx="110" cy="270" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <circle cx="230" cy="150" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <circle cx="290" cy="280" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <circle cx="190" cy="230" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="75" y="166" font-size="14" text-anchor="middle" fill="#1f2937">farms, towns</text>
  <rect x="392" y="177" width="36" height="36" rx="3" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>
  <text x="380" y="167" font-size="15" text-anchor="end" fill="#1f2937" font-weight="bold">PORT</text>
  <text x="520" y="150" font-size="16" text-anchor="middle" fill="#2563eb" font-weight="bold">SEA</text>
  <line x1="445" y1="215" x2="559.0" y2="215.0" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="570.0,215.0 559.0,221.0 559.0,209.0" fill="#059669"/>
  <text x="510" y="240" font-size="14" text-anchor="middle" fill="#059669">exports leave</text>
  <line x1="570" y1="265" x2="456.0" y2="265.0" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="445.0,265.0 456.0,259.0 456.0,271.0" fill="#dc2626"/>
  <text x="510" y="290" font-size="14" text-anchor="middle" fill="#dc2626">imports arrive</text>
  <text x="510" y="180" font-size="14" text-anchor="middle" fill="#6b7280">(other countries)</text>
  <line x1="30" y1="365" x2="64" y2="365" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <text x="70" y="370" font-size="14" text-anchor="start" fill="#1f2937">road</text>
  <line x1="140" y1="365" x2="174" y2="365" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 4" stroke-linecap="round"/>
  <text x="180" y="370" font-size="14" text-anchor="start" fill="#1f2937">rail</text>
  <line x1="240" y1="365" x2="274" y2="365" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  <text x="280" y="370" font-size="14" text-anchor="start" fill="#1f2937">river</text>
  <text x="520" y="385" font-size="14" text-anchor="middle" fill="#6b7280">Links carry goods both ways</text>
</svg>
