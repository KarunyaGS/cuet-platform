<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" font-family="Arial, Helvetica, sans-serif">
  <text x="330" y="28" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">The Human Development Index (HDI) combines three dimensions</text>
  <rect x="20" y="50" width="190" height="118" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="115" y="76" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">HEALTH</text>
  <text x="115" y="100" font-size="14" fill="#1f2937" text-anchor="middle">Life expectancy</text>
  <text x="115" y="119" font-size="14" fill="#1f2937" text-anchor="middle">at birth</text>
  <line x1="115" y1="168" x2="115" y2="198" stroke="#1f2937" stroke-width="2"/>
  <polygon points="115,206 110.5,196 119.5,196" fill="#1f2937"/>
  <rect x="45" y="208" width="140" height="38" rx="6" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="115" y="233" font-size="14" fill="#1f2937" text-anchor="middle">index 0 to 1</text>
  <rect x="235" y="50" width="190" height="118" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="330" y="76" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">KNOWLEDGE</text>
  <text x="330" y="100" font-size="14" fill="#1f2937" text-anchor="middle">Years of schooling</text>
  <text x="330" y="119" font-size="14" fill="#1f2937" text-anchor="middle">(education)</text>
  <line x1="330" y1="168" x2="330" y2="198" stroke="#1f2937" stroke-width="2"/>
  <polygon points="330,206 325.5,196 334.5,196" fill="#1f2937"/>
  <rect x="260" y="208" width="140" height="38" rx="6" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="330" y="233" font-size="14" fill="#1f2937" text-anchor="middle">index 0 to 1</text>
  <rect x="450" y="50" width="190" height="118" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="545" y="76" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">RESOURCES</text>
  <text x="545" y="100" font-size="14" fill="#1f2937" text-anchor="middle">Income per person</text>
  <text x="545" y="119" font-size="14" fill="#1f2937" text-anchor="middle">(standard of living;</text>
  <text x="545" y="138" font-size="14" fill="#1f2937" text-anchor="middle">GNI per capita, adjusted</text>
  <text x="545" y="157" font-size="14" fill="#1f2937" text-anchor="middle">for purchasing power)</text>
  <line x1="545" y1="168" x2="545" y2="198" stroke="#1f2937" stroke-width="2"/>
  <polygon points="545,206 540.5,196 549.5,196" fill="#1f2937"/>
  <rect x="475" y="208" width="140" height="38" rx="6" fill="none" stroke="#d97706" stroke-width="2"/>
  <text x="545" y="233" font-size="14" fill="#1f2937" text-anchor="middle">index 0 to 1</text>
  <line x1="115" y1="246" x2="223.6" y2="329.1" stroke="#1f2937" stroke-width="2"/>
  <polygon points="230,334 219.3,331.5 224.8,324.3" fill="#1f2937"/>
  <line x1="330" y1="246" x2="330" y2="326" stroke="#1f2937" stroke-width="2"/>
  <polygon points="330,334 325.5,324 334.5,324" fill="#1f2937"/>
  <line x1="545" y1="246" x2="436.4" y2="329.1" stroke="#1f2937" stroke-width="2"/>
  <polygon points="430,334 435.2,324.3 440.7,331.5" fill="#1f2937"/>
  <rect x="150" y="336" width="360" height="62" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="2.5"/>
  <text x="330" y="362" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">Human Development Index (HDI)</text>
  <text x="330" y="384" font-size="14" fill="#1f2937" text-anchor="middle">a value between 0 and 1; higher is better</text>
  <text x="330" y="424" font-size="15" fill="#1f2937" text-anchor="middle">Each index = (actual value - minimum) / (maximum - minimum)</text>
  <text x="330" y="444" font-size="14" fill="#6b7280" text-anchor="middle">UNDP fixes the minimum and maximum values (goalposts).</text>
</svg>
