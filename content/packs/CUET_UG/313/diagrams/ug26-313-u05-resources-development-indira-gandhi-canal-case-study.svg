<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" font-family="Arial, Helvetica, sans-serif">
  <text x="330" y="28" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">Indira Gandhi Canal Command Area: canal, problems, measures</text>
  <rect x="20" y="46" width="620" height="110" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="36" y="74" font-size="15" fill="#2563eb" font-weight="bold">The canal</text>
  <text x="36" y="100" font-size="14" fill="#1f2937">Begins at the Harike barrage (Sutlej-Beas confluence).</text>
  <text x="36" y="121" font-size="14" fill="#1f2937">Carries water to the dry areas of western Rajasthan,</text>
  <text x="36" y="142" font-size="14" fill="#1f2937">up to Jaisalmer.</text>
  <rect x="20" y="186" width="620" height="90" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="36" y="214" font-size="15" fill="#dc2626" font-weight="bold">Problems that appeared</text>
  <text x="36" y="240" font-size="14" fill="#1f2937">- Waterlogging</text>
  <text x="36" y="261" font-size="14" fill="#1f2937">- Salinity of the soil</text>
  <rect x="20" y="304" width="620" height="140" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="36" y="332" font-size="15" fill="#059669" font-weight="bold">Sustainability measures suggested</text>
  <text x="36" y="358" font-size="14" fill="#1f2937">- Lining of canals to stop seepage</text>
  <text x="36" y="379" font-size="14" fill="#1f2937">- Avoiding water-intensive crops (rice, sugarcane, cotton)</text>
  <text x="36" y="400" font-size="14" fill="#1f2937">- Afforestation and shelter-belt plantation</text>
  <text x="36" y="421" font-size="14" fill="#1f2937">- Pasture development</text>
  <line x1="330" y1="156" x2="330" y2="175.2" stroke="#1f2937" stroke-width="2.5"/>
  <polygon points="330,184 325.1,173 334.9,173" fill="#1f2937"/>
  <line x1="330" y1="276" x2="330" y2="293.2" stroke="#1f2937" stroke-width="2.5"/>
  <polygon points="330,302 325.1,291 334.9,291" fill="#1f2937"/>
  <text x="330" y="462" font-size="14" fill="#6b7280" text-anchor="middle">Schematic summary of the case study in the lesson; no map is drawn.</text>
</svg>
