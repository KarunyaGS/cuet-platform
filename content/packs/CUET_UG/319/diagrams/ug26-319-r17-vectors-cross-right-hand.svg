<text x="318.6" y="220" font-size="14" fill="#d97706" text-anchor="start" font-weight="bold">curl from a to b</text>
<text x="320" y="386" font-size="14" fill="#1f2937" text-anchor="middle">Fingers curl from a towards b; the thumb points along a × b.</text>
<text x="320" y="412" font-size="14" fill="#1f2937" text-anchor="middle">Here a = 2 units along x, b = 1.5 units along y, angle 90°:</text>
<text x="320" y="438" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">|a × b| = |a||b| sin 90° = 2 × 1.5 = 3.0 = area of the shaded parallelogram.</text>
<text x="320" y="464" font-size="14" fill="#dc2626" text-anchor="middle">Swapping the order reverses the direction: b × a = −(a × b), pointing down the z-axis.</text>
<text x="320" y="508" font-size="13" fill="#6b7280" text-anchor="middle">Schematic oblique drawing, not to scale.</text>
</svg>
