<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="Arial, Helvetica, sans-serif">
<text x="350" y="30" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Perpetuity: ₹80,000 deposited, ₹2,400 paid out every half-year, for ever</text>
<rect x="70" y="170" width="480" height="50" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5" rx="6"/>
<text x="310" y="201" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">Capital stays ₹80,000</text>
<text x="70" y="260" font-size="14" fill="#6b7280" text-anchor="middle">start</text>
<line x1="70" y1="228" x2="70" y2="236" stroke="#1f2937" stroke-width="2"/>
<text x="210" y="260" font-size="14" fill="#6b7280" text-anchor="middle">6 months</text>
<line x1="210" y1="228" x2="210" y2="236" stroke="#1f2937" stroke-width="2"/>
<text x="350" y="260" font-size="14" fill="#6b7280" text-anchor="middle">12 months</text>
<line x1="350" y1="228" x2="350" y2="236" stroke="#1f2937" stroke-width="2"/>
<text x="490" y="260" font-size="14" fill="#6b7280" text-anchor="middle">18 months</text>
<line x1="490" y1="228" x2="490" y2="236" stroke="#1f2937" stroke-width="2"/>
<line x1="210" y1="166" x2="210" y2="122.8" stroke="#d97706" stroke-width="3"/>
<polygon points="210,114 214.28,124.13 205.72,124.13" fill="#d97706" stroke="none" stroke-width="2" stroke-linejoin="round"/>
<text x="210" y="106" font-size="14" fill="#d97706" text-anchor="middle" font-weight="bold">₹2,400 paid</text>
<line x1="350" y1="166" x2="350" y2="122.8" stroke="#d97706" stroke-width="3"/>
<polygon points="350,114 354.28,124.13 345.72,124.13" fill="#d97706" stroke="none" stroke-width="2" stroke-linejoin="round"/>
<text x="350" y="106" font-size="14" fill="#d97706" text-anchor="middle" font-weight="bold">₹2,400 paid</text>
<line x1="490" y1="166" x2="490" y2="122.8" stroke="#d97706" stroke-width="3"/>
<polygon points="490,114 494.28,124.13 485.72,124.13" fill="#d97706" stroke="none" stroke-width="2" stroke-linejoin="round"/>
<text x="490" y="106" font-size="14" fill="#d97706" text-anchor="middle" font-weight="bold">₹2,400 paid</text>
<text x="70" y="308" font-size="14" fill="#1f2937">Half-year rate i = 6% ÷ 2 = 3%.  Interest earned each half-year = 3% × 80,000 = ₹2,400,</text>
<text x="70" y="332" font-size="14" fill="#1f2937">exactly the amount paid out, so the capital is never used up.</text>
<text x="70" y="360" font-size="16" fill="#dc2626" font-weight="bold">PV = C ÷ i = 2,400 ÷ 0.03 = ₹80,000</text>
</svg>
