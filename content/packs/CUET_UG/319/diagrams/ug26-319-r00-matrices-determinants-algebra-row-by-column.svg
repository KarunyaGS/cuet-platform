<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Arial, Helvetica, sans-serif" role="img">
<title>Matrix multiplication row by column</title>
<rect x="44" y="290" width="168" height="52" fill="#2563eb" fill-opacity="0.16" stroke="none" stroke-width="1.5"/>
<rect x="240" y="56" width="52" height="156" fill="#2563eb" fill-opacity="0.16" stroke="none" stroke-width="1.5"/>
<rect x="240" y="290" width="52" height="52" fill="#d97706" fill-opacity="0.35" stroke="#d97706" stroke-width="2"/>
<path d="M50 238 L43 238 L43 342 L50 342" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M206 238 L213 238 L213 342 L206 342" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="76" y="270" font-size="18" fill="#1f2937" text-anchor="middle">1</text>
<text x="128" y="270" font-size="18" fill="#1f2937" text-anchor="middle">2</text>
<text x="180" y="270" font-size="18" fill="#1f2937" text-anchor="middle">3</text>
<text x="76" y="322" font-size="18" fill="#1f2937" text-anchor="middle">4</text>
<text x="128" y="322" font-size="18" fill="#1f2937" text-anchor="middle">5</text>
<text x="180" y="322" font-size="18" fill="#1f2937" text-anchor="middle">6</text>
<path d="M240 56 L233 56 L233 212 L240 212" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M344 56 L351 56 L351 212 L344 212" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="266" y="88" font-size="18" fill="#1f2937" text-anchor="middle">7</text>
<text x="318" y="88" font-size="18" fill="#1f2937" text-anchor="middle">8</text>
<text x="266" y="140" font-size="18" fill="#1f2937" text-anchor="middle">9</text>
<text x="318" y="140" font-size="18" fill="#1f2937" text-anchor="middle">10</text>
<text x="266" y="192" font-size="18" fill="#1f2937" text-anchor="middle">11</text>
<text x="318" y="192" font-size="18" fill="#1f2937" text-anchor="middle">12</text>
<path d="M240 238 L233 238 L233 342 L240 342" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M344 238 L351 238 L351 342 L344 342" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="266" y="270" font-size="18" fill="#1f2937" text-anchor="middle">58</text>
<text x="318" y="270" font-size="18" fill="#1f2937" text-anchor="middle">64</text>
<text x="266" y="322" font-size="18" fill="#1f2937" text-anchor="middle">139</text>
<text x="318" y="322" font-size="18" fill="#1f2937" text-anchor="middle">154</text>
<text x="128" y="228" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">A  (2×3)</text>
<text x="306" y="46" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">B  (3×2)</text>
<text x="378" y="270" font-size="15" fill="#d97706" text-anchor="start" font-weight="bold">AB  (2×2)</text>
<text x="378" y="322" font-size="14" fill="#6b7280" text-anchor="start">orders: (2×3)(3×2) → 2×2</text>
<text x="50" y="392" font-size="15" fill="#1f2937" text-anchor="start">Highlighted entry: row 2 of A times column 1 of B</text>
<text x="50" y="420" font-size="17" fill="#d97706" text-anchor="start" font-weight="bold">4×7 + 5×9 + 6×11 = 28 + 45 + 66 = 139</text>
<text x="50" y="446" font-size="14" fill="#6b7280" text-anchor="start">The 3 columns of A match the 3 rows of B: that is why AB exists.</text>
</svg>
