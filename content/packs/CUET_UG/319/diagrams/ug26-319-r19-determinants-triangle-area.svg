<polygon points="490,174.29 482,170.93 482,177.65" fill="#1f2937"/>
<line x1="145.56" y1="340" x2="145.56" y2="66.4" stroke="#1f2937" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="145.56,60 142.2,68 148.92,68" fill="#1f2937"/>
<text x="494" y="179.29" font-size="14" fill="#1f2937" text-anchor="start" font-style="italic">x</text>
<text x="155.56" y="48" font-size="14" fill="#1f2937" text-anchor="start" font-style="italic">y</text>
<text x="97.78" y="192.29" font-size="13" fill="#1f2937" text-anchor="middle">−2</text>
<text x="241.11" y="192.29" font-size="13" fill="#1f2937" text-anchor="middle">4</text>
<text x="288.89" y="192.29" font-size="13" fill="#1f2937" text-anchor="middle">6</text>
<text x="336.67" y="192.29" font-size="13" fill="#1f2937" text-anchor="middle">8</text>
<text x="384.44" y="192.29" font-size="13" fill="#1f2937" text-anchor="middle">10</text>
<text x="432.22" y="192.29" font-size="13" fill="#1f2937" text-anchor="middle">12</text>
<text x="137.56" y="303.57" font-size="13" fill="#1f2937" text-anchor="end">−6</text>
<text x="137.56" y="262.14" font-size="13" fill="#1f2937" text-anchor="end">−4</text>
<text x="137.56" y="220.71" font-size="13" fill="#1f2937" text-anchor="end">−2</text>
<text x="137.56" y="137.86" font-size="13" fill="#1f2937" text-anchor="end">2</text>
<text x="137.56" y="96.43" font-size="13" fill="#1f2937" text-anchor="end">4</text>
