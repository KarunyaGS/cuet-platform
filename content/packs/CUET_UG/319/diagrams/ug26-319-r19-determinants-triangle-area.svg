<text x="203.33" y="316.57" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">(2, −6)</text>
<circle cx="265" cy="91.43" r="4.5" fill="#1f2937" stroke="#1f2937" stroke-width="1"/>
<text x="271" y="79.43" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">(5, 4)</text>
<circle cx="97.78" cy="91.43" r="4.5" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="93.78" y="79.43" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">k = −2</text>
<circle cx="432.22" cy="91.43" r="4.5" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<text x="432.22" y="79.43" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">k = 12</text>
<text x="522" y="80" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold">Area = ½ |det|</text>
<text x="522" y="104" font-size="14" fill="#6b7280" text-anchor="start">rows (x, y, 1)</text>
<text x="522" y="150" font-size="15" fill="#2563eb" text-anchor="start" font-weight="bold">k = −2</text>
<text x="522" y="174" font-size="14" fill="#2563eb" text-anchor="start">det = 70</text>
<text x="522" y="196" font-size="14" fill="#2563eb" text-anchor="start">area = ½ × 70 = 35</text>
<text x="522" y="244" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold">k = 12</text>
<text x="522" y="268" font-size="14" fill="#dc2626" text-anchor="start">det = −70 (negative!)</text>
<text x="522" y="290" font-size="14" fill="#dc2626" text-anchor="start">area = ½ × 70 = 35</text>
<text x="350" y="368" font-size="14" fill="#1f2937" text-anchor="middle">det = x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂) = 2(4 − 4) + 5(4 + 6) + k(−6 − 4) = 50 − 10k</text>
<text x="350" y="394" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Area = 35 means |50 − 10k| = 70, so k = −2 or k = 12.</text>
<text x="350" y="420" font-size="14" fill="#1f2937" text-anchor="middle">The determinant can be negative; the area never is, so take the modulus.</text>
<text x="350" y="446" font-size="14" fill="#6b7280" text-anchor="middle">If the determinant is 0, the three points lie on one line (zero area).</text>
<text x="350" y="508" font-size="13" fill="#6b7280" text-anchor="middle">Both triangles share the vertices (2, −6) and (5, 4); the third vertex sits on the line y = 4.</text>
</svg>
