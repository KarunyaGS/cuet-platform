<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="Arial, Helvetica, sans-serif" role="img">
<title>Symmetric and skew-symmetric matrices compared</title>
<rect x="96" y="70" width="46" height="46" fill="#2563eb" fill-opacity="0.25" stroke="none" stroke-width="1.5"/>
<rect x="50" y="116" width="46" height="46" fill="#2563eb" fill-opacity="0.25" stroke="none" stroke-width="1.5"/>
<rect x="142" y="70" width="46" height="46" fill="#059669" fill-opacity="0.25" stroke="none" stroke-width="1.5"/>
<rect x="50" y="162" width="46" height="46" fill="#059669" fill-opacity="0.25" stroke="none" stroke-width="1.5"/>
<rect x="142" y="116" width="46" height="46" fill="#d97706" fill-opacity="0.25" stroke="none" stroke-width="1.5"/>
<rect x="96" y="162" width="46" height="46" fill="#d97706" fill-opacity="0.25" stroke="none" stroke-width="1.5"/>
<path d="M50 70 L43 70 L43 208 L50 208" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M188 70 L195 70 L195 208 L188 208" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="73" y="99" font-size="18" fill="#1f2937" text-anchor="middle">2</text>
<text x="119" y="99" font-size="18" fill="#1f2937" text-anchor="middle">5</text>
<text x="165" y="99" font-size="18" fill="#1f2937" text-anchor="middle">7</text>
<text x="73" y="145" font-size="18" fill="#1f2937" text-anchor="middle">5</text>
<text x="119" y="145" font-size="18" fill="#1f2937" text-anchor="middle">3</text>
<text x="165" y="145" font-size="18" fill="#1f2937" text-anchor="middle">1</text>
<text x="73" y="191" font-size="18" fill="#1f2937" text-anchor="middle">7</text>
<text x="119" y="191" font-size="18" fill="#1f2937" text-anchor="middle">1</text>
<text x="165" y="191" font-size="18" fill="#1f2937" text-anchor="middle">4</text>
<rect x="406" y="70" width="46" height="46" fill="#2563eb" fill-opacity="0.25" stroke="none" stroke-width="1.5"/>
<rect x="360" y="116" width="46" height="46" fill="#2563eb" fill-opacity="0.25" stroke="none" stroke-width="1.5"/>
<rect x="452" y="70" width="46" height="46" fill="#059669" fill-opacity="0.25" stroke="none" stroke-width="1.5"/>
<rect x="360" y="162" width="46" height="46" fill="#059669" fill-opacity="0.25" stroke="none" stroke-width="1.5"/>
<rect x="452" y="116" width="46" height="46" fill="#d97706" fill-opacity="0.25" stroke="none" stroke-width="1.5"/>
<rect x="406" y="162" width="46" height="46" fill="#d97706" fill-opacity="0.25" stroke="none" stroke-width="1.5"/>
<rect x="360" y="70" width="46" height="46" fill="#dc2626" fill-opacity="0.18" stroke="none" stroke-width="1.5"/>
<rect x="406" y="116" width="46" height="46" fill="#dc2626" fill-opacity="0.18" stroke="none" stroke-width="1.5"/>
<rect x="452" y="162" width="46" height="46" fill="#dc2626" fill-opacity="0.18" stroke="none" stroke-width="1.5"/>
<path d="M360 70 L353 70 L353 208 L360 208" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M498 70 L505 70 L505 208 L498 208" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="383" y="99" font-size="18" fill="#1f2937" text-anchor="middle">0</text>
<text x="429" y="99" font-size="18" fill="#1f2937" text-anchor="middle">4</text>
<text x="475" y="99" font-size="18" fill="#1f2937" text-anchor="middle">−3</text>
<text x="383" y="145" font-size="18" fill="#1f2937" text-anchor="middle">−4</text>
<text x="429" y="145" font-size="18" fill="#1f2937" text-anchor="middle">0</text>
<text x="475" y="145" font-size="18" fill="#1f2937" text-anchor="middle">6</text>
<text x="383" y="191" font-size="18" fill="#1f2937" text-anchor="middle">3</text>
<text x="429" y="191" font-size="18" fill="#1f2937" text-anchor="middle">−6</text>
<text x="475" y="191" font-size="18" fill="#1f2937" text-anchor="middle">0</text>
<text x="119" y="52" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Symmetric: Aᵀ = A</text>
<text x="429" y="52" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Skew-symmetric: Aᵀ = −A</text>
<text x="50" y="250" font-size="14" fill="#1f2937" text-anchor="start">Mirror entries across the main</text>
<text x="50" y="270" font-size="14" fill="#1f2937" text-anchor="start">diagonal (top-left to bottom-right) are equal.</text>
<text x="360" y="250" font-size="14" fill="#1f2937" text-anchor="start">Mirror entries are opposite;</text>
<text x="360" y="270" font-size="14" fill="#1f2937" text-anchor="start">the diagonal entries are all 0.</text>
<text x="30" y="322" font-size="14" fill="#6b7280" text-anchor="start">Same colour = a mirror pair (aᵢⱼ and aⱼᵢ). Red cells on the right: aᵢᵢ = −aᵢᵢ forces 0.</text>
</svg>
