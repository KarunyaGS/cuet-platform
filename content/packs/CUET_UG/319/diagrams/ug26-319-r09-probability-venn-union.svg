<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family="Arial, Helvetica, sans-serif">
<rect x="30" y="20" width="640" height="330" fill="none" stroke="#1f2937" stroke-width="2"/>
<text x="46" y="44" font-size="14" fill="#1f2937" font-weight="bold">S = {1, 2, ..., 20}</text>
<circle cx="275" cy="190" r="105" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5" fill-opacity="0.55"/>
<circle cx="425" cy="190" r="105" fill="#a7f3d0" stroke="#059669" stroke-width="2.5" fill-opacity="0.55"/>
<text x="245" y="75" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">A: multiples of 3</text>
<text x="455" y="75" font-size="14" fill="#059669" text-anchor="middle" font-weight="bold">B: multiples of 5</text>
<text x="215" y="156" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">3</text>
<text x="260" y="156" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">6</text>
<text x="195" y="190" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">9</text>
<text x="240" y="190" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">12</text>
<text x="215" y="224" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">18</text>
<text x="350" y="208" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">15</text>
<text x="470" y="166" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">5</text>
<text x="470" y="196" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">10</text>
<text x="470" y="226" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">20</text>
<text x="350" y="184" font-size="14" fill="#6b7280" text-anchor="middle">A ∩ B</text>
<text x="350" y="325" font-size="14" fill="#6b7280" text-anchor="middle">Outside both circles (11 numbers): 1, 2, 4, 7, 8, 11, 13, 14, 16, 17, 19</text>
<text x="350" y="392" font-size="15" fill="#1f2937" text-anchor="middle">n(A) = 6,  n(B) = 4,  n(A ∩ B) = 1  (the number 15)</text>
<text x="350" y="418" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">n(A ∪ B) = 6 + 4 − 1 = 9,  so  P(A or B) = 9/20</text>
<text x="350" y="446" font-size="14" fill="#6b7280" text-anchor="middle">The overlap is subtracted once because 15 is counted in both circles.</text>
</svg>
