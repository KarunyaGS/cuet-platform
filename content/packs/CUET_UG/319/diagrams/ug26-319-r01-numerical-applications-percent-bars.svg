<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Arial, Helvetica, sans-serif" role="img">
<title>Bar model: A is 20% more than B, but B is 16 2/3% less than A</title>
<text x="58" y="88" font-size="18" fill="#1f2937" text-anchor="end" font-weight="bold">A</text>
<rect x="70" y="64" width="300" height="36" fill="#2563eb" fill-opacity="0.25" stroke="#2563eb" stroke-width="2"/>
<rect x="370" y="64" width="60" height="36" fill="#d97706" fill-opacity="0.4" stroke="#d97706" stroke-width="2"/>
<text x="220" y="88" font-size="16" fill="#1f2937" text-anchor="middle">100</text>
<text x="400" y="88" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">20</text>
<text x="438" y="88" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">= 120</text>
<text x="58" y="148" font-size="18" fill="#1f2937" text-anchor="end" font-weight="bold">B</text>
<rect x="70" y="124" width="300" height="36" fill="#2563eb" fill-opacity="0.25" stroke="#2563eb" stroke-width="2"/>
<rect x="370" y="124" width="60" height="36" fill="none" stroke="#d97706" stroke-width="2"/>
<line x1="370" y1="124" x2="370" y2="160" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
<text x="220" y="148" font-size="16" fill="#1f2937" text-anchor="middle">100</text>
<text x="400" y="148" font-size="16" fill="#d97706" text-anchor="middle">20</text>
<text x="438" y="148" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">= 100</text>
<text x="30" y="32" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">A earns 20% more than B (B = 100 units)</text>
<text x="30" y="210" font-size="16" fill="#d97706" text-anchor="start" font-weight="bold">A more than B: 20 ÷ 100 = 20%   (base is B)</text>
<text x="30" y="240" font-size="16" fill="#dc2626" text-anchor="start" font-weight="bold">B less than A: 20 ÷ 120 = 16⅔%   (base is A)</text>
<text x="30" y="276" font-size="14" fill="#6b7280" text-anchor="start">Same gap of 20 units, but compared with a different base,</text>
<text x="30" y="296" font-size="14" fill="#6b7280" text-anchor="start">so the two percentages differ.</text>
</svg>
