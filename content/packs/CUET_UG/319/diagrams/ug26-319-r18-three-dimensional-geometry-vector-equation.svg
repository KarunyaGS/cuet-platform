<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" font-family="Arial, Helvetica, sans-serif">
<text x="350" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Vector equation of a line:  r = a + λb</text>
<line x1="330" y1="175" x2="268.26" y2="226.81" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="263.35,230.92 271.64,228.35 267.32,223.21" fill="#9ca3af"/>
<text x="271.35" y="244.92" font-size="14" fill="#6b7280" text-anchor="middle" font-style="italic">x</text>
<line x1="330" y1="175" x2="555.6" y2="175" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="562,175 554,171.64 554,178.36" fill="#9ca3af"/>
<text x="570" y="189" font-size="14" fill="#6b7280" text-anchor="middle" font-style="italic">y</text>
<line x1="330" y1="175" x2="330" y2="36.4" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="330,30 326.64,38 333.36,38" fill="#9ca3af"/>
<text x="338" y="44" font-size="14" fill="#6b7280" text-anchor="middle" font-style="italic">z</text>
<line x1="163.04" y1="44.3" x2="477.21" y2="370.95" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="477.21,370.95 472.91,359.82 466.25,366.22" fill="#2563eb"/>
<line x1="330" y1="175" x2="285.84" y2="166.07" stroke="#059669" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="278.78,164.64 286.86,170.13 288.36,162.72" fill="#059669"/>
<text x="322" y="193" font-size="14" fill="#1f2937" text-anchor="end">O</text>
<circle cx="196.11" cy="78.68" r="5" fill="#6b7280" stroke="#6b7280" stroke-width="1"/>
<text x="184.11" y="98.68" font-size="14" fill="#6b7280" text-anchor="end" font-weight="bold">λ = −1</text>
<text x="184.11" y="115.68" font-size="13" fill="#6b7280" text-anchor="end">(−1, −5, 3)</text>
<circle cx="278.78" cy="164.64" r="5" fill="#059669" stroke="#059669" stroke-width="1"/>
<text x="264.78" y="188.64" font-size="14" fill="#059669" text-anchor="end" font-weight="bold">λ = 0 (point A)</text>
<text x="264.78" y="205.64" font-size="13" fill="#059669" text-anchor="end">(2, −1, 1)</text>
<circle cx="361.46" cy="250.6" r="5" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<text x="373.46" y="242.6" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold">λ = 1</text>
<text x="373.46" y="259.6" font-size="13" fill="#dc2626" text-anchor="start">(5, 3, −1)</text>
<circle cx="444.14" cy="336.56" r="5" fill="#6b7280" stroke="#6b7280" stroke-width="1"/>
<text x="456.14" y="328.56" font-size="14" fill="#6b7280" text-anchor="start" font-weight="bold">λ = 2</text>
<text x="456.14" y="345.56" font-size="13" fill="#6b7280" text-anchor="start">(8, 7, −3)</text>
<text x="280" y="378" font-size="14" fill="#1f2937" text-anchor="middle">a = (2, −1, 1) is the position vector of A.</text>
<text x="280" y="400" font-size="14" fill="#1f2937" text-anchor="middle">b = (3, 4, −2) is the direction: each step of λ adds b.</text>
<text x="280" y="422" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">λ = 1 gives (5, 3, −1), the point checked in the solved example.</text>
<text x="280" y="456" font-size="13" fill="#6b7280" text-anchor="middle">Schematic oblique drawing, not to scale. Green arrow: the vector a from O to A.</text>
</svg>
