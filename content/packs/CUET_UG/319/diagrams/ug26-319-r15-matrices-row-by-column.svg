<text x="100" y="152" font-size="16" fill="#1f2937" text-anchor="middle">−1</text>
<rect x="121" y="131" width="38" height="32" rx="4" fill="#dbeafe" stroke="none" stroke-width="0"/>
<text x="140" y="152" font-size="16" fill="#1f2937" text-anchor="middle">4</text>
