<text x="100" y="82" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold">A</text>
<text x="290" y="66" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold">B</text>
<text x="540" y="82" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold">AB</text>
<text x="100" y="192" font-size="14" fill="#2563eb" text-anchor="middle">order 2 × 3</text>
<text x="290" y="210" font-size="14" fill="#dc2626" text-anchor="middle">order 3 × 2</text>
<text x="540" y="192" font-size="14" fill="#059669" text-anchor="middle">order 2 × 2</text>
<text x="190" y="136" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="bold">×</text>
<text x="445" y="136" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="bold">=</text>
<rect x="150" y="228" width="400" height="56" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text x="350" y="251" font-size="14" fill="#1f2937" text-anchor="middle">Inner numbers must match: columns of A (3) = rows of B (3)</text>
<text x="350" y="273" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Outer numbers give the order of AB: 2 × 2</text>
<text x="350" y="316" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Entry in row 2, column 1 of AB = 3×2 + (−1)×0 + 4×1</text>
<text x="350" y="340" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">= 6 + 0 + 4 = 10</text>
<text x="350" y="374" font-size="14" fill="#6b7280" text-anchor="middle">Blue row of A paired with red column of B, term by term, then added.</text>
<text x="350" y="394" font-size="14" fill="#6b7280" text-anchor="middle">Whole product: rows of AB are (2, 7) and (10, −4)</text>
