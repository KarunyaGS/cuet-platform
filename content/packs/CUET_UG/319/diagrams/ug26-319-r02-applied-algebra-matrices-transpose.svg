<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Arial, Helvetica, sans-serif" role="img">
<title>Transpose: rows of A become columns of A transpose</title>
<text x="30" y="24" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">Transpose: rows become columns</text>
<rect x="70" y="60" width="150" height="50" fill="#2563eb" fill-opacity="0.18" stroke="none" stroke-width="1.5"/>
<rect x="70" y="110" width="150" height="50" fill="#dc2626" fill-opacity="0.18" stroke="none" stroke-width="1.5"/>
<path d="M70 60 L63 60 L63 160 L70 160" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M220 60 L227 60 L227 160 L220 160" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="95" y="91" font-size="18" fill="#1f2937" text-anchor="middle">1</text>
<text x="145" y="91" font-size="18" fill="#1f2937" text-anchor="middle">2</text>
<text x="195" y="91" font-size="18" fill="#1f2937" text-anchor="middle">3</text>
<text x="95" y="141" font-size="18" fill="#1f2937" text-anchor="middle">4</text>
<text x="145" y="141" font-size="18" fill="#1f2937" text-anchor="middle">5</text>
<text x="195" y="141" font-size="18" fill="#1f2937" text-anchor="middle">6</text>
<rect x="390" y="60" width="50" height="150" fill="#2563eb" fill-opacity="0.18" stroke="none" stroke-width="1.5"/>
<rect x="440" y="60" width="50" height="150" fill="#dc2626" fill-opacity="0.18" stroke="none" stroke-width="1.5"/>
<path d="M390 60 L383 60 L383 210 L390 210" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M490 60 L497 60 L497 210 L490 210" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="415" y="91" font-size="18" fill="#1f2937" text-anchor="middle">1</text>
<text x="465" y="91" font-size="18" fill="#1f2937" text-anchor="middle">4</text>
<text x="415" y="141" font-size="18" fill="#1f2937" text-anchor="middle">2</text>
<text x="465" y="141" font-size="18" fill="#1f2937" text-anchor="middle">5</text>
<text x="415" y="191" font-size="18" fill="#1f2937" text-anchor="middle">3</text>
<text x="465" y="191" font-size="18" fill="#1f2937" text-anchor="middle">6</text>
<text x="145" y="52" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">A  (2×3)</text>
<text x="440" y="52" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Aᵀ  (3×2)</text>
<line x1="250" y1="110" x2="348" y2="110" stroke="#6b7280" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="360,110 348,115.04 348,104.96" fill="#6b7280"/>
<text x="305" y="98" font-size="14" fill="#6b7280" text-anchor="middle">swap rows</text>
<text x="305" y="134" font-size="14" fill="#6b7280" text-anchor="middle">and columns</text>
<text x="30" y="250" font-size="14" fill="#1f2937" text-anchor="start">Row 1 of A (blue) becomes column 1 of Aᵀ; row 2 (red) becomes column 2.</text>
<text x="30" y="274" font-size="14" fill="#6b7280" text-anchor="start">An entry in row i, column j moves to row j, column i.</text>
</svg>
