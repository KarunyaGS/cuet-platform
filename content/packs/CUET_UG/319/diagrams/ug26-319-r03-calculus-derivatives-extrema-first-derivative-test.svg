<text x="189.3" y="155.44" font-size="14" fill="#1f2937" text-anchor="end">local max (−1, 2)</text>
<text x="430.7" y="302.56" font-size="14" fill="#1f2937" text-anchor="start">local min (1, −2)</text>
<text x="318" y="215" font-size="14" fill="#1f2937" text-anchor="start">(0, 0)</text>
<text x="130.65" y="88" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">f′ &gt; 0</text>
<text x="310" y="88" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">f′ &lt; 0</text>
<text x="489.35" y="88" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">f′ &gt; 0</text>
<text x="185" y="380" font-size="14" fill="#d97706" text-anchor="middle" font-weight="bold">f″ &lt; 0: bends down</text>
<text x="435" y="380" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">f″ &gt; 0: bends up</text>
<text x="30" y="28" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold">f(x) = x³ − 3x:  f′(x) = 3(x − 1)(x + 1),  f″(x) = 6x</text>
<text x="30" y="50" font-size="14" fill="#6b7280" text-anchor="start">Green flat segments: tangent is horizontal where f′ = 0.</text>
<text x="30" y="424" font-size="14" fill="#1f2937" text-anchor="start">f′ changes + to − at x = −1 (maximum) and − to + at x = 1 (minimum).</text>
<text x="30" y="448" font-size="14" fill="#6b7280" text-anchor="start">f″(−1) = −6 &lt; 0 and f″(1) = 6 &gt; 0 agree with the first derivative test.</text>
</svg>
