<line x1="400" y1="260" x2="602.16" y2="114.21" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="608,110 598.49,112.2 602.91,118.33" fill="#059669"/>
<line x1="452" y1="160" x2="608" y2="110" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5,4"/>
<line x1="556" y1="210" x2="608" y2="110" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5,4"/>
<text x="499.6" y="255" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">a</text>
<text x="414" y="210" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="bold">b</text>
<text x="474" y="137.5" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">a + b</text>
<text x="390" y="278" font-size="14" fill="#1f2937" text-anchor="end">O</text>
<text x="612" y="102" font-size="14" fill="#059669" text-anchor="start">(4, 3)</text>
<text x="448" y="150" font-size="14" fill="#dc2626" text-anchor="end">(1, 2)</text>
<text x="360" y="300" font-size="15" fill="#1f2937" text-anchor="middle">|a| = √10 ≈ 3.162,   |b| = √5 ≈ 2.236,   |a + b| = √25 = 5</text>
<text x="360" y="326" font-size="14" fill="#6b7280" text-anchor="middle">|a| + |b| ≈ 5.398, which is more than |a + b| = 5 because a and b are not parallel.</text>
<text x="360" y="356" font-size="14" fill="#1f2937" text-anchor="middle">Component rule: add matching components, (3 + 1, 1 + 2) = (4, 3). Both laws give the same vector.</text>
<text x="360" y="408" font-size="13" fill="#6b7280" text-anchor="middle">Grid squares are 1 unit.</text>
</svg>
