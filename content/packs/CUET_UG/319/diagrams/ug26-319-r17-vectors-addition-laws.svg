<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial, Helvetica, sans-serif">
<text x="360" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Adding vectors a = (3, 1) and b = (1, 2): the result is a + b = (4, 3)</text>
