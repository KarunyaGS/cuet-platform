<text x="530" y="52" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Parallelogram law (same start)</text>
<line x1="400" y1="260" x2="661.6" y2="260" stroke="#1f2937" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="668,260 660,256.64 660,263.36" fill="#1f2937"/>
<line x1="400" y1="260" x2="400" y2="58.4" stroke="#1f2937" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="400,52 396.64,60 403.36,60" fill="#1f2937"/>
<polygon points="400,260 556,210 608,110 452,160" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4" stroke-linejoin="round" fill-opacity="0.6"/>
<line x1="400" y1="260" x2="549.14" y2="212.2" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="556,210 546.28,209.15 548.58,216.35" fill="#2563eb"/>
<line x1="400" y1="260" x2="448.68" y2="166.39" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round"/>
