<line x1="40" y1="60" x2="300" y2="60" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="170" y="52" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Triangle law (head to tail)</text>
<line x1="40" y1="260" x2="301.6" y2="260" stroke="#1f2937" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="308,260 300,256.64 300,263.36" fill="#1f2937"/>
<line x1="40" y1="260" x2="40" y2="58.4" stroke="#1f2937" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="40,52 36.64,60 43.36,60" fill="#1f2937"/>
