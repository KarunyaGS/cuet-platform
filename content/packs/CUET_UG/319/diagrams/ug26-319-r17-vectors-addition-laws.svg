<polygon points="248,110 238.49,112.2 242.91,118.33" fill="#059669"/>
<text x="129.2" y="257" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">a</text>
<text x="228" y="192" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="bold">b</text>
<text x="116.8" y="162" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">a + b</text>
<text x="30" y="278" font-size="14" fill="#1f2937" text-anchor="end">O</text>
<text x="252" y="102" font-size="14" fill="#059669" text-anchor="start">(4, 3)</text>
<text x="202" y="228" font-size="14" fill="#2563eb" text-anchor="start">(3, 1)</text>
<line x1="400" y1="260" x2="400" y2="60" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="452" y1="260" x2="452" y2="60" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="504" y1="260" x2="504" y2="60" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="556" y1="260" x2="556" y2="60" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="608" y1="260" x2="608" y2="60" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="660" y1="260" x2="660" y2="60" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="400" y1="260" x2="660" y2="260" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
