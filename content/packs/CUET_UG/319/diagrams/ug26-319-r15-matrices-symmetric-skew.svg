<text x="142" y="232" font-size="14" fill="#1f2937" text-anchor="middle">a<tspan dy="4" font-size="75%">ij</tspan><tspan dy="-4"> = a</tspan><tspan dy="4" font-size="75%">ji</tspan><tspan dy="-4">: mirror entries equal</tspan></text>
<text x="142" y="254" font-size="14" fill="#6b7280" text-anchor="middle">diagonal can be anything</text>
<text x="492" y="232" font-size="14" fill="#1f2937" text-anchor="middle">a<tspan dy="4" font-size="75%">ij</tspan><tspan dy="-4"> = −a</tspan><tspan dy="4" font-size="75%">ji</tspan><tspan dy="-4">: mirror entries opposite</tspan></text>
<text x="492" y="254" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">diagonal must be 0</text>
<text x="350" y="316" font-size="14" fill="#6b7280" text-anchor="middle">Same colour = a mirror pair (red outline = main diagonal). Only square matrices can be either.</text>
