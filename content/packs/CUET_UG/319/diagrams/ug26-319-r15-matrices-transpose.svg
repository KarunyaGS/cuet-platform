<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Arial, Helvetica, sans-serif">
<text x="320" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Transpose: rows become columns</text>
<rect x="91" y="81" width="42" height="34" rx="4" fill="#dbeafe" stroke="none" stroke-width="0"/>
<text x="112" y="103" font-size="16" fill="#1f2937" text-anchor="middle">1</text>
<rect x="135" y="81" width="42" height="34" rx="4" fill="#dbeafe" stroke="none" stroke-width="0"/>
<text x="156" y="103" font-size="16" fill="#1f2937" text-anchor="middle">2</text>
<rect x="179" y="81" width="42" height="34" rx="4" fill="#dbeafe" stroke="none" stroke-width="0"/>
<text x="200" y="103" font-size="16" fill="#1f2937" text-anchor="middle">3</text>
<rect x="91" y="117" width="42" height="34" rx="4" fill="#fee2e2" stroke="none" stroke-width="0"/>
<text x="112" y="139" font-size="16" fill="#1f2937" text-anchor="middle">4</text>
<rect x="135" y="117" width="42" height="34" rx="4" fill="#fee2e2" stroke="none" stroke-width="0"/>
<text x="156" y="139" font-size="16" fill="#1f2937" text-anchor="middle">5</text>
<rect x="179" y="117" width="42" height="34" rx="4" fill="#fee2e2" stroke="none" stroke-width="0"/>
<text x="200" y="139" font-size="16" fill="#1f2937" text-anchor="middle">6</text>
<path d="M94,80 L87,80 L87,152 L94,152" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M218,80 L225,80 L225,152 L218,152" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="401" y="61" width="42" height="34" rx="4" fill="#dbeafe" stroke="none" stroke-width="0"/>
<text x="422" y="83" font-size="16" fill="#1f2937" text-anchor="middle">1</text>
<rect x="445" y="61" width="42" height="34" rx="4" fill="#fee2e2" stroke="none" stroke-width="0"/>
<text x="466" y="83" font-size="16" fill="#1f2937" text-anchor="middle">4</text>
<rect x="401" y="97" width="42" height="34" rx="4" fill="#dbeafe" stroke="none" stroke-width="0"/>
<text x="422" y="119" font-size="16" fill="#1f2937" text-anchor="middle">2</text>
<rect x="445" y="97" width="42" height="34" rx="4" fill="#fee2e2" stroke="none" stroke-width="0"/>
<text x="466" y="119" font-size="16" fill="#1f2937" text-anchor="middle">5</text>
<rect x="401" y="133" width="42" height="34" rx="4" fill="#dbeafe" stroke="none" stroke-width="0"/>
<text x="422" y="155" font-size="16" fill="#1f2937" text-anchor="middle">3</text>
<rect x="445" y="133" width="42" height="34" rx="4" fill="#fee2e2" stroke="none" stroke-width="0"/>
<text x="466" y="155" font-size="16" fill="#1f2937" text-anchor="middle">6</text>
<path d="M404,60 L397,60 L397,168 L404,168" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M484,60 L491,60 L491,168 L484,168" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="156" y="66" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold">A</text>
<text x="444" y="46" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold">A′</text>
<text x="156" y="180" font-size="14" fill="#1f2937" text-anchor="middle">order 2 × 3</text>
<text x="444" y="196" font-size="14" fill="#1f2937" text-anchor="middle">order 3 × 2</text>
<line x1="280" y1="116" x2="352.8" y2="116" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="360,116 351,112.22 351,119.78" fill="#1f2937"/>
<text x="320" y="104" font-size="14" fill="#6b7280" text-anchor="middle">swap rows</text>
<text x="320" y="140" font-size="14" fill="#6b7280" text-anchor="middle">and columns</text>
<text x="320" y="248" font-size="14" fill="#1f2937" text-anchor="middle">Element in row i, column j of A goes to row j, column i of A′:</text>
<text x="320" y="270" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">for example a<tspan dy="4" font-size="75%">12</tspan><tspan dy="-4"> = 2 becomes a′</tspan><tspan dy="4" font-size="75%">21</tspan><tspan dy="-4"> = 2, and a</tspan><tspan dy="4" font-size="75%">23</tspan><tspan dy="-4"> = 6 becomes a′</tspan><tspan dy="4" font-size="75%">32</tspan><tspan dy="-4"> = 6.</tspan></text>
</svg>
