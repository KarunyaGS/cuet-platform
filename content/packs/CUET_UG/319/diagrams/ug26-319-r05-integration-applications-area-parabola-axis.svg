<text x="495.38" y="300" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">y = 4x − x²</text>
<text x="30" y="386" font-size="14" fill="#1f2937" text-anchor="start">The curve meets the x-axis where 4x − x² = 0, so x = 0 and x = 4.</text>
<text x="30" y="408" font-size="14" fill="#6b7280" text-anchor="start">Area = [2x² − x³/3] from 0 to 4 = 32 − 64/3 = 32/3 ≈ 10.67 square units</text>
