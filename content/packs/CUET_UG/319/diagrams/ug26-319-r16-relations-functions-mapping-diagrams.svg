<text x="595" y="355" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Quick tests</text>
<text x="595" y="380" font-size="14" fill="#1f2937" text-anchor="middle">Function: one arrow from every</text>
<text x="595" y="398" font-size="14" fill="#1f2937" text-anchor="middle">point of A.</text>
<text x="595" y="423" font-size="14" fill="#1f2937" text-anchor="middle">One-one: no point of B has</text>
<text x="595" y="441" font-size="14" fill="#1f2937" text-anchor="middle">two arrows.</text>
<text x="360" y="524" font-size="14" fill="#1f2937" text-anchor="middle">Onto: every point of B has at least one arrow.</text>
<text x="360" y="548" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Bijective = one-one and onto.</text>
<text x="360" y="586" font-size="13" fill="#6b7280" text-anchor="middle">Each diagram is a small example; blue = A (domain), green = B (codomain).</text>
