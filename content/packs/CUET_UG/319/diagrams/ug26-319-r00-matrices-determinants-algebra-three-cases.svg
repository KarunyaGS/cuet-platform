<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 538" font-family="Arial, Helvetica, sans-serif" role="img">
<title>Two equations as two lines: three cases</title>
<rect x="40" y="22" width="200" height="140" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
<line x1="40" y1="138.67" x2="240" y2="138.67" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round"/>
<line x1="73.33" y1="22" x2="73.33" y2="162" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round"/>
<text x="236" y="132.67" font-size="14" fill="#6b7280" text-anchor="end">x</text>
<text x="79.33" y="36" font-size="14" fill="#6b7280" text-anchor="start">y</text>
<path d="M40 45.33 L206.67 162" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M240 45.33 L73.33 162" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="140" cy="115.33" r="6" fill="#059669" stroke="#fff" stroke-width="1.5"/>
<text x="270" y="42" font-size="16" fill="#059669" text-anchor="start" font-weight="bold">Unique solution</text>
<text x="270" y="68" font-size="15" fill="#2563eb" text-anchor="start">x + y = 3</text>
<text x="270" y="90" font-size="15" fill="#dc2626" text-anchor="start">x − y = 1</text>
<text x="270" y="116" font-size="15" fill="#1f2937" text-anchor="start">|A| = −2  (not 0)</text>
<text x="270" y="138" font-size="15" fill="#1f2937" text-anchor="start">X = A⁻¹B gives (2, 1)</text>
<text x="270" y="160" font-size="14" fill="#6b7280" text-anchor="start">lines cross at one point</text>
<rect x="40" y="198" width="200" height="140" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
<line x1="40" y1="314.67" x2="240" y2="314.67" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round"/>
<line x1="73.33" y1="198" x2="73.33" y2="338" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round"/>
<text x="236" y="308.67" font-size="14" fill="#6b7280" text-anchor="end">x</text>
<text x="79.33" y="212" font-size="14" fill="#6b7280" text-anchor="start">y</text>
<path d="M40 244.67 L173.33 338" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M40 198 L240 338" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="270" y="218" font-size="16" fill="#059669" text-anchor="start" font-weight="bold">No solution</text>
<text x="270" y="244" font-size="15" fill="#2563eb" text-anchor="start">x + y = 2</text>
<text x="270" y="266" font-size="15" fill="#dc2626" text-anchor="start">x + y = 4</text>
<text x="270" y="292" font-size="15" fill="#1f2937" text-anchor="start">|A| = 0</text>
<text x="270" y="314" font-size="15" fill="#1f2937" text-anchor="start">(adj A)B = [−2, 2] ≠ O</text>
<text x="270" y="336" font-size="14" fill="#6b7280" text-anchor="start">parallel lines never meet</text>
<rect x="40" y="374" width="200" height="140" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
<line x1="40" y1="490.67" x2="240" y2="490.67" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round"/>
<line x1="73.33" y1="374" x2="73.33" y2="514" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round"/>
<text x="236" y="484.67" font-size="14" fill="#6b7280" text-anchor="end">x</text>
<text x="79.33" y="388" font-size="14" fill="#6b7280" text-anchor="start">y</text>
<path d="M40 420.67 L173.33 514" fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M40 420.67 L173.33 514" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 7"/>
<text x="270" y="394" font-size="16" fill="#059669" text-anchor="start" font-weight="bold">Infinitely many solutions</text>
<text x="270" y="420" font-size="15" fill="#2563eb" text-anchor="start">x + y = 2</text>
<text x="270" y="442" font-size="15" fill="#dc2626" text-anchor="start">2x + 2y = 4</text>
<text x="270" y="468" font-size="15" fill="#1f2937" text-anchor="start">|A| = 0</text>
<text x="270" y="490" font-size="15" fill="#1f2937" text-anchor="start">(adj A)B = [0, 0] = O</text>
<text x="270" y="512" font-size="14" fill="#6b7280" text-anchor="start">the two lines are the same line</text>
</svg>
