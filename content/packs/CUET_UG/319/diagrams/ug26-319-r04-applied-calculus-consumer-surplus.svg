<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Arial, Helvetica, sans-serif" role="img">
<title>Consumer surplus as the area between the demand curve and the price line</title>
<line x1="80" y1="340" x2="525" y2="340" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="534,340 525,343.78 525,336.22" fill="#1f2937"/>
<line x1="80" y1="340" x2="80" y2="35" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="80,26 83.78,35 76.22,35" fill="#1f2937"/>
<line x1="80" y1="336" x2="80" y2="344" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="80" y="360" font-size="14" fill="#1f2937" text-anchor="middle">0</text>
<line x1="160" y1="336" x2="160" y2="344" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="160" y="360" font-size="14" fill="#1f2937" text-anchor="middle">2</text>
<line x1="240" y1="336" x2="240" y2="344" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="240" y="360" font-size="14" fill="#1f2937" text-anchor="middle">4</text>
<line x1="320" y1="336" x2="320" y2="344" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="320" y="360" font-size="14" fill="#1f2937" text-anchor="middle">6</text>
<line x1="400" y1="336" x2="400" y2="344" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="400" y="360" font-size="14" fill="#1f2937" text-anchor="middle">8</text>
<line x1="480" y1="336" x2="480" y2="344" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="480" y="360" font-size="14" fill="#1f2937" text-anchor="middle">10</text>
<line x1="76" y1="340" x2="84" y2="340" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="72" y="345" font-size="14" fill="#1f2937" text-anchor="end">0</text>
<line x1="76" y1="230.91" x2="84" y2="230.91" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="72" y="235.91" font-size="14" fill="#1f2937" text-anchor="end">8</text>
<line x1="76" y1="67.27" x2="84" y2="67.27" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="72" y="72.27" font-size="14" fill="#1f2937" text-anchor="end">20</text>
<text x="300" y="384" font-size="14" fill="#6b7280" text-anchor="middle">quantity x</text>
<text x="88" y="22" font-size="14" fill="#6b7280" text-anchor="start">price p (Rs)</text>
<rect x="80" y="230.91" width="240" height="109.09" fill="#6b7280" fill-opacity="0.15" stroke="none" stroke-width="1.5"/>
<path d="M80 230.91 L80 67.27 L320 230.91 Z" fill="#059669" fill-opacity="0.3" stroke="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="80" y1="230.91" x2="320" y2="230.91" stroke="#1f2937" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/>
<line x1="320" y1="230.91" x2="320" y2="340" stroke="#1f2937" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/>
<path d="M80 67.27 L86.67 71.82 L93.33 76.36 L100 80.91 L106.67 85.45 L113.33 90 L120 94.55 L126.67 99.09 L133.33 103.64 L140 108.18 L146.67 112.73 L153.33 117.27 L160 121.82 L166.67 126.36 L173.33 130.91 L180 135.45 L186.67 140 L193.33 144.55 L200 149.09 L206.67 153.64 L213.33 158.18 L220 162.73 L226.67 167.27 L233.33 171.82 L240 176.36 L246.67 180.91 L253.33 185.45 L260 190 L266.67 194.55 L273.33 199.09 L280 203.64 L286.67 208.18 L293.33 212.73 L300 217.27 L306.67 221.82 L313.33 226.36 L320 230.91 L326.67 235.45 L333.33 240 L340 244.55 L346.67 249.09 L353.33 253.64 L360 258.18 L366.67 262.73 L373.33 267.27 L380 271.82 L386.67 276.36 L393.33 280.91 L400 285.45 L406.67 290 L413.33 294.55 L420 299.09 L426.67 303.64 L433.33 308.18 L440 312.73 L446.67 317.27 L453.33 321.82 L460 326.36 L466.67 330.91 L473.33 335.45 L480 340" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="320" cy="230.91" r="6" fill="#1f2937" stroke="none" stroke-width="2"/>
<text x="332" y="222.91" font-size="14" fill="#1f2937" text-anchor="start">equilibrium (6, 8)</text>
<text x="408" y="280.91" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold">demand p = 20 − 2x</text>
<text x="94" y="176.36" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">consumer surplus</text>
<text x="94" y="196.36" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">= 36</text>
<text x="200" y="290.45" font-size="14" fill="#6b7280" text-anchor="middle">paid: 8 × 6 = 48</text>
<text x="30" y="428" font-size="14" fill="#1f2937" text-anchor="start">Area under demand from 0 to 6 = 84,  so CS = 84 − 48 = 36</text>
<text x="30" y="452" font-size="14" fill="#6b7280" text-anchor="start">Triangle check: ½ × 6 × (20 − 8) = 36.</text>
</svg>
