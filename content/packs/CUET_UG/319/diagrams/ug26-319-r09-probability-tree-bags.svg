<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family="Arial, Helvetica, sans-serif">
<text x="42" y="186" font-size="14" fill="#6b7280">Start</text>
<line x1="50" y1="200" x2="230" y2="110" stroke="#1f2937" stroke-width="2"/>
<line x1="50" y1="200" x2="230" y2="290" stroke="#1f2937" stroke-width="2"/>
<text x="115" y="140" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">1/2</text>
<text x="115" y="272" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">1/2</text>
<circle cx="50" cy="200" r="5" fill="#1f2937" stroke="none" stroke-width="2"/>
<text x="220" y="96" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">Bag A</text>
<text x="220" y="316" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">Bag B</text>
<circle cx="230" cy="110" r="5" fill="#2563eb" stroke="none" stroke-width="2"/>
<circle cx="230" cy="290" r="5" fill="#2563eb" stroke="none" stroke-width="2"/>
<line x1="230" y1="110" x2="410" y2="70" stroke="#dc2626" stroke-width="2.5"/>
<line x1="230" y1="110" x2="410" y2="150" stroke="#6b7280" stroke-width="2"/>
<text x="330" y="82" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">red 3/5</text>
<text x="330" y="152" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold">blue 2/5</text>
<line x1="230" y1="290" x2="410" y2="250" stroke="#dc2626" stroke-width="2.5"/>
<line x1="230" y1="290" x2="410" y2="330" stroke="#6b7280" stroke-width="2"/>
<text x="330" y="262" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">red 1/5</text>
<text x="330" y="332" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold">blue 4/5</text>
<circle cx="410" cy="70" r="4.5" fill="#dc2626" stroke="none" stroke-width="2"/>
<text x="422" y="75" font-size="14" fill="#dc2626" font-weight="bold">A, red: 1/2 × 3/5 = 3/10</text>
<circle cx="410" cy="150" r="4.5" fill="#1f2937" stroke="none" stroke-width="2"/>
<text x="422" y="155" font-size="14" fill="#1f2937">A, blue: 1/2 × 2/5 = 1/5</text>
<circle cx="410" cy="250" r="4.5" fill="#dc2626" stroke="none" stroke-width="2"/>
<text x="422" y="255" font-size="14" fill="#dc2626" font-weight="bold">B, red: 1/2 × 1/5 = 1/10</text>
<circle cx="410" cy="330" r="4.5" fill="#1f2937" stroke="none" stroke-width="2"/>
<text x="422" y="335" font-size="14" fill="#1f2937">B, blue: 1/2 × 4/5 = 2/5</text>
<rect x="30" y="372" width="640" height="84" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" rx="6"/>
<text x="46" y="398" font-size="14" fill="#dc2626" font-weight="bold">P(red) = 3/10 + 1/10 = 4/10 = 2/5   (add the two red leaves)</text>
<text x="46" y="424" font-size="14" fill="#2563eb" font-weight="bold">P(A | red) = (3/10) ÷ (2/5) = 3/4   (red leaf of A ÷ all red leaves)</text>
<text x="46" y="447" font-size="14" fill="#6b7280">All four leaves add to 1.</text>
</svg>
