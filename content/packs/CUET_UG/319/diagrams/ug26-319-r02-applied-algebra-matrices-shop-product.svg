<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Arial, Helvetica, sans-serif" role="img">
<title>Sales matrix times price column gives revenue</title>
<rect x="114" y="216" width="132" height="60" fill="#2563eb" fill-opacity="0.16" stroke="none" stroke-width="1.5"/>
<rect x="274" y="70" width="60" height="120" fill="#2563eb" fill-opacity="0.16" stroke="none" stroke-width="1.5"/>
<rect x="274" y="216" width="60" height="60" fill="#d97706" fill-opacity="0.35" stroke="#d97706" stroke-width="2"/>
<path d="M120 216 L113 216 L113 336 L120 336" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M240 216 L247 216 L247 336 L240 336" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="150" y="252" font-size="18" fill="#1f2937" text-anchor="middle">10</text>
<text x="210" y="252" font-size="18" fill="#1f2937" text-anchor="middle">20</text>
<text x="150" y="312" font-size="18" fill="#1f2937" text-anchor="middle">15</text>
<text x="210" y="312" font-size="18" fill="#1f2937" text-anchor="middle">5</text>
<path d="M274 70 L267 70 L267 190 L274 190" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M334 70 L341 70 L341 190 L334 190" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="304" y="106" font-size="18" fill="#1f2937" text-anchor="middle">40</text>
<text x="304" y="166" font-size="18" fill="#1f2937" text-anchor="middle">30</text>
<path d="M274 216 L267 216 L267 336 L274 336" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M334 216 L341 216 L341 336 L334 336" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="304" y="252" font-size="18" fill="#1f2937" text-anchor="middle">1000</text>
<text x="304" y="312" font-size="18" fill="#1f2937" text-anchor="middle">750</text>
<text x="30" y="26" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">Revenue = Sales × Prices</text>
<text x="180" y="206" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">S  (2×2)</text>
<text x="304" y="60" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">P  (2×1)</text>
<text x="304" y="206" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold">SP  (2×1)</text>
<text x="104" y="251" font-size="14" fill="#6b7280" text-anchor="end">shop A</text>
<text x="104" y="311" font-size="14" fill="#6b7280" text-anchor="end">shop B</text>
<text x="356" y="105" font-size="14" fill="#6b7280" text-anchor="start">rice price</text>
<text x="356" y="165" font-size="14" fill="#6b7280" text-anchor="start">wheat price</text>
<text x="356" y="251" font-size="14" fill="#6b7280" text-anchor="start">Rs, shop A</text>
<text x="356" y="311" font-size="14" fill="#6b7280" text-anchor="start">Rs, shop B</text>
<text x="150" y="358" font-size="14" fill="#6b7280" text-anchor="middle">rice kg</text>
<text x="210" y="358" font-size="14" fill="#6b7280" text-anchor="middle">wheat kg</text>
<text x="30" y="400" font-size="15" fill="#1f2937" text-anchor="start">Highlighted entry: shop A sales row times the price column</text>
<text x="30" y="426" font-size="17" fill="#d97706" text-anchor="start" font-weight="bold">10×40 + 20×30 = 400 + 600 = 1000</text>
<text x="30" y="452" font-size="14" fill="#6b7280" text-anchor="start">(shop B: 15×40 + 5×30 = 750)</text>
</svg>
