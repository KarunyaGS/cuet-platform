<line x1="86" y1="252" x2="94" y2="252" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="82" y="257" font-size="14" fill="#1f2937" text-anchor="end">0.1</text>
<line x1="86" y1="210" x2="94" y2="210" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="82" y="215" font-size="14" fill="#1f2937" text-anchor="end">0.2</text>
<line x1="86" y1="168" x2="94" y2="168" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="82" y="173" font-size="14" fill="#1f2937" text-anchor="end">0.3</text>
<line x1="86" y1="126" x2="94" y2="126" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="82" y="131" font-size="14" fill="#1f2937" text-anchor="end">0.4</text>
<text x="530" y="334" font-size="14" fill="#6b7280" text-anchor="end">value of X</text>
<text x="98" y="66" font-size="14" fill="#6b7280" text-anchor="start">P(X = x)</text>
<rect x="122.86" y="252" width="60" height="42" fill="#2563eb" fill-opacity="0.3" stroke="#2563eb" stroke-width="2"/>
<text x="152.86" y="244" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">0.1</text>
