<text x="257.62" y="160" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">0.3</text>
<rect x="332.38" y="126" width="60" height="168" fill="#2563eb" fill-opacity="0.3" stroke="#2563eb" stroke-width="2"/>
<text x="362.38" y="118" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">0.4</text>
<rect x="437.14" y="210" width="60" height="84" fill="#2563eb" fill-opacity="0.3" stroke="#2563eb" stroke-width="2"/>
<text x="467.14" y="202" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">0.2</text>
<path d="M330.95 298 L319.95 318 L341.95 318 Z" fill="#dc2626" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="330.95" y="340" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">E(X) = 1.7</text>
<text x="30" y="26" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">Distribution of X from the lesson (values 0 to 3)</text>
<text x="30" y="388" font-size="15" fill="#1f2937" text-anchor="start">E(X) = 0(0.1) + 1(0.3) + 2(0.4) + 3(0.2) = 1.7</text>
<text x="30" y="412" font-size="15" fill="#1f2937" text-anchor="start">E(X²) = 3.7,  Var(X) = 3.7 − 1.7² = 0.81,  σ = 0.9</text>
<text x="30" y="440" font-size="14" fill="#6b7280" text-anchor="start">The red triangle is the balance point of the bars, not a value X must take.</text>
</svg>
