<line x1="467.14" y1="290" x2="467.14" y2="298" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="467.14" y="314" font-size="14" fill="#1f2937" text-anchor="middle">3</text>
<line x1="86" y1="294" x2="94" y2="294" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
