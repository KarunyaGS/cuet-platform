<text x="383.2" y="270.92" font-size="14" fill="#059669" text-anchor="start" font-weight="bold">average: 240 ÷ 5 = 48 km/h</text>
<text x="30" y="418" font-size="14" fill="#6b7280" text-anchor="start">Illustrative trip from the lesson: 120 km out at 60 km/h and 120 km back at 40 km/h.</text>
