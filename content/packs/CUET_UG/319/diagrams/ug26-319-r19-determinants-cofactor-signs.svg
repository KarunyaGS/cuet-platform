<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" font-family="Arial, Helvetica, sans-serif">
<text x="350" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Cofactor signs and how a minor is formed</text>
<text x="150" y="64" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Sign of (−1)^(i + j)</text>
<rect x="71" y="87" width="46" height="42" rx="6" fill="#d1fae5" stroke="none" stroke-width="0"/>
<text x="94" y="116" font-size="22" fill="#059669" text-anchor="middle" font-weight="bold">+</text>
<rect x="119" y="87" width="46" height="42" rx="6" fill="#fee2e2" stroke="none" stroke-width="0"/>
<text x="142" y="116" font-size="22" fill="#dc2626" text-anchor="middle" font-weight="bold">−</text>
<rect x="167" y="87" width="46" height="42" rx="6" fill="#d1fae5" stroke="none" stroke-width="0"/>
<text x="190" y="116" font-size="22" fill="#059669" text-anchor="middle" font-weight="bold">+</text>
<rect x="71" y="131" width="46" height="42" rx="6" fill="#fee2e2" stroke="none" stroke-width="0"/>
<text x="94" y="160" font-size="22" fill="#dc2626" text-anchor="middle" font-weight="bold">−</text>
<rect x="119" y="131" width="46" height="42" rx="6" fill="#d1fae5" stroke="none" stroke-width="0"/>
<text x="142" y="160" font-size="22" fill="#059669" text-anchor="middle" font-weight="bold">+</text>
<rect x="167" y="131" width="46" height="42" rx="6" fill="#fee2e2" stroke="none" stroke-width="0"/>
<text x="190" y="160" font-size="22" fill="#dc2626" text-anchor="middle" font-weight="bold">−</text>
<rect x="71" y="175" width="46" height="42" rx="6" fill="#d1fae5" stroke="none" stroke-width="0"/>
<text x="94" y="204" font-size="22" fill="#059669" text-anchor="middle" font-weight="bold">+</text>
<rect x="119" y="175" width="46" height="42" rx="6" fill="#fee2e2" stroke="none" stroke-width="0"/>
<text x="142" y="204" font-size="22" fill="#dc2626" text-anchor="middle" font-weight="bold">−</text>
<rect x="167" y="175" width="46" height="42" rx="6" fill="#d1fae5" stroke="none" stroke-width="0"/>
<text x="190" y="204" font-size="22" fill="#059669" text-anchor="middle" font-weight="bold">+</text>
<line x1="67" y1="86" x2="67" y2="218" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
<line x1="217" y1="86" x2="217" y2="218" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
<text x="150" y="248" font-size="14" fill="#1f2937" text-anchor="middle">Chessboard: + at the corners and centre</text>
<text x="150" y="268" font-size="14" fill="#6b7280" text-anchor="middle">(the top-left entry is always +)</text>
<text x="500" y="56" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Minor and cofactor of a₂₃</text>
<rect x="411" y="91" width="44" height="36" rx="4" fill="#d1fae5" stroke="none" stroke-width="0"/>
<text x="433" y="114" font-size="17" fill="#1f2937" text-anchor="middle">1</text>
<rect x="457" y="91" width="44" height="36" rx="4" fill="#d1fae5" stroke="none" stroke-width="0"/>
<text x="479" y="114" font-size="17" fill="#1f2937" text-anchor="middle">2</text>
<rect x="503" y="91" width="44" height="36" rx="4" fill="#f3f4f6" stroke="none" stroke-width="0"/>
<text x="525" y="114" font-size="17" fill="#9ca3af" text-anchor="middle">3</text>
<rect x="411" y="129" width="44" height="36" rx="4" fill="#f3f4f6" stroke="none" stroke-width="0"/>
<text x="433" y="152" font-size="17" fill="#9ca3af" text-anchor="middle">4</text>
<rect x="457" y="129" width="44" height="36" rx="4" fill="#f3f4f6" stroke="none" stroke-width="0"/>
<text x="479" y="152" font-size="17" fill="#9ca3af" text-anchor="middle">5</text>
<rect x="503" y="129" width="44" height="36" rx="4" fill="#f3f4f6" stroke="none" stroke-width="0"/>
<text x="525" y="152" font-size="17" fill="#9ca3af" text-anchor="middle" font-weight="bold">6</text>
<rect x="411" y="167" width="44" height="36" rx="4" fill="#d1fae5" stroke="none" stroke-width="0"/>
<text x="433" y="190" font-size="17" fill="#1f2937" text-anchor="middle">7</text>
<rect x="457" y="167" width="44" height="36" rx="4" fill="#d1fae5" stroke="none" stroke-width="0"/>
<text x="479" y="190" font-size="17" fill="#1f2937" text-anchor="middle">8</text>
<rect x="503" y="167" width="44" height="36" rx="4" fill="#f3f4f6" stroke="none" stroke-width="0"/>
<text x="525" y="190" font-size="17" fill="#9ca3af" text-anchor="middle">10</text>
<line x1="407" y1="90" x2="407" y2="204" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
<line x1="551" y1="90" x2="551" y2="204" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
<text x="398" y="152" font-size="14" fill="#dc2626" text-anchor="end" font-weight="bold">row 2</text>
<text x="525" y="84" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">column 3</text>
<rect x="503" y="129" width="44" height="36" rx="4" fill="none" stroke="#d97706" stroke-width="2.6"/>
<text x="500" y="232" font-size="14" fill="#1f2937" text-anchor="middle">Delete row 2 and column 3 (grey).</text>
<text x="500" y="254" font-size="14" fill="#059669" text-anchor="middle">Green entries are what is left.</text>
<text x="350" y="300" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">M₂₃ = determinant of the green entries = 1×8 − 2×7 = −6</text>
<text x="350" y="330" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">A₂₃ = (−1)^(2+3) × M₂₃ = (−1)^5 × (−6) = 6</text>
<text x="350" y="366" font-size="14" fill="#1f2937" text-anchor="middle">Position (2, 3) sits on a "−" square, so the cofactor has the opposite sign to the minor.</text>
<text x="350" y="392" font-size="14" fill="#6b7280" text-anchor="middle">Expanding a determinant: each element × its own cofactor, summed along one row or column.</text>
<text x="350" y="458" font-size="13" fill="#6b7280" text-anchor="middle">A = [[1, 2, 3], [4, 5, 6], [7, 8, 10]] (the matrix of the lesson example).</text>
</svg>
