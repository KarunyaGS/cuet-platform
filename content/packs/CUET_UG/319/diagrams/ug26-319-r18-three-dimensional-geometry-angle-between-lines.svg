<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="Arial, Helvetica, sans-serif">
<text x="350" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Angle between two lines = angle between their directions</text>
<line x1="120" y1="345" x2="88.69" y2="371.27" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="83.18,375.9 92.5,373.01 87.64,367.22" fill="#1f2937"/>
<text x="72.45" y="389.9" font-size="16" fill="#1f2937" text-anchor="middle" font-style="italic">x</text>
<line x1="120" y1="345" x2="292.2" y2="345" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="299.4,345 290.4,341.22 290.4,348.78" fill="#1f2937"/>
<text x="313.4" y="350" font-size="16" fill="#1f2937" text-anchor="middle" font-style="italic">y</text>
<line x1="120" y1="345" x2="120" y2="85.4" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="120,78.2 116.22,87.2 123.78,87.2" fill="#1f2937"/>
<text x="120" y="69.2" font-size="16" fill="#1f2937" text-anchor="middle" font-style="italic">z</text>
<line x1="120" y1="345" x2="187.64" y2="274.46" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
<polygon points="192.62,269.26 183.66,273.14 189.12,278.37" fill="#2563eb"/>
<line x1="120" y1="345" x2="206.6" y2="132.54" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
<polygon points="209.31,125.87 202.42,132.78 209.42,135.63" fill="#dc2626"/>
<path d="M202.3,259.16 L200.76,257.32 L199.2,255.5 L197.61,253.69 L196.01,251.91 L194.4,250.16 L192.76,248.42 L191.1,246.71 L189.43,245.02 L187.75,243.36 L186.04,241.72 L184.32,240.1 L182.59,238.51 L180.84,236.95 L179.07,235.41 L177.29,233.89 L175.5,232.41 L173.7,230.95 L171.88,229.52 L170.04,228.12 L168.2,226.74" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="198.04" y="255.72" font-size="18" fill="#059669" text-anchor="start" font-weight="bold">θ</text>
<text x="208.62" y="277.26" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold">d₁ = (1, 2, 2)</text>
<text x="221.31" y="129.87" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold">d₂ = (2, 3, 6)</text>
<text x="480" y="170" font-size="14" fill="#1f2937" text-anchor="start">d₁ · d₂ = 1×2 + 2×3 + 2×6 = 20</text>
<text x="480" y="196" font-size="14" fill="#1f2937" text-anchor="start">|d₁| = 3,   |d₂| = 7</text>
<text x="480" y="222" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">cos θ = 20 / 21</text>
<text x="480" y="248" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">θ ≈ 17.8°</text>
<text x="350" y="394" font-size="14" fill="#1f2937" text-anchor="middle">Slide both lines (keeping their directions) so they start at one point;</text>
<text x="350" y="416" font-size="14" fill="#1f2937" text-anchor="middle">then θ is the angle between those direction vectors.</text>
<text x="350" y="440" font-size="14" fill="#6b7280" text-anchor="middle">Use the modulus on the dot product to get the acute angle.</text>
<text x="350" y="468" font-size="13" fill="#6b7280" text-anchor="middle">Oblique drawing: the arc is the true 3-D angle, but its size looks different on the page.</text>
</svg>
