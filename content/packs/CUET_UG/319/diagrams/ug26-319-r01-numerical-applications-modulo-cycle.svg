<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Arial, Helvetica, sans-serif" role="img">
<title>Remainders of powers of 3 modulo 7 repeat in a cycle of 6</title>
<line x1="214.25" y1="79" x2="263.61" y2="107.5" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
<polygon points="273.14,113 261.3,111.5 265.92,103.5" fill="#6b7280"/>
<line x1="298.25" y1="155.5" x2="298.25" y2="212.5" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
<polygon points="298.25,223.5 293.63,212.5 302.87,212.5" fill="#6b7280"/>
<line x1="274" y1="266.5" x2="224.64" y2="295" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
<polygon points="215.11,300.5 222.33,291 226.95,299" fill="#6b7280"/>
<line x1="165.75" y1="301" x2="116.39" y2="272.5" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
<polygon points="106.86,267 118.7,268.5 114.08,276.5" fill="#6b7280"/>
<line x1="81.75" y1="224.5" x2="81.75" y2="167.5" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
<polygon points="81.75,156.5 86.37,167.5 77.13,167.5" fill="#6b7280"/>
<line x1="106" y1="113.5" x2="155.36" y2="85" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
<polygon points="164.89,79.5 157.67,89 153.05,81" fill="#6b7280"/>
<circle cx="190" cy="65" r="26" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="190" y="72" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="bold">3</text>
<text x="190" y="18" font-size="15" fill="#1f2937" text-anchor="middle">3¹</text>
<circle cx="298.25" cy="127.5" r="26" fill="#fff" stroke="#d97706" stroke-width="3"/>
<text x="298.25" y="134.5" font-size="20" fill="#d97706" text-anchor="middle" font-weight="bold">2</text>
<text x="343.29" y="106.5" font-size="15" fill="#1f2937" text-anchor="middle">3²</text>
<circle cx="298.25" cy="252.5" r="26" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="298.25" y="259.5" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="bold">6</text>
<text x="343.29" y="283.5" font-size="15" fill="#1f2937" text-anchor="middle">3³</text>
<circle cx="190" cy="315" r="26" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="190" y="322" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="bold">4</text>
<text x="190" y="372" font-size="15" fill="#1f2937" text-anchor="middle">3⁴</text>
<circle cx="81.75" cy="252.5" r="26" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="81.75" y="259.5" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="bold">5</text>
<text x="36.71" y="283.5" font-size="15" fill="#1f2937" text-anchor="middle">3⁵</text>
<circle cx="81.75" cy="127.5" r="26" fill="#fff" stroke="#059669" stroke-width="3"/>
<text x="81.75" y="134.5" font-size="20" fill="#059669" text-anchor="middle" font-weight="bold">1</text>
<text x="36.71" y="106.5" font-size="15" fill="#1f2937" text-anchor="middle">3⁶</text>
<text x="190" y="188" font-size="15" fill="#6b7280" text-anchor="middle">powers of 3</text>
<text x="190" y="208" font-size="15" fill="#6b7280" text-anchor="middle">mod 7</text>
<text x="400" y="110" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">The remainders repeat</text>
<text x="400" y="134" font-size="15" fill="#1f2937" text-anchor="start">every 6 powers: 3, 2, 6,</text>
<text x="400" y="156" font-size="15" fill="#1f2937" text-anchor="start">4, 5, 1, then 3 again.</text>
<text x="400" y="200" font-size="16" fill="#d97706" text-anchor="start" font-weight="bold">20 = 6×3 + 2</text>
<text x="400" y="226" font-size="16" fill="#d97706" text-anchor="start" font-weight="bold">3²⁰ ≡ 3² ≡ 2  (mod 7)</text>
<text x="400" y="262" font-size="14" fill="#059669" text-anchor="start">Green: 3⁶ ≡ 1, the cycle</text>
<text x="400" y="282" font-size="14" fill="#059669" text-anchor="start">restarts here.</text>
</svg>
