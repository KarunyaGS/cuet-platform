<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 535" font-family="Arial, Helvetica, sans-serif" role="img">
<title>Open box: volume against cut-out side with the maximum</title>
<text x="30" y="26" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">Open box from a 12 cm square sheet</text>
<rect x="50" y="44" width="168" height="168" fill="#2563eb" fill-opacity="0.1" stroke="#1f2937" stroke-width="2.5"/>
<rect x="50" y="44" width="28" height="28" fill="#dc2626" fill-opacity="0.35" stroke="#dc2626" stroke-width="2"/>
<rect x="190" y="44" width="28" height="28" fill="#dc2626" fill-opacity="0.35" stroke="#dc2626" stroke-width="2"/>
<rect x="50" y="184" width="28" height="28" fill="#dc2626" fill-opacity="0.35" stroke="#dc2626" stroke-width="2"/>
<rect x="190" y="184" width="28" height="28" fill="#dc2626" fill-opacity="0.35" stroke="#dc2626" stroke-width="2"/>
<text x="64" y="63" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">x</text>
<text x="134" y="133" font-size="15" fill="#1f2937" text-anchor="middle">base (12 − 2x)²</text>
<text x="134" y="234" font-size="14" fill="#6b7280" text-anchor="middle">12 cm</text>
<text x="270" y="80" font-size="15" fill="#1f2937" text-anchor="start">Cut a square of side x from each</text>
<text x="270" y="100" font-size="15" fill="#1f2937" text-anchor="start">corner (red) and fold up the flaps.</text>
<text x="270" y="136" font-size="15" fill="#1f2937" text-anchor="start">height = x,  base side = 12 − 2x</text>
<text x="270" y="164" font-size="17" fill="#2563eb" text-anchor="start" font-weight="bold">V = x(12 − 2x)²</text>
<text x="270" y="192" font-size="15" fill="#1f2937" text-anchor="start">V′ = 12(x − 2)(x − 6) = 0 at x = 2</text>
<text x="270" y="218" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">V(2) = 2 × 8² = 128 cm³</text>
