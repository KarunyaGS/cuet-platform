<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Arial, Helvetica, sans-serif" role="img">
<title>Number line solution of -2x + 3 &gt;= 11</title>
<text x="30" y="30" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">Solve  −2x + 3 ≥ 11</text>
<line x1="54" y1="130" x2="559" y2="130" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
<polygon points="570,130 559,134.62 559,125.38" fill="#1f2937"/>
<line x1="60" y1="125" x2="60" y2="135" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="60" y="154" font-size="14" fill="#1f2937" text-anchor="middle">−8</text>
<line x1="108" y1="125" x2="108" y2="135" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="108" y="154" font-size="14" fill="#1f2937" text-anchor="middle">−7</text>
<line x1="156" y1="125" x2="156" y2="135" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="156" y="154" font-size="14" fill="#1f2937" text-anchor="middle">−6</text>
<line x1="204" y1="125" x2="204" y2="135" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="204" y="154" font-size="14" fill="#1f2937" text-anchor="middle">−5</text>
<line x1="252" y1="125" x2="252" y2="135" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="252" y="154" font-size="14" fill="#1f2937" text-anchor="middle">−4</text>
<line x1="300" y1="125" x2="300" y2="135" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="300" y="154" font-size="14" fill="#1f2937" text-anchor="middle">−3</text>
<line x1="348" y1="125" x2="348" y2="135" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="348" y="154" font-size="14" fill="#1f2937" text-anchor="middle">−2</text>
<line x1="396" y1="125" x2="396" y2="135" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="396" y="154" font-size="14" fill="#1f2937" text-anchor="middle">−1</text>
<line x1="444" y1="125" x2="444" y2="135" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="444" y="154" font-size="14" fill="#1f2937" text-anchor="middle">0</text>
<line x1="492" y1="125" x2="492" y2="135" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="492" y="154" font-size="14" fill="#1f2937" text-anchor="middle">1</text>
<line x1="540" y1="125" x2="540" y2="135" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<text x="540" y="154" font-size="14" fill="#1f2937" text-anchor="middle">2</text>
<line x1="252" y1="130" x2="70" y2="130" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
<polygon points="54,130 70,123.28 70,136.72" fill="#2563eb"/>
<circle cx="252" cy="130" r="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<text x="252" y="108" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">x ≤ −4</text>
<circle cx="204" cy="178" r="6" fill="#059669" stroke="none" stroke-width="2"/>
<circle cx="444" cy="178" r="6" fill="#dc2626" stroke="none" stroke-width="2"/>
<text x="204" y="212" font-size="14" fill="#059669" text-anchor="middle">x = −5</text>
<text x="204" y="232" font-size="14" fill="#059669" text-anchor="middle">−2(−5)+3 = 13 ≥ 11, true</text>
<text x="458" y="212" font-size="14" fill="#dc2626" text-anchor="middle">x = 0</text>
<text x="458" y="232" font-size="14" fill="#dc2626" text-anchor="middle">3 ≥ 11, false</text>
<text x="30" y="270" font-size="15" fill="#1f2937" text-anchor="start">−2x ≥ 8, and dividing by −2 reverses the sign: x ≤ −4.</text>
<text x="30" y="296" font-size="14" fill="#6b7280" text-anchor="start">Closed dot at −4: the value −4 itself satisfies the inequality.</text>
</svg>
