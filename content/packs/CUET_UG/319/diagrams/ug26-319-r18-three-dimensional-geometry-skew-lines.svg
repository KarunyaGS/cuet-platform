<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" font-family="Arial, Helvetica, sans-serif">
<text x="350" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Skew lines: neither parallel nor intersecting</text>
<line x1="482.07" y1="301.38" x2="184.36" y2="153.66" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="184.36,153.66 192.16,162.69 196.27,154.41" fill="#2563eb"/>
<line x1="248.49" y1="218.2" x2="445.08" y2="186.76" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="445.08,186.76 433.49,183.94 434.95,193.06" fill="#dc2626"/>
<line x1="333.21" y1="227.52" x2="346.79" y2="202.48" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
<circle cx="333.21" cy="227.52" r="4.5" fill="#059669" stroke="#059669" stroke-width="1"/>
<circle cx="346.79" cy="202.48" r="4.5" fill="#059669" stroke="#059669" stroke-width="1"/>
<text x="170.36" y="175.66" font-size="14" fill="#2563eb" text-anchor="end" font-weight="bold">line 1: r = a₁ + λb₁</text>
<text x="453.08" y="208.76" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold">line 2: r = a₂ + μb₂</text>
<text x="310" y="267" font-size="14" fill="#059669" text-anchor="end" font-weight="bold">shortest distance</text>
<line x1="314" y1="261" x2="336" y2="223" stroke="#059669" stroke-width="1.3" stroke-linecap="round"/>
<rect x="40" y="370" width="620" height="96" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.2"/>
<text x="350" y="394" font-size="14" fill="#1f2937" text-anchor="middle">Line 1: a₁ = (1, 2, 3), b₁ = (1, −3, 2).   Line 2: a₂ = (4, 5, 6), b₂ = (2, 3, 1).</text>
<text x="350" y="418" font-size="14" fill="#1f2937" text-anchor="middle">b₁ × b₂ = (−9, 3, 9),  |b₁ × b₂| = √171 = 3√19;   (a₂ − a₁) · (b₁ × b₂) = 9</text>
<text x="350" y="446" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold">d = 9 / √171 = 3/√19 ≈ 0.688</text>
<text x="350" y="502" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">The lines look as if they cross on the page, but in space they never meet.</text>
<text x="350" y="526" font-size="14" fill="#1f2937" text-anchor="middle">The common perpendicular (green) meets both lines at right angles; its length is the shortest distance.</text>
<text x="350" y="548" font-size="13" fill="#6b7280" text-anchor="middle">Schematic oblique drawing (right angles do not look right-angled). Numbers computed from the formula.</text>
</svg>
