<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Arial, Helvetica, sans-serif">
<text x="320" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">A relation from A to B is a chosen subset of A × B</text>
<text x="280" y="72" font-size="14" fill="#6b7280" text-anchor="middle">second element y in B</text>
<text x="215" y="88" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">y = a</text>
<text x="345" y="88" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">y = b</text>
<text x="138" y="132" font-size="15" fill="#1f2937" text-anchor="end" font-weight="bold">x = 1</text>
<rect x="154" y="104" width="122" height="48" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="215" y="133" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">(1, a)</text>
<rect x="284" y="104" width="122" height="48" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="345" y="133" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">(1, b)</text>
<text x="138" y="188" font-size="15" fill="#1f2937" text-anchor="end" font-weight="bold">x = 2</text>
<rect x="154" y="160" width="122" height="48" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
<text x="215" y="189" font-size="16" fill="#6b7280" text-anchor="middle">(2, a)</text>
<rect x="284" y="160" width="122" height="48" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
<text x="345" y="189" font-size="16" fill="#6b7280" text-anchor="middle">(2, b)</text>
<text x="138" y="244" font-size="15" fill="#1f2937" text-anchor="end" font-weight="bold">x = 3</text>
<rect x="154" y="216" width="122" height="48" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="215" y="245" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">(3, a)</text>
<rect x="284" y="216" width="122" height="48" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="345" y="245" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">(3, b)</text>
<text x="280" y="294" font-size="14" fill="#059669" text-anchor="middle" font-weight="bold">Green: pairs in R = {(x, y): x is odd}</text>
<text x="320" y="320" font-size="14" fill="#1f2937" text-anchor="middle">A × B has 3 × 2 = 6 ordered pairs. Each pair is either in R or out,</text>
<text x="320" y="340" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">so there are 2^6 = 64 possible relations (subsets).</text>
<text x="320" y="368" font-size="13" fill="#6b7280" text-anchor="middle">R here has 4 pairs: (1, a), (1, b), (3, a), (3, b).</text>
</svg>
