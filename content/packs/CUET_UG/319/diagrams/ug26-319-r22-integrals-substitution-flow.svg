<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="Arial, Helvetica, sans-serif">
  <rect x="90.0" y="20.0" width="460.0" height="58.0" fill="none" stroke="#1f2937" stroke-width="2.5" rx="8"/>
  <text x="320.0" y="42.0" font-size="14" fill="#6b7280" text-anchor="middle">Start</text>
  <text x="320.0" y="66.0" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold">∫ 2x cos(x²) dx</text>
  <line x1="320.0" y1="81.0" x2="320.0" y2="96.0" stroke="#1f2937" stroke-width="2"/>
  <polygon points="320.0,106.0 315.8,96.0 324.2,96.0" fill="#1f2937"/>
  <rect x="90.0" y="108.0" width="460.0" height="58.0" fill="none" stroke="#2563eb" stroke-width="2.5" rx="8"/>
  <text x="320.0" y="130.0" font-size="14" fill="#6b7280" text-anchor="middle">Substitute</text>
  <text x="320.0" y="154.0" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">let t = x²,   then dt = 2x dx</text>
  <line x1="320.0" y1="169.0" x2="320.0" y2="184.0" stroke="#1f2937" stroke-width="2"/>
  <polygon points="320.0,194.0 315.8,184.0 324.2,184.0" fill="#1f2937"/>
  <rect x="90.0" y="196.0" width="460.0" height="58.0" fill="none" stroke="#2563eb" stroke-width="2.5" rx="8"/>
  <text x="320.0" y="218.0" font-size="14" fill="#6b7280" text-anchor="middle">New integral</text>
  <text x="320.0" y="242.0" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">∫ cos t dt</text>
  <line x1="320.0" y1="257.0" x2="320.0" y2="272.0" stroke="#1f2937" stroke-width="2"/>
  <polygon points="320.0,282.0 315.8,272.0 324.2,272.0" fill="#1f2937"/>
  <rect x="90.0" y="284.0" width="460.0" height="58.0" fill="none" stroke="#2563eb" stroke-width="2.5" rx="8"/>
  <text x="320.0" y="306.0" font-size="14" fill="#6b7280" text-anchor="middle">Integrate in t</text>
  <text x="320.0" y="330.0" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">sin t + C</text>
  <line x1="320.0" y1="345.0" x2="320.0" y2="360.0" stroke="#1f2937" stroke-width="2"/>
  <polygon points="320.0,370.0 315.8,360.0 324.2,360.0" fill="#1f2937"/>
  <rect x="90.0" y="372.0" width="460.0" height="58.0" fill="none" stroke="#1f2937" stroke-width="2.5" rx="8"/>
  <text x="320.0" y="394.0" font-size="14" fill="#6b7280" text-anchor="middle">Return to x</text>
  <text x="320.0" y="418.0" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold">sin(x²) + C</text>
  <line x1="320.0" y1="433.0" x2="320.0" y2="448.0" stroke="#1f2937" stroke-width="2"/>
  <polygon points="320.0,458.0 315.8,448.0 324.2,448.0" fill="#1f2937"/>
  <rect x="90.0" y="460.0" width="460.0" height="58.0" fill="none" stroke="#059669" stroke-width="2.5" rx="8"/>
  <text x="320.0" y="482.0" font-size="14" fill="#6b7280" text-anchor="middle">Check</text>
  <text x="320.0" y="506.0" font-size="17" fill="#059669" text-anchor="middle" font-weight="bold">d/dx sin(x²) = cos(x²) · 2x  ✓</text>
  <text x="336.0" y="98.0" font-size="14" fill="#6b7280" text-anchor="start">inner function x², its derivative 2x is present</text>
  <text x="336.0" y="186.0" font-size="14" fill="#6b7280" text-anchor="start">the x-part 2x dx becomes dt</text>
  <text x="336.0" y="274.0" font-size="14" fill="#6b7280" text-anchor="start">only t remains</text>
  <text x="336.0" y="450.0" font-size="14" fill="#6b7280" text-anchor="start">replace t by x²</text>
</svg>
