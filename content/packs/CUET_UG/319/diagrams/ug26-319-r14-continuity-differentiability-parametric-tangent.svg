<text x="108.08" y="71.25" font-size="14" fill="#2563eb" text-anchor="start">x = t², y = t³</text>
<text x="430" y="70" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold">At t = 1</text>
<text x="430" y="96" font-size="14" fill="#1f2937" text-anchor="start">dx/dt = 2t = 2</text>
<text x="430" y="120" font-size="14" fill="#1f2937" text-anchor="start">dy/dt = 3t² = 3</text>
<text x="430" y="148" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold">dy/dx = 3 / 2 = 1.5</text>
<text x="430" y="200" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">At t = −1</text>
<text x="430" y="226" font-size="14" fill="#1f2937" text-anchor="start">dx/dt = −2</text>
<text x="430" y="250" font-size="14" fill="#1f2937" text-anchor="start">dy/dt = 3</text>
<text x="430" y="278" font-size="14" fill="#059669" text-anchor="start" font-weight="bold">dy/dx = 3 / (−2) = −1.5</text>
<text x="430" y="320" font-size="14" fill="#6b7280" text-anchor="start">Formula check: 3t/2</text>
<text x="320" y="368" font-size="13" fill="#6b7280" text-anchor="middle">Dashed lines are the tangents whose slopes are given by dy/dx = (dy/dt)/(dx/dt).</text>
