<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" font-family="Arial, Helvetica, sans-serif">
<text x="350" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Direction cosines of the line from O to P(2, 3, 6)</text>
<line x1="130" y1="350" x2="79.9" y2="392.04" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="74.39,396.67 83.71,393.78 78.85,387.99" fill="#1f2937"/>
<text x="63.66" y="410.67" font-size="16" fill="#1f2937" text-anchor="middle" font-style="italic">x</text>
<line x1="130" y1="350" x2="325.2" y2="350" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="332.4,350 323.4,346.22 323.4,353.78" fill="#1f2937"/>
<text x="346.4" y="355" font-size="16" fill="#1f2937" text-anchor="middle" font-style="italic">y</text>
<line x1="130" y1="350" x2="130" y2="31.6" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="130,24.4 126.22,33.4 133.78,33.4" fill="#1f2937"/>
<text x="130" y="15.4" font-size="16" fill="#1f2937" text-anchor="middle" font-style="italic">z</text>
<line x1="92.92" y1="381.11" x2="224.92" y2="381.11" stroke="#6b7280" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5,4"/>
<line x1="262" y1="350" x2="224.92" y2="381.11" stroke="#6b7280" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5,4"/>
<line x1="224.92" y1="381.11" x2="224.92" y2="117.11" stroke="#6b7280" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5,4"/>
<line x1="130" y1="350" x2="222.21" y2="123.78" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round"/>
<polygon points="224.92,117.11 218.03,124.02 225.03,126.87" fill="#2563eb"/>
<text x="236.92" y="117.11" font-size="15" fill="#2563eb" text-anchor="start" font-weight="bold">P(2, 3, 6)</text>
<path d="M98.48,376.44 L100.69,372.11 L103.02,367.68 L105.45,363.18 L107.99,358.63 L110.62,354.04 L113.33,349.43 L116.1,344.83 L118.93,340.25 L121.81,335.7 L124.72,331.22 L127.66,326.81 L130.6,322.5 L133.54,318.3 L136.46,314.23 L139.36,310.31 L142.22,306.55 L145.04,302.97 L147.78,299.58 L150.46,296.4 L153.05,293.44" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="112.72" y="345.22" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="bold">α</text>
<path d="M231.2,350 L230.28,345.23 L229.04,340.47 L227.48,335.74 L225.62,331.06 L223.45,326.43 L220.99,321.89 L218.23,317.43 L215.2,313.07 L211.89,308.84 L208.32,304.73 L204.51,300.77 L200.45,296.96 L196.18,293.32 L191.69,289.87 L187.01,286.6 L182.14,283.54 L177.11,280.68 L171.93,278.05 L166.62,275.65 L161.19,273.48" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="218.32" y="298.73" font-size="17" fill="#059669" text-anchor="middle" font-weight="bold">β</text>
<path d="M130,218 L132.14,218.75 L134.27,219.59 L136.4,220.53 L138.53,221.57 L140.65,222.7 L142.76,223.92 L144.87,225.23 L146.96,226.64 L149.04,228.13 L151.11,229.72 L153.16,231.39 L155.19,233.15 L157.21,235 L159.21,236.93 L161.18,238.94 L163.13,241.03 L165.06,243.21 L166.96,245.46 L168.84,247.79 L170.68,250.19" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="161.11" y="223.72" font-size="17" fill="#d97706" text-anchor="middle" font-weight="bold">γ</text>
<text x="122" y="370" font-size="15" fill="#1f2937" text-anchor="end">O</text>
<text x="520" y="110" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">OP = √(2² + 3² + 6²) = √49 = 7</text>
<text x="420" y="150" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold">l = cos α = 2/7</text>
<text x="690" y="150" font-size="14" fill="#dc2626" text-anchor="end">≈ 0.286  (angle 73.4°)</text>
<text x="420" y="180" font-size="14" fill="#059669" text-anchor="start" font-weight="bold">m = cos β = 3/7</text>
<text x="690" y="180" font-size="14" fill="#059669" text-anchor="end">≈ 0.429  (angle 64.6°)</text>
<text x="420" y="210" font-size="14" fill="#d97706" text-anchor="start" font-weight="bold">n = cos γ = 6/7</text>
<text x="690" y="210" font-size="14" fill="#d97706" text-anchor="end">≈ 0.857  (angle 31.0°)</text>
<line x1="420" y1="226" x2="690" y2="226" stroke="#6b7280" stroke-width="1" stroke-linecap="round"/>
<text x="555" y="248" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">l² + m² + n² = 1</text>
<text x="555" y="274" font-size="14" fill="#6b7280" text-anchor="middle">(4 + 9 + 36)/49 = 1</text>
<text x="555" y="312" font-size="14" fill="#1f2937" text-anchor="middle">Direction ratios 2, 3, 6 are the</text>
<text x="555" y="332" font-size="14" fill="#1f2937" text-anchor="middle">coordinates of P; divide by 7</text>
<text x="555" y="352" font-size="14" fill="#1f2937" text-anchor="middle">to get the direction cosines.</text>
<text x="350" y="458" font-size="13" fill="#6b7280" text-anchor="middle">Angles are measured from the positive axes; the oblique drawing is schematic and does not preserve angle sizes.</text>
</svg>
