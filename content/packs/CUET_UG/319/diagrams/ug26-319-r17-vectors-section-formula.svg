<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="Arial, Helvetica, sans-serif">
<text x="350" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Section formula: dividing A(1, 2, 3) and B(4, 5, 6) in the ratio 2 : 1</text>
<line x1="30" y1="110" x2="592.8" y2="110" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="600,110 591,106.22 591,113.78" fill="#9ca3af"/>
<circle cx="60" cy="110" r="6" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="60" y="94" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">A</text>
<text x="60" y="136" font-size="14" fill="#2563eb" text-anchor="middle">(1, 2, 3)</text>
<circle cx="310" cy="110" r="6" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<text x="310" y="94" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="bold">B</text>
<text x="310" y="136" font-size="14" fill="#dc2626" text-anchor="middle">(4, 5, 6)</text>
<circle cx="226.67" cy="110" r="6" fill="#059669" stroke="#059669" stroke-width="1"/>
<text x="226.67" y="94" font-size="17" fill="#059669" text-anchor="middle" font-weight="bold">P</text>
<text x="226.67" y="136" font-size="14" fill="#059669" text-anchor="middle">(3, 4, 5)</text>
<circle cx="560" cy="110" r="6" fill="#d97706" stroke="#d97706" stroke-width="1"/>
<text x="560" y="94" font-size="17" fill="#d97706" text-anchor="middle" font-weight="bold">Q</text>
<text x="560" y="136" font-size="14" fill="#d97706" text-anchor="middle">(7, 8, 9)</text>
<text x="143.33" y="170" font-size="14" fill="#059669" text-anchor="middle">AP = 2 parts</text>
<text x="268.33" y="190" font-size="14" fill="#059669" text-anchor="middle">PB = 1 part</text>
<line x1="60" y1="154" x2="226.67" y2="154" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
<line x1="226.67" y1="154" x2="310" y2="154" stroke="#86efac" stroke-width="2" stroke-linecap="round"/>
<rect x="70" y="230" width="560" height="96" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.2"/>
<text x="350" y="254" font-size="14" fill="#1f2937" text-anchor="middle">Internal (P):  (m·b + n·a)/(m + n) = (2·(4,5,6) + 1·(1,2,3)) / 3 = (3, 4, 5)</text>
<text x="350" y="278" font-size="14" fill="#1f2937" text-anchor="middle">External (Q):  (m·b − n·a)/(m − n) = (2·(4,5,6) − (1,2,3)) / 1 = (7, 8, 9)</text>
<text x="350" y="304" font-size="13" fill="#6b7280" text-anchor="middle">Check: AP : PB = 3.464 : 1.732 = 2 : 1;  AQ : BQ = 10.392 : 5.196 = 2 : 1</text>
<text x="350" y="350" font-size="13" fill="#6b7280" text-anchor="middle">Schematic: the three coordinates are collapsed onto one line; spacing follows the ratio.</text>
</svg>
