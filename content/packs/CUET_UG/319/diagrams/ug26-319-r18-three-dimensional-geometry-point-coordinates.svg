<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Arial, Helvetica, sans-serif">
<text x="320" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">A point in space: three coordinates measured along the axes</text>
<line x1="200" y1="350" x2="113.5" y2="422.58" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="107.98,427.21 117.31,424.32 112.45,418.53" fill="#1f2937"/>
<text x="97.26" y="441.21" font-size="16" fill="#1f2937" text-anchor="middle" font-style="italic">x</text>
<line x1="200" y1="350" x2="428" y2="350" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="435.2,350 426.2,346.22 426.2,353.78" fill="#1f2937"/>
<text x="449.2" y="355" font-size="16" fill="#1f2937" text-anchor="middle" font-style="italic">y</text>
<line x1="200" y1="350" x2="200" y2="94" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="200,86.8 196.22,95.8 203.78,95.8" fill="#1f2937"/>
<text x="200" y="77.8" font-size="16" fill="#1f2937" text-anchor="middle" font-style="italic">z</text>
<line x1="129.22" y1="409.39" x2="241.22" y2="409.39" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5,4"/>
<line x1="312" y1="350" x2="241.22" y2="409.39" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5,4"/>
<line x1="129.22" y1="409.39" x2="129.22" y2="185.39" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5,4"/>
<line x1="200" y1="126" x2="129.22" y2="185.39" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5,4"/>
<line x1="312" y1="350" x2="312" y2="126" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5,4"/>
<line x1="200" y1="126" x2="312" y2="126" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5,4"/>
<line x1="241.22" y1="409.39" x2="241.22" y2="185.39" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5,4"/>
<line x1="129.22" y1="185.39" x2="241.22" y2="185.39" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5,4"/>
<line x1="312" y1="126" x2="241.22" y2="185.39" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5,4"/>
<line x1="200" y1="350" x2="241.22" y2="185.39" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round"/>
<polygon points="241.22,185.39 234.06,194.94 243.03,197.19" fill="#2563eb"/>
<circle cx="241.22" cy="185.39" r="5.5" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="255.22" y="211.39" font-size="16" fill="#2563eb" text-anchor="start" font-weight="bold">P(3, 2, 4)</text>
<circle cx="129.22" cy="409.39" r="4.5" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<circle cx="312" cy="350" r="4.5" fill="#059669" stroke="#059669" stroke-width="1"/>
<circle cx="200" cy="126" r="4.5" fill="#d97706" stroke="#d97706" stroke-width="1"/>
<text x="115.22" y="415.39" font-size="15" fill="#dc2626" text-anchor="end" font-weight="bold">x = 3</text>
<text x="322" y="374" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">y = 2</text>
<text x="188" y="132" font-size="15" fill="#d97706" text-anchor="end" font-weight="bold">z = 4</text>
<text x="192" y="370" font-size="15" fill="#1f2937" text-anchor="end">O</text>
<text x="470" y="150" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">OP = √(3² + 2² + 4²)</text>
<text x="470" y="176" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">= √29 ≈ 5.385</text>
<text x="470" y="214" font-size="14" fill="#6b7280" text-anchor="middle">Walk 3 along x, then 2 along y,</text>
<text x="470" y="234" font-size="14" fill="#6b7280" text-anchor="middle">then 4 up along z to reach P.</text>
<text x="320" y="460" font-size="13" fill="#6b7280" text-anchor="middle">Schematic oblique drawing: the x-axis points towards the viewer, so lengths along x look shorter.</text>
</svg>
