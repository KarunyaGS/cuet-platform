<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, Helvetica, sans-serif" role="img">
<title>Rule of allegation: cross method and price line</title>
<text x="30" y="30" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">Rule of allegation (cross method)</text>
<text x="70" y="90" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="bold">Rs 40</text>
<text x="70" y="70" font-size="14" fill="#6b7280" text-anchor="middle">cheaper</text>
<text x="70" y="210" font-size="18" fill="#dc2626" text-anchor="middle" font-weight="bold">Rs 55</text>
<text x="70" y="230" font-size="14" fill="#6b7280" text-anchor="middle">dearer</text>
<line x1="115" y1="86" x2="420" y2="198" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
<line x1="115" y1="204" x2="420" y2="92" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
<rect x="210" y="125" width="100" height="50" rx="6" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<text x="260" y="158" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold">Rs 46</text>
<text x="260" y="118" font-size="14" fill="#6b7280" text-anchor="middle">mean price</text>
<text x="435" y="98" font-size="17" fill="#dc2626" text-anchor="start" font-weight="bold">55 − 46 = 9</text>
<text x="435" y="208" font-size="17" fill="#2563eb" text-anchor="start" font-weight="bold">46 − 40 = 6</text>
<text x="435" y="70" font-size="14" fill="#6b7280" text-anchor="start">parts of cheaper</text>
<text x="435" y="230" font-size="14" fill="#6b7280" text-anchor="start">parts of dearer</text>
<text x="30" y="272" font-size="17" fill="#059669" text-anchor="start" font-weight="bold">cheaper : dearer = 9 : 6 = 3 : 2</text>
<line x1="110" y1="355" x2="470" y2="355" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
<line x1="110" y1="355" x2="254" y2="355" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
<line x1="254" y1="355" x2="470" y2="355" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
<circle cx="110" cy="355" r="6" fill="#2563eb" stroke="none" stroke-width="2"/>
<text x="110" y="383" font-size="14" fill="#1f2937" text-anchor="middle">Rs 40</text>
<circle cx="254" cy="355" r="6" fill="#1f2937" stroke="none" stroke-width="2"/>
<text x="254" y="383" font-size="14" fill="#1f2937" text-anchor="middle">Rs 46</text>
<circle cx="470" cy="355" r="6" fill="#dc2626" stroke="none" stroke-width="2"/>
<text x="470" y="383" font-size="14" fill="#1f2937" text-anchor="middle">Rs 55</text>
<text x="182" y="341" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">6</text>
<text x="362" y="341" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">9</text>
<text x="40" y="360" font-size="14" fill="#6b7280" text-anchor="start">price line</text>
<text x="30" y="406" font-size="14" fill="#6b7280" text-anchor="start">Check: 3 kg at 40 + 2 kg at 55 = Rs 230 for 5 kg = Rs 46 per kg.</text>
</svg>
