<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Arial, Helvetica, sans-serif" role="img">
<title>Determinant as area of a parallelogram</title>
<path d="M80 270 L230 220 L280 120 L130 170 Z" fill="#059669" fill-opacity="0.22" stroke="#059669" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="80" y1="270" x2="220.51" y2="223.16" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="230,220 221.84,227.15 219.19,219.18" fill="#2563eb"/>
<line x1="80" y1="270" x2="125.53" y2="178.94" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="130,170 129.28,180.82 121.77,177.07" fill="#dc2626"/>
<text x="238" y="225" font-size="14" fill="#2563eb" text-anchor="start">u = (3, 1)</text>
<text x="126" y="160" font-size="14" fill="#dc2626" text-anchor="middle">v = (1, 2)</text>
<text x="200" y="200" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">area 5</text>
<text x="30" y="30" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">|A| = 3×2 − 1×1 = 5</text>
<text x="30" y="52" font-size="14" fill="#6b7280" text-anchor="start">A = [3 1; 1 2], columns u and v</text>
<line x1="380" y1="270" x2="431.06" y2="244.47" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="440,240 432.93,248.23 429.18,240.72" fill="#2563eb"/>
<line x1="380" y1="270" x2="491.06" y2="214.47" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="500,210 492.93,218.23 489.18,210.72" fill="#dc2626"/>
<text x="436" y="228" font-size="14" fill="#2563eb" text-anchor="end">u = (2, 1)</text>
<text x="506" y="202" font-size="14" fill="#dc2626" text-anchor="start">v = (4, 2)</text>
<text x="470" y="298" font-size="14" fill="#059669" text-anchor="middle" font-weight="bold">columns on one line: area 0</text>
<text x="340" y="30" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">|A| = 2×2 − 4×1 = 0</text>
<text x="340" y="52" font-size="14" fill="#6b7280" text-anchor="start">A = [2 4; 1 2]: singular</text>
</svg>
