xt x="320" y="354" font-size="15" fill="#1f2937" text-anchor="middle">b = 2</text><text x="466" y="354" font-size="15" fill="#1f2937" text-anchor="middle">x</text><text x="66" y="48" font-size="15" fill="#1f2937" text-anchor="middle">y</text><text x="386" y="77.00000000000003" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">y = x²</text><text x="281.6" y="302.5" font-size="13" fill="#1f2937" text-anchor="middle">shaded</text><text x="560" y="90" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold">Area under a curve</text><text x="560" y="122" font-size="15" fill="#1f2937" text-anchor="start">Area = ∫ from a to b of f(x) dx</text><text x="560" y="150" font-size="14" fill="#6b7280" text-anchor="start">(f(x) ≥ 0 on [a, b])</text><text x="560" y="196" font-size="15" fill="#1f2937" text-anchor="start">Here f(x) = x², a = 0, b = 2:</text><text x="560" y="224" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">Area = [x³/3] from 0 to 2 = 8/3</text><text x="560" y="252" font-size="15" fill="#059669" text-anchor="start">≈ 2.67 square units</text><text x="560" y="300" font-size="14" fill="#6b7280" text-anchor="start">The integral adds up all the thin strips.</text>
