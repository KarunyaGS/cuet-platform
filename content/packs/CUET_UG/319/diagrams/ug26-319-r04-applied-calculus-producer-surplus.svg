<text x="298.65" y="184" font-size="14" fill="#1f2937" text-anchor="start">equilibrium (4, 12)</text>
<text x="346.05" y="242.5" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold">supply p = 2x + 4</text>
<text x="90.23" y="176.5" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">producer</text>
<text x="90.23" y="196.5" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">surplus</text>
<text x="90.23" y="216.5" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">= 16</text>
<text x="202.79" y="300" font-size="14" fill="#6b7280" text-anchor="middle">cost along supply: 32</text>
<text x="30" y="428" font-size="14" fill="#1f2937" text-anchor="start">PS = 12 × 4 − (area under supply from 0 to 4) = 48 − 32 = 16</text>
<text x="30" y="452" font-size="14" fill="#6b7280" text-anchor="start">Triangle check: ½ × 4 × (12 − 4) = 16.</text>
</svg>
