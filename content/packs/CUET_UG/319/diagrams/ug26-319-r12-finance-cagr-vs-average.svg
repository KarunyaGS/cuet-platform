<text x="90" y="414" font-size="14" fill="#2563eb">Blue: actual values (+20%, then −10%).</text>
<text x="90" y="438" font-size="14" fill="#059669">Green: the constant yearly rate that gets from 100 to 108:</text>
<text x="90" y="458" font-size="14" fill="#059669" font-weight="bold">CAGR = √1.08 − 1 ≈ 3.92%.</text>
<text x="90" y="484" font-size="14" fill="#dc2626">Red dashed: growing at the simple average rate, 5% a year, ends at</text>
<text x="90" y="504" font-size="14" fill="#dc2626" font-weight="bold">100 × 1.05² = 110.25, not 108. The average of the rates is wrong.</text>
