<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" font-family="Arial, Helvetica, sans-serif">
<text x="350" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Testing a relation on {1, 2, 3} by drawing arrows</text>
<text x="180" y="70" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">R = {(1,1), (2,2), (3,3), (1,2)}</text>
<circle cx="85.14" cy="228.88" r="14" fill="none" stroke="#059669" stroke-width="2"/>
<polygon points="97.02,236.28 104.99,230.64 98.57,226.64" fill="#059669"/>
<circle cx="274.86" cy="228.88" r="14" fill="none" stroke="#059669" stroke-width="2"/>
<polygon points="270.35,215.62 260.62,214.94 263.05,222.1" fill="#059669"/>
<circle cx="180" cy="103.6" r="14" fill="none" stroke="#059669" stroke-width="2"/>
<polygon points="169.03,112.3 171.67,121.7 177.59,117" fill="#059669"/>
<line x1="130" y1="220" x2="222.8" y2="220" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="230,220 221,216.22 221,223.78" fill="#2563eb"/>
<circle cx="110" cy="220" r="17" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<text x="110" y="226" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">1</text>
<circle cx="250" cy="220" r="17" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<text x="250" y="226" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">2</text>
<circle cx="180" cy="130" r="17" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<text x="180" y="136" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">3</text>
<text x="55" y="282" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">✓ Reflexive</text>
<text x="55" y="306" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold">✗ Symmetric</text>
<text x="55" y="330" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">✓ Transitive</text>
<text x="520" y="70" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">R plus the pair (2,1)</text>
<circle cx="425.14" cy="228.88" r="14" fill="none" stroke="#059669" stroke-width="2"/>
<polygon points="437.02,236.28 444.99,230.64 438.57,226.64" fill="#059669"/>
<circle cx="614.86" cy="228.88" r="14" fill="none" stroke="#059669" stroke-width="2"/>
<polygon points="610.35,215.62 600.62,214.94 603.05,222.1" fill="#059669"/>
<circle cx="520" cy="103.6" r="14" fill="none" stroke="#059669" stroke-width="2"/>
<polygon points="509.03,112.3 511.67,121.7 517.59,117" fill="#059669"/>
<line x1="470" y1="227" x2="562.8" y2="227" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="570,227 561,223.22 561,230.78" fill="#2563eb"/>
<line x1="570" y1="213" x2="477.2" y2="213" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="470,213 479,216.78 479,209.22" fill="#2563eb"/>
<circle cx="450" cy="220" r="17" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<text x="450" y="226" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">1</text>
<circle cx="590" cy="220" r="17" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<text x="590" y="226" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">2</text>
<circle cx="520" cy="130" r="17" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<text x="520" y="136" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">3</text>
<text x="395" y="282" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">✓ Reflexive</text>
<text x="395" y="306" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">✓ Symmetric</text>
<text x="395" y="330" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">✓ Transitive</text>
<text x="180" y="368" font-size="14" fill="#dc2626" text-anchor="middle">No arrow from 2 back to 1,</text>
<text x="180" y="388" font-size="14" fill="#dc2626" text-anchor="middle">so R is not symmetric.</text>
<text x="520" y="368" font-size="14" fill="#059669" text-anchor="middle">All three tests pass:</text>
<text x="520" y="388" font-size="14" fill="#059669" text-anchor="middle" font-weight="bold">an equivalence relation.</text>
<text x="350" y="418" font-size="13" fill="#6b7280" text-anchor="middle">Arrow from a to b means (a, b) is in R. A loop on a means (a, a) is in R.</text>
</svg>
