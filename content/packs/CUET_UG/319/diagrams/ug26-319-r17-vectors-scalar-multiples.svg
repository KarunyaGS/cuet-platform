<text x="535" y="214" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Length of ka = |k| × |a|</text>
<text x="535" y="236" font-size="14" fill="#6b7280" text-anchor="middle">|a| = √5 ≈ 2.24</text>
<text x="320" y="340" font-size="14" fill="#059669" text-anchor="middle">k &gt; 0: same direction, length scaled by k.</text>
<text x="320" y="362" font-size="14" fill="#dc2626" text-anchor="middle">k &lt; 0: opposite direction, length scaled by |k|.</text>
<text x="320" y="388" font-size="14" fill="#1f2937" text-anchor="middle">ka and a are always parallel (they lie on one line through O).</text>
