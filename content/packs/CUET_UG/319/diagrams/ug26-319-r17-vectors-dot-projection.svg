<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="Arial, Helvetica, sans-serif">
<text x="340" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Dot product as a projection (the shadow of a on b)</text>
<line x1="50" y1="310" x2="50" y2="60" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="110" y1="310" x2="110" y2="60" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="170" y1="310" x2="170" y2="60" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="230" y1="310" x2="230" y2="60" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="290" y1="310" x2="290" y2="60" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="350" y1="310" x2="350" y2="60" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="410" y1="310" x2="410" y2="60" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="50" y1="310" x2="410" y2="310" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="50" y1="254.44" x2="410" y2="254.44" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="50" y1="198.89" x2="410" y2="198.89" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="50" y1="143.33" x2="410" y2="143.33" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="50" y1="87.78" x2="410" y2="87.78" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="50" y1="310" x2="411.6" y2="310" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<polygon points="418,310 410,306.64 410,313.36" fill="#1f2937"/>
<line x1="50" y1="310" x2="50" y2="58.4" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<polygon points="50,52 46.64,60 53.36,60" fill="#1f2937"/>
<line x1="230" y1="87.78" x2="287.93" y2="221.88" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5,4"/>
<path d="M287.93,221.88 L275.68,226.42 L270.77,215.07 L283.03,210.53" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="50" y1="310" x2="287.93" y2="221.88" stroke="#059669" stroke-width="7" stroke-linecap="round"/>
<line x1="50" y1="310" x2="343.25" y2="201.39" stroke="#dc2626" stroke-width="2.8" stroke-linecap="round"/>
<polygon points="350,198.89 340.25,198.47 342.87,205.56" fill="#dc2626"/>
<line x1="50" y1="310" x2="225.47" y2="93.37" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round"/>
<polygon points="230,87.78 221.4,92.39 227.27,97.15" fill="#2563eb"/>
<text x="222" y="81.78" font-size="15" fill="#2563eb" text-anchor="end" font-weight="bold">a = (3, 4)</text>
<text x="358" y="204.89" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold">b = (5, 2)</text>
<text x="206" y="296.22" font-size="14" fill="#059669" text-anchor="middle" font-weight="bold">projection ≈ 4.271</text>
<text x="430" y="80" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold">a · b = 3×5 + 4×2 = 23</text>
<text x="430" y="108" font-size="14" fill="#1f2937" text-anchor="start">|a| = 5,  |b| = √29 ≈ 5.385</text>
<text x="430" y="136" font-size="14" fill="#1f2937" text-anchor="start">cos θ = 23 / (5 × 5.385) ≈ 0.8542</text>
<text x="430" y="160" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">θ ≈ 31.3°</text>
<rect x="425" y="186" width="235" height="72" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="437" y="210" font-size="14" fill="#059669" text-anchor="start" font-weight="bold">Projection of a on b (green):</text>
<text x="437" y="232" font-size="14" fill="#059669" text-anchor="start">a·b / |b| = 23 / 5.385 ≈ 4.271</text>
<text x="437" y="252" font-size="13" fill="#6b7280" text-anchor="start">check: |a| cos θ = 4.271</text>
<text x="430" y="292" font-size="14" fill="#6b7280" text-anchor="start">Dashed line meets b at a right angle.</text>
<text x="340" y="378" font-size="14" fill="#1f2937" text-anchor="middle">Dot product = |b| × (projection of a on b) = 5.385 × 4.271 = 23.</text>
<text x="340" y="402" font-size="14" fill="#6b7280" text-anchor="middle">If the angle were 90°, the shadow would shrink to 0 and a · b = 0.</text>
</svg>
