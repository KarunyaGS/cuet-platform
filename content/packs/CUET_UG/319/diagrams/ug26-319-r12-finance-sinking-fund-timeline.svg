<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" font-family="Arial, Helvetica, sans-serif">
<text x="350" y="30" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Sinking fund: equal deposit at the end of each year, 8% p.a.</text>
<line x1="70" y1="190" x2="650" y2="190" stroke="#1f2937" stroke-width="2.5"/>
<polygon points="660,190 648,184 648,196" fill="#1f2937" stroke="none" stroke-width="2" stroke-linejoin="round"/>
<line x1="70" y1="184" x2="70" y2="196" stroke="#1f2937" stroke-width="2"/>
<text x="70" y="216" font-size="14" fill="#6b7280" text-anchor="middle">start</text>
<line x1="182" y1="184" x2="182" y2="196" stroke="#1f2937" stroke-width="2"/>
<text x="182" y="216" font-size="14" fill="#6b7280" text-anchor="middle">end of year 1</text>
<line x1="294" y1="184" x2="294" y2="196" stroke="#1f2937" stroke-width="2"/>
<text x="294" y="216" font-size="14" fill="#6b7280" text-anchor="middle">end of year 2</text>
<line x1="406" y1="184" x2="406" y2="196" stroke="#1f2937" stroke-width="2"/>
<text x="406" y="216" font-size="14" fill="#6b7280" text-anchor="middle">end of year 3</text>
<line x1="518" y1="184" x2="518" y2="196" stroke="#1f2937" stroke-width="2"/>
<text x="518" y="216" font-size="14" fill="#6b7280" text-anchor="middle">end of year 4</text>
<line x1="630" y1="184" x2="630" y2="196" stroke="#1f2937" stroke-width="2"/>
<text x="630" y="216" font-size="14" fill="#6b7280" text-anchor="middle">end of year 5</text>
<line x1="182" y1="128" x2="182" y2="173.2" stroke="#2563eb" stroke-width="3"/>
<polygon points="182,182 177.72,171.87 186.28,171.87" fill="#2563eb" stroke="none" stroke-width="2" stroke-linejoin="round"/>
<text x="182" y="118" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">₹85,228</text>
<line x1="294" y1="128" x2="294" y2="173.2" stroke="#2563eb" stroke-width="3"/>
<polygon points="294,182 289.72,171.87 298.28,171.87" fill="#2563eb" stroke="none" stroke-width="2" stroke-linejoin="round"/>
<text x="294" y="118" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">₹85,228</text>
<line x1="406" y1="128" x2="406" y2="173.2" stroke="#2563eb" stroke-width="3"/>
<polygon points="406,182 401.72,171.87 410.28,171.87" fill="#2563eb" stroke="none" stroke-width="2" stroke-linejoin="round"/>
<text x="406" y="118" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">₹85,228</text>
<line x1="518" y1="128" x2="518" y2="173.2" stroke="#2563eb" stroke-width="3"/>
<polygon points="518,182 513.72,171.87 522.28,171.87" fill="#2563eb" stroke="none" stroke-width="2" stroke-linejoin="round"/>
<text x="518" y="118" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">₹85,228</text>
<line x1="630" y1="128" x2="630" y2="173.2" stroke="#2563eb" stroke-width="3"/>
<polygon points="630,182 625.72,171.87 634.28,171.87" fill="#2563eb" stroke="none" stroke-width="2" stroke-linejoin="round"/>
<text x="630" y="118" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">₹85,228</text>
<text x="66" y="94" font-size="14" fill="#2563eb" font-weight="bold">deposit C each year</text>
<text x="70" y="256" font-size="14" fill="#1f2937" font-weight="bold">Value of each deposit at the end of year 5 (compound interest at 8%):</text>
<text x="182" y="286" font-size="14" fill="#6b7280" text-anchor="middle">C × 1.08^4</text>
<text x="182" y="308" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">₹1,15,952</text>
<text x="294" y="286" font-size="14" fill="#6b7280" text-anchor="middle">C × 1.08^3</text>
<text x="294" y="308" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">₹1,07,363</text>
<text x="406" y="286" font-size="14" fill="#6b7280" text-anchor="middle">C × 1.08^2</text>
<text x="406" y="308" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">₹99,410</text>
<text x="518" y="286" font-size="14" fill="#6b7280" text-anchor="middle">C × 1.08</text>
<text x="518" y="308" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">₹92,046</text>
<text x="630" y="286" font-size="14" fill="#6b7280" text-anchor="middle">C × 1</text>
<text x="630" y="308" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">₹85,228</text>
<line x1="142" y1="324" x2="670" y2="324" stroke="#6b7280" stroke-width="1.5"/>
<text x="670" y="348" font-size="15" fill="#dc2626" text-anchor="end" font-weight="bold">Sum ≈ ₹5,00,000</text>
<text x="70" y="348" font-size="15" fill="#dc2626" font-weight="bold">Target A = ₹5,00,000</text>
<text x="70" y="396" font-size="14" fill="#6b7280">Amounts are rounded to the rupee, so they add to within ₹1 of the target.</text>
<text x="70" y="418" font-size="14" fill="#6b7280">The last deposit earns no interest; the first earns interest for 4 years.</text>
</svg>
