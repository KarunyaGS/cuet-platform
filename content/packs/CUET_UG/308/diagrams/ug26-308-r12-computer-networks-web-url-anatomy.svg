<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" font-family="Arial, Helvetica, sans-serif">
<rect x="53" y="70" width="78" height="52" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text x="92" y="104" font-size="21" fill="#2563eb" text-anchor="middle" font-weight="bold">https</text><rect x="131" y="70" width="46" height="52" rx="6" fill="#fff" stroke="#6b7280" stroke-width="2.5"/><text x="154" y="104" font-size="21" fill="#6b7280" text-anchor="middle" font-weight="bold">://</text><rect x="177" y="70" width="190" height="52" rx="6" fill="#fff" stroke="#059669" stroke-width="2.5"/><text x="272" y="104" font-size="21" fill="#059669" text-anchor="middle" font-weight="bold">www.example.com</text><rect x="367" y="70" width="220" height="52" rx="6" fill="#fff" stroke="#d97706" stroke-width="2.5"/><text x="477" y="104" font-size="21" fill="#d97706" text-anchor="middle" font-weight="bold">/courses/index.html</text><text x="320" y="36" font-size="15" fill="#6b7280" text-anchor="middle">Example URL (illustrative)</text><line x1="56" y1="134" x2="128" y2="134" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="134" y1="134" x2="174" y2="134" stroke="#6b7280" stroke-width="5" stroke-linecap="round"/><line x1="180" y1="134" x2="364" y2="134" stroke="#059669" stroke-width="5" stroke-linecap="round"/><line x1="370" y1="134" x2="584" y2="134" stroke="#d97706" stroke-width="5" stroke-linecap="round"/><rect x="30" y="158" width="580" height="62" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text x="46" y="182" font-size="16" fill="#2563eb" text-anchor="start" font-weight="bold">Protocol (scheme)</text><text x="46" y="204" font-size="14.5" fill="#1f2937" text-anchor="start">Rules used to fetch the page. HTTPS is HTTP made secure with encryption.</text><rect x="30" y="242" width="580" height="62" rx="8" fill="#fff" stroke="#059669" stroke-width="2.5"/><text x="46" y="266" font-size="16" fill="#059669" text-anchor="start" font-weight="bold">Domain name</text><text x="46" y="288" font-size="14.5" fill="#1f2937" text-anchor="start">Name of the web server. DNS turns it into an IP address.</text><rect x="30" y="326" width="580" height="62" rx="8" fill="#fff" stroke="#d97706" stroke-width="2.5"/><text x="46" y="350" font-size="16" fill="#d97706" text-anchor="start" font-weight="bold">Path</text><text x="46" y="372" font-size="14.5" fill="#1f2937" text-anchor="start">Folder and file on the server that hold the page.</text><text x="320" y="438" font-size="14" fill="#6b7280" text-anchor="middle">The :// after the protocol separates it from the domain name.</text>
</svg>
