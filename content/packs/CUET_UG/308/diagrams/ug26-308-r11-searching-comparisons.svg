<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="Arial, Helvetica, sans-serif">
<text x="110" y="24" font-size="16" fill="#1f2937" font-weight="bold">Most comparisons needed (worst case)</text>
<text x="20" y="80" font-size="16" fill="#1f2937" font-weight="bold">n = 8</text>
<rect x="110" y="56" width="50" height="18" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="168" y="71" font-size="14" fill="#d97706" font-weight="bold">linear 8</text>
<rect x="110" y="78" width="25" height="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="143" y="93" font-size="14" fill="#2563eb" font-weight="bold">binary 4</text>
<text x="20" y="140" font-size="16" fill="#1f2937" font-weight="bold">n = 16</text>
<rect x="110" y="116" width="100" height="18" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="218" y="131" font-size="14" fill="#d97706" font-weight="bold">linear 16</text>
<rect x="110" y="138" width="31.2" height="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="149.2" y="153" font-size="14" fill="#2563eb" font-weight="bold">binary 5</text>
<text x="20" y="200" font-size="16" fill="#1f2937" font-weight="bold">n = 32</text>
<rect x="110" y="176" width="200" height="18" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="318" y="191" font-size="14" fill="#d97706" font-weight="bold">linear 32</text>
<rect x="110" y="198" width="37.5" height="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="155.5" y="213" font-size="14" fill="#2563eb" font-weight="bold">binary 6</text>
<text x="20" y="260" font-size="16" fill="#1f2937" font-weight="bold">n = 64</text>
<rect x="110" y="236" width="400" height="18" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="518" y="251" font-size="14" fill="#d97706" font-weight="bold">linear 64</text>
<rect x="110" y="258" width="43.8" height="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="161.8" y="273" font-size="14" fill="#2563eb" font-weight="bold">binary 7</text>
<text x="300" y="320" font-size="14" fill="#1f2937" text-anchor="middle">Doubling n adds one comparison to binary search (sorted list needed).</text>
</svg>
