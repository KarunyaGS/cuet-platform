  <text x="100" y="107" font-size="14" fill="#1f2937" text-anchor="middle">Book</text>
  <rect x="140" y="88" width="70" height="28" rx="0" fill="#dbeafe" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="175" y="107" font-size="14" fill="#1f2937" text-anchor="middle">4</text>
  <rect x="10" y="116" width="50" height="28" rx="0" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="35" y="135" font-size="14" fill="#1f2937" text-anchor="middle">3</text>
  <rect x="60" y="116" width="80" height="28" rx="0" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="100" y="135" font-size="14" fill="#1f2937" text-anchor="middle">Pen</text>
  <rect x="140" y="116" width="70" height="28" rx="0" fill="#dbeafe" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="175" y="135" font-size="14" fill="#1f2937" text-anchor="middle">6</text>
  <rect x="10" y="144" width="50" height="28" rx="0" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="35" y="163" font-size="14" fill="#1f2937" text-anchor="middle">4</text>
  <rect x="60" y="144" width="80" height="28" rx="0" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="100" y="163" font-size="14" fill="#1f2937" text-anchor="middle">Bag</text>
  <rect x="140" y="144" width="70" height="28" rx="0" fill="#dbeafe" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="175" y="163" font-size="14" fill="#1f2937" text-anchor="middle">2</text>
  <rect x="10" y="172" width="50" height="28" rx="0" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="35" y="191" font-size="14" fill="#1f2937" text-anchor="middle">5</text>
  <rect x="60" y="172" width="80" height="28" rx="0" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="100" y="191" font-size="14" fill="#1f2937" text-anchor="middle">Book</text>
  <rect x="140" y="172" width="70" height="28" rx="0" fill="#dbeafe" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="175" y="191" font-size="14" fill="#1f2937" text-anchor="middle">5</text>
  <rect x="10" y="200" width="50" height="28" rx="0" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="35" y="219" font-size="14" fill="#1f2937" text-anchor="middle">6</text>
  <rect x="60" y="200" width="80" height="28" rx="0" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="100" y="219" font-size="14" fill="#1f2937" text-anchor="middle">Bag</text>
  <rect x="140" y="200" width="70" height="28" rx="0" fill="#dbeafe" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="175" y="219" font-size="14" fill="#1f2937" text-anchor="middle">3</text>
  <rect x="10" y="228" width="50" height="28" rx="0" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="35" y="247" font-size="14" fill="#1f2937" text-anchor="middle">7</text>
  <rect x="60" y="228" width="80" height="28" rx="0" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="100" y="247" font-size="14" fill="#1f2937" text-anchor="middle">Pen</text>
  <rect x="140" y="228" width="70" height="28" rx="0" fill="#fee2e2" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="175" y="247" font-size="14" fill="#6b7280" text-anchor="middle" font-style="italic">NULL</text>
  <text x="240" y="52" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold">Result</text>
  <rect x="240" y="64" width="450" height="44" rx="6" fill="#d1fae5" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="250" y="83" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">COUNT(*)</text>
  <text x="250" y="101" font-size="14" fill="#1f2937" text-anchor="start">counts every row</text>
  <text x="680" y="91" font-size="16" fill="#1f2937" text-anchor="end" font-weight="bold">7</text>
  <rect x="240" y="116" width="450" height="44" rx="6" fill="#d1fae5" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="250" y="135" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">COUNT(Qty)</text>
  <text x="250" y="153" font-size="14" fill="#1f2937" text-anchor="start">skips the NULL</text>
  <text x="680" y="143" font-size="16" fill="#1f2937" text-anchor="end" font-weight="bold">6</text>
  <rect x="240" y="168" width="450" height="44" rx="6" fill="#d1fae5" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="250" y="187" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">SUM(Qty)</text>
  <text x="250" y="205" font-size="14" fill="#1f2937" text-anchor="start">10+4+6+2+5+3</text>
  <text x="680" y="195" font-size="16" fill="#1f2937" text-anchor="end" font-weight="bold">30</text>
  <rect x="240" y="220" width="450" height="44" rx="6" fill="#d1fae5" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="250" y="239" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">AVG(Qty)</text>
  <text x="250" y="257" font-size="14" fill="#1f2937" text-anchor="start">30 / 6, not 30 / 7</text>
  <text x="680" y="247" font-size="16" fill="#1f2937" text-anchor="end" font-weight="bold">5</text>
</svg>
