<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 288" font-family="Arial, Helvetica, sans-serif">
  <text x="10" y="20" font-size="15" fill="#2563eb" text-anchor="start" font-weight="bold">Column highlighted in blue is the one the functions read</text>
  <rect x="10" y="32" width="50" height="28" rx="0" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="35" y="51" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">SID</text>
  <rect x="60" y="32" width="80" height="28" rx="0" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="100" y="51" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Item</text>
  <rect x="140" y="32" width="70" height="28" rx="0" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/>
