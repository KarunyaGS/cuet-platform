  <rect x="140" y="60" width="70" height="28" rx="0" fill="#dbeafe" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="175" y="79" font-size="14" fill="#1f2937" text-anchor="middle">10</text>
  <rect x="10" y="88" width="50" height="28" rx="0" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
