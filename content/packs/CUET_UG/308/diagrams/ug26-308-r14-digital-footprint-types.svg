<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="780" height="290" fill="#ffffff"/>
<rect x="20" y="20" width="340" height="150" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="190" y="48" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">Active footprint</text>
<text x="190" y="68" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal">You share the data on purpose</text>
<text x="40" y="100" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal">• Posts and comments on social media</text>
<text x="40" y="124" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal">• Emails you send</text>
<text x="40" y="148" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal">• Forms you fill in online</text>
<rect x="420" y="20" width="340" height="150" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="590" y="48" font-size="17" fill="#d97706" text-anchor="middle" font-weight="bold">Passive footprint</text>
<text x="590" y="68" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal">Collected without you doing anything</text>
<text x="440" y="100" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal">• Cookies and tracking by websites</text>
<text x="440" y="124" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal">• Location data from your device</text>
<text x="440" y="148" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal">• IP address and browsing history</text>
<path d="M190,172 V214 H289" fill="none" stroke="#1f2937" stroke-width="2"/><path d="M590,172 V214 H491" fill="none" stroke="#1f2937" stroke-width="2"/><polygon points="300,214 289,208 289,220" fill="#1f2937"/><polygon points="480,214 491,208 491,220" fill="#1f2937"/>
<rect x="300" y="190" width="180" height="48" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="390" y="211" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Digital footprint</text>
<text x="390" y="228" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">the whole trail of data</text>
<text x="390" y="270" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Both kinds can be seen, copied and shared, and cannot be fully deleted.</text>
</svg>
