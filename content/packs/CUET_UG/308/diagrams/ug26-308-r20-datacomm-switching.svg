<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#1f2937"/></marker></defs>
<text x="190" y="30" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">Circuit switching</text><text x="580" y="30" font-size="17" fill="#059669" text-anchor="middle" font-weight="bold">Packet switching</text><rect x="20" y="70" width="60" height="44" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="50" y="98" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">A</text><rect x="300" y="70" width="60" height="44" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="330" y="98" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">B</text><circle cx="130" cy="92" r="20" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="130" y="97" font-size="13" fill="#1f2937" text-anchor="middle">S1</text><circle cx="190" cy="92" r="20" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="190" y="97" font-size="13" fill="#1f2937" text-anchor="middle">S2</text><circle cx="250" cy="92" r="20" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="250" y="97" font-size="13" fill="#1f2937" text-anchor="middle">S3</text><circle cx="160" cy="180" r="20" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="160" y="185" font-size="13" fill="#1f2937" text-anchor="middle">S4</text><circle cx="240" cy="180" r="20" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="240" y="185" font-size="13" fill="#1f2937" text-anchor="middle">S5</text><line x1="80" y1="92" x2="110" y2="92" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="150" y1="92" x2="170" y2="92" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="210" y1="92" x2="230" y2="92" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="270" y1="92" x2="300" y2="92" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="140" y1="108" x2="156" y2="162" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/><line x1="198" y1="108" x2="170" y2="164" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/><line x1="180" y1="180" x2="220" y2="180" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/><line x1="246" y1="160" x2="252" y2="110" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/><text x="190" y="240" font-size="14" fill="#1f2937" text-anchor="middle">A path from A to B is set up first</text><text x="190" y="260" font-size="14" fill="#1f2937" text-anchor="middle">and kept for the whole call.</text><text x="190" y="288" font-size="13" fill="#6b7280" text-anchor="middle">Setup delay; the line stays reserved</text><text x="190" y="306" font-size="13" fill="#6b7280" text-anchor="middle">even when it is idle.</text><rect x="420" y="70" width="60" height="44" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="450" y="98" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">A</text><rect x="700" y="70" width="60" height="44" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="730" y="98" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">B</text><circle cx="530" cy="92" r="20" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="530" y="97" font-size="13" fill="#1f2937" text-anchor="middle">S1</text><circle cx="590" cy="92" r="20" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="590" y="97" font-size="13" fill="#1f2937" text-anchor="middle">S2</text><circle cx="650" cy="92" r="20" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="650" y="97" font-size="13" fill="#1f2937" text-anchor="middle">S3</text><circle cx="560" cy="180" r="20" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="560" y="185" font-size="13" fill="#1f2937" text-anchor="middle">S4</text><circle cx="640" cy="180" r="20" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="640" y="185" font-size="13" fill="#1f2937" text-anchor="middle">S5</text><line x1="480" y1="92" x2="510" y2="92" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/><line x1="550" y1="92" x2="570" y2="92" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/><line x1="610" y1="92" x2="630" y2="92" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/><line x1="670" y1="92" x2="700" y2="92" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/><line x1="540" y1="108" x2="556" y2="162" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/><line x1="580" y1="180" x2="620" y2="180" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/><line x1="646" y1="160" x2="652" y2="110" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/><rect x="486" y="76" width="16" height="12" fill="#059669"/><rect x="486" y="98" width="16" height="12" fill="#d97706"/><text x="590" y="240" font-size="14" fill="#1f2937" text-anchor="middle">The message is split into packets.</text><text x="590" y="260" font-size="14" fill="#1f2937" text-anchor="middle">Each packet can take a different route.</text><text x="590" y="288" font-size="13" fill="#6b7280" text-anchor="middle">No setup delay; packets are put back</text><text x="590" y="306" font-size="13" fill="#6b7280" text-anchor="middle">in order at B. The line is shared.</text><line x1="385" y1="56" x2="385" y2="320" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5 5" stroke-linecap="round"/>
</svg>
