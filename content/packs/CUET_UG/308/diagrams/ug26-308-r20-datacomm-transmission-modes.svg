<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 520" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#1f2937"/></marker></defs>
<rect x="70" y="70" width="110" height="54" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="125" y="103" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Sender</text><rect x="470" y="70" width="110" height="54" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="525" y="103" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Receiver</text><line x1="185" y1="97" x2="462" y2="97" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)" stroke-linecap="round"/><text x="325" y="62" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">Simplex</text><text x="325" y="152" font-size="14" fill="#6b7280" text-anchor="middle">one way only, e.g. keyboard to computer, TV broadcast</text><rect x="70" y="220" width="110" height="54" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="125" y="253" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Device A</text><rect x="470" y="220" width="110" height="54" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="525" y="253" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Device B</text><line x1="185" y1="232" x2="462" y2="232" stroke="#059669" stroke-width="3" marker-end="url(#ag)" stroke-linecap="round"/><line x1="462" y1="262" x2="185" y2="262" stroke="#059669" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ag)" stroke-linecap="round"/><text x="325" y="212" font-size="17" fill="#059669" text-anchor="middle" font-weight="bold">Half duplex</text><text x="325" y="302" font-size="14" fill="#6b7280" text-anchor="middle">both ways, but one direction at a time, e.g. walkie-talkie</text><rect x="70" y="370" width="110" height="54" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="125" y="403" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Device A</text><rect x="470" y="370" width="110" height="54" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="525" y="403" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Device B</text><line x1="185" y1="382" x2="462" y2="382" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)" stroke-linecap="round"/><line x1="462" y1="412" x2="185" y2="412" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)" stroke-linecap="round"/><text x="325" y="362" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="bold">Full duplex</text><text x="325" y="452" font-size="14" fill="#6b7280" text-anchor="middle">both ways at the same time, e.g. telephone call</text>
</svg>
