<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 682" font-family="Arial, Helvetica, sans-serif">
<rect x="30" y="200" width="150" height="76" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text x="105" y="232" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">Browser</text><text x="105" y="254" font-size="14" fill="#1f2937" text-anchor="middle">(client)</text><rect x="440" y="40" width="170" height="76" rx="8" fill="#fff" stroke="#d97706" stroke-width="2.5"/><text x="525" y="72" font-size="16" fill="#d97706" text-anchor="middle" font-weight="bold">DNS</text><text x="525" y="94" font-size="14" fill="#1f2937" text-anchor="middle">name to IP address</text><rect x="440" y="330" width="170" height="76" rx="8" fill="#fff" stroke="#059669" stroke-width="2.5"/><text x="525" y="362" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">Web server</text><text x="525" y="384" font-size="14" fill="#1f2937" text-anchor="middle">(server)</text><line x1="150" y1="196" x2="430.8" y2="74" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/><polygon points="440,70 432.1,79.4 427.7,69.3" fill="#d97706"/><circle cx="300" cy="131" r="13" fill="#d97706" stroke="#d97706" stroke-width="2"/><text x="300" y="136" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">1</text><line x1="440" y1="112" x2="179.2" y2="226" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/><polygon points="170,230 177.9,220.6 182.3,230.6" fill="#d97706"/><circle cx="300" cy="173" r="13" fill="#d97706" stroke="#d97706" stroke-width="2"/><text x="300" y="178" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">2</text><line x1="150" y1="262" x2="430.4" y2="342.2" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/><polygon points="440,345 427.9,347.3 430.9,336.7" fill="#059669"/><circle cx="250" cy="291" r="13" fill="#059669" stroke="#059669" stroke-width="2"/><text x="250" y="296" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">3</text><line x1="440" y1="392" x2="179.3" y2="285.8" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/><polygon points="170,282 182.3,281.1 178.1,291.2" fill="#059669"/><circle cx="360" cy="351" r="13" fill="#059669" stroke="#059669" stroke-width="2"/><text x="360" y="356" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">4</text><circle cx="40" cy="446" r="13" fill="#d97706" stroke="#d97706" stroke-width="2"/><text x="40" y="451" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="64" y="450" font-size="15" fill="#1f2937" text-anchor="start">Browser asks DNS for the IP address of</text><text x="64" y="470" font-size="14.5" fill="#6b7280" text-anchor="start">www.example.com</text><circle cx="40" cy="498" r="13" fill="#d97706" stroke="#d97706" stroke-width="2"/><text x="40" y="503" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="64" y="502" font-size="15" fill="#1f2937" text-anchor="start">DNS replies with the IP address</text><text x="64" y="522" font-size="14.5" fill="#6b7280" text-anchor="start">(illustrative: 192.0.2.10)</text><circle cx="40" cy="550" r="13" fill="#059669" stroke="#059669" stroke-width="2"/><text x="40" y="555" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="64" y="554" font-size="15" fill="#1f2937" text-anchor="start">Browser sends an HTTP (or HTTPS) request</text><text x="64" y="574" font-size="14.5" fill="#6b7280" text-anchor="start">to that address for the page</text><circle cx="40" cy="602" r="13" fill="#059669" stroke="#059669" stroke-width="2"/><text x="40" y="607" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">4</text><text x="64" y="606" font-size="15" fill="#1f2937" text-anchor="start">Web server sends the page back</text><text x="64" y="626" font-size="14.5" fill="#6b7280" text-anchor="start">and the browser displays it</text><text x="320" y="668" font-size="14" fill="#6b7280" text-anchor="middle">Solid arrow = request, dashed arrow = reply. Schematic.</text>
</svg>
