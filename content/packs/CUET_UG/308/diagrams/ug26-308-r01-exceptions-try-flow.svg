<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#1f2937"/></marker></defs>
<rect x="290" y="20" width="180" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="380" y="47" font-size="15" fill="#1f2937" text-anchor="middle">try: run the statements</text><line x1="380" y1="64" x2="380" y2="96" stroke="#1f2937" stroke-width="2" marker-end="url(#a)" stroke-linecap="round"/><polygon points="380,96 480,146 380,196 280,146" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="380" y="142" font-size="14" fill="#1f2937" text-anchor="middle">Was an exception</text><text x="380" y="160" font-size="14" fill="#1f2937" text-anchor="middle">raised?</text><rect x="20" y="120" width="190" height="52" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="115" y="151" font-size="15" fill="#1f2937" text-anchor="middle">first matching except runs</text><rect x="610" y="120" width="130" height="52" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="675" y="151" font-size="15" fill="#1f2937" text-anchor="middle">else runs</text><line x1="278" y1="146" x2="214" y2="146" stroke="#1f2937" stroke-width="2" marker-end="url(#a)" stroke-linecap="round"/><text x="246" y="134" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">yes</text><line x1="482" y1="146" x2="606" y2="146" stroke="#1f2937" stroke-width="2" marker-end="url(#a)" stroke-linecap="round"/><text x="544" y="134" font-size="14" fill="#059669" text-anchor="middle" font-weight="bold">no</text><line x1="115" y1="172" x2="115" y2="214" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/><line x1="115" y1="214" x2="330" y2="262" stroke="#1f2937" stroke-width="2" marker-end="url(#a)" stroke-linecap="round"/><line x1="675" y1="172" x2="675" y2="214" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/><line x1="675" y1="214" x2="430" y2="262" stroke="#1f2937" stroke-width="2" marker-end="url(#a)" stroke-linecap="round"/><text x="124" y="196" font-size="13" fill="#6b7280" text-anchor="start">handled</text><text x="666" y="196" font-size="13" fill="#6b7280" text-anchor="end">success path</text><rect x="280" y="262" width="200" height="50" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="380" y="292" font-size="15" fill="#1f2937" text-anchor="middle">finally: always runs</text><line x1="380" y1="312" x2="380" y2="340" stroke="#1f2937" stroke-width="2" marker-end="url(#a)" stroke-linecap="round"/><text x="380" y="360" font-size="13" fill="#6b7280" text-anchor="middle">program continues (an unhandled exception</text><text x="380" y="378" font-size="13" fill="#6b7280" text-anchor="middle">moves up after finally has run)</text>
</svg>
