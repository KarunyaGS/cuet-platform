<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 662" font-family="Arial, Helvetica, sans-serif">
<text x="20" y="30" font-size="18" fill="#1f2937" text-anchor="start" font-weight="bold">Bus</text><line x1="40" y1="100" x2="305" y2="100" stroke="#1f2937" stroke-width="3.5" stroke-linecap="round"/><rect x="32" y="88" width="9" height="24" fill="#1f2937"/><rect x="304" y="88" width="9" height="24" fill="#1f2937"/><line x1="75" y1="100" x2="75" y2="138" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><rect x="56" y="138" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="75" y1="166" x2="75" y2="171" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="65" y1="171" x2="85" y2="171" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="140" y1="100" x2="140" y2="138" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><rect x="121" y="138" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="140" y1="166" x2="140" y2="171" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="130" y1="171" x2="150" y2="171" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="205" y1="100" x2="205" y2="138" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><rect x="186" y="138" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="205" y1="166" x2="205" y2="171" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="195" y1="171" x2="215" y2="171" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="270" y1="100" x2="270" y2="138" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><rect x="251" y="138" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="270" y1="166" x2="270" y2="171" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="260" y1="171" x2="280" y2="171" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="163" y1="91" x2="181" y2="109" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/><line x1="163" y1="109" x2="181" y2="91" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/><text x="340" y="70" font-size="15" fill="#1f2937" text-anchor="start">One common backbone cable with a</text>
<text x="340" y="88.8" font-size="15" fill="#1f2937" text-anchor="start">terminator at each end.</text><text x="340" y="125" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold">Fails: a break in the backbone</text>
<text x="340" y="143.8" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold">stops the whole network.</text><text x="56" y="78" font-size="14" fill="#6b7280" text-anchor="middle">terminator</text><line x1="20" y1="205" x2="620" y2="205" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round"/><text x="20" y="235" font-size="18" fill="#1f2937" text-anchor="start" font-weight="bold">Star</text><line x1="170" y1="335" x2="170" y2="273" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="170" y1="335" x2="284.1" y2="315.8" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="170" y1="335" x2="240.5" y2="385.2" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="170" y1="335" x2="99.5" y2="385.2" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="170" y1="335" x2="55.9" y2="315.8" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><rect x="151" y="259" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="170" y1="287" x2="170" y2="292" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="160" y1="292" x2="180" y2="292" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><rect x="265.1" y="301.8" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="284.1" y1="329.8" x2="284.1" y2="334.8" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="274.1" y1="334.8" x2="294.1" y2="334.8" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><rect x="221.5" y="371.2" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="240.5" y1="399.2" x2="240.5" y2="404.2" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="230.5" y1="404.2" x2="250.5" y2="404.2" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><rect x="80.5" y="371.2" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="99.5" y1="399.2" x2="99.5" y2="404.2" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="89.5" y1="404.2" x2="109.5" y2="404.2" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><rect x="36.9" y="301.8" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="55.9" y1="329.8" x2="55.9" y2="334.8" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="45.9" y1="334.8" x2="65.9" y2="334.8" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><rect x="122" y="319" width="96" height="32" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text x="170" y="340" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">Hub/switch</text><line x1="211.8" y1="362.1" x2="229.8" y2="380.1" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/><line x1="211.8" y1="380.1" x2="229.8" y2="362.1" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/><text x="340" y="285" font-size="15" fill="#1f2937" text-anchor="start">Every node joins one central</text>
<text x="340" y="303.8" font-size="15" fill="#1f2937" text-anchor="start">hub or switch.</text><text x="340" y="335" font-size="15" fill="#d97706" text-anchor="start" font-weight="bold">Cable cut: only that node is</text>
<text x="340" y="353.8" font-size="15" fill="#d97706" text-anchor="start" font-weight="bold">cut off; the rest still work.</text><text x="340" y="385" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold">Central device fails: the whole</text>
<text x="340" y="403.8" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold">network fails.</text><line x1="20" y1="430" x2="620" y2="430" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round"/><text x="20" y="460" font-size="18" fill="#1f2937" text-anchor="start" font-weight="bold">Ring</text><line x1="191" y1="485.3" x2="207.4" y2="497.2" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><polygon points="215.5,503.1 203.4,501.1 209.9,492.2" fill="#1f2937"/><line x1="228.5" y1="543.1" x2="222.3" y2="562.4" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><polygon points="219.2,571.9 217.3,559.7 227.8,563.1" fill="#1f2937"/><line x1="185.1" y1="596.6" x2="154.9" y2="596.6" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><line x1="120.8" y1="571.9" x2="114.6" y2="552.6" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><polygon points="111.5,543.1 120.1,551.9 109.6,555.3" fill="#1f2937"/><line x1="124.5" y1="503.1" x2="140.9" y2="491.2" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><polygon points="149,485.3 143.3,496.2 136.8,487.3" fill="#1f2937"/><rect x="151" y="456" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="170" y1="484" x2="170" y2="489" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="160" y1="489" x2="180" y2="489" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><rect x="217.6" y="504.4" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="236.6" y1="532.4" x2="236.6" y2="537.4" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="226.6" y1="537.4" x2="246.6" y2="537.4" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><rect x="192.1" y="582.6" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="211.1" y1="610.6" x2="211.1" y2="615.6" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="201.1" y1="615.6" x2="221.1" y2="615.6" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><rect x="109.9" y="582.6" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="128.9" y1="610.6" x2="128.9" y2="615.6" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="118.9" y1="615.6" x2="138.9" y2="615.6" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><rect x="84.4" y="504.4" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="103.4" y1="532.4" x2="103.4" y2="537.4" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="93.4" y1="537.4" x2="113.4" y2="537.4" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="162" y1="588.6" x2="178" y2="604.6" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/><line x1="162" y1="604.6" x2="178" y2="588.6" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/><text x="340" y="515" font-size="15" fill="#1f2937" text-anchor="start">Each node has exactly two neighbours</text>
<text x="340" y="533.8" font-size="15" fill="#1f2937" text-anchor="start">in a closed loop; data usually flows</text>
<text x="340" y="552.5" font-size="15" fill="#1f2937" text-anchor="start">one way round.</text><text x="340" y="585" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold">Fails (simple ring): one broken link</text>
<text x="340" y="603.8" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold">or failed node can break the ring.</text><text x="320" y="650" font-size="14" fill="#6b7280" text-anchor="middle">Schematic. Red cross = the failure point.</text>
</svg>
