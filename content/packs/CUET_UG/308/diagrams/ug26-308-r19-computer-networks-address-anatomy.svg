<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 456" font-family="Arial, Helvetica, sans-serif">
<text x="20" y="30" font-size="18" fill="#2563eb" text-anchor="start" font-weight="bold">IPv4 address (example)</text><rect x="78" y="50" width="100" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="128" y="85" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="bold">192</text><text x="128" y="124" font-size="14" fill="#1f2937" text-anchor="middle">8 bits</text><text x="128" y="142" font-size="14" fill="#6b7280" text-anchor="middle">0 to 255</text><circle cx="192" cy="94" r="3.5" fill="#1f2937"/><rect x="206" y="50" width="100" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="256" y="85" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="bold">168</text><text x="256" y="124" font-size="14" fill="#1f2937" text-anchor="middle">8 bits</text><text x="256" y="142" font-size="14" fill="#6b7280" text-anchor="middle">0 to 255</text><circle cx="320" cy="94" r="3.5" fill="#1f2937"/><rect x="334" y="50" width="100" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="384" y="85" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="bold">1</text><text x="384" y="124" font-size="14" fill="#1f2937" text-anchor="middle">8 bits</text><text x="384" y="142" font-size="14" fill="#6b7280" text-anchor="middle">0 to 255</text><circle cx="448" cy="94" r="3.5" fill="#1f2937"/><rect x="462" y="50" width="100" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="512" y="85" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="bold">10</text><text x="512" y="124" font-size="14" fill="#1f2937" text-anchor="middle">8 bits</text><text x="512" y="142" font-size="14" fill="#6b7280" text-anchor="middle">0 to 255</text><line x1="78" y1="160" x2="562" y2="160" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><text x="320" y="184" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">4 x 8 = 32 bits in all</text><text x="320" y="216" font-size="14" fill="#dc2626" text-anchor="middle">A part above 255 makes the address invalid: 192.168.1.300 is not valid.</text><line x1="20" y1="240" x2="620" y2="240" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round"/><text x="20" y="272" font-size="18" fill="#059669" text-anchor="start" font-weight="bold">MAC address (example)</text><rect x="84" y="292" width="62" height="48" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/><text x="115" y="325" font-size="22" fill="#059669" text-anchor="middle" font-weight="bold">2C</text><text x="156" y="325" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="bold">:</text><rect x="166" y="292" width="62" height="48" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/><text x="197" y="325" font-size="22" fill="#059669" text-anchor="middle" font-weight="bold">54</text><text x="238" y="325" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="bold">:</text><rect x="248" y="292" width="62" height="48" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/><text x="279" y="325" font-size="22" fill="#059669" text-anchor="middle" font-weight="bold">91</text><text x="320" y="325" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="bold">:</text><rect x="330" y="292" width="62" height="48" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/><text x="361" y="325" font-size="22" fill="#d97706" text-anchor="middle" font-weight="bold">88</text><text x="402" y="325" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="bold">:</text><rect x="412" y="292" width="62" height="48" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/><text x="443" y="325" font-size="22" fill="#d97706" text-anchor="middle" font-weight="bold">C9</text><text x="484" y="325" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="bold">:</text><rect x="494" y="292" width="62" height="48" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/><text x="525" y="325" font-size="22" fill="#d97706" text-anchor="middle" font-weight="bold">E3</text><line x1="84" y1="358" x2="309" y2="358" stroke="#059669" stroke-width="3" stroke-linecap="round"/><line x1="331" y1="358" x2="556" y2="358" stroke="#d97706" stroke-width="3" stroke-linecap="round"/><text x="197" y="380" font-size="14.5" fill="#059669" text-anchor="middle" font-weight="bold">Manufacturer (OUI)</text><text x="443" y="380" font-size="14.5" fill="#d97706" text-anchor="middle" font-weight="bold">Serial number</text><text x="320" y="416" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">6 pairs of hexadecimal digits = 12 hex digits = 48 bits</text><text x="320" y="440" font-size="14" fill="#6b7280" text-anchor="middle">Fixed in the network card by its manufacturer; works inside a local network.</text>
</svg>
