<ellipse cx="110" cy="150" rx="90" ry="55" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="110" y="155" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">Internet</text><rect x="330" y="60" width="36" height="180" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="3"/><text x="348" y="40" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">Firewall</text><line x1="330" y1="78" x2="366" y2="78" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/><line x1="330" y1="104" x2="366" y2="104" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/><line x1="330" y1="130" x2="366" y2="130" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/><line x1="330" y1="156" x2="366" y2="156" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/><line x1="330" y1="182" x2="366" y2="182" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/><line x1="330" y1="208" x2="366" y2="208" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/><rect x="520" y="70" width="230" height="160" rx="6" fill="#f9fafb" stroke="#059669" stroke-width="2.5"/><text x="635" y="62" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">Private network</text><rect x="560" y="110" width="56" height="34" rx="6" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="588" y="132" font-size="13" fill="#1f2937" text-anchor="middle">PC</text><rect x="650" y="110" width="56" height="34" rx="6" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="678" y="132" font-size="13" fill="#1f2937" text-anchor="middle">PC</text><rect x="560" y="185" width="56" height="34" rx="6" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="588" y="207" font-size="13" fill="#1f2937" text-anchor="middle">PC</text><rect x="650" y="185" width="56" height="34" rx="6" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="678" y="207" font-size="13" fill="#1f2937" text-anchor="middle">PC</text><line x1="200" y1="120" x2="322" y2="120" stroke="#059669" stroke-width="3" marker-end="url(#ag)" stroke-linecap="round"/><line x1="372" y1="120" x2="512" y2="120" stroke="#059669" stroke-width="3" marker-end="url(#ag)" stroke-linecap="round"/><text x="262" y="108" font-size="13" fill="#059669" text-anchor="middle">allowed</text><line x1="200" y1="190" x2="322" y2="190" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/><text x="262" y="178" font-size="13" fill="#dc2626" text-anchor="middle">blocked</text><path d="M 311,180 L 331,200 M 331,180 L 311,200" stroke="#dc2626" stroke-width="4" fill="none" stroke-linecap="round"/><text x="400" y="290" font-size="14" fill="#1f2937" text-anchor="middle">A firewall checks incoming and outgoing traffic against its security rules (IP address, port, protocol).</text><text x="400" y="312" font-size="14" fill="#6b7280" text-anchor="middle">It does not remove a virus that is already inside the network: that is the job of antivirus software.</text>
</svg>
