xt x="250" y="478" font-size="14" fill="#6b7280" text-anchor="middle">MAC table</text><line x1="76" y1="460" x2="178" y2="460" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/><polygon points="188,460 177,465.5 177,454.5" fill="#1f2937"/><rect x="431" y="378" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="450" y1="406" x2="450" y2="411" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="440" y1="411" x2="460" y2="411" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><text x="450" y="428" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">B</text><text x="488" y="397" font-size="14" fill="#6b7280" text-anchor="start">gets nothing</text><rect x="431" y="446" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="450" y1="474" x2="450" y2="479" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="440" y1="479" x2="460" y2="479" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><text x="450" y="496" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">C</text><line x1="310" y1="460" x2="418" y2="460" stroke="#059669" stroke-width="3" stroke-linecap="round"/><polygon points="428,460 417,465.5 417,454.5" fill="#059669"/><text x="488" y="465" font-size="14" fill="#059669" text-anchor="start" font-weight="bold">receives it</text><rect x="431" y="514" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="450" y1="542" x2="450" y2="547" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="440" y1="547" x2="460" y2="547" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><text x="450" y="564" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">D</text><text x="488" y="533" font-size="14" fill="#6b7280" text-anchor="start">gets nothing</text><text x="320" y="592" font-size="14" fill="#6b7280" text-anchor="middle">Switch uses the MAC address 