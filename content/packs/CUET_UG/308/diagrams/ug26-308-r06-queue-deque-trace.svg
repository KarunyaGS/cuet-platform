<line x1="10" y1="386" x2="590" y2="386" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="20" y="417" font-size="16" fill="#1f2937" font-weight="bold">x = d.pop(0)</text>
<text x="20" y="437" font-size="14" fill="#dc2626">x = 9 (leaves front)</text>
<rect x="320" y="392" width="56" height="38" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="348" y="416.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">7</text>
