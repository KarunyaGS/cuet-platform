<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 638" font-family="Arial, Helvetica, sans-serif">
<text x="20" y="28" font-size="15" fill="#6b7280" font-weight="bold">Statement</text>
<text x="300" y="28" font-size="15" fill="#6b7280" font-weight="bold">d after it (front left, rear right)</text>
<line x1="10" y1="40" x2="590" y2="40" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round"/>
<text x="20" y="77" font-size="16" fill="#1f2937" font-weight="bold">d = []</text>
<text x="320" y="77" font-size="15" fill="#6b7280">[ ]  empty</text>
<line x1="10" y1="114" x2="590" y2="114" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="20" y="145" font-size="16" fill="#1f2937" font-weight="bold">d.append(4)</text>
<rect x="320" y="120" width="56" height="38" rx="3" fill="#d1fae5" stroke="#1f2937" stroke-width="2"/><text x="348" y="144.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">4</text>
<text x="348" y="174" font-size="14" fill="#6b7280" text-anchor="middle">front = rear</text>
<line x1="10" y1="182" x2="590" y2="182" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="20" y="213" font-size="16" fill="#1f2937" font-weight="bold">d.insert(0, 7)</text>
<rect x="320" y="188" width="56" height="38" rx="3" fill="#d1fae5" stroke="#1f2937" stroke-width="2"/><text x="348" y="212.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">7</text>
<rect x="380" y="188" width="56" height="38" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="408" y="212.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">4</text>
<text x="348" y="242" font-size="14" fill="#2563eb" text-anchor="middle">front</text>
<text x="408" y="242" font-size="14" fill="#059669" text-anchor="middle">rear</text>
<line x1="10" y1="250" x2="590" y2="250" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="20" y="281" font-size="16" fill="#1f2937" font-weight="bold">d.insert(0, 9)</text>
<rect x="320" y="256" width="56" height="38" rx="3" fill="#d1fae5" stroke="#1f2937" stroke-width="2"/><text x="348" y="280.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">9</text>
