<rect x="440" y="392" width="56" height="38" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="468" y="416.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">1</text>
<rect x="260" y="392" width="56" height="38" rx="3" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/><text x="288" y="416.6" font-size="16" fill="#6b7280" text-anchor="middle">9</text>
<text x="348" y="446" font-size="14" fill="#2563eb" text-anchor="middle">front</text>
<text x="468" y="446" font-size="14" fill="#059669" text-anchor="middle">rear</text>
<line x1="10" y1="454" x2="590" y2="454" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="20" y="485" font-size="16" fill="#1f2937" font-weight="bold">y = d.pop()</text>
<text x="20" y="505" font-size="14" fill="#dc2626">y = 1 (leaves rear)</text>
<rect x="320" y="460" width="56" height="38" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="348" y="484.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">7</text>
<rect x="380" y="460" width="56" height="38" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="408" y="484.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">4</text>
<rect x="440" y="460" width="56" height="38" rx="3" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/><text x="468" y="484.6" font-size="16" fill="#6b7280" text-anchor="middle">1</text>
<text x="348" y="514" font-size="14" fill="#2563eb" text-anchor="middle">front</text>
<text x="408" y="514" font-size="14" fill="#059669" text-anchor="middle">rear</text>
<line x1="10" y1="522" x2="590" y2="522" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="20" y="553" font-size="16" fill="#1f2937" font-weight="bold">d.insert(0, x + y)</text>
<text x="20" y="573" font-size="14" fill="#6b7280">x + y = 10</text>
<rect x="320" y="528" width="56" height="38" rx="3" fill="#d1fae5" stroke="#1f2937" stroke-width="2"/><text x="348" y="552.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">10</text>
<rect x="380" y="528" width="56" height="38" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="408" y="552.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">7</text>
<rect x="440" y="528" width="56" height="38" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="468" y="552.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">4</text>
<text x="348" y="582" font-size="14" fill="#2563eb" text-anchor="middle">front</text>
<text x="468" y="582" font-size="14" fill="#059669" text-anchor="middle">rear</text>
<line x1="10" y1="590" x2="590" y2="590" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="300" y="630" font-size="14" fill="#6b7280" text-anchor="middle">Green = just added. Dashed red = just removed, from the end it left.</text>
</svg>
