<rect x="440" y="256" width="56" height="38" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="468" y="280.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">4</text>
<text x="348" y="310" font-size="14" fill="#2563eb" text-anchor="middle">front</text>
<text x="468" y="310" font-size="14" fill="#059669" text-anchor="middle">rear</text>
<line x1="10" y1="318" x2="590" y2="318" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="20" y="349" font-size="16" fill="#1f2937" font-weight="bold">d.append(1)</text>
<rect x="320" y="324" width="56" height="38" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="348" y="348.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">9</text>
<rect x="380" y="324" width="56" height="38" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="408" y="348.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">7</text>
<rect x="440" y="324" width="56" height="38" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="468" y="348.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">4</text>
<rect x="500" y="324" width="56" height="38" rx="3" fill="#d1fae5" stroke="#1f2937" stroke-width="2"/><text x="528" y="348.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">1</text>
<text x="348" y="378" font-size="14" fill="#2563eb" text-anchor="middle">front</text>
