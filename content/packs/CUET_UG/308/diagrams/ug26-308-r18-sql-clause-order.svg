<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 310" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="780" height="310" fill="#ffffff"/>
<text x="25" y="28" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold">Order in which the clauses are written</text>
<rect x="25" y="40" width="110" height="36" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="80.0" y="63" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">SELECT</text>
<rect x="149" y="40" width="110" height="36" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="204.0" y="63" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">FROM</text>
<rect x="273" y="40" width="110" height="36" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="328.0" y="63" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">WHERE</text>
<rect x="397" y="40" width="110" height="36" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="452.0" y="63" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">GROUP BY</text>
<rect x="521" y="40" width="110" height="36" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="576.0" y="63" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">HAVING</text>
<rect x="645" y="40" width="110" height="36" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="700.0" y="63" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">ORDER BY</text>
<text x="25" y="124" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold">Order in which MySQL processes them</text>
<rect x="25" y="138" width="110" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="39" y="166" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">1</text>
<text x="94.0" y="166" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">FROM</text>
<text x="80.0" y="204" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">picks the table</text>
<line x1="136" y1="160" x2="148" y2="160" stroke="#1f2937" stroke-width="1.5"/><polygon points="149,160 138,154 138,166" fill="#1f2937"/>
<rect x="149" y="138" width="110" height="44" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="163" y="166" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">2</text>
<text x="218.0" y="166" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">WHERE</text>
<text x="204.0" y="204" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">keeps rows (no</text>
<text x="204.0" y="220" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">aggregates)</text>
<line x1="260" y1="160" x2="272" y2="160" stroke="#1f2937" stroke-width="1.5"/><polygon points="273,160 262,154 262,166" fill="#1f2937"/>
<rect x="273" y="138" width="110" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="287" y="166" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">3</text>
<text x="342.0" y="166" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">GROUP BY</text>
<text x="328.0" y="204" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">makes groups of</text>
<text x="328.0" y="220" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">rows</text>
<line x1="384" y1="160" x2="396" y2="160" stroke="#1f2937" stroke-width="1.5"/><polygon points="397,160 386,154 386,166" fill="#1f2937"/>
<rect x="397" y="138" width="110" height="44" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="411" y="166" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">4</text>
<text x="466.0" y="166" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">HAVING</text>
<text x="452.0" y="204" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">keeps groups</text>
<text x="452.0" y="220" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">(aggregates</text>
<text x="452.0" y="236" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">allowed)</text>
<line x1="508" y1="160" x2="520" y2="160" stroke="#1f2937" stroke-width="1.5"/><polygon points="521,160 510,154 510,166" fill="#1f2937"/>
<rect x="521" y="138" width="110" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="535" y="166" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">5</text>
<text x="590.0" y="166" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">SELECT</text>
<text x="576.0" y="204" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">chooses</text>
<text x="576.0" y="220" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">columns, works</text>
<text x="576.0" y="236" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">out aggregates</text>
<line x1="632" y1="160" x2="644" y2="160" stroke="#1f2937" stroke-width="1.5"/><polygon points="645,160 634,154 634,166" fill="#1f2937"/>
<rect x="645" y="138" width="110" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="659" y="166" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">6</text>
<text x="714.0" y="166" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">ORDER BY</text>
<text x="700.0" y="204" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">sorts the final</text>
<text x="700.0" y="220" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">result</text>
<text x="25" y="290" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">WHERE works on rows before grouping; HAVING works on groups after grouping.</text>
</svg>
