<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Arial, Helvetica, sans-serif">
  <text x="320" y="28" font-size="16" fill="#1f2937" text-anchor="middle" font-family="Courier New, monospace">s = pd.Series([10, 20, 30], index=["a", "b", "c"])</text>
  <text x="320" y="52" font-size="15" fill="#6b7280" text-anchor="middle">print(s) shows these labels and values:</text>
  <text x="205" y="96" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">index</text>
  <text x="315" y="96" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">values</text>
  <rect x="150" y="110" width="110" height="44" rx="0" fill="#dbeafe" stroke="#6b7280" stroke-width="1.3"/>
  <text x="205" y="139" font-size="18" fill="#1f2937" text-anchor="middle" font-family="Courier New, monospace">a</text>
  <rect x="260" y="110" width="110" height="44" rx="0" fill="#d1fae5" stroke="#6b7280" stroke-width="1.3"/>
  <text x="315" y="139" font-size="18" fill="#1f2937" text-anchor="middle" font-family="Courier New, monospace">10</text>
  <text x="400" y="138" font-size="16" fill="#6b7280" text-anchor="start">0</text>
  <rect x="150" y="154" width="110" height="44" rx="0" fill="#dbeafe" stroke="#6b7280" stroke-width="1.3"/>
  <text x="205" y="183" font-size="18" fill="#1f2937" text-anchor="middle" font-family="Courier New, monospace">b</text>
  <rect x="260" y="154" width="110" height="44" rx="0" fill="#d1fae5" stroke="#6b7280" stroke-width="1.3"/>
  <text x="315" y="183" font-size="18" fill="#1f2937" text-anchor="middle" font-family="Courier New, monospace">20</text>
  <text x="400" y="182" font-size="16" fill="#6b7280" text-anchor="start">1</text>
  <rect x="150" y="198" width="110" height="44" rx="0" fill="#dbeafe" stroke="#6b7280" stroke-width="1.3"/>
  <text x="205" y="227" font-size="18" fill="#1f2937" text-anchor="middle" font-family="Courier New, monospace">c</text>
  <rect x="260" y="198" width="110" height="44" rx="0" fill="#d1fae5" stroke="#6b7280" stroke-width="1.3"/>
  <text x="315" y="227" font-size="18" fill="#1f2937" text-anchor="middle" font-family="Courier New, monospace">30</text>
  <text x="400" y="226" font-size="16" fill="#6b7280" text-anchor="start">2</text>
  <text x="400" y="96" font-size="15" fill="#6b7280" text-anchor="start">position</text>
  <rect x="150" y="242" width="220" height="44" rx="0" fill="none" stroke="#6b7280" stroke-width="1.3"/>
  <text x="260" y="271" font-size="17" fill="#1f2937" text-anchor="middle" font-family="Courier New, monospace">dtype: int64</text>
  <text x="20" y="182" font-size="15" fill="#2563eb" text-anchor="start" font-weight="bold">by label</text>
  <line x1="100" y1="176" x2="137" y2="176" stroke="#2563eb" stroke-width="2"/>
  <polygon points="146.0,176.0 137.0,180.5 137.0,171.5" fill="#2563eb" stroke="none" stroke-width="1.5"/>
  <text x="445" y="174" font-size="15" fill="#2563eb" text-anchor="start" font-family="Courier New, monospace">s["b"]  gives 20</text>
  <text x="445" y="200" font-size="15" fill="#6b7280" text-anchor="start" font-family="Courier New, monospace">s.iloc[1]  gives 20</text>
  <text x="320" y="330" font-size="15" fill="#6b7280" text-anchor="middle">A Series = index (labels) + values. Positions 0, 1, 2 are implicit.</text>
  <text x="320" y="354" font-size="15" fill="#6b7280" text-anchor="middle">All values share one data type (dtype).</text>
</svg>
