<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 548" font-family="Arial, Helvetica, sans-serif">
<line x1="190" y1="90" x2="250" y2="138" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><rect x="171" y="48" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="190" y1="76" x2="190" y2="81" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="180" y1="81" x2="200" y2="81" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="250" y1="90" x2="250" y2="138" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><rect x="231" y="48" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="250" y1="76" x2="250" y2="81" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="240" y1="81" x2="260" y2="81" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="310" y1="90" x2="250" y2="138" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><rect x="291" y="48" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="310" y1="76" x2="310" y2="81" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="300" y1="81" x2="320" y2="81" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><text x="250" y="28" font-size="14" fill="#6b7280" text-anchor="middle">Computers, each with a network card (NIC)</text><rect x="15" y="136" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="34" y1="164" x2="34" y2="169" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="24" y1="169" x2="44" y2="169" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="53" y1="150" x2="72" y2="150" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><rect x="72" y="136" width="70" height="28" rx="8" fill="#fff" stroke="#d97706" stroke-width="2.5"/><text x="107" y="156" font-size="14" fill="#d97706" text-anchor="middle" font-weight="bold">Repeater</text><line x1="142" y1="150" x2="185" y2="150" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><text x="92" y="186" font-size="14" fill="#d97706" text-anchor="middle">Regenerates a</text>
<text x="92" y="203" font-size="14" fill="#d97706" text-anchor="middle">weak signal on a</text>
<text x="92" y="220" font-size="14" fill="#d97706" text-anchor="middle">long cable</text><rect x="185" y="132" width="130" height="36" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text x="250" y="155" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">Switch</text><line x1="250" y1="178" x2="250" y2="232" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><polygon points="250,168 255.5,179 244.5,179" fill="#1f2937"/><polygon points="250,242 244.5,231 255.5,231" fill="#1f2937"/><rect x="185" y="242" width="130" height="36" rx="8" fill="#fff" stroke="#059669" stroke-width="2.5"/><text x="250" y="265" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">Router</text><line x1="250" y1="288" x2="250" y2="342" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><polygon points="250,278 255.5,289 244.5,289" fill="#1f2937"/><polygon points="250,352 244.5,341 255.5,341" fill="#1f2937"/><rect x="185" y="352" width="130" height="36" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2.5"/><text x="250" y="375" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">Modem</text><line x1="250" y1="398" x2="250" y2="452" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><polygon points="250,388 255.5,399 244.5,399" fill="#1f2937"/><polygon points="250,462 244.5,451 255.5,451" fill="#1f2937"/><rect x="155" y="462" width="190" height="44" rx="20" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="250" y="489" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">ISP and the Internet</text><rect x="40" y="242" width="90" height="36" rx="8" fill="#fff" stroke="#1f2937" stroke-width="2.5"/><text x="85" y="265" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Gateway</text><line x1="130" y1="260" x2="185" y2="260" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><text x="85" y="300" font-size="14" fill="#1f2937" text-anchor="middle">Joins networks that</text>
<text x="85" y="317" font-size="14" fill="#1f2937" text-anchor="middle">use different</text>
<text x="85" y="334" font-size="14" fill="#1f2937" text-anchor="middle">protocols</text><text x="390" y="130" font-size="14" fill="#2563eb" text-anchor="start">Inside one network. Uses MAC</text>
<text x="390" y="147" font-size="14" fill="#2563eb" text-anchor="start">addresses and sends data only to</text>
<text x="390" y="164" font-size="14" fill="#2563eb" text-anchor="start">the intended receiver (a hub</text>
<text x="390" y="181" font-size="14" fill="#2563eb" text-anchor="start">would copy it to every port).</text><text x="390" y="243" font-size="14" fill="#059669" text-anchor="start">Between networks. Uses IP</text>
<text x="390" y="260" font-size="14" fill="#059669" text-anchor="start">addresses to choose the path;</text>
<text x="390" y="277" font-size="14" fill="#059669" text-anchor="start">joins the LAN to the Internet.</text><text x="390" y="354" font-size="14" fill="#dc2626" text-anchor="start">Digital to analog and back</text>
<text x="390" y="371" font-size="14" fill="#dc2626" text-anchor="start">for the telephone or cable</text>
<text x="390" y="388" font-size="14" fill="#dc2626" text-anchor="start">line to the ISP.</text><text x="320" y="536" font-size="14" fill="#6b7280" text-anchor="middle">Schematic. A home Wi-Fi box often combines modem, router and switch.</text>
</svg>
