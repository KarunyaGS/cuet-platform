<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 502" font-family="Arial, Helvetica, sans-serif">
<text x="20" y="28" font-size="15" fill="#6b7280" font-weight="bold">Statement</text>
<text x="320" y="28" font-size="15" fill="#6b7280" font-weight="bold">q after it (front on the left)</text>
<line x1="10" y1="40" x2="590" y2="40" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round"/>
<text x="20" y="77" font-size="16" fill="#1f2937" font-weight="bold">q = []</text>
<text x="320" y="77" font-size="15" fill="#6b7280">[ ]  empty</text>
<line x1="10" y1="114" x2="590" y2="114" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="20" y="145" font-size="16" fill="#1f2937" font-weight="bold">q.append(10)</text>
<rect x="320" y="120" width="56" height="38" rx="3" fill="#d1fae5" stroke="#1f2937" stroke-width="2"/><text x="348" y="144.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">10</text>
<text x="348" y="174" font-size="14" fill="#6b7280" text-anchor="middle">front = rear</text>
<line x1="10" y1="182" x2="590" y2="182" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="20" y="213" font-size="16" fill="#1f2937" font-weight="bold">q.append(20)</text>
<rect x="320" y="188" width="56" height="38" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="348" y="212.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">10</text>
<rect x="380" y="188" width="56" height="38" rx="3" fill="#d1fae5" stroke="#1f2937" stroke-width="2"/><text x="408" y="212.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">20</text>
<text x="348" y="242" font-size="14" fill="#2563eb" text-anchor="middle">front</text>
<text x="408" y="242" font-size="14" fill="#059669" text-anchor="middle">rear</text>
<line x1="10" y1="250" x2="590" y2="250" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="20" y="281" font-size="16" fill="#1f2937" font-weight="bold">q.append(30)</text>
<rect x="320" y="256" width="56" height="38" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="348" y="280.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">10</text>
<rect x="380" y="256" width="56" height="38" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="408" y="280.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">20</text>
<rect x="440" y="256" width="56" height="38" rx="3" fill="#d1fae5" stroke="#1f2937" stroke-width="2"/><text x="468" y="280.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">30</text>
<text x="348" y="310" font-size="14" fill="#2563eb" text-anchor="middle">front</text>
<text x="468" y="310" font-size="14" fill="#059669" text-anchor="middle">rear</text>
<line x1="10" y1="318" x2="590" y2="318" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="20" y="349" font-size="16" fill="#1f2937" font-weight="bold">q.pop(0)</text>
<text x="20" y="369" font-size="14" fill="#dc2626">returns 10 (front leaves)</text>
<rect x="320" y="324" width="56" height="38" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="348" y="348.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">20</text>
<rect x="380" y="324" width="56" height="38" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="408" y="348.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">30</text>
<rect x="260" y="324" width="56" height="38" rx="3" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/><text x="288" y="348.6" font-size="16" fill="#6b7280" text-anchor="middle">10</text>
<text x="348" y="378" font-size="14" fill="#2563eb" text-anchor="middle">front</text>
<text x="408" y="378" font-size="14" fill="#059669" text-anchor="middle">rear</text>
<line x1="10" y1="386" x2="590" y2="386" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="20" y="417" font-size="16" fill="#1f2937" font-weight="bold">q.append(40)</text>
<rect x="320" y="392" width="56" height="38" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="348" y="416.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">20</text>
<rect x="380" y="392" width="56" height="38" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="408" y="416.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">30</text>
<rect x="440" y="392" width="56" height="38" rx="3" fill="#d1fae5" stroke="#1f2937" stroke-width="2"/><text x="468" y="416.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">40</text>
<text x="348" y="446" font-size="14" fill="#2563eb" text-anchor="middle">front</text>
<text x="468" y="446" font-size="14" fill="#059669" text-anchor="middle">rear</text>
<line x1="10" y1="454" x2="590" y2="454" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="300" y="494" font-size="14" fill="#6b7280" text-anchor="middle">Green = just added at the rear. Dashed red = just removed from the front.</text>
</svg>
