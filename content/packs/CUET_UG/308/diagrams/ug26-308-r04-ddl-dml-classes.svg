<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 356" font-family="Arial, Helvetica, sans-serif">
  <rect x="10" y="10" width="218" height="330" rx="8" fill="none" stroke="#2563eb" stroke-width="2"/>
  <rect x="10" y="10" width="218" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="119" y="36" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold">DDL</text>
  <text x="119" y="58" font-size="14" fill="#1f2937" text-anchor="middle">Data Definition Language</text>
  <text x="119" y="96" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">Structure</text>
  <text x="119" y="120" font-size="14" fill="#1f2937" text-anchor="middle">Defines and changes the</text>
  <text x="119" y="138" font-size="14" fill="#1f2937" text-anchor="middle">structure (schema)</text>
  <rect x="44" y="168" width="150" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="119" y="191" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">CREATE</text>
  <rect x="44" y="212" width="150" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="119" y="235" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">ALTER</text>
  <rect x="44" y="256" width="150" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="119" y="279" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">DROP</text>
  <line x1="26" y1="292" x2="212" y2="292" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="119" y="312" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold">Changes:</text>
  <text x="119" y="330" font-size="14" fill="#1f2937" text-anchor="middle">Tables, columns, databases</text>
  <rect x="240" y="10" width="218" height="330" rx="8" fill="none" stroke="#d97706" stroke-width="2"/>
  <rect x="240" y="10" width="218" height="58" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="349" y="36" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold">DML</text>
  <text x="349" y="58" font-size="14" fill="#1f2937" text-anchor="middle">Data Manipulation Language</text>
  <text x="349" y="96" font-size="14" fill="#d97706" text-anchor="middle" font-weight="bold">Data</text>
  <text x="349" y="120" font-size="14" fill="#1f2937" text-anchor="middle">Adds, changes and removes</text>
  <text x="349" y="138" font-size="14" fill="#1f2937" text-anchor="middle">the data (rows)</text>
  <rect x="274" y="168" width="150" height="34" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="349" y="191" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">INSERT</text>
  <rect x="274" y="212" width="150" height="34" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="349" y="235" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">UPDATE</text>
  <rect x="274" y="256" width="150" height="34" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="349" y="279" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">DELETE</text>
  <line x1="256" y1="292" x2="442" y2="292" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="349" y="312" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold">Changes:</text>
  <text x="349" y="330" font-size="14" fill="#1f2937" text-anchor="middle">Rows inside tables</text>
  <rect x="470" y="10" width="218" height="330" rx="8" fill="none" stroke="#059669" stroke-width="2"/>
  <rect x="470" y="10" width="218" height="58" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="579" y="36" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold">DQL</text>
  <text x="579" y="58" font-size="14" fill="#1f2937" text-anchor="middle">Data Query Language</text>
  <text x="579" y="96" font-size="14" fill="#059669" text-anchor="middle" font-weight="bold">Query</text>
  <text x="579" y="120" font-size="14" fill="#1f2937" text-anchor="middle">Reads data without</text>
  <text x="579" y="138" font-size="14" fill="#1f2937" text-anchor="middle">changing it</text>
  <rect x="504" y="168" width="150" height="34" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="579" y="191" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">SELECT</text>
  <line x1="486" y1="292" x2="672" y2="292" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="579" y="312" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold">Changes:</text>
  <text x="579" y="330" font-size="14" fill="#1f2937" text-anchor="middle">Nothing, it only reads</text>
</svg>
