<text x="375" y="103.8" font-size="15" fill="#1f2937" text-anchor="start">in a hierarchy under a root</text>
<text x="375" y="122.5" font-size="15" fill="#1f2937" text-anchor="start">node (bus and star combined).</text><text x="375" y="160" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold">Root or backbone link fails:</text>
