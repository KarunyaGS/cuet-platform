 stroke-width="2"/><line x1="254.2" y1="399.9" x2="254.2" y2="404.9" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="244.2" y1="404.9" x2="264.2" y2="404.9" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><rect x="206.8" y="459.1" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="225.8" y1="487.1" x2="225.8" y2="492.1" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="215.8" y1="492.1" x2="235.8" y2="492.1" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><rect x="115.2" y="459.1" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="134.2" y1="487.1" x2="134.2" y2="492.1" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="124.2" y1="492.1" x2="144.2" y2="492.1" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><rect x="86.8" y="371.9" width="38" height="28" rx="3" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="105.8" y1="399.9" x2="105.8" y2="404.9" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="95.8" y1="404.9" x2="115.8" y2="404.9" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><text x="375" y="365" font-size="15" fill="#1f2937" text-anchor="start">Every node is joined directly</text>
<text x="375" y="383.8" font-size="15" fill="#1f2937" text-anchor="start">to every other node.</text><text x="375" y="420" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">One link fails: data takes another</text>
