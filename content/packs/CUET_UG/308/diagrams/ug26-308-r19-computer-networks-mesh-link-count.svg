<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 426" font-family="Arial, Helvetica, sans-serif">
<text x="20" y="30" font-size="18" fill="#1f2937" text-anchor="start" font-weight="bold">Full mesh: links = n(n - 1) / 2</text><line x1="160" y1="90" x2="230" y2="160" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/><line x1="160" y1="90" x2="160" y2="230" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/><line x1="160" y1="90" x2="90" y2="160" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/><line x1="230" y1="160" x2="160" y2="230" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/><line x1="230" y1="160" x2="90" y2="160" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/><line x1="160" y1="230" x2="90" y2="160" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/><circle cx="160" cy="90" r="11" fill="#fff" stroke="#1f2937" stroke-width="2.5"/><circle cx="230" cy="160" r="11" fill="#fff" stroke="#1f2937" stroke-width="2.5"/><circle cx="160" cy="230" r="11" fill="#fff" stroke="#1f2937" stroke-width="2.5"/><circle cx="90" cy="160" r="11" fill="#fff" stroke="#1f2937" stroke-width="2.5"/><text x="160" y="262" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">4 nodes</text><text x="160" y="286" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">4 x 3 / 2 = 6 links</text><text x="160" y="308" font-size="14" fill="#6b7280" text-anchor="middle">each node has 3 ports</text><line x1="470" y1="80" x2="539.3" y2="120" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/><line x1="470" y1="80" x2="539.3" y2="200" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/><line x1="470" y1="80" x2="470" y2="240" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/><line x1="470" y1="80" x2="400.7" y2="200" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/><line x1="470" y1="80" x2="400.7" y2="120" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/><line x1="539.3" y1="120" x2="539.3" y2="200" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/><line x1="539.3" y1="120" x2="470" y2="240" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/><line x1="539.3" y1="120" x2="400.7" y2="200" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/><line x1="539.3" y1="120" x2="400.7" y2="120" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/><line x1="539.3" y1="200" x2="470" y2="240" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/><line x1="539.3" y1="200" x2="400.7" y2="200" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/><line x1="539.3" y1="200" x2="400.7" y2="120" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/><line x1="470" y1="240" x2="400.7" y2="200" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/><line x1="470" y1="240" x2="400.7" y2="120" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/><line x1="400.7" y1="200" x2="400.7" y2="120" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/><circle cx="470" cy="80" r="11" fill="#fff" stroke="#1f2937" stroke-width="2.5"/><circle cx="539.3" cy="120" r="11" fill="#fff" stroke="#1f2937" stroke-width="2.5"/><circle cx="539.3" cy="200" r="11" fill="#fff" stroke="#1f2937" stroke-width="2.5"/><circle cx="470" cy="240" r="11" fill="#fff" stroke="#1f2937" stroke-width="2.5"/><circle cx="400.7" cy="200" r="11" fill="#fff" stroke="#1f2937" stroke-width="2.5"/><circle cx="400.7" cy="120" r="11" fill="#fff" stroke="#1f2937" stroke-width="2.5"/><text x="470" y="262" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">6 nodes</text><text x="470" y="286" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">6 x 5 / 2 = 15 links</text><text x="470" y="308" font-size="14" fill="#6b7280" text-anchor="middle">each node has 5 ports</text><line x1="20" y1="330" x2="620" y2="330" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round"/><text x="320" y="362" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold">For 8 nodes: 8 x 7 / 2 = 28 links.</text><text x="320" y="386" font-size="14.5" fill="#1f2937" text-anchor="middle">Each node needs n - 1 ports, so cost grows quickly.</text><text x="320" y="414" font-size="14" fill="#6b7280" text-anchor="middle">Schematic.</text>
</svg>
