<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 748" font-family="Arial, Helvetica, sans-serif">
<rect x="11" y="20" width="108" height="52" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text x="65" y="52" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">Browser</text><line x1="65" y1="72" x2="65" y2="470" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/><rect x="141" y="20" width="108" height="52" rx="8" fill="#fff" stroke="#d97706" stroke-width="2.5"/><text x="195" y="42" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold">ISP</text>
<text x="195" y="60" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold">resolver</text><line x1="195" y1="72" x2="195" y2="470" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/><rect x="271" y="20" width="108" height="52" rx="8" fill="#fff" stroke="#6b7280" stroke-width="2.5"/><text x="325" y="42" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="bold">Root</text>
<text x="325" y="60" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="bold">server</text><line x1="325" y1="72" x2="325" y2="470" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/><rect x="401" y="20" width="108" height="52" rx="8" fill="#fff" stroke="#6b7280" stroke-width="2.5"/><text x="455" y="42" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="bold">.in TLD</text>
<text x="455" y="60" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="bold">server</text><line x1="455" y1="72" x2="455" y2="470" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/><rect x="521" y="20" width="108" height="52" rx="8" fill="#fff" stroke="#059669" stroke-width="2.5"/><text x="575" y="42" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold">example.in</text>
<text x="575" y="60" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold">server</text><line x1="575" y1="72" x2="575" y2="470" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/><line x1="69" y1="105" x2="181" y2="105" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/><polygon points="191,105 180,110.5 180,99.5" fill="#2563eb"/><circle cx="130" cy="105" r="12" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="130" y="110" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">1</text><line x1="199" y1="160" x2="311" y2="160" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/><polygon points="321,160 310,165.5 310,154.5" fill="#d97706"/><circle cx="260" cy="160" r="12" fill="#d97706" stroke="#d97706" stroke-width="2"/><text x="260" y="165" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">2</text><line x1="321" y1="205" x2="209" y2="205" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/><polygon points="199,205 210,199.5 210,210.5" fill="#6b7280"/><circle cx="260" cy="205" r="12" fill="#6b7280" stroke="#6b7280" stroke-width="2"/><text x="260" y="210" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">3</text><line x1="199" y1="250" x2="441" y2="250" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/><polygon points="451,250 440,255.5 440,244.5" fill="#d97706"/><circle cx="325" cy="250" r="12" fill="#d97706" stroke="#d97706" stroke-width="2"/><text x="325" y="255" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">4</text><line x1="451" y1="295" x2="209" y2="295" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/><polygon points="199,295 210,289.5 210,300.5" fill="#6b7280"/><circle cx="325" cy="295" r="12" fill="#6b7280" stroke="#6b7280" stroke-width="2"/><text x="325" y="300" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">5</text><line x1="199" y1="340" x2="561" y2="340" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/><polygon points="571,340 560,345.5 560,334.5" fill="#d97706"/><circle cx="385" cy="340" r="12" fill="#d97706" stroke="#d97706" stroke-width="2"/><text x="385" y="345" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">6</text><line x1="571" y1="385" x2="209" y2="385" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/><polygon points="199,385 210,379.5 210,390.5" fill="#059669"/><circle cx="385" cy="385" r="12" fill="#059669" stroke="#059669" stroke-width="2"/><text x="385" y="390" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">7</text><line x1="191" y1="430" x2="79" y2="430" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/><polygon points="69,430 80,424.5 80,435.5" fill="#059669"/><circle cx="130" cy="430" r="12" fill="#059669" stroke="#059669" stroke-width="2"/><text x="130" y="435" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">8</text><text x="24" y="510" font-size="14.5" fill="#1f2937" text-anchor="start">1  Browser has no cached IP address, so it asks the ISP resolver.</text><text x="24" y="532" font-size="14.5" fill="#1f2937" text-anchor="start">2  Resolver (no cached entry) asks a root server.</text><text x="24" y="554" font-size="14.5" fill="#1f2937" text-anchor="start">3  Root server points to the .in TLD server.</text><text x="24" y="576" font-size="14.5" fill="#1f2937" text-anchor="start">4  Resolver asks the .in TLD server.</text><text x="24" y="598" font-size="14.5" fill="#1f2937" text-anchor="start">5  TLD server points to the server for example.in.</text><text x="24" y="620" font-size="14.5" fill="#1f2937" text-anchor="start">6  Resolver asks that authoritative server.</text><text x="24" y="642" font-size="14.5" fill="#1f2937" text-anchor="start">7  It returns the IP address of www.example.in.</text><text x="24" y="664" font-size="14.5" fill="#1f2937" text-anchor="start">8  Resolver gives the IP address to the browser.</text><text x="24" y="706" font-size="14.5" fill="#059669" text-anchor="start" font-weight="bold">Then the browser connects to that IP address and sends the HTTP request.</text><text x="320" y="734" font-size="14" fill="#6b7280" text-anchor="middle">Solid arrow = question, dashed arrow = answer. Schematic.</text>
</svg>
