<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" font-family="Arial, Helvetica, sans-serif">
<rect x="170" y="66" width="84" height="54" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="212" y="100" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold">10</text>
<rect x="258" y="66" width="84" height="54" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="300" y="100" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold">20</text>
<rect x="346" y="66" width="84" height="54" rx="3" fill="#d1fae5" stroke="#1f2937" stroke-width="2"/><text x="388" y="100" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold">30</text>
<line x1="162" y1="93" x2="28" y2="93" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/><polygon points="20.0,93.0 30.0,88.5 30.0,97.5" fill="#dc2626"/>
<text x="20" y="48" font-size="16" fill="#dc2626" font-weight="bold">DEQUEUE</text>
<text x="20" y="64" font-size="14" fill="#dc2626">q.pop(0)</text>
<line x1="580" y1="93" x2="442" y2="93" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/><polygon points="434.0,93.0 444.0,88.5 444.0,97.5" fill="#059669"/>
<text x="580" y="48" font-size="16" fill="#059669" text-anchor="end" font-weight="bold">ENQUEUE</text>
<text x="580" y="64" font-size="14" fill="#059669" text-anchor="end">q.append(x)</text>
<text x="212" y="146" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">front</text>
<text x="212" y="164" font-size="14" fill="#2563eb" text-anchor="middle">q[0]</text>
<text x="388" y="146" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">rear</text>
<text x="388" y="164" font-size="14" fill="#059669" text-anchor="middle">q[-1]</text>
<text x="212" y="54" font-size="14" fill="#6b7280" text-anchor="middle">joined first</text>
<text x="388" y="54" font-size="14" fill="#6b7280" text-anchor="middle">joined last</text>
<text x="300" y="202" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Leaving order: 10, 20, 30 (same as joining order)</text>
<text x="300" y="226" font-size="15" fill="#1f2937" text-anchor="middle">FIFO: first in, first out</text>
</svg>
