<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="Arial, Helvetica, sans-serif">
  <text x="340" y="28" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Courier New, monospace">plt.pie([20, 30, 50], labels=["A", "B", "C"], autopct="%1.1f%%")</text>
  <path d="M190,240 L330.0,240.0 A140,140 0 0 0 233.3,106.9 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="260.223" y="193.98" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">20.0%</text>
  <text x="324.297" y="147.428" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">A</text>
  <path d="M190,240 L233.3,106.9 A140,140 0 0 0 50.0,240.0 Z" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/>
  <text x="138.98" y="174.777" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">30.0%</text>
  <text x="92.4276" y="110.703" font-size="17" fill="#059669" text-anchor="middle" font-weight="bold">B</text>
  <path d="M190,240 L50.0,240.0 A140,140 0 0 0 330.0,240.0 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="190" y="331.8" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">50.0%</text>
  <text x="190" y="411" font-size="17" fill="#d97706" text-anchor="middle" font-weight="bold">C</text>
  <text x="410" y="120" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold">angle of a wedge</text>
  <text x="410" y="144" font-size="15" fill="#1f2937" text-anchor="start">= value / total x 360</text>
  <text x="410" y="184" font-size="15" fill="#2563eb" text-anchor="start">A: 20/100 x 360 = 72 degrees</text>
  <text x="410" y="214" font-size="15" fill="#059669" text-anchor="start">B: 30/100 x 360 = 108 degrees</text>
  <text x="410" y="244" font-size="15" fill="#d97706" text-anchor="start">C: 50/100 x 360 = 180 degrees</text>
  <text x="410" y="274" font-size="15" fill="#6b7280" text-anchor="start">total = 360 degrees</text>
  <text x="410" y="320" font-size="14" fill="#6b7280" text-anchor="start">By default the first wedge (A)</text>
  <text x="410" y="340" font-size="14" fill="#6b7280" text-anchor="start">starts at the 3 o'clock position</text>
  <text x="410" y="360" font-size="14" fill="#6b7280" text-anchor="start">and wedges run anticlockwise.</text>
</svg>
