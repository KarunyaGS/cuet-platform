<text x="325" y="218" font-size="14" fill="#6b7280" text-anchor="middle">Each column is the stack after reading the symbol above it. Green = operand pushed.</text>
<text x="325" y="240" font-size="14" fill="#6b7280" text-anchor="middle">Amber = result of an operator (popped B first, then A, computed A op B).</text>
<text x="325" y="262" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Last stack holds one item, 37: the value of the expression.</text>
