<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" font-family="Arial, Helvetica, sans-serif">
<text x="320" y="26" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">A: "B is a liar"   B: "C is a liar"   C: "A and B are both liars"</text><rect x="10" y="50" width="190" height="46" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="105" y="79" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">Case</text><rect x="200" y="50" width="90" height="46" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="245" y="79" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">A</text><rect x="290" y="50" width="90" height="46" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="335" y="79" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">B</text><rect x="380" y="50" width="90" height="46" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="425" y="79" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">C</text><rect x="470" y="50" width="160" height="46" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="550" y="79" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">Result</text><rect x="10" y="96" width="190" height="46" fill="none" stroke="#6b7280" stroke-width="1.5"/><text x="105" y="125" font-size="15" text-anchor="middle" fill="#1f2937">1. Assume B is truthful</text><rect x="200" y="96" width="90" height="46" fill="none" stroke="#6b7280" stroke-width="1.5"/><text x="245" y="125" font-size="15" text-anchor="middle" fill="#1f2937">Liar</text><rect x="290" y="96" width="90" height="46" fill="none" stroke="#6b7280" stroke-width="1.5"/><text x="335" y="125" font-size="15" text-anchor="middle" fill="#1f2937">Truthful</text><rect x="380" y="96" width="90" height="46" fill="none" stroke="#6b7280" stroke-width="1.5"/><text x="425" y="125" font-size="15" text-anchor="middle" fill="#1f2937">Liar</text><rect x="470" y="96" width="160" height="46" fill="#ecfdf5" stroke="#6b7280" stroke-width="1.5"/><text x="550" y="125" font-size="15" text-anchor="middle" fill="#059669" font-weight="bold">Consistent</text><rect x="10" y="142" width="190" height="46" fill="none" stroke="#6b7280" stroke-width="1.5"/><text x="105" y="171" font-size="15" text-anchor="middle" fill="#1f2937">2. Assume B is a liar</text><rect x="200" y="142" width="90" height="46" fill="none" stroke="#6b7280" stroke-width="1.5"/><text x="245" y="171" font-size="15" text-anchor="middle" fill="#1f2937">Liar?</text><rect x="290" y="142" width="90" height="46" fill="none" stroke="#6b7280" stroke-width="1.5"/><text x="335" y="171" font-size="15" text-anchor="middle" fill="#1f2937">Liar</text><rect x="380" y="142" width="90" height="46" fill="none" stroke="#6b7280" stroke-width="1.5"/><text x="425" y="171" font-size="15" text-anchor="middle" fill="#1f2937">Truthful</text><rect x="470" y="142" width="160" height="46" fill="#fef2f2" stroke="#6b7280" stroke-width="1.5"/><text x="550" y="171" font-size="15" text-anchor="middle" fill="#dc2626" font-weight="bold">Contradiction</text><text x="10" y="214" font-size="15" text-anchor="start" fill="#1f2937">Case 1: B truthful makes C a liar, so C's claim is false (not both are liars).</text>
<text x="10" y="236" font-size="15" text-anchor="start" fill="#1f2937">A says B is a liar, which is false, so A is a liar. Everything fits.</text><text x="10" y="276" font-size="15" text-anchor="start" fill="#1f2937">Case 2: B a liar makes C truthful, so A and B are both liars. But then</text>
<text x="10" y="298" font-size="15" text-anchor="start" fill="#1f2937">A's claim "B is a liar" is true, and a liar cannot say something true.</text><text x="10" y="348" font-size="16" text-anchor="start" fill="#059669" font-weight="bold">Only Case 1 survives: B is truthful; A and C are liars.</text>
</svg>
