<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" font-family="Arial, Helvetica, sans-serif">
<text x="320" y="28" font-size="17" text-anchor="middle" fill="#1f2937" font-weight="bold">A 12 V battery across a 4 ohm resistor</text><polyline points="120,80 440,80 440,112" fill="none" stroke="#1f2937" stroke-width="2.5"/><polyline points="440,112 440,125.9 427,131.4 453,142.5 427,153.5 453,164.5 427,175.5 453,186.5 427,197.6 453,208.6 440,214.1 440,228" fill="none" stroke="#1f2937" stroke-width="2.5"/><polyline points="440,228 440,260 120,260 120,188" fill="none" stroke="#1f2937" stroke-width="2.5"/><line x1="120" y1="80" x2="120" y2="142" stroke="#1f2937" stroke-width="2.5"/><line x1="96" y1="142" x2="144" y2="142" stroke="#1f2937" stroke-width="4"/><line x1="107" y1="158" x2="133" y2="158" stroke="#1f2937" stroke-width="4"/><line x1="120" y1="158" x2="120" y2="188" stroke="#1f2937" stroke-width="2.5"/><text x="154" y="144" font-size="18" text-anchor="start" fill="#dc2626" font-weight="bold">+</text><text x="154" y="168" font-size="20" text-anchor="start" fill="#1f2937" font-weight="bold">-</text><text x="86" y="156" font-size="17" text-anchor="end" fill="#2563eb" font-weight="bold">12 V</text><text x="468" y="176" font-size="17" text-anchor="start" fill="#059669" font-weight="bold">R = 4 ohm</text><line x1="250" y1="80" x2="319" y2="80" stroke="#dc2626" stroke-width="3"/>
<polygon points="330,80 319,85.5 319,74.5" fill="#dc2626" stroke="none" stroke-width="2"/><text x="290" y="66" font-size="17" text-anchor="middle" fill="#dc2626" font-weight="bold">I = 3 A</text><text x="320" y="302" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">I = V / R = 12 / 4 = 3 A</text><text x="320" y="326" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">P = V x I = 12 x 3 = 36 W</text><text x="320" y="354" font-size="14" text-anchor="middle" fill="#6b7280">Key: long and short plates = battery cell; zigzag = resistor; arrow = current direction.</text>
</svg>
