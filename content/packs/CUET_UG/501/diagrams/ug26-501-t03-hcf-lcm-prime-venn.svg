<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, Helvetica, sans-serif">
<text x="320" y="28" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">Prime factors of 36 and 48</text><circle cx="260" cy="180" r="115" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5" fill-opacity="0.5"/><circle cx="380" cy="180" r="115" fill="#fde68a" stroke="#d97706" stroke-width="2.5" fill-opacity="0.5"/><text x="190" y="62" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold">36 = 2 x 2 x 3 x 3</text><text x="450" y="62" font-size="15" text-anchor="middle" fill="#d97706" font-weight="bold">48 = 2 x 2 x 2 x 2 x 3</text><text x="205" y="186" font-size="20" text-anchor="middle" fill="#1f2937" font-weight="bold">3</text><text x="320" y="186" font-size="20" text-anchor="middle" fill="#1f2937" font-weight="bold">2 x 2 x 3</text><text x="435" y="186" font-size="20" text-anchor="middle" fill="#1f2937" font-weight="bold">2 x 2</text><text x="205" y="212" font-size="14" text-anchor="middle" fill="#6b7280">only in 36</text><text x="320" y="212" font-size="14" text-anchor="middle" fill="#6b7280">in both</text><text x="435" y="212" font-size="14" text-anchor="middle" fill="#6b7280">only in 48</text><text x="320" y="330" font-size="16" text-anchor="middle" fill="#059669" font-weight="bold">HCF = the overlap = 2 x 2 x 3 = 12</text><text x="320" y="358" font-size="16" text-anchor="middle" fill="#dc2626" font-weight="bold">LCM = overlap x the rest = 12 x 3 x 4 = 144</text><text x="320" y="386" font-size="15" text-anchor="middle" fill="#1f2937">Check: HCF x LCM = 12 x 144 = 1728 = 36 x 48</text>
</svg>
