<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 315" font-family="Arial, Helvetica, sans-serif">
<text x="340" y="26" font-size="17" text-anchor="middle" fill="#1f2937" font-weight="bold">A row of 40 persons (schematic, not to scale)</text><rect x="40" y="110" width="195" height="46" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><text x="137.5" y="139" font-size="15" text-anchor="middle" fill="#1f2937">13 persons</text><rect x="235" y="110" width="15" height="46" fill="#fde68a" stroke="#d97706" stroke-width="2"/><rect x="250" y="110" width="105" height="46" fill="#a7f3d0" stroke="#1f2937" stroke-width="2"/><text x="302.5" y="139" font-size="15" text-anchor="middle" fill="#1f2937">7 between</text><rect x="355" y="110" width="15" height="46" fill="#fde68a" stroke="#d97706" stroke-width="2"/><rect x="370" y="110" width="270" height="46" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><text x="505" y="139" font-size="15" text-anchor="middle" fill="#1f2937">18 persons</text><text x="242.5" y="92" font-size="17" text-anchor="middle" fill="#d97706" font-weight="bold">A</text><text x="362.5" y="92" font-size="17" text-anchor="middle" fill="#d97706" font-weight="bold">B</text><line x1="40" y1="184" x2="250" y2="184" stroke="#6b7280" stroke-width="2"/><line x1="40" y1="178" x2="40" y2="190" stroke="#6b7280" stroke-width="2"/><line x1="250" y1="178" x2="250" y2="190" stroke="#6b7280" stroke-width="2"/><text x="145" y="208" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold">A is 14th from the left</text><line x1="355" y1="184" x2="640" y2="184" stroke="#6b7280" stroke-width="2"/><line x1="355" y1="178" x2="355" y2="190" stroke="#6b7280" stroke-width="2"/><line x1="640" y1="178" x2="640" y2="190" stroke="#6b7280" stroke-width="2"/><text x="497.5" y="208" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold">B is 19th from the right</text><line x1="40" y1="236" x2="370" y2="236" stroke="#6b7280" stroke-width="2"/><line x1="40" y1="230" x2="40" y2="242" stroke="#6b7280" stroke-width="2"/><line x1="370" y1="230" x2="370" y2="242" stroke="#6b7280" stroke-width="2"/><text x="205" y="260" font-size="15" text-anchor="middle" fill="#059669" font-weight="bold">B is 40 - 19 + 1 = 22nd from the left</text><text x="340" y="296" font-size="16" text-anchor="middle" fill="#dc2626" font-weight="bold">Persons between A and B: 22 - 14 - 1 = 7</text>
</svg>
