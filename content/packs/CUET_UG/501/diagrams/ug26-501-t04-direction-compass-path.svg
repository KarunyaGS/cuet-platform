<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" font-family="Arial, Helvetica, sans-serif">
<text x="320" y="26" font-size="17" text-anchor="middle" fill="#1f2937" font-weight="bold">Ravi walks 8 km north, turns right, walks 6 km</text><line x1="540" y1="100" x2="540" y2="56" stroke="#1f2937" stroke-width="2.5"/>
<polygon points="540,45 545.5,56 534.5,56" fill="#1f2937" stroke="none" stroke-width="2"/><line x1="540" y1="100" x2="584" y2="100" stroke="#1f2937" stroke-width="2"/>
<polygon points="595,100 584,105.5 584,94.5" fill="#1f2937" stroke="none" stroke-width="2"/><line x1="540" y1="100" x2="540" y2="145" stroke="#1f2937" stroke-width="2"/><line x1="540" y1="100" x2="495" y2="100" stroke="#1f2937" stroke-width="2"/><text x="540" y="36" font-size="17" text-anchor="middle" fill="#1f2937" font-weight="bold">N</text><text x="610" y="106" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">E</text><text x="540" y="166" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">S</text><text x="480" y="106" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">W</text><line x1="140" y1="340" x2="140" y2="163" stroke="#2563eb" stroke-width="3.5"/>
<polygon points="140,152 145.5,163 134.5,163" fill="#2563eb" stroke="none" stroke-width="2"/><line x1="140" y1="148" x2="269" y2="148" stroke="#2563eb" stroke-width="3.5"/>
<polygon points="280,148 269,153.5 269,142.5" fill="#2563eb" stroke="none" stroke-width="2"/><line x1="140" y1="340" x2="284" y2="148" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 5"/><polyline points="140,164 156,164 156,148" fill="none" stroke="#1f2937" stroke-width="1.8"/><circle cx="140" cy="340" r="6" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><circle cx="140" cy="148" r="6" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><circle cx="284" cy="148" r="6" fill="#dc2626" stroke="#dc2626" stroke-width="2"/><text x="152" y="362" font-size="15" text-anchor="start" fill="#1f2937" font-weight="bold">Start</text><text x="128" y="140" font-size="14" text-anchor="end" fill="#6b7280">turn right</text><text x="294" y="140" font-size="15" text-anchor="start" fill="#dc2626" font-weight="bold">End</text><text x="126" y="249" font-size="15" text-anchor="end" fill="#2563eb" font-weight="bold">8 km north</text><text x="212" y="134" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold">6 km east</text><text x="234" y="264" font-size="16" text-anchor="start" fill="#dc2626" font-weight="bold">10 km</text><text x="340" y="215" font-size="15" text-anchor="start" fill="#1f2937" font-weight="bold">Distance from start:</text>
<text x="340" y="239" font-size="15" text-anchor="start" fill="#1f2937" font-weight="bold">8² + 6² = 64 + 36 = 100</text>
<text x="340" y="263" font-size="15" text-anchor="start" fill="#1f2937" font-weight="bold">so the distance is 10 km.</text><text x="340" y="305" font-size="15" text-anchor="start" fill="#1f2937">The end point is 8 km north and</text>
<text x="340" y="327" font-size="15" text-anchor="start" fill="#1f2937">6 km east of the start, so it lies</text>
<text x="340" y="349" font-size="15" text-anchor="start" fill="#1f2937">to the north-east.</text>
</svg>
