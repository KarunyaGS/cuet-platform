<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 335" font-family="Arial, Helvetica, sans-serif">
<text x="360" y="28" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">Freedom struggle: key dates in order</text><line x1="30" y1="175" x2="689" y2="175" stroke="#1f2937" stroke-width="3"/>
<polygon points="700,175 689,180.5 689,169.5" fill="#1f2937" stroke="none" stroke-width="2"/><circle cx="70" cy="175" r="7" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><line x1="70" y1="167" x2="70" y2="137" stroke="#6b7280" stroke-width="1.5"/><text x="70" y="110" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">1857</text><text x="70" y="129" font-size="14" text-anchor="middle" fill="#1f2937">Revolt of 1857</text><circle cx="150" cy="175" r="7" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><line x1="150" y1="183" x2="150" y2="213" stroke="#6b7280" stroke-width="1.5"/><text x="150" y="233" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">1885</text><text x="150" y="252" font-size="14" text-anchor="middle" fill="#1f2937">Indian National</text><text x="150" y="271" font-size="14" text-anchor="middle" fill="#1f2937">Congress founded</text><circle cx="230" cy="175" r="7" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><line x1="230" y1="167" x2="230" y2="137" stroke="#6b7280" stroke-width="1.5"/><text x="230" y="91" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">1905</text><text x="230" y="110" font-size="14" text-anchor="middle" fill="#1f2937">Partition</text><text x="230" y="129" font-size="14" text-anchor="middle" fill="#1f2937">of Bengal</text><circle cx="310" cy="175" r="7" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><line x1="310" y1="183" x2="310" y2="213" stroke="#6b7280" stroke-width="1.5"/><text x="310" y="233" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">1919</text><text x="310" y="252" font-size="14" text-anchor="middle" fill="#1f2937">Jallianwala Bagh</text><text x="310" y="271" font-size="14" text-anchor="middle" fill="#1f2937">massacre</text><circle cx="390" cy="175" r="7" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><line x1="390" y1="167" x2="390" y2="137" stroke="#6b7280" stroke-width="1.5"/><text x="390" y="91" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">1920</text><text x="390" y="110" font-size="14" text-anchor="middle" fill="#1f2937">Non-Cooperation</text><text x="390" y="129" font-size="14" text-anchor="middle" fill="#1f2937">Movement</text><circle cx="470" cy="175" r="7" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><line x1="470" y1="183" x2="470" y2="213" stroke="#6b7280" stroke-width="1.5"/><text x="470" y="233" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">1930</text><text x="470" y="252" font-size="14" text-anchor="middle" fill="#1f2937">Dandi March</text><text x="470" y="271" font-size="14" text-anchor="middle" fill="#1f2937">(Salt Satyagraha)</text><circle cx="550" cy="175" r="7" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><line x1="550" y1="167" x2="550" y2="137" stroke="#6b7280" stroke-width="1.5"/><text x="550" y="91" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">1942</text><text x="550" y="110" font-size="14" text-anchor="middle" fill="#1f2937">Quit India</text><text x="550" y="129" font-size="14" text-anchor="middle" fill="#1f2937">Movement</text><circle cx="630" cy="175" r="7" fill="#059669" stroke="#059669" stroke-width="2"/><line x1="630" y1="183" x2="630" y2="213" stroke="#6b7280" stroke-width="1.5"/><text x="630" y="233" font-size="14" text-anchor="middle" fill="#059669" font-weight="bold">15 August 1947</text><text x="630" y="252" font-size="14" text-anchor="middle" fill="#1f2937">Independence</text><text x="360" y="318" font-size="14" text-anchor="middle" fill="#6b7280">Events are equally spaced for reading; not drawn to a time scale.</text>
</svg>
