<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Arial, Helvetica, sans-serif">
<text x="320" y="28" font-size="17" text-anchor="middle" fill="#1f2937" font-weight="bold">Row of five friends facing north</text><rect x="75" y="90" width="90" height="64" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/><text x="120" y="132" font-size="26" text-anchor="middle" fill="#1f2937" font-weight="bold">T</text><text x="120" y="76" font-size="14" text-anchor="middle" fill="#6b7280">Seat 1</text><rect x="175" y="90" width="90" height="64" fill="#fde68a" stroke="#d97706" stroke-width="2.5"/><text x="220" y="132" font-size="26" text-anchor="middle" fill="#1f2937" font-weight="bold">P</text><text x="220" y="76" font-size="14" text-anchor="middle" fill="#6b7280">Seat 2</text><rect x="275" y="90" width="90" height="64" fill="#fde68a" stroke="#d97706" stroke-width="2.5"/><text x="320" y="132" font-size="26" text-anchor="middle" fill="#1f2937" font-weight="bold">R</text><text x="320" y="76" font-size="14" text-anchor="middle" fill="#6b7280">Seat 3</text><rect x="375" y="90" width="90" height="64" fill="#a7f3d0" stroke="#059669" stroke-width="2.5"/><text x="420" y="132" font-size="26" text-anchor="middle" fill="#1f2937" font-weight="bold">Q</text><text x="420" y="76" font-size="14" text-anchor="middle" fill="#6b7280">Seat 4</text><rect x="475" y="90" width="90" height="64" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/><text x="520" y="132" font-size="26" text-anchor="middle" fill="#1f2937" font-weight="bold">S</text><text x="520" y="76" font-size="14" text-anchor="middle" fill="#6b7280">Seat 5</text><text x="75" y="182" font-size="14" text-anchor="start" fill="#6b7280">left end</text><text x="565" y="182" font-size="14" text-anchor="end" fill="#6b7280">right end</text><text x="320" y="186" font-size="15" text-anchor="middle" fill="#dc2626" font-weight="bold">middle seat</text><text x="75" y="226" font-size="15" text-anchor="start" fill="#2563eb" font-weight="bold">Blue: T at the left end and S at the right end (given).</text><text x="75" y="252" font-size="15" text-anchor="start" fill="#d97706" font-weight="bold">Amber: P sits immediately to the left of R, so they fill seats 2-3.</text><text x="75" y="278" font-size="15" text-anchor="start" fill="#059669" font-weight="bold">Green: Q cannot sit next to T, so Q takes seat 4.</text>
</svg>
