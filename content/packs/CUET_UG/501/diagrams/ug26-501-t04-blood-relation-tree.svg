<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Arial, Helvetica, sans-serif">
<text x="300" y="26" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">'His mother is the only daughter of my mother.'</text><text x="250" y="46" font-size="14" text-anchor="middle" fill="#6b7280">(the woman speaks, pointing to a man)</text><circle cx="250" cy="100" r="26" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/><text x="292" y="106" font-size="15" text-anchor="start" fill="#1f2937" font-weight="bold">The woman's mother</text><circle cx="250" cy="210" r="26" fill="#fde68a" stroke="#d97706" stroke-width="2.5"/><text x="292" y="216" font-size="15" text-anchor="start" fill="#1f2937" font-weight="bold">The woman (speaker)</text><rect x="224" y="294" width="52" height="52" fill="#a7f3d0" stroke="#059669" stroke-width="2.5"/><text x="292" y="326" font-size="15" text-anchor="start" fill="#1f2937" font-weight="bold">The man she points to</text><line x1="250" y1="126" x2="250" y2="184" stroke="#1f2937" stroke-width="2.5"/><line x1="250" y1="236" x2="250" y2="294" stroke="#1f2937" stroke-width="2.5"/><text x="238" y="160" font-size="14" text-anchor="end" fill="#2563eb">her only daughter</text><text x="238" y="268" font-size="14" text-anchor="end" fill="#059669">her son</text><text x="10" y="384" font-size="14" text-anchor="start" fill="#6b7280">Circle = female, square = male. A vertical line joins parent (above) to child (below).</text>
</svg>
