<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 365" font-family="Arial, Helvetica, sans-serif">
<text x="320" y="26" font-size="17" text-anchor="middle" fill="#1f2937" font-weight="bold">Counting odd days around the week</text><line x1="227" y1="118" x2="249.1" y2="128.6" stroke="#d97706" stroke-width="3"/>
<polygon points="259,133.4 246.7,133.6 251.4,123.7" fill="#d97706" stroke="none" stroke-width="2"/><text x="260.4" y="95.7" font-size="17" text-anchor="middle" fill="#d97706" font-weight="bold">1</text><line x1="292.7" y1="175.7" x2="298.1" y2="199.5" stroke="#d97706" stroke-width="3"/>
<polygon points="300.6,210.2 292.8,200.7 303.5,198.3" fill="#d97706" stroke="none" stroke-width="2"/><text x="335.6" y="190" font-size="17" text-anchor="middle" fill="#d97706" font-weight="bold">2</text><line x1="288.5" y1="262.9" x2="273.3" y2="282.1" stroke="#d97706" stroke-width="3"/>
<polygon points="266.4,290.7 269,278.6 277.6,285.5" fill="#d97706" stroke="none" stroke-width="2"/><text x="308.8" y="307.7" font-size="17" text-anchor="middle" fill="#d97706" font-weight="bold">3</text><line x1="217.7" y1="314.1" x2="193.3" y2="314.1" stroke="#d97706" stroke-width="3"/>
<polygon points="182.3,314.1 193.3,308.6 193.3,319.6" fill="#d97706" stroke="none" stroke-width="2"/><text x="200" y="360.1" font-size="17" text-anchor="middle" fill="#d97706" font-weight="bold">4</text><line x1="133.6" y1="290.7" x2="118.3" y2="271.5" stroke="#d97706" stroke-width="3"/>
<polygon points="111.5,262.9 122.6,268.1 114,275" fill="#d97706" stroke="none" stroke-width="2"/><text x="91.2" y="307.7" font-size="17" text-anchor="middle" fill="#d97706" font-weight="bold">5</text><circle cx="200" cy="105" r="27" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/><text x="200" y="110" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">Mon</text><circle cx="286" cy="146.4" r="27" fill="#f9fafb" stroke="#6b7280" stroke-width="2.5"/><text x="286" y="151.4" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">Tue</text><circle cx="307.2" cy="239.5" r="27" fill="#f9fafb" stroke="#6b7280" stroke-width="2.5"/><text x="307.2" y="244.5" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">Wed</text><circle cx="247.7" cy="314.1" r="27" fill="#f9fafb" stroke="#6b7280" stroke-width="2.5"/><text x="247.7" y="319.1" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">Thu</text><circle cx="152.3" cy="314.1" r="27" fill="#f9fafb" stroke="#6b7280" stroke-width="2.5"/><text x="152.3" y="319.1" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">Fri</text><circle cx="92.8" cy="239.5" r="27" fill="#a7f3d0" stroke="#059669" stroke-width="2.5"/><text x="92.8" y="244.5" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">Sat</text><circle cx="114" cy="146.4" r="27" fill="#f9fafb" stroke="#6b7280" stroke-width="2.5"/><text x="114" y="151.4" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">Sun</text><text x="385" y="110" font-size="15" text-anchor="start" fill="#1f2937">26 Jan 2026 is a Monday.</text>
<text x="385" y="134" font-size="15" text-anchor="start" fill="#1f2937">15 Aug 2026 is 201 days later.</text>
<text x="385" y="158" font-size="15" text-anchor="start" fill="#1f2937"></text>
<text x="385" y="182" font-size="15" text-anchor="start" fill="#1f2937">201 = 28 x 7 + 5</text>
<text x="385" y="206" font-size="15" text-anchor="start" fill="#1f2937">28 whole weeks change nothing;</text>
<text x="385" y="230" font-size="15" text-anchor="start" fill="#1f2937">only the 5 odd days count.</text>
<text x="385" y="254" font-size="15" text-anchor="start" fill="#1f2937"></text>
<text x="385" y="278" font-size="15" text-anchor="start" fill="#1f2937">Monday + 5 days = Saturday</text><text x="385" y="316" font-size="14" text-anchor="start" fill="#6b7280">(Blue = start, green = answer)</text>
</svg>
