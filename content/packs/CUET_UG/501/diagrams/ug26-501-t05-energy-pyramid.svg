<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" font-family="Arial, Helvetica, sans-serif">
<text x="320" y="28" font-size="17" text-anchor="middle" fill="#1f2937" font-weight="bold">Energy at each level (grassland example)</text><rect x="80" y="252" width="310" height="56" fill="#a7f3d0" stroke="#1f2937" stroke-width="2"/><text x="235" y="286" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">20000 J</text><text x="405" y="286" font-size="15" text-anchor="start" fill="#1f2937">Producers (green plants)</text><rect x="115" y="188" width="240" height="56" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><text x="235" y="222" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">2000 J</text><text x="405" y="222" font-size="15" text-anchor="start" fill="#1f2937">Primary consumers</text><text x="10" y="257" font-size="15" text-anchor="start" fill="#d97706" font-weight="bold">x 10%</text><rect x="150" y="124" width="170" height="56" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><text x="235" y="158" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">200 J</text><text x="405" y="158" font-size="15" text-anchor="start" fill="#1f2937">Secondary consumers</text><text x="10" y="193" font-size="15" text-anchor="start" fill="#d97706" font-weight="bold">x 10%</text><rect x="185" y="60" width="100" height="56" fill="#fecaca" stroke="#1f2937" stroke-width="2"/><text x="235" y="94" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">20 J</text><text x="405" y="94" font-size="15" text-anchor="start" fill="#1f2937">Tertiary consumers</text><text x="10" y="129" font-size="15" text-anchor="start" fill="#d97706" font-weight="bold">x 10%</text><text x="320" y="338" font-size="14" text-anchor="middle" fill="#6b7280">Sunlight is captured by the producers. At each step up only about 10% of the</text><text x="320" y="358" font-size="14" text-anchor="middle" fill="#6b7280">energy passes on; the rest is lost as heat. Not drawn to scale.</text>
</svg>
