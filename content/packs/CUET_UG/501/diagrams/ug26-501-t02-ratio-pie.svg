<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 345" font-family="Arial, Helvetica, sans-serif">
<text x="320" y="28" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">360 divided in the ratio 2 : 3 : 4</text><path d="M175,195 L175,70 A125,125 0 0 1 298.1,173.3 Z" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><text x="224.8" y="141.6" font-size="20" text-anchor="middle" fill="#1f2937" font-weight="bold">80</text><path d="M175,195 L298.1,173.3 A125,125 0 0 1 132.2,312.5 Z" fill="#a7f3d0" stroke="#1f2937" stroke-width="2"/><text x="224.8" y="260.4" font-size="20" text-anchor="middle" fill="#1f2937" font-weight="bold">120</text><path d="M175,195 L132.2,312.5 A125,125 0 0 1 175,70 Z" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><text x="98.7" y="187.5" font-size="20" text-anchor="middle" fill="#1f2937" font-weight="bold">160</text><rect x="335" y="94" width="22" height="22" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="369" y="110" font-size="15" text-anchor="start" fill="#1f2937" font-weight="bold">Share 1: 2 parts</text><text x="369" y="130" font-size="15" text-anchor="start" fill="#1f2937">2 x 40 = 80</text><rect x="335" y="150" width="22" height="22" fill="#a7f3d0" stroke="#059669" stroke-width="2"/><text x="369" y="166" font-size="15" text-anchor="start" fill="#1f2937" font-weight="bold">Share 2: 3 parts</text><text x="369" y="186" font-size="15" text-anchor="start" fill="#1f2937">3 x 40 = 120</text><rect x="335" y="206" width="22" height="22" fill="#fde68a" stroke="#d97706" stroke-width="2"/><text x="369" y="222" font-size="15" text-anchor="start" fill="#1f2937" font-weight="bold">Share 3: 4 parts</text><text x="369" y="242" font-size="15" text-anchor="start" fill="#1f2937">4 x 40 = 160</text><text x="335" y="290" font-size="15" text-anchor="start" fill="#1f2937" font-weight="bold">Total 9 parts = 360</text><text x="335" y="312" font-size="15" text-anchor="start" fill="#1f2937">1 part = 360 / 9 = 40</text>
</svg>
