<polygon points="180,118 174.5,107 185.5,107" fill="#dc2626" stroke="none" stroke-width="2"/><text x="180" y="76" font-size="15" text-anchor="middle" fill="#dc2626" font-weight="bold">0.001 M HCl: pH 3</text><line x1="340" y1="92" x2="340" y2="107" stroke="#059669" stroke-width="3"/>
<polygon points="340,118 334.5,107 345.5,107" fill="#059669" stroke="none" stroke-width="2"/><text x="340" y="76" font-size="15" text-anchor="middle" fill="#059669" font-weight="bold">neutral: pH 7</text><text x="200" y="218" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">acidic: below 7</text><text x="480" y="218" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">basic: above 7</text><text x="340" y="262" font-size="14" text-anchor="middle" fill="#6b7280">Each step of 1 on the scale is a tenfold change in hydrogen ion concentration.</text>
