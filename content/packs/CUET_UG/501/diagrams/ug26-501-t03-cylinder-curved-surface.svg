<polygon points="210,92 215.5,103 204.5,103" fill="#2563eb" stroke="none" stroke-width="2"/><text x="220" y="155" font-size="15" text-anchor="start" fill="#2563eb" font-weight="bold">h = 10 cm</text><text x="475" y="30" font-size="17" text-anchor="middle" fill="#1f2937" font-weight="bold">Curved surface opened out flat</text><rect x="310" y="100" width="330" height="75" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/><text x="475" y="143.5" font-size="17" text-anchor="middle" fill="#059669" font-weight="bold">44 x 10 = 440 cm²</text><text x="475" y="201" font-size="15" text-anchor="middle" fill="#1f2937">width = circumference 2πr = 44 cm</text><text x="648" y="142.5" font-size="15" text-anchor="start" fill="#2563eb" font-weight="bold">10 cm</text><text x="355" y="292" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">Volume = πr²h = 22/7 x 7 x 7 x 10 = 1540 cm³</text><text x="10" y="330" font-size="14" text-anchor="start" fill="#6b7280">Base radius 7 cm, height 10 cm, π = 22/7; schematic, not to scale.</text>
