<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Arial, Helvetica, sans-serif">
<text x="160" y="27" font-size="17" text-anchor="middle" fill="#1f2937" font-weight="bold">All A are B</text><circle cx="160" cy="110" r="62" fill="#fde68a" stroke="#d97706" stroke-width="2.5" fill-opacity="0.5"/><circle cx="160" cy="123" r="30" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5" fill-opacity="0.6"/><text x="160" y="68" font-size="17" text-anchor="middle" fill="#d97706" font-weight="bold">B</text><text x="160" y="129" font-size="17" text-anchor="middle" fill="#2563eb" font-weight="bold">A</text><text x="160" y="194" font-size="14" text-anchor="middle" fill="#6b7280">A lies completely inside B</text><text x="480" y="27" font-size="17" text-anchor="middle" fill="#1f2937" font-weight="bold">No A is B</text><circle cx="418" cy="110" r="46" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5" fill-opacity="0.6"/><circle cx="542" cy="110" r="46" fill="#fde68a" stroke="#d97706" stroke-width="2.5" fill-opacity="0.5"/><text x="418" y="116" font-size="17" text-anchor="middle" fill="#2563eb" font-weight="bold">A</text><text x="542" y="116" font-size="17" text-anchor="middle" fill="#d97706" font-weight="bold">B</text><text x="480" y="194" font-size="14" text-anchor="middle" fill="#6b7280">A and B do not overlap</text><text x="160" y="237" font-size="17" text-anchor="middle" fill="#1f2937" font-weight="bold">Some A are B</text><circle cx="125" cy="327" r="52" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5" fill-opacity="0.6"/><circle cx="195" cy="327" r="52" fill="#fde68a" stroke="#d97706" stroke-width="2.5" fill-opacity="0.5"/><text x="100" y="267" font-size="17" text-anchor="middle" fill="#2563eb" font-weight="bold">A</text><text x="220" y="267" font-size="17" text-anchor="middle" fill="#d97706" font-weight="bold">B</text><circle cx="160" cy="327" r="6" fill="#dc2626" stroke="#dc2626" stroke-width="2"/><text x="160" y="404" font-size="14" text-anchor="middle" fill="#6b7280">Overlap; the dot marks A that is also B</text><text x="480" y="237" font-size="17" text-anchor="middle" fill="#1f2937" font-weight="bold">Some A are not B</text><circle cx="445" cy="327" r="52" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5" fill-opacity="0.6"/><circle cx="515" cy="327" r="52" fill="#fde68a" stroke="#d97706" stroke-width="2.5" fill-opacity="0.5"/><text x="420" y="267" font-size="17" text-anchor="middle" fill="#2563eb" font-weight="bold">A</text><text x="540" y="267" font-size="17" text-anchor="middle" fill="#d97706" font-weight="bold">B</text><circle cx="420" cy="327" r="6" fill="#dc2626" stroke="#dc2626" stroke-width="2"/><text x="480" y="404" font-size="14" text-anchor="middle" fill="#6b7280">The dot marks A that is outside B</text>
</svg>
