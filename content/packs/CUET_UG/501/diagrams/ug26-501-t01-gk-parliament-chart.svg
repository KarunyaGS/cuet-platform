<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="Arial, Helvetica, sans-serif">
<text x="350" y="26" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">The Union Parliament of India</text><rect x="240" y="38" width="220" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="350" y="64" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">Union Parliament</text><line x1="350" y1="78" x2="350" y2="100" stroke="#6b7280" stroke-width="2"/><line x1="122.5" y1="100" x2="577.5" y2="100" stroke="#6b7280" stroke-width="2"/><line x1="122.5" y1="100" x2="122.5" y2="116" stroke="#6b7280" stroke-width="2"/><rect x="15" y="116" width="215" height="196" fill="none" stroke="#d97706" stroke-width="2.5"/><text x="122.5" y="142" font-size="17" text-anchor="middle" fill="#d97706" font-weight="bold">President</text><text x="122.5" y="170" font-size="14" text-anchor="middle" fill="#1f2937">One of the three</text>
<text x="122.5" y="190" font-size="14" text-anchor="middle" fill="#1f2937">parts of Parliament</text>
<text x="122.5" y="210" font-size="14" text-anchor="middle" fill="#1f2937"></text>
<text x="122.5" y="230" font-size="14" text-anchor="middle" fill="#1f2937">Minimum age</text>
<text x="122.5" y="250" font-size="14" text-anchor="middle" fill="#1f2937">to be President: 35</text><line x1="350" y1="100" x2="350" y2="116" stroke="#6b7280" stroke-width="2"/><rect x="242.5" y="116" width="215" height="196" fill="none" stroke="#2563eb" stroke-width="2.5"/><text x="350" y="142" font-size="17" text-anchor="middle" fill="#2563eb" font-weight="bold">Lok Sabha</text><text x="350" y="170" font-size="14" text-anchor="middle" fill="#1f2937">Lower house</text>
<text x="350" y="190" font-size="14" text-anchor="middle" fill="#1f2937">Directly elected</text>
<text x="350" y="210" font-size="14" text-anchor="middle" fill="#1f2937">Normal term: 5 years</text>
<text x="350" y="230" font-size="14" text-anchor="middle" fill="#1f2937">Minimum age: 25</text>
<text x="350" y="250" font-size="14" text-anchor="middle" fill="#1f2937">Money Bill: introduced</text>
<text x="350" y="270" font-size="14" text-anchor="middle" fill="#1f2937">only here</text><line x1="577.5" y1="100" x2="577.5" y2="116" stroke="#6b7280" stroke-width="2"/><rect x="470" y="116" width="215" height="196" fill="none" stroke="#059669" stroke-width="2.5"/><text x="577.5" y="142" font-size="17" text-anchor="middle" fill="#059669" font-weight="bold">Rajya Sabha</text><text x="577.5" y="170" font-size="14" text-anchor="middle" fill="#1f2937">Permanent; never dissolved</text>
<text x="577.5" y="190" font-size="14" text-anchor="middle" fill="#1f2937">1/3 of members retire</text>
<text x="577.5" y="210" font-size="14" text-anchor="middle" fill="#1f2937">every 2 years</text>
<text x="577.5" y="230" font-size="14" text-anchor="middle" fill="#1f2937">Member term: 6 years</text>
<text x="577.5" y="250" font-size="14" text-anchor="middle" fill="#1f2937">Minimum age: 30</text>
<text x="577.5" y="270" font-size="14" text-anchor="middle" fill="#1f2937">Chairman: Vice-President</text>
<text x="577.5" y="290" font-size="14" text-anchor="middle" fill="#1f2937">(ex-officio)</text><text x="350" y="342" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">Ages to remember: 25 (Lok Sabha), 30 (Rajya Sabha), 35 (President)</text>
</svg>
