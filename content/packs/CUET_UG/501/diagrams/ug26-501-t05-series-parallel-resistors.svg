<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 330" font-family="Arial, Helvetica, sans-serif">
<text x="10" y="28" font-size="16" text-anchor="start" fill="#2563eb" font-weight="bold">Series: one path, so the resistances add</text><circle cx="40" cy="80" r="6" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><line x1="40" y1="80" x2="120" y2="80" stroke="#1f2937" stroke-width="2.5"/><polyline points="120,80 134.4,80 142,93 157.2,67 172.4,93 187.6,67 202.8,93 218,67 225.6,80 240,80" fill="none" stroke="#1f2937" stroke-width="2.5"/><line x1="240" y1="80" x2="290" y2="80" stroke="#1f2937" stroke-width="2.5"/><polyline points="290,80 304.4,80 312,93 327.2,67 342.4,93 357.6,67 372.8,93 388,67 395.6,80 410,80" fill="none" stroke="#1f2937" stroke-width="2.5"/><line x1="410" y1="80" x2="480" y2="80" stroke="#1f2937" stroke-width="2.5"/><circle cx="480" cy="80" r="6" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><text x="180" y="54" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">R1</text><text x="350" y="54" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">R2</text><text x="500" y="86" font-size="17" text-anchor="start" fill="#2563eb" font-weight="bold">R = R1 + R2</text><line x1="10" y1="140" x2="670" y2="140" stroke="#d1d5db" stroke-width="1.5"/><text x="10" y="172" font-size="16" text-anchor="start" fill="#059669" font-weight="bold">Parallel: two paths, so the reciprocals add</text><circle cx="40" cy="252" r="6" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><line x1="40" y1="252" x2="110" y2="252" stroke="#1f2937" stroke-width="2.5"/><line x1="110" y1="215" x2="110" y2="290" stroke="#1f2937" stroke-width="2.5"/><line x1="110" y1="215" x2="170" y2="215" stroke="#1f2937" stroke-width="2.5"/><polyline points="170,215 191.6,215 200.2,228 217.3,202 234.4,228 251.5,202 268.6,228 285.7,202 302.8,228 319.9,202 328.4,215 350,215" fill="none" stroke="#1f2937" stroke-width="2.5"/><line x1="350" y1="215" x2="410" y2="215" stroke="#1f2937" stroke-width="2.5"/><line x1="110" y1="290" x2="170" y2="290" stroke="#1f2937" stroke-width="2.5"/><polyline points="170,290 191.6,290 200.2,303 217.3,277 234.4,303 251.5,277 268.6,303 285.7,277 302.8,303 319.9,277 328.4,290 350,290" fill="none" stroke="#1f2937" stroke-width="2.5"/><line x1="350" y1="290" x2="410" y2="290" stroke="#1f2937" stroke-width="2.5"/><line x1="410" y1="215" x2="410" y2="290" stroke="#1f2937" stroke-width="2.5"/><line x1="410" y1="252" x2="480" y2="252" stroke="#1f2937" stroke-width="2.5"/><circle cx="480" cy="252" r="6" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><circle cx="110" cy="252" r="4" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><circle cx="410" cy="252" r="4" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><text x="260" y="191" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">R1</text><text x="260" y="324" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">R2</text><text x="500" y="244" font-size="17" text-anchor="start" fill="#059669" font-weight="bold">1/R = 1/R1 + 1/R2</text><text x="500" y="270" font-size="14" text-anchor="start" fill="#6b7280">R is less than</text><text x="500" y="288" font-size="14" text-anchor="start" fill="#6b7280">the smaller of R1, R2</text>
</svg>
