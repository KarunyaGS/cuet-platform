<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" font-family="Arial, Helvetica, sans-serif">
<text x="165" y="58" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">Diagram 1: pens and cups apart</text><text x="505" y="58" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">Diagram 2: pens and cups overlap</text><circle cx="165" cy="170" r="95" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5" fill-opacity="0.45"/><circle cx="125" cy="175" r="38" fill="#a7f3d0" stroke="#059669" stroke-width="2.5" fill-opacity="0.6"/><circle cx="270" cy="175" r="50" fill="#fde68a" stroke="#d97706" stroke-width="2.5" fill-opacity="0.5"/><text x="125" y="180" font-size="15" text-anchor="middle" fill="#059669" font-weight="bold">Pens</text><text x="180" y="245" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold">Books</text><text x="292" y="180" font-size="15" text-anchor="middle" fill="#d97706" font-weight="bold">Cups</text><circle cx="505" cy="170" r="95" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5" fill-opacity="0.45"/><circle cx="490" cy="150" r="40" fill="#a7f3d0" stroke="#059669" stroke-width="2.5" fill-opacity="0.6"/><circle cx="490" cy="225" r="45" fill="#fde68a" stroke="#d97706" stroke-width="2.5" fill-opacity="0.5"/><text x="490" y="140" font-size="15" text-anchor="middle" fill="#059669" font-weight="bold">Pens</text><text x="570" y="175" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold">Books</text><text x="448" y="268" font-size="15" text-anchor="end" fill="#d97706" font-weight="bold">Cups</text><text x="10" y="320" font-size="15" text-anchor="start" fill="#059669" font-weight="bold">(I) Some cups are books: true in both diagrams, so it follows.</text><text x="10" y="346" font-size="15" text-anchor="start" fill="#dc2626" font-weight="bold">(II) Some pens are cups: false in Diagram 1, so it does not follow.</text><text x="10" y="372" font-size="15" text-anchor="start" fill="#dc2626" font-weight="bold">(III) All pens are cups: false in both diagrams, so it does not follow.</text><text x="10" y="26" font-size="15" text-anchor="start" fill="#6b7280">All pens are books. Some books are cups.</text>
</svg>
