<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 345" font-family="Arial, Helvetica, sans-serif">
<polygon points="70,108 70,270 286,270" fill="#eff6ff" stroke="#1f2937" stroke-width="2.5"/><polyline points="70,254 86,254 86,270" fill="none" stroke="#1f2937" stroke-width="2"/><text x="56" y="194" font-size="17" text-anchor="end" fill="#2563eb" font-weight="bold">9</text><text x="178" y="298" font-size="17" text-anchor="middle" fill="#2563eb" font-weight="bold">12</text><text x="200" y="181" font-size="17" text-anchor="start" fill="#dc2626" font-weight="bold">15</text><text x="56" y="276" font-size="15" text-anchor="end" fill="#1f2937" font-weight="bold">B</text><text x="56" y="104" font-size="15" text-anchor="end" fill="#1f2937" font-weight="bold">A</text><text x="294" y="290" font-size="15" text-anchor="start" fill="#1f2937" font-weight="bold">C</text><text x="80" y="24" font-size="15" text-anchor="start" fill="#6b7280">Right angle at B; the hypotenuse AC is opposite it</text><text x="355" y="110" font-size="17" text-anchor="start" fill="#1f2937" font-weight="bold">9² + 12² = 15²</text>
<text x="355" y="138" font-size="17" text-anchor="start" fill="#1f2937" font-weight="bold">81 + 144 = 225</text>
<text x="355" y="166" font-size="17" text-anchor="start" fill="#1f2937" font-weight="bold">so the hypotenuse is 15</text><text x="355" y="210" font-size="15" text-anchor="start" fill="#6b7280">9-12-15 is the 3-4-5 triple</text>
<text x="355" y="232" font-size="15" text-anchor="start" fill="#6b7280">multiplied by 3.</text><text x="10" y="330" font-size="14" text-anchor="start" fill="#6b7280">Lengths in the same unit; schematic, not to scale.</text>
