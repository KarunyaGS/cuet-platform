<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 494" font-family="Arial, Helvetica, sans-serif">
<text x="320" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Assisted reproductive technologies: who goes where</text><rect x="20" y="46" width="280" height="60" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.1"/><text x="160" y="71.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">IVF in the laboratory</text><text x="160" y="90.5" font-size="14" fill="#1f2937" text-anchor="middle">ova + sperms form a zygote</text><rect x="340" y="46" width="280" height="60" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.1"/><text x="480" y="71.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">ICSI in the laboratory</text><text x="480" y="90.5" font-size="14" fill="#1f2937" text-anchor="middle">one sperm injected into an ovum</text><line x1="160" y1="108" x2="250.78" y2="146.13" stroke="#2563eb" stroke-width="2"/><polygon points="260,150 247.53,151.27 252.18,140.21" fill="#2563eb"/><line x1="480" y1="108" x2="389.22" y2="146.13" stroke="#2563eb" stroke-width="2"/><polygon points="380,150 387.82,140.21 392.47,151.27" fill="#2563eb"/><rect x="190" y="152" width="260" height="56" rx="8" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.12"/><text x="320" y="175.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Zygote or early embryo</text><text x="320" y="194.5" font-size="14" fill="#1f2937" text-anchor="middle">count the blastomeres</text><line x1="250" y1="210" x2="168.9" y2="251.45" stroke="#059669" stroke-width="2"/><polygon points="160,256 167.06,245.65 172.53,256.34" fill="#059669"/><line x1="390" y1="210" x2="471.1" y2="251.45" stroke="#059669" stroke-width="2"/><polygon points="480,256 467.47,256.34 472.94,245.65" fill="#059669"/><rect x="20" y="258" width="280" height="70" rx="8" fill="#d97706" stroke="#d97706" stroke-width="2" fill-opacity="0.12"/><text x="160" y="288.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">8 blastomeres or fewer</text><text x="160" y="307.5" font-size="14" fill="#1f2937" text-anchor="middle">ZIFT: into the fallopian tube</text><rect x="340" y="258" width="280" height="70" rx="8" fill="#d97706" stroke="#d97706" stroke-width="2" fill-opacity="0.12"/><text x="480" y="288.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">More than 8 blastomeres</text><text x="480" y="307.5" font-size="14" fill="#1f2937" text-anchor="middle">IUT: into the uterus</text><line x1="20" y1="356" x2="620" y2="356" stroke="#e5e7eb" stroke-width="2"/><text x="320" y="384" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold">Fertilisation takes place inside the body</text><rect x="20" y="398" width="280" height="76" rx="8" fill="#dc2626" stroke="#dc2626" stroke-width="2" fill-opacity="0.08"/><text x="160" y="422" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">GIFT</text><text x="160" y="441" font-size="14" fill="#1f2937" text-anchor="middle">donor ovum placed in the</text><text x="160" y="460" font-size="14" fill="#1f2937" text-anchor="middle">fallopian tube</text><rect x="340" y="398" width="280" height="76" rx="8" fill="#dc2626" stroke="#dc2626" stroke-width="2" fill-opacity="0.08"/><text x="480" y="431.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">IUI</text><text x="480" y="450.5" font-size="14" fill="#1f2937" text-anchor="middle">semen placed in the uterus</text>
</svg>
