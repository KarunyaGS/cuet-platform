<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 535" font-family="Arial, Helvetica, sans-serif">
<text x="155" y="18" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Biomass, land (upright)</text><rect x="214.4" y="36" width="35.2" height="34" rx="3" fill="#dc2626" stroke="#dc2626" stroke-width="2" fill-opacity="0.2"/><text x="148" y="58" font-size="14" fill="#1f2937" text-anchor="end">Secondary carnivores</text><rect x="196.8" y="76" width="70.4" height="34" rx="3" fill="#d97706" stroke="#d97706" stroke-width="2" fill-opacity="0.2"/><text x="148" y="98" font-size="14" fill="#1f2937" text-anchor="end">Primary carnivores</text><rect x="177" y="116" width="110" height="34" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.2"/><text x="148" y="138" font-size="14" fill="#1f2937" text-anchor="end">Herbivores</text><rect x="157.2" y="156" width="149.6" height="34" rx="3" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.2"/><text x="148" y="178" font-size="14" fill="#1f2937" text-anchor="end">Producers</text><text x="155" y="208" font-size="14" fill="#6b7280" text-anchor="middle">10 000, 1 000, 100, 10 kg per ha</text><text x="475" y="18" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Biomass, sea (inverted)</text><rect x="477.2" y="36" width="149.6" height="34" rx="3" fill="#dc2626" stroke="#dc2626" stroke-width="2" fill-opacity="0.2"/><text x="468" y="58" font-size="14" fill="#1f2937" text-anchor="end">Fish</text><rect x="497" y="76" width="110" height="34" rx="3" fill="#d97706" stroke="#d97706" stroke-width="2" fill-opacity="0.2"/><text x="468" y="98" font-size="14" fill="#1f2937" text-anchor="end">Zooplankton</text><rect x="530" y="116" width="44" height="34" rx="3" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.2"/><text x="468" y="138" font-size="14" fill="#1f2937" text-anchor="end">Phytoplankton</text><text x="475" y="208" font-size="14" fill="#6b7280" text-anchor="middle">schematic: small standing crop of algae</text><text x="155" y="268" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Number, one tree (spindle)</text><rect x="210" y="286" width="44" height="34" rx="3" fill="#dc2626" stroke="#dc2626" stroke-width="2" fill-opacity="0.2"/><text x="148" y="308" font-size="14" fill="#1f2937" text-anchor="end">Birds</text><rect x="157.2" y="326" width="149.6" height="34" rx="3" fill="#d97706" stroke="#d97706" stroke-width="2" fill-opacity="0.2"/><text x="148" y="348" font-size="14" fill="#1f2937" text-anchor="end">Caterpillars</text><rect x="223.2" y="366" width="17.6" height="34" rx="3" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.2"/><text x="148" y="388" font-size="14" fill="#1f2937" text-anchor="end">Tree</text><text x="155" y="458" font-size="14" fill="#6b7280" text-anchor="middle">1 tree, 5 000 caterpillars, 40 birds</text><text x="475" y="268" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Energy (always upright)</text><rect x="534.4" y="286" width="35.2" height="34" rx="3" fill="#dc2626" stroke="#dc2626" stroke-width="2" fill-opacity="0.2"/><text x="468" y="308" font-size="14" fill="#1f2937" text-anchor="end">Secondary carnivores</text><rect x="516.8" y="326" width="70.4" height="34" rx="3" fill="#d97706" stroke="#d97706" stroke-width="2" fill-opacity="0.2"/><text x="468" y="348" font-size="14" fill="#1f2937" text-anchor="end">Primary carnivores</text><rect x="497" y="366" width="110" height="34" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.2"/><text x="468" y="388" font-size="14" fill="#1f2937" text-anchor="end">Herbivores</text><rect x="477.2" y="406" width="149.6" height="34" rx="3" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.2"/><text x="468" y="428" font-size="14" fill="#1f2937" text-anchor="end">Producers</text><text x="475" y="458" font-size="14" fill="#6b7280" text-anchor="middle">less energy at each higher level</text><text x="320" y="520" font-size="14" fill="#6b7280" text-anchor="middle">Bar widths are schematic, not to scale.</text>
</svg>
