<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Arial, Helvetica, sans-serif">
<text x="320" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">RNA interference in a transgenic tobacco cell</text><rect x="20" y="48" width="200" height="58" rx="8" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.1"/><text x="120" y="72.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Introduced DNA</text><text x="120" y="91.5" font-size="14" fill="#1f2937" text-anchor="middle">(via Agrobacterium)</text><line x1="222" y1="66" x2="290" y2="66" stroke="#2563eb" stroke-width="2"/><polygon points="300,66 289,72 289,60" fill="#2563eb"/><line x1="222" y1="90" x2="290" y2="90" stroke="#dc2626" stroke-width="2"/><polygon points="300,90 289,96 289,84" fill="#dc2626"/><line x1="300" y1="66" x2="420" y2="66" stroke="#2563eb" stroke-width="3"/><text x="360" y="56" font-size="14" fill="#2563eb" text-anchor="middle">sense RNA</text><line x1="300" y1="90" x2="420" y2="90" stroke="#dc2626" stroke-width="3"/><text x="360" y="112" font-size="14" fill="#dc2626" text-anchor="middle">antisense RNA</text><line x1="450" y1="64" x2="450" y2="92" stroke="#6b7280" stroke-width="1.5"/><line x1="462" y1="64" x2="462" y2="92" stroke="#6b7280" stroke-width="1.5"/><line x1="474" y1="64" x2="474" y2="92" stroke="#6b7280" stroke-width="1.5"/><line x1="486" y1="64" x2="486" y2="92" stroke="#6b7280" stroke-width="1.5"/><line x1="498" y1="64" x2="498" y2="92" stroke="#6b7280" stroke-width="1.5"/><line x1="510" y1="64" x2="510" y2="92" stroke="#6b7280" stroke-width="1.5"/><line x1="522" y1="64" x2="522" y2="92" stroke="#6b7280" stroke-width="1.5"/><line x1="534" y1="64" x2="534" y2="92" stroke="#6b7280" stroke-width="1.5"/><line x1="546" y1="64" x2="546" y2="92" stroke="#6b7280" stroke-width="1.5"/><line x1="558" y1="64" x2="558" y2="92" stroke="#6b7280" stroke-width="1.5"/><line x1="570" y1="64" x2="570" y2="92" stroke="#6b7280" stroke-width="1.5"/><line x1="440" y1="64" x2="580" y2="64" stroke="#2563eb" stroke-width="3"/><line x1="440" y1="92" x2="580" y2="92" stroke="#dc2626" stroke-width="3"/><line x1="420" y1="78" x2="426" y2="78" stroke="#1f2937" stroke-width="2"/><polygon points="436,78 425,84 425,72" fill="#1f2937"/><text x="510" y="52" font-size="14" fill="#1f2937" text-anchor="middle">double-stranded RNA</text><text x="510" y="120" font-size="14" fill="#6b7280" text-anchor="middle">(complementary strands pair)</text><line x1="510" y1="126" x2="510" y2="168" stroke="#1f2937" stroke-width="2"/><polygon points="510,178 504,167 516,167" fill="#1f2937"/><text x="500" y="160" font-size="14" fill="#1f2937" text-anchor="end">binds</text><line x1="300" y1="205" x2="600" y2="205" stroke="#059669" stroke-width="3"/><text x="300" y="256" font-size="14" fill="#059669" text-anchor="start">nematode-specific mRNA (the target)</text><path d="M472,192 L492,226 M492,192 L472,226" stroke="#dc2626" stroke-width="4" fill="none"/><rect x="20" y="270" width="280" height="60" rx="8" fill="#dc2626" stroke="#dc2626" stroke-width="2" fill-opacity="0.1"/><text x="160" y="295.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">mRNA silenced</text><text x="160" y="314.5" font-size="14" fill="#1f2937" text-anchor="middle">translation blocked</text><line x1="302" y1="300" x2="328" y2="300" stroke="#1f2937" stroke-width="2"/><polygon points="338,300 327,306 327,294" fill="#1f2937"/><rect x="340" y="270" width="280" height="60" rx="8" fill="#d97706" stroke="#d97706" stroke-width="2" fill-opacity="0.12"/><text x="480" y="295.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">No protein made</text><text x="480" y="314.5" font-size="14" fill="#1f2937" text-anchor="middle">parasite cannot survive</text><text x="320" y="362" font-size="14" fill="#6b7280" text-anchor="middle">Schematic. Strands drawn as plain lines, not to scale.</text>
</svg>
