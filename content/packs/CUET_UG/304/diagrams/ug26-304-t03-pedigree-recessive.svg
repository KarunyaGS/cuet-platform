<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="Arial, Helvetica, sans-serif">
<text x="320.0" y="28.0" font-size="17" text-anchor="middle" fill="#1f2937" font-weight="bold">Pedigree symbols</text>
<rect x="43.0" y="53.0" width="34.0" height="34.0" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<text x="88.0" y="76.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="normal">male</text>
<circle cx="170.0" cy="70.0" r="18.0" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<text x="198.0" y="76.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="normal">female</text>
<circle cx="300.0" cy="70.0" r="18.0" fill="#1f2937" stroke="#1f2937" stroke-width="2.5"/>
<text x="328.0" y="76.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="normal">affected</text>
<rect x="413.0" y="53.0" width="34.0" height="34.0" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<circle cx="480.0" cy="70.0" r="18.0" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<line x1="447.0" y1="70.0" x2="462.0" y2="70.0" stroke="#1f2937" stroke-width="2.5"/>
<text x="505.0" y="76.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="normal">mating</text>
<line x1="20.0" y1="110.0" x2="620.0" y2="110.0" stroke="#e5e7eb" stroke-width="2"/>
<text x="320.0" y="140.0" font-size="17" text-anchor="middle" fill="#1f2937" font-weight="bold">Example: two unaffected parents</text>
<rect x="203.0" y="183.0" width="34.0" height="34.0" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<circle cx="420.0" cy="200.0" r="18.0" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<line x1="237.0" y1="200.0" x2="402.0" y2="200.0" stroke="#1f2937" stroke-width="2.5"/>
<text x="20.0" y="206.0" font-size="17" text-anchor="start" fill="#6b7280" font-weight="bold">I</text>
<text x="220.0" y="245.0" font-size="16" text-anchor="middle" fill="#059669" font-weight="bold">Aa</text>
<text x="420.0" y="245.0" font-size="16" text-anchor="middle" fill="#059669" font-weight="bold">Aa</text>
<text x="220.0" y="262.0" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="normal">carrier</text>
<text x="420.0" y="262.0" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="normal">carrier</text>
<line x1="320.0" y1="200.0" x2="320.0" y2="300.0" stroke="#1f2937" stroke-width="2.5"/>
<line x1="160.0" y1="300.0" x2="480.0" y2="300.0" stroke="#1f2937" stroke-width="2.5"/>
<line x1="160.0" y1="300.0" x2="160.0" y2="330.0" stroke="#1f2937" stroke-width="2.5"/>
<circle cx="160.0" cy="348.0" r="18.0" fill="#1f2937" stroke="#1f2937" stroke-width="2.5"/>
<line x1="320.0" y1="300.0" x2="320.0" y2="330.0" stroke="#1f2937" stroke-width="2.5"/>
<rect x="303.0" y="331.0" width="34.0" height="34.0" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<line x1="480.0" y1="300.0" x2="480.0" y2="330.0" stroke="#1f2937" stroke-width="2.5"/>
<circle cx="480.0" cy="348.0" r="18.0" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<text x="20.0" y="354.0" font-size="17" text-anchor="start" fill="#6b7280" font-weight="bold">II</text>
<text x="160.0" y="392.0" font-size="16" text-anchor="middle" fill="#dc2626" font-weight="bold">aa</text>
<text x="160.0" y="410.0" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="normal">affected</text>
<text x="320.0" y="392.0" font-size="16" text-anchor="middle" fill="#059669" font-weight="bold">AA or Aa</text>
<text x="320.0" y="410.0" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="normal">unaffected</text>
<text x="480.0" y="392.0" font-size="16" text-anchor="middle" fill="#059669" font-weight="bold">AA or Aa</text>
<text x="480.0" y="410.0" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="normal">unaffected</text>
<text x="320.0" y="452.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="normal">Two unaffected parents have an affected child (a daughter).</text>
<text x="320.0" y="476.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="normal">So the trait is recessive, and both parents are carriers (Aa).</text>
<text x="320.0" y="500.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="normal">An affected daughter also rules out an X-linked recessive trait</text>
<text x="320.0" y="522.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="normal">(her father is unaffected), so it is autosomal.</text>
</svg>
