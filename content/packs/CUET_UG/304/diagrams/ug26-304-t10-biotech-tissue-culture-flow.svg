<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 422" font-family="Arial, Helvetica, sans-serif">
<text x="320" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Micropropagation by tissue culture</text><rect x="40" y="46" width="560" height="54" rx="8" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.1"/><text x="320" y="68.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Explant</text><text x="320" y="87.5" font-size="14" fill="#1f2937" text-anchor="middle">small piece of plant, for example a meristem</text><line x1="320" y1="103" x2="320" y2="117" stroke="#1f2937" stroke-width="2"/><polygon points="320,127 314,116 326,116" fill="#1f2937"/><rect x="40" y="130" width="560" height="54" rx="8" fill="#d97706" stroke="#d97706" stroke-width="2" fill-opacity="0.1"/><text x="320" y="152.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Callus</text><text x="320" y="171.5" font-size="14" fill="#1f2937" text-anchor="middle">unorganised mass of cells on sterile medium</text><line x1="320" y1="187" x2="320" y2="201" stroke="#1f2937" stroke-width="2"/><polygon points="320,211 314,200 326,200" fill="#1f2937"/><rect x="40" y="214" width="560" height="54" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.1"/><text x="320" y="236.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Shoots and roots form</text><text x="320" y="255.5" font-size="14" fill="#1f2937" text-anchor="middle">change the auxin : cytokinin ratio</text><line x1="320" y1="271" x2="320" y2="285" stroke="#1f2937" stroke-width="2"/><polygon points="320,295 314,284 326,284" fill="#1f2937"/><rect x="40" y="298" width="560" height="54" rx="8" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.1"/><text x="320" y="320.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Plantlets, hardened, moved to soil</text><text x="320" y="339.5" font-size="14" fill="#1f2937" text-anchor="middle">many identical plants (clones)</text><text x="320" y="386" font-size="14" fill="#6b7280" text-anchor="middle">Medium: sucrose, mineral salts, vitamins, amino acids, auxin and cytokinin.</text><text x="320" y="406" font-size="14" fill="#6b7280" text-anchor="middle">Works because plant cells are totipotent.</text>
</svg>
