<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" font-family="Arial, Helvetica, sans-serif">
<rect x="8" y="10" width="624" height="128" rx="10" fill="#e5e7eb" stroke="#e5e7eb" stroke-width="2" fill-opacity="0.35"/><text x="20" y="30" font-size="14" fill="#6b7280" text-anchor="start" font-weight="bold">Primary treatment: physical</text><rect x="8" y="152" width="624" height="290" rx="10" fill="#e5e7eb" stroke="#e5e7eb" stroke-width="2" fill-opacity="0.35"/><text x="20" y="172" font-size="14" fill="#6b7280" text-anchor="start" font-weight="bold">Secondary treatment: biological</text><rect x="20" y="48" width="170" height="56" rx="8" fill="#d97706" stroke="#d97706" stroke-width="2" fill-opacity="0.12"/><text x="105" y="71.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Raw sewage</text><text x="105" y="90.5" font-size="14" fill="#1f2937" text-anchor="middle">waste water in</text><rect x="235" y="48" width="170" height="56" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.1"/><text x="320" y="71.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Filtration</text><text x="320" y="90.5" font-size="14" fill="#1f2937" text-anchor="middle">floating debris out</text><rect x="450" y="48" width="160" height="56" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.1"/><text x="530" y="71.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Sedimentation</text><text x="530" y="90.5" font-size="14" fill="#1f2937" text-anchor="middle">grit settles</text><line x1="193" y1="76" x2="223" y2="76" stroke="#1f2937" stroke-width="2"/><polygon points="233,76 222,82 222,70" fill="#1f2937"/><line x1="408" y1="76" x2="438" y2="76" stroke="#1f2937" stroke-width="2"/><polygon points="448,76 437,82 437,70" fill="#1f2937"/><line x1="535" y1="106" x2="535" y2="190" stroke="#1f2937" stroke-width="2"/><polygon points="535,200 529,189 541,189" fill="#1f2937"/><text x="527" y="132" font-size="14" fill="#1f2937" text-anchor="end">primary effluent</text><rect x="450" y="198" width="160" height="56" rx="8" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.12"/><text x="530" y="221.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Aeration tank</text><text x="530" y="240.5" font-size="14" fill="#1f2937" text-anchor="middle">air, flocs, BOD falls</text><rect x="235" y="198" width="170" height="56" rx="8" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.12"/><text x="320" y="221.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Settling tank</text><text x="320" y="240.5" font-size="14" fill="#1f2937" text-anchor="middle">flocs settle</text><rect x="20" y="198" width="170" height="56" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.1"/><text x="105" y="221.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Treated effluent</text><text x="105" y="240.5" font-size="14" fill="#1f2937" text-anchor="middle">to river or stream</text><line x1="448" y1="226" x2="418" y2="226" stroke="#1f2937" stroke-width="2"/><polygon points="408,226 419,220 419,232" fill="#1f2937"/><line x1="233" y1="226" x2="203" y2="226" stroke="#1f2937" stroke-width="2"/><polygon points="193,226 204,220 204,232" fill="#1f2937"/><line x1="290" y1="256" x2="290" y2="350" stroke="#1f2937" stroke-width="2"/><polygon points="290,360 284,349 296,349" fill="#1f2937"/><text x="282" y="318" font-size="14" fill="#1f2937" text-anchor="end">activated sludge,</text><text x="282" y="337" font-size="14" fill="#1f2937" text-anchor="end">major part</text><rect x="235" y="362" width="170" height="56" rx="8" fill="#d97706" stroke="#d97706" stroke-width="2" fill-opacity="0.12"/><text x="320" y="385.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Anaerobic digester</text><text x="320" y="404.5" font-size="14" fill="#1f2937" text-anchor="middle">sludge digested</text><line x1="408" y1="390" x2="438" y2="390" stroke="#1f2937" stroke-width="2"/><polygon points="448,390 437,396 437,384" fill="#1f2937"/><rect x="450" y="362" width="160" height="56" rx="8" fill="#dc2626" stroke="#dc2626" stroke-width="2" fill-opacity="0.1"/><text x="530" y="385.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Biogas</text><text x="530" y="404.5" font-size="14" fill="#1f2937" text-anchor="middle">CH4, H2S, CO2</text><line x1="360" y1="256" x2="360" y2="300" stroke="#059669" stroke-width="2"/><line x1="360" y1="300" x2="535" y2="300" stroke="#059669" stroke-width="2"/><line x1="535" y1="300" x2="535" y2="268" stroke="#059669" stroke-width="2"/><polygon points="535,258 541,269 529,269" fill="#059669"/><text x="447" y="322" font-size="14" fill="#059669" text-anchor="middle">small part: inoculum</text>
