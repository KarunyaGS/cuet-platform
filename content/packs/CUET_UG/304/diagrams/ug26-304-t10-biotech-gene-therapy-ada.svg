<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 428" font-family="Arial, Helvetica, sans-serif">
<text x="320" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Gene therapy for ADA deficiency</text><rect x="30" y="44" width="350" height="52" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.1"/><text x="205" y="75" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Lymphocytes taken from the patient's blood</text><line x1="205" y1="99" x2="205" y2="109" stroke="#1f2937" stroke-width="2"/><polygon points="205,119 199,108 211,108" fill="#1f2937"/><rect x="30" y="122" width="350" height="52" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.1"/><text x="205" y="153" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Grown in culture outside the body</text><line x1="205" y1="177" x2="205" y2="187" stroke="#1f2937" stroke-width="2"/><polygon points="205,197 199,186 211,186" fill="#1f2937"/><rect x="30" y="200" width="350" height="52" rx="8" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.1"/><text x="205" y="221.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Functional ADA cDNA inserted</text><text x="205" y="240.5" font-size="14" fill="#1f2937" text-anchor="middle">using a retroviral vector</text><line x1="205" y1="255" x2="205" y2="265" stroke="#1f2937" stroke-width="2"/><polygon points="205,275 199,264 211,264" fill="#1f2937"/><rect x="30" y="278" width="350" height="52" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.1"/><text x="205" y="309" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Engineered lymphocytes returned to the patient</text><line x1="205" y1="333" x2="205" y2="343" stroke="#1f2937" stroke-width="2"/><polygon points="205,353 199,342 211,342" fill="#1f2937"/><rect x="30" y="356" width="350" height="52" rx="8" fill="#d97706" stroke="#d97706" stroke-width="2" fill-opacity="0.1"/><text x="205" y="377.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">These cells are not immortal</text><text x="205" y="396.5" font-size="14" fill="#1f2937" text-anchor="middle">so periodic infusions are needed</text><rect x="405" y="170" width="215" height="104" rx="8" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="7 5"/><text x="512" y="198" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Permanent cure?</text><text x="512" y="217" font-size="14" fill="#1f2937" text-anchor="middle">ADA gene put into</text><text x="512" y="236" font-size="14" fill="#1f2937" text-anchor="middle">cells at an early</text><text x="512" y="255" font-size="14" fill="#1f2937" text-anchor="middle">embryonic stage</text><line x1="405" y1="222" x2="393" y2="222" stroke="#059669" stroke-width="2"/><polygon points="383,222 394,216 394,228" fill="#059669"/>
</svg>
