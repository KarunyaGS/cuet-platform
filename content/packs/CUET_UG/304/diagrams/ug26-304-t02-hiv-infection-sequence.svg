<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="Arial, Helvetica, sans-serif">
<rect x="60.0" y="15.0" width="520.0" height="70.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="320.0" y="45.6" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="normal">HIV (RNA genome, a retrovirus) enters</text>
<text x="320.0" y="65.6" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="normal">a macrophage or a helper T-lymphocyte</text>
<text x="40.0" y="56.0" font-size="18" text-anchor="middle" fill="#6b7280" font-weight="bold">1</text>
<line x1="320.0" y1="85.0" x2="320.0" y2="104.0" stroke="#1f2937" stroke-width="2.5"/>
<polygon points="320.0,113.0 315.0,102.0 325.0,102.0" fill="#1f2937" stroke="none" stroke-width="1"/>
<rect x="60.0" y="113.0" width="520.0" height="70.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="320.0" y="143.6" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="normal">Reverse transcriptase makes viral DNA</text>
<text x="320.0" y="163.6" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="normal">from the viral RNA</text>
<text x="40.0" y="154.0" font-size="18" text-anchor="middle" fill="#6b7280" font-weight="bold">2</text>
<line x1="320.0" y1="183.0" x2="320.0" y2="202.0" stroke="#1f2937" stroke-width="2.5"/>
<polygon points="320.0,211.0 315.0,200.0 325.0,200.0" fill="#1f2937" stroke="none" stroke-width="1"/>
<rect x="60.0" y="211.0" width="520.0" height="70.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="320.0" y="241.6" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="normal">Viral DNA is incorporated into the</text>
<text x="320.0" y="261.6" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="normal">host cell DNA</text>
<text x="40.0" y="252.0" font-size="18" text-anchor="middle" fill="#6b7280" font-weight="bold">3</text>
<line x1="320.0" y1="281.0" x2="320.0" y2="300.0" stroke="#1f2937" stroke-width="2.5"/>
<polygon points="320.0,309.0 315.0,298.0 325.0,298.0" fill="#1f2937" stroke="none" stroke-width="1"/>
<rect x="60.0" y="309.0" width="520.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="320.0" y="339.6" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="normal">Infected cell makes new viral RNA and proteins:</text>
<text x="320.0" y="359.6" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="normal">progeny viruses are released</text>
<text x="40.0" y="350.0" font-size="18" text-anchor="middle" fill="#6b7280" font-weight="bold">4</text>
<line x1="320.0" y1="379.0" x2="320.0" y2="398.0" stroke="#1f2937" stroke-width="2.5"/>
<polygon points="320.0,407.0 315.0,396.0 325.0,396.0" fill="#1f2937" stroke="none" stroke-width="1"/>
<rect x="60.0" y="407.0" width="520.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="320.0" y="437.6" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="normal">Progeny viruses attack more helper T cells;</text>
<text x="320.0" y="457.6" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="normal">macrophages keep producing virus (HIV factory)</text>
<text x="40.0" y="448.0" font-size="18" text-anchor="middle" fill="#6b7280" font-weight="bold">5</text>
<line x1="320.0" y1="477.0" x2="320.0" y2="496.0" stroke="#1f2937" stroke-width="2.5"/>
<polygon points="320.0,505.0 315.0,494.0 325.0,494.0" fill="#1f2937" stroke="none" stroke-width="1"/>
<rect x="60.0" y="505.0" width="520.0" height="70.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="320.0" y="535.6" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="normal">Helper T cell number falls progressively:</text>
<text x="320.0" y="555.6" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="normal">immune deficiency (AIDS)</text>
<text x="40.0" y="546.0" font-size="18" text-anchor="middle" fill="#6b7280" font-weight="bold">6</text>
<text x="320.0" y="632.0" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="normal">Simplified sequence of HIV infection (schematic)</text>
</svg>
