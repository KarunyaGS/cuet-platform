<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 364" font-family="Arial, Helvetica, sans-serif">
<text x="320" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Bird species in three places, equator to pole</text><text x="40" y="54" font-size="14" fill="#1f2937" text-anchor="start">Colombia (equator, 0 degrees)</text><rect x="40" y="62" width="520" height="40" rx="3" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.25"/><text x="550" y="88" font-size="14" fill="#059669" text-anchor="end" font-weight="bold">about 1400</text><text x="40" y="146" font-size="14" fill="#1f2937" text-anchor="start">New York (41 degrees N)</text><rect x="40" y="154" width="39" height="40" rx="3" fill="#d97706" stroke="#d97706" stroke-width="2" fill-opacity="0.25"/><text x="89" y="180" font-size="14" fill="#d97706" text-anchor="start" font-weight="bold">about 105</text><text x="40" y="238" font-size="14" fill="#1f2937" text-anchor="start">Greenland (71 degrees N)</text><rect x="40" y="246" width="20.8" height="40" rx="3" fill="#dc2626" stroke="#dc2626" stroke-width="2" fill-opacity="0.25"/><text x="70.8" y="272" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold">about 56</text><text x="320" y="344" font-size="14" fill="#6b7280" text-anchor="middle">Bar length is proportional to the number of bird species (linear scale).</text>
</svg>
