<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 550" width="640" height="550" font-family="Arial, Helvetica, sans-serif">
<text x="160.0" y="30.0" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">Male</text>
<text x="480.0" y="30.0" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">Female</text>
<rect x="25.0" y="55.0" width="270.0" height="80.0" rx="8" fill="#fee2e2" stroke="#1f2937" stroke-width="2"/>
<text x="160.0" y="90.9" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">Pollen mother cell (PMC)</text>
<text x="160.0" y="109.6" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">2n</text>
<rect x="25.0" y="215.0" width="270.0" height="80.0" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
<text x="160.0" y="250.9" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">Microspore tetrad</text>
<text x="160.0" y="269.6" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">4 microspores, n each</text>
<rect x="25.0" y="375.0" width="270.0" height="80.0" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
<text x="160.0" y="410.9" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">Pollen grain</text>
<text x="160.0" y="429.6" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">vegetative + generative cell, n</text>
<line x1="160.0" y1="135.0" x2="160.0" y2="204.0" stroke="#1f2937" stroke-width="2"/>
<polygon points="160.0,213.0 155.0,202.0 165.0,202.0" fill="#1f2937" stroke="none" stroke-width="1"/>
<text x="172.0" y="173.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">meiosis</text>
<line x1="160.0" y1="295.0" x2="160.0" y2="364.0" stroke="#1f2937" stroke-width="2"/>
<polygon points="160.0,373.0 155.0,362.0 165.0,362.0" fill="#1f2937" stroke="none" stroke-width="1"/>
<text x="172.0" y="333.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">mitosis in each</text>
<text x="172.0" y="350.5" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">microspore</text>
<rect x="345.0" y="55.0" width="270.0" height="80.0" rx="8" fill="#fee2e2" stroke="#1f2937" stroke-width="2"/>
<text x="480.0" y="90.9" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">Megaspore mother cell (MMC)</text>
<text x="480.0" y="109.6" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">2n</text>
<rect x="345.0" y="215.0" width="270.0" height="80.0" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
<text x="480.0" y="250.9" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">4 megaspores, n each</text>
<text x="480.0" y="269.6" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">1 functional, 3 degenerate</text>
<rect x="345.0" y="375.0" width="270.0" height="80.0" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
<text x="480.0" y="410.9" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">Embryo sac</text>
<text x="480.0" y="429.6" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">7 cells, 8 nuclei, n</text>
<line x1="480.0" y1="135.0" x2="480.0" y2="204.0" stroke="#1f2937" stroke-width="2"/>
<polygon points="480.0,213.0 475.0,202.0 485.0,202.0" fill="#1f2937" stroke="none" stroke-width="1"/>
<text x="492.0" y="173.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">meiosis</text>
<line x1="480.0" y1="295.0" x2="480.0" y2="364.0" stroke="#1f2937" stroke-width="2"/>
<polygon points="480.0,373.0 475.0,362.0 485.0,362.0" fill="#1f2937" stroke="none" stroke-width="1"/>
<text x="492.0" y="333.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">3 free-nuclear</text>
<text x="492.0" y="350.5" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">mitoses (1 &gt; 2 &gt; 4 &gt; 8)</text>
<rect x="190.0" y="478.0" width="14.0" height="14.0" rx="0" fill="#fee2e2" stroke="#1f2937" stroke-width="1.5"/>
<text x="210.0" y="490.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">diploid (2n)</text>
<rect x="340.0" y="478.0" width="14.0" height="14.0" rx="0" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
<text x="360.0" y="490.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">haploid (n)</text>
<text x="320.0" y="527.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="normal">One PMC &gt; 4 pollen grains; one MMC &gt; 1 embryo sac</text>
</svg>
