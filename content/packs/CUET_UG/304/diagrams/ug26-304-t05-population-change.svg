<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" font-family="Arial, Helvetica, sans-serif">
<rect x="240.0" y="150.0" width="200.0" height="100.0" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/>
<text x="340.0" y="190.0" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">Population</text>
<text x="340.0" y="218.0" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">density N(t)</text>
<line x1="340.0" y1="55.0" x2="340.0" y2="139.0" stroke="#059669" stroke-width="3.5"/>
<polygon points="340.0,148.0 335.0,137.0 345.0,137.0" fill="#059669" stroke="none" stroke-width="1"/>
<text x="340.0" y="35.0" font-size="16" text-anchor="middle" fill="#059669" font-weight="bold">Births (B)</text>
<line x1="60.0" y1="200.0" x2="229.0" y2="200.0" stroke="#059669" stroke-width="3.5"/>
<polygon points="238.0,200.0 227.0,205.0 227.0,195.0" fill="#059669" stroke="none" stroke-width="1"/>
<text x="150.0" y="185.0" font-size="15" text-anchor="middle" fill="#059669" font-weight="bold">Immigration (I)</text>
<line x1="442.0" y1="200.0" x2="631.0" y2="200.0" stroke="#dc2626" stroke-width="3.5"/>
<polygon points="640.0,200.0 629.0,205.0 629.0,195.0" fill="#dc2626" stroke="none" stroke-width="1"/>
<text x="540.0" y="185.0" font-size="15" text-anchor="middle" fill="#dc2626" font-weight="bold">Emigration (E)</text>
<line x1="340.0" y1="252.0" x2="340.0" y2="341.0" stroke="#dc2626" stroke-width="3.5"/>
<polygon points="340.0,350.0 335.0,339.0 345.0,339.0" fill="#dc2626" stroke="none" stroke-width="1"/>
<text x="340.0" y="375.0" font-size="16" text-anchor="middle" fill="#dc2626" font-weight="bold">Deaths (D)</text>
<text x="340.0" y="430.0" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">N(t+1) = N(t) + [ (B + I) - (D + E) ]</text>
<text x="340.0" y="455.0" font-size="14" text-anchor="middle" fill="#6b7280" font-weight="normal">gains: births and immigration (green).  losses: deaths and emigration (red).</text>
</svg>
