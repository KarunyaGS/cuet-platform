<text x="150.0" y="290.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">2 XX (girls) : 2 XY (boys)</text>
<text x="150.0" y="314.0" font-size="16" text-anchor="middle" fill="#2563eb" font-weight="bold">sex ratio 1 : 1</text>
<text x="480.0" y="290.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">2 ZZ (males) : 2 ZW (females)</text>
<text x="480.0" y="314.0" font-size="16" text-anchor="middle" fill="#2563eb" font-weight="bold">sex ratio 1 : 1</text>
<text x="150.0" y="356.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">Male is heterogametic:</text>
<text x="150.0" y="376.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">sperm are X or Y</text>
<text x="480.0" y="356.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">Female is heterogametic:</text>
<text x="480.0" y="376.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">eggs are Z or W</text>
<rect x="215.0" y="420.0" width="18.0" height="18.0" rx="0" fill="#fee2e2" stroke="#1f2937" stroke-width="1.5"/>
