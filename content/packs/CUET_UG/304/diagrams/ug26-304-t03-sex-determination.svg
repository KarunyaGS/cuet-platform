<rect x="340.0" y="420.0" width="18.0" height="18.0" rx="0" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
<text x="365.0" y="435.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="normal">male</text>
<text x="340.0" y="468.0" font-size="14" text-anchor="middle" fill="#6b7280" font-weight="normal">The heterogametic parent decides the sex of the offspring.</text>
