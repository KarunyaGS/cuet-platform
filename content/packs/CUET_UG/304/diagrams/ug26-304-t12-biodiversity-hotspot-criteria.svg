<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" font-family="Arial, Helvetica, sans-serif">
<text x="320" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">What makes a biodiversity hotspot</text><rect x="20" y="50" width="190" height="66" rx="8" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.1"/><text x="115" y="78.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Very high</text><text x="115" y="97.5" font-size="14" fill="#1f2937" text-anchor="middle">species richness</text><line x1="115" y1="119" x2="231.3" y2="185.06" stroke="#059669" stroke-width="2"/><polygon points="240,190 227.47,189.78 233.4,179.35" fill="#059669"/><rect x="225" y="50" width="190" height="66" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.1"/><text x="320" y="78.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">High endemism</text><text x="320" y="97.5" font-size="14" fill="#1f2937" text-anchor="middle">species found nowhere else</text><line x1="320" y1="119" x2="320" y2="180" stroke="#2563eb" stroke-width="2"/><polygon points="320,190 314,179 326,179" fill="#2563eb"/><rect x="430" y="50" width="190" height="66" rx="8" fill="#dc2626" stroke="#dc2626" stroke-width="2" fill-opacity="0.1"/><text x="525" y="78.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Accelerating</text><text x="525" y="97.5" font-size="14" fill="#1f2937" text-anchor="middle">habitat loss</text><line x1="525" y1="119" x2="408.7" y2="185.06" stroke="#dc2626" stroke-width="2"/><polygon points="400,190 406.6,179.35 412.53,189.78" fill="#dc2626"/><rect x="190" y="192" width="260" height="70" rx="8" fill="#d97706" stroke="#d97706" stroke-width="2" fill-opacity="0.18"/><text x="320" y="222.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Biodiversity hotspot</text><text x="320" y="241.5" font-size="14" fill="#1f2937" text-anchor="middle">all three conditions together</text><text x="320" y="296" font-size="14" fill="#1f2937" text-anchor="middle">34 hotspots in the world (NCERT figure). Three cover India:</text><text x="320" y="319" font-size="14" fill="#1f2937" text-anchor="middle">Western Ghats and Sri Lanka, Indo-Burma, Himalaya.</text><text x="320" y="352" font-size="14" fill="#6b7280" text-anchor="middle">Concept diagram: no map, no scale.</text>
</svg>
