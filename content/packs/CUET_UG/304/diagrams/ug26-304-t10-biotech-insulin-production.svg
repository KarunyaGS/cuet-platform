<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="Arial, Helvetica, sans-serif">
<text x="320" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Making human insulin in E. coli (rDNA insulin, Humulin)</text><rect x="30" y="46" width="260" height="54" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.1"/><text x="160" y="68.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">DNA sequence for chain A</text><text x="160" y="87.5" font-size="14" fill="#1f2937" text-anchor="middle">(prepared separately)</text><line x1="160" y1="103" x2="160" y2="116" stroke="#1f2937" stroke-width="2"/><polygon points="160,126 154,115 166,115" fill="#1f2937"/><rect x="30" y="128" width="260" height="54" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.1"/><text x="160" y="150.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Inserted into a plasmid</text><text x="160" y="169.5" font-size="14" fill="#1f2937" text-anchor="middle">of E. coli</text><line x1="160" y1="185" x2="160" y2="198" stroke="#1f2937" stroke-width="2"/><polygon points="160,208 154,197 166,197" fill="#1f2937"/><rect x="30" y="210" width="260" height="54" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.1"/><text x="160" y="232.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">E. coli makes chain A</text><text x="160" y="251.5" font-size="14" fill="#1f2937" text-anchor="middle">21 amino acids</text><rect x="350" y="46" width="260" height="54" rx="8" fill="#d97706" stroke="#d97706" stroke-width="2" fill-opacity="0.1"/><text x="480" y="68.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">DNA sequence for chain B</text><text x="480" y="87.5" font-size="14" fill="#1f2937" text-anchor="middle">(prepared separately)</text><line x1="480" y1="103" x2="480" y2="116" stroke="#1f2937" stroke-width="2"/><polygon points="480,126 474,115 486,115" fill="#1f2937"/><rect x="350" y="128" width="260" height="54" rx="8" fill="#d97706" stroke="#d97706" stroke-width="2" fill-opacity="0.1"/><text x="480" y="150.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Inserted into a plasmid</text><text x="480" y="169.5" font-size="14" fill="#1f2937" text-anchor="middle">of E. coli</text><line x1="480" y1="185" x2="480" y2="198" stroke="#1f2937" stroke-width="2"/><polygon points="480,208 474,197 486,197" fill="#1f2937"/><rect x="350" y="210" width="260" height="54" rx="8" fill="#d97706" stroke="#d97706" stroke-width="2" fill-opacity="0.1"/><text x="480" y="232.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">E. coli makes chain B</text><text x="480" y="251.5" font-size="14" fill="#1f2937" text-anchor="middle">30 amino acids</text><line x1="160" y1="267" x2="160" y2="296" stroke="#1f2937" stroke-width="2"/><line x1="160" y1="296" x2="310" y2="296" stroke="#1f2937" stroke-width="2"/><line x1="310" y1="296" x2="310" y2="300" stroke="#1f2937" stroke-width="2"/><polygon points="310,310 304,299 316,299" fill="#1f2937"/><line x1="480" y1="267" x2="480" y2="296" stroke="#1f2937" stroke-width="2"/><line x1="480" y1="296" x2="330" y2="296" stroke="#1f2937" stroke-width="2"/><line x1="330" y1="296" x2="330" y2="300" stroke="#1f2937" stroke-width="2"/><polygon points="330,310 324,299 336,299" fill="#1f2937"/><rect x="80" y="312" width="480" height="54" rx="8" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.1"/><text x="320" y="334.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Chains extracted and joined</text><text x="320" y="353.5" font-size="14" fill="#1f2937" text-anchor="middle">by disulphide bridges</text><line x1="320" y1="369" x2="320" y2="382" stroke="#1f2937" stroke-width="2"/><polygon points="320,392 314,381 326,381" fill="#1f2937"/><rect x="80" y="394" width="480" height="58" rx="8" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.18"/><text x="320" y="418.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Human insulin (Humulin)</text><text x="320" y="437.5" font-size="14" fill="#1f2937" text-anchor="middle">21 + 30 = 51 amino acids, no C peptide</text><text x="320" y="486" font-size="14" fill="#6b7280" text-anchor="middle">In the human body insulin is first made as proinsulin, which has a C peptide.</text><text x="320" y="506" font-size="14" fill="#6b7280" text-anchor="middle">The C peptide is removed during maturation.</text>
</svg>
