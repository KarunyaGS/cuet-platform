<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 438" font-family="Arial, Helvetica, sans-serif">
<text x="320" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Which stage does each contraceptive method act on?</text><text x="227.5" y="56" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Ovulation</text><text x="342.5" y="56" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Sperm reaches</text><text x="342.5" y="74" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">ovum</text><text x="457.5" y="56" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Fertilisation</text><text x="572.5" y="56" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Implantation</text><rect x="20" y="88" width="610" height="50" rx="6" fill="none" stroke="#e5e7eb" stroke-width="2" fill-opacity="0.3"/><text x="28" y="118" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">Natural methods</text><circle cx="227.5" cy="113" r="11" fill="#d97706"/><circle cx="342.5" cy="113" r="11" fill="#2563eb"/><rect x="20" y="146" width="610" height="50" rx="6" fill="#e5e7eb" stroke="#e5e7eb" stroke-width="2" fill-opacity="0.3"/><text x="28" y="176" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">Barrier methods</text><circle cx="342.5" cy="171" r="11" fill="#2563eb"/><rect x="20" y="204" width="610" height="50" rx="6" fill="none" stroke="#e5e7eb" stroke-width="2" fill-opacity="0.3"/><text x="28" y="234" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">IUDs</text><circle cx="342.5" cy="229" r="11" fill="#2563eb"/><circle cx="457.5" cy="229" r="11" fill="#059669"/><circle cx="572.5" cy="229" r="11" fill="#dc2626"/><rect x="20" y="262" width="610" height="50" rx="6" fill="#e5e7eb" stroke="#e5e7eb" stroke-width="2" fill-opacity="0.3"/><text x="28" y="292" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">Pill, injectables</text><circle cx="227.5" cy="287" r="11" fill="#d97706"/><circle cx="342.5" cy="287" r="11" fill="#2563eb"/><circle cx="572.5" cy="287" r="11" fill="#dc2626"/><rect x="20" y="320" width="610" height="50" rx="6" fill="none" stroke="#e5e7eb" stroke-width="2" fill-opacity="0.3"/><text x="28" y="350" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">Surgical (terminal)</text><circle cx="342.5" cy="345" r="11" fill="#2563eb"/><text x="320" y="400" font-size="14" fill="#6b7280" text-anchor="middle">A dot means the lesson says the method acts at that stage.</text><text x="320" y="422" font-size="14" fill="#6b7280" text-anchor="middle">Natural: lactational amenorrhoea stops ovulation; abstinence and withdrawal avoid meeting.</text>
</svg>
