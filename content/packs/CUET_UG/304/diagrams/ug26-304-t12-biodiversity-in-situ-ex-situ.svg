<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="Arial, Helvetica, sans-serif">
<rect x="210" y="16" width="220" height="44" rx="8" fill="#6b7280" stroke="#6b7280" stroke-width="2" fill-opacity="0.1"/><text x="320" y="43" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Conservation of biodiversity</text><line x1="250" y1="62" x2="169.21" y2="96.11" stroke="#059669" stroke-width="2"/><polygon points="160,100 167.8,90.19 172.47,101.25" fill="#059669"/><line x1="390" y1="62" x2="470.79" y2="96.11" stroke="#2563eb" stroke-width="2"/><polygon points="480,100 467.53,101.25 472.2,90.19" fill="#2563eb"/><rect x="20" y="102" width="280" height="66" rx="8" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.12"/><text x="160" y="130.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">In situ (on site)</text><text x="160" y="149.5" font-size="14" fill="#1f2937" text-anchor="middle">whole ecosystem, natural habitat</text><rect x="340" y="102" width="280" height="66" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.12"/><text x="480" y="130.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Ex situ (off site)</text><text x="480" y="149.5" font-size="14" fill="#1f2937" text-anchor="middle">species moved to special care</text><rect x="40" y="196" width="240" height="40" rx="8" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.06"/><text x="160" y="221" font-size="14" fill="#1f2937" text-anchor="middle">National parks</text><rect x="40" y="248" width="240" height="40" rx="8" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.06"/><text x="160" y="273" font-size="14" fill="#1f2937" text-anchor="middle">Wildlife sanctuaries</text><rect x="40" y="300" width="240" height="40" rx="8" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.06"/><text x="160" y="325" font-size="14" fill="#1f2937" text-anchor="middle">Biosphere reserves</text><rect x="40" y="352" width="240" height="40" rx="8" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.06"/><text x="160" y="377" font-size="14" fill="#1f2937" text-anchor="middle">Biodiversity hotspots</text><rect x="40" y="404" width="240" height="40" rx="8" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.06"/><text x="160" y="429" font-size="14" fill="#1f2937" text-anchor="middle">Sacred groves</text><rect x="360" y="196" width="240" height="40" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.06"/><text x="480" y="221" font-size="14" fill="#1f2937" text-anchor="middle">Zoological parks</text><rect x="360" y="248" width="240" height="40" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.06"/><text x="480" y="273" font-size="14" fill="#1f2937" text-anchor="middle">Botanical gardens</text><rect x="360" y="300" width="240" height="40" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.06"/><text x="480" y="325" font-size="14" fill="#1f2937" text-anchor="middle">Wildlife safari parks</text><rect x="360" y="352" width="240" height="40" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.06"/><text x="480" y="377" font-size="14" fill="#1f2937" text-anchor="middle">Seed banks</text><rect x="360" y="404" width="240" height="40" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.06"/><text x="480" y="429" font-size="14" fill="#1f2937" text-anchor="middle">Cryopreservation of gametes</text><line x1="160" y1="170" x2="160" y2="194" stroke="#059669" stroke-width="2"/><line x1="480" y1="170" x2="480" y2="194" stroke="#2563eb" stroke-width="2"/><text x="320" y="480" font-size="14" fill="#6b7280" text-anchor="middle">If the species is taken out of its natural habitat, the method is ex situ.</text>
</svg>
