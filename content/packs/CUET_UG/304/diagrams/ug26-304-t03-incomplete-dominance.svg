<text x="470.0" y="161.0" font-size="17" text-anchor="start" fill="#1f2937" font-weight="normal">1 red (RR)</text>
<rect x="440.0" y="177.0" width="20.0" height="20.0" rx="0" fill="#fbcfe8" stroke="#1f2937" stroke-width="1.5"/>
<text x="470.0" y="193.0" font-size="17" text-anchor="start" fill="#1f2937" font-weight="normal">2 pink (Rr)</text>
<rect x="440.0" y="209.0" width="20.0" height="20.0" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="470.0" y="225.0" font-size="17" text-anchor="start" fill="#1f2937" font-weight="normal">1 white (rr)</text>
<text x="440.0" y="268.0" font-size="18" text-anchor="start" fill="#2563eb" font-weight="bold">1 : 2 : 1</text>
<text x="440.0" y="292.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="normal">= phenotype ratio</text>
<text x="440.0" y="312.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="normal">= genotype ratio</text>
<text x="320.0" y="395.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="normal">Compare complete dominance: genotype 1:2:1 but phenotype 3:1.</text>
<text x="320.0" y="421.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="normal">The heterozygote Rr is intermediate, so 3 genotypes give 3 phenotypes.</text>
<text x="320.0" y="490.0" font-size="14" text-anchor="middle" fill="#6b7280" font-weight="normal">Snapdragon (Antirrhinum) / Mirabilis flower colour</text>
