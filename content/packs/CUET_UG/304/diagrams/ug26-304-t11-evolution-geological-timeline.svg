<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 474" font-family="Arial, Helvetica, sans-serif">
<text x="320" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Geological eras (time runs left to right)</text><rect x="30" y="70" width="309.83" height="40" rx="0" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.22"/><text x="184.92" y="60" font-size="14" fill="#059669" text-anchor="middle" font-weight="bold">Palaeozoic</text><rect x="339.83" y="70" width="199.41" height="40" rx="0" fill="#d97706" stroke="#d97706" stroke-width="2" fill-opacity="0.22"/><text x="439.54" y="60" font-size="14" fill="#d97706" text-anchor="middle" font-weight="bold">Mesozoic</text><rect x="539.24" y="70" width="70.76" height="40" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.22"/><text x="574.62" y="60" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">Cenozoic</text><line x1="30" y1="110" x2="30" y2="122" stroke="#1f2937" stroke-width="2"/><text x="36" y="142" font-size="14" fill="#1f2937" text-anchor="middle">541</text><line x1="339.83" y1="110" x2="339.83" y2="122" stroke="#1f2937" stroke-width="2"/><text x="339.83" y="142" font-size="14" fill="#1f2937" text-anchor="middle">252</text><line x1="539.24" y1="110" x2="539.24" y2="122" stroke="#1f2937" stroke-width="2"/><text x="539.24" y="142" font-size="14" fill="#1f2937" text-anchor="middle">66</text><line x1="610" y1="110" x2="610" y2="122" stroke="#1f2937" stroke-width="2"/><text x="604" y="142" font-size="14" fill="#1f2937" text-anchor="middle">0</text><text x="320" y="166" font-size="14" fill="#6b7280" text-anchor="middle">million years ago (approximate)</text><rect x="20" y="186" width="600" height="80" rx="8" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.08"/><text x="34" y="210" font-size="14" fill="#059669" text-anchor="start" font-weight="bold">Palaeozoic</text><text x="34" y="232" font-size="14" fill="#1f2937" text-anchor="start">Plants: algae, then bryophytes and pteridophytes (swamp forests)</text><text x="34" y="253" font-size="14" fill="#1f2937" text-anchor="start">Vertebrates: jawless then jawed fishes, amphibians, first reptiles</text><rect x="20" y="278" width="600" height="80" rx="8" fill="#d97706" stroke="#d97706" stroke-width="2" fill-opacity="0.08"/><text x="34" y="302" font-size="14" fill="#d97706" text-anchor="start" font-weight="bold">Mesozoic</text><text x="34" y="324" font-size="14" fill="#1f2937" text-anchor="start">Plants: gymnosperms dominant, flowering plants appear late</text><text x="34" y="345" font-size="14" fill="#1f2937" text-anchor="start">Vertebrates: reptiles (dinosaurs) dominant; first birds and mammals</text><rect x="20" y="370" width="600" height="80" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.08"/><text x="34" y="394" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold">Cenozoic</text><text x="34" y="416" font-size="14" fill="#1f2937" text-anchor="start">Plants: angiosperms (flowering plants) dominant</text><text x="34" y="437" font-size="14" fill="#1f2937" text-anchor="start">Vertebrates: mammals diversify; humans appear</text>
</svg>
