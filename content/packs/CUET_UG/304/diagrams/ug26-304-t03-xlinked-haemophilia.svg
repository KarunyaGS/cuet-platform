<text x="212.5" y="286.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="normal">carrier girl</text>
<text x="327.5" y="286.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="normal">haemophilic boy</text>
<text x="182.5" y="130.0" font-size="1" text-anchor="middle" fill="#1f2937" font-weight="normal"></text>
<text x="480.0" y="120.0" font-size="16" text-anchor="start" fill="#1f2937" font-weight="normal">Daughters: 1 normal,</text>
<text x="480.0" y="142.0" font-size="16" text-anchor="start" fill="#1f2937" font-weight="normal">1 carrier</text>
<text x="480.0" y="182.0" font-size="16" text-anchor="start" fill="#1f2937" font-weight="normal">Sons: 1 normal,</text>
<text x="480.0" y="204.0" font-size="16" text-anchor="start" fill="#dc2626" font-weight="bold">1 haemophilic</text>
<text x="480.0" y="248.0" font-size="16" text-anchor="start" fill="#2563eb" font-weight="bold">50% of sons affected</text>
<text x="330.0" y="340.0" font-size="14" text-anchor="middle" fill="#6b7280" font-weight="normal">Side: mother gametes.  Top: father gametes.</text>
<text x="330.0" y="366.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">No daughter is affected here because the father is normal.</text>
<text x="330.0" y="396.0" font-size="14" text-anchor="middle" fill="#6b7280" font-weight="normal">X<tspan font-size="10" dy="-5">H</tspan><tspan dy="5"> = normal allele, X</tspan><tspan font-size="10" dy="-5">h</tspan><tspan dy="5"> = haemophilia allele</tspan></text>
