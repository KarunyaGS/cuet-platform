<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 468" font-family="Arial, Helvetica, sans-serif">
<text x="320" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">How Bt cotton kills a bollworm</text><rect x="40" y="44" width="560" height="48" rx="8" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.1"/><text x="320" y="73" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">cry gene from Bacillus thuringiensis put into cotton</text><line x1="320" y1="95" x2="320" y2="103" stroke="#1f2937" stroke-width="2"/><polygon points="320,113 314,102 326,102" fill="#1f2937"/><rect x="40" y="116" width="560" height="48" rx="8" fill="#059669" stroke="#059669" stroke-width="2" fill-opacity="0.1"/><text x="320" y="145" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Plant makes the Cry protein as an inactive protoxin</text><line x1="320" y1="167" x2="320" y2="175" stroke="#1f2937" stroke-width="2"/><polygon points="320,185 314,174 326,174" fill="#1f2937"/><rect x="40" y="188" width="560" height="48" rx="8" fill="#d97706" stroke="#d97706" stroke-width="2" fill-opacity="0.1"/><text x="320" y="217" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Bollworm larva eats the plant tissue</text><line x1="320" y1="239" x2="320" y2="247" stroke="#1f2937" stroke-width="2"/><polygon points="320,257 314,246 326,246" fill="#1f2937"/><rect x="40" y="260" width="560" height="48" rx="8" fill="#dc2626" stroke="#dc2626" stroke-width="2" fill-opacity="0.1"/><text x="320" y="279.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Alkaline insect gut dissolves the crystals</text><text x="320" y="298.5" font-size="14" fill="#1f2937" text-anchor="middle">protoxin becomes active toxin</text><line x1="320" y1="311" x2="320" y2="319" stroke="#1f2937" stroke-width="2"/><polygon points="320,329 314,318 326,318" fill="#1f2937"/><rect x="40" y="332" width="560" height="48" rx="8" fill="#dc2626" stroke="#dc2626" stroke-width="2" fill-opacity="0.1"/><text x="320" y="361" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Toxin binds midgut epithelial cells and makes pores</text><line x1="320" y1="383" x2="320" y2="391" stroke="#1f2937" stroke-width="2"/><polygon points="320,401 314,390 326,390" fill="#1f2937"/><rect x="40" y="404" width="560" height="48" rx="8" fill="#dc2626" stroke="#dc2626" stroke-width="2" fill-opacity="0.1"/><text x="320" y="433" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Cells swell and burst (lyse): the insect dies</text>
</svg>
