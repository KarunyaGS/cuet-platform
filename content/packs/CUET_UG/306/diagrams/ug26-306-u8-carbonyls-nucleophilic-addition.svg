<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560" font-family="Arial, Helvetica, sans-serif">
  <text x="430" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>Nucleophilic addition to the carbonyl group</tspan></text>
  <text x="150" y="62" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="bold"><tspan>1. Nucleophile attacks (slow)</tspan></text>
  <text x="430" y="62" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="bold"><tspan>2. Tetrahedral alkoxide ion</tspan></text>
  <text x="710" y="62" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="bold"><tspan>3. Proton is taken up</tspan></text>
  <line x1="160" y1="166" x2="210" y2="166" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="160" y1="174" x2="210" y2="174" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="226" y="175" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold"><tspan>O</tspan></text>
  <text x="150" y="175" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>C</tspan></text>
  <line x1="142" y1="162" x2="104" y2="136" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="90" y="133" font-size="15" fill="#1f2937" text-anchor="middle"><tspan>R</tspan></text>
  <line x1="142" y1="178" x2="104" y2="204" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="90" y="219" font-size="15" fill="#1f2937" text-anchor="middle"><tspan>R′</tspan></text>
  <text x="158" y="198" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold"><tspan>δ+</tspan></text>
  <text x="226" y="144" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold"><tspan>δ−</tspan></text>
  <text x="142" y="100" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold"><tspan>Nu</tspan><tspan dy="-6.08" font-size="11.5">−</tspan></text>
  <line x1="142" y1="108" x2="143.2875295001209" y2="126.02541300169264" stroke="#dc2626" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="144,136 138.2,125.4 148.2,124.7" fill="#dc2626" stroke="none" stroke-width="1"/>
  <path d="M170,154 Q196,130 218,148" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="222,153 210,150 216,141" fill="#dc2626" stroke="none" stroke-width="1"/>
  <text x="160" y="262" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>sp</tspan><tspan dy="-4.94" font-size="9.4">2</tspan><tspan dy="4.94" font-size="13">: planar, 120°</tspan></text>
  <text x="160" y="278" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>carbon is δ+, so attacked</tspan></text>
  <line x1="268" y1="170" x2="302.0" y2="170.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="312,170 301.0,175.0 301.0,165.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <line x1="440" y1="170" x2="486" y2="170" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="502" y="175" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold"><tspan>O</tspan><tspan dy="-6.08" font-size="11.5">−</tspan></text>
  <text x="430" y="175" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>C</tspan></text>
  <line x1="430" y1="159" x2="430" y2="118" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="430" y="113" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold"><tspan>Nu</tspan></text>
  <polygon points="424,176 385.1,197.9 390.9,206.1" fill="#1f2937" stroke="none" stroke-width="1"/>
  <text x="374" y="219" font-size="15" fill="#1f2937" text-anchor="middle"><tspan>R</tspan></text>
  <line x1="434" y1="181" x2="454" y2="212" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"/>
  <text x="464" y="231" font-size="15" fill="#1f2937" text-anchor="middle"><tspan>R′</tspan></text>
  <text x="430" y="262" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>sp</tspan><tspan dy="-4.94" font-size="9.4">3</tspan><tspan dy="4.94" font-size="13">: tetrahedral,</tspan></text>
  <text x="430" y="278" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>about 109.5°</tspan></text>
  <line x1="520" y1="170" x2="562.0" y2="170.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="572,170 561.0,175.0 561.0,165.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <text x="546" y="158" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold"><tspan>H</tspan><tspan dy="-5.32" font-size="10.1">+</tspan></text>
  <line x1="720" y1="170" x2="766" y2="170" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="784" y="175" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>OH</tspan></text>
  <text x="710" y="175" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>C</tspan></text>
  <line x1="710" y1="159" x2="710" y2="118" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="710" y="113" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold"><tspan>Nu</tspan></text>
  <polygon points="704,176 665.1,197.9 670.9,206.1" fill="#1f2937" stroke="none" stroke-width="1"/>
  <text x="654" y="219" font-size="15" fill="#1f2937" text-anchor="middle"><tspan>R</tspan></text>
  <line x1="714" y1="181" x2="734" y2="212" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"/>
  <text x="744" y="231" font-size="15" fill="#1f2937" text-anchor="middle"><tspan>R′</tspan></text>
  <text x="710" y="262" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>Addition product: e.g. Nu = CN</tspan></text>
  <text x="710" y="278" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>gives a cyanohydrin</tspan></text>
  <rect x="30" y="316" width="800" height="210" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="430" y="344" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold"><tspan>Why aldehydes are more reactive than ketones</tspan></text>
  <text x="430" y="372" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>Reactivity towards nucleophiles</tspan></text>
  <rect x="75.0" y="388.0" width="150" height="52" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="150" y="409.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>HCHO</tspan></text>
  <text x="150" y="427.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>methanal</tspan></text>
  <rect x="275.0" y="388.0" width="150" height="52" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="350" y="409.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>CH</tspan><tspan dy="3.92" font-size="10.1">3</tspan><tspan dy="-3.92" font-size="14">CHO</tspan></text>
  <text x="350" y="427.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>ethanal</tspan></text>
  <rect x="475.0" y="388.0" width="150" height="52" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="550" y="409.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>CH</tspan><tspan dy="3.92" font-size="10.1">3</tspan><tspan dy="-3.92" font-size="14">COCH</tspan><tspan dy="3.92" font-size="10.1">3</tspan></text>
  <text x="550" y="427.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>propanone</tspan></text>
  <line x1="228" y1="414" x2="262.0" y2="414.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="272,414 261.0,419.0 261.0,409.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <line x1="428" y1="414" x2="462.0" y2="414.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="472,414 461.0,419.0 461.0,409.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <text x="740" y="408" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold"><tspan>most reactive</tspan></text>
  <text x="740" y="426" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold"><tspan>on the left</tspan></text>
  <text x="430" y="468" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>Electronic: each alkyl group pushes electrons to carbon (+I), making it less δ+; a ketone has two, an aldehyde one.</tspan></text>
  <text x="430" y="488" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>Steric: two alkyl groups hinder the approaching Nu</tspan><tspan dy="-4.94" font-size="9.4">−</tspan><tspan dy="4.94" font-size="13"> and crowd the tetrahedral product.</tspan></text>
  <text x="430" y="516" font-size="13" fill="#4b5563" text-anchor="middle" font-style="italic"><tspan>Aromatic aldehydes are less reactive than aliphatic aldehydes: resonance with the ring lowers the δ+ on carbon.</tspan></text>
</svg>
