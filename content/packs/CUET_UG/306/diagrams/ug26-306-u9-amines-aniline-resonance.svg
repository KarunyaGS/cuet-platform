<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Arial, Helvetica, sans-serif">
  <!-- Structure I (Kekule, C1=C2, C3=C4, C5=C6) -->
  <polygon points="110,94 141.2,112 141.2,148 110,166 78.8,148 78.8,112" fill="none" stroke="#1f2937" stroke-width="2"/>
  <line x1="112.8" y1="104.3" x2="130.9" y2="114.7" stroke="#1f2937" stroke-width="2"/>
  <line x1="130.9" y1="145.3" x2="112.8" y2="155.7" stroke="#1f2937" stroke-width="2"/>
  <line x1="86.3" y1="140.4" x2="86.3" y2="119.6" stroke="#1f2937" stroke-width="2"/>
  <line x1="110" y1="94" x2="110" y2="75" stroke="#1f2937" stroke-width="2"/>
  <text x="110" y="70" font-size="16" fill="#1f2937" text-anchor="middle">N</text>
  <text x="117" y="70" font-size="16" fill="#1f2937">H<tspan dy="4" font-size="11">2</tspan></text>
  <circle cx="106" cy="51" r="2.3" fill="#2563eb"/>
  <circle cx="114" cy="51" r="2.3" fill="#2563eb"/>
  <text x="110" y="196" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">I</text>

  <!-- arrow I <-> II -->
  <line x1="206" y1="130" x2="274" y2="130" stroke="#1f2937" stroke-width="2"/>
  <polygon points="198,130 208,125 208,135" fill="#1f2937"/>
  <polygon points="282,130 272,125 272,135" fill="#1f2937"/>

  <!-- Structure II (Kekule, C2=C3, C4=C5, C6=C1) -->
  <polygon points="370,94 401.2,112 401.2,148 370,166 338.8,148 338.8,112" fill="none" stroke="#1f2937" stroke-width="2"/>
  <line x1="393.7" y1="119.6" x2="393.7" y2="140.4" stroke="#1f2937" stroke-width="2"/>
  <line x1="367.2" y1="155.7" x2="349.1" y2="145.3" stroke="#1f2937" stroke-width="2"/>
  <line x1="349.1" y1="114.7" x2="367.2" y2="104.3" stroke="#1f2937" stroke-width="2"/>
  <line x1="370" y1="94" x2="370" y2="75" stroke="#1f2937" stroke-width="2"/>
  <text x="370" y="70" font-size="16" fill="#1f2937" text-anchor="middle">N</text>
  <text x="377" y="70" font-size="16" fill="#1f2937">H<tspan dy="4" font-size="11">2</tspan></text>
  <circle cx="366" cy="51" r="2.3" fill="#2563eb"/>
  <circle cx="374" cy="51" r="2.3" fill="#2563eb"/>
  <text x="370" y="196" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">II</text>

  <!-- arrow II <-> III -->
  <line x1="466" y1="130" x2="534" y2="130" stroke="#1f2937" stroke-width="2"/>
  <polygon points="458,130 468,125 468,135" fill="#1f2937"/>
  <polygon points="542,130 532,125 532,135" fill="#1f2937"/>

  <!-- Structure III (C=N+, negative charge at ortho C2) -->
  <polygon points="630,94 661.2,112 661.2,148 630,166 598.8,148 598.8,112" fill="none" stroke="#1f2937" stroke-width="2"/>
  <line x1="650.9" y1="145.3" x2="632.8" y2="155.7" stroke="#1f2937" stroke-width="2"/>
  <line x1="606.3" y1="140.4" x2="606.3" y2="119.6" stroke="#1f2937" stroke-width="2"/>
  <line x1="626.5" y1="94" x2="626.5" y2="75" stroke="#1f2937" stroke-width="2"/>
  <line x1="633.5" y1="94" x2="633.5" y2="75" stroke="#1f2937" stroke-width="2"/>
  <text x="630" y="70" font-size="16" fill="#1f2937" text-anchor="middle">N</text>
  <text x="637" y="70" font-size="16" fill="#1f2937">H<tspan dy="4" font-size="11">2</tspan></text>
  <circle cx="612" cy="56" r="7" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="608" y1="56" x2="616" y2="56" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="612" y1="52" x2="612" y2="60" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="677" cy="100" r="7" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="673" y1="100" x2="681" y2="100" stroke="#dc2626" stroke-width="1.5"/>
  <text x="630" y="196" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">III</text>
  <text x="690" y="104" font-size="13" fill="#dc2626">ortho</text>

  <!-- arrow (III) <-> IV -->
  <line x1="98" y1="340" x2="166" y2="340" stroke="#1f2937" stroke-width="2"/>
  <polygon points="90,340 100,335 100,345" fill="#1f2937"/>
  <polygon points="174,340 164,335 164,345" fill="#1f2937"/>

  <!-- Structure IV (C=N+, negative charge at para C4) -->
  <polygon points="240,304 271.2,322 271.2,358 240,376 208.8,358 208.8,322" fill="none" stroke="#1f2937" stroke-width="2"/>
  <line x1="263.7" y1="329.6" x2="263.7" y2="350.4" stroke="#1f2937" stroke-width="2"/>
  <line x1="216.3" y1="350.4" x2="216.3" y2="329.6" stroke="#1f2937" stroke-width="2"/>
  <line x1="236.5" y1="304" x2="236.5" y2="285" stroke="#1f2937" stroke-width="2"/>
  <line x1="243.5" y1="304" x2="243.5" y2="285" stroke="#1f2937" stroke-width="2"/>
  <text x="240" y="280" font-size="16" fill="#1f2937" text-anchor="middle">N</text>
  <text x="247" y="280" font-size="16" fill="#1f2937">H<tspan dy="4" font-size="11">2</tspan></text>
  <circle cx="222" cy="266" r="7" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="218" y1="266" x2="226" y2="266" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="222" y1="262" x2="222" y2="270" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="240" cy="392" r="7" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="236" y1="392" x2="244" y2="392" stroke="#dc2626" stroke-width="1.5"/>
  <text x="254" y="397" font-size="13" fill="#dc2626">para</text>
  <text x="240" y="424" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">IV</text>

  <!-- arrow IV <-> V -->
  <line x1="336" y1="340" x2="404" y2="340" stroke="#1f2937" stroke-width="2"/>
  <polygon points="328,340 338,335 338,345" fill="#1f2937"/>
  <polygon points="412,340 402,335 402,345" fill="#1f2937"/>

  <!-- Structure V (C=N+, negative charge at the other ortho C6) -->
  <polygon points="500,304 531.2,322 531.2,358 500,376 468.8,358 468.8,322" fill="none" stroke="#1f2937" stroke-width="2"/>
  <line x1="523.7" y1="329.6" x2="523.7" y2="350.4" stroke="#1f2937" stroke-width="2"/>
  <line x1="497.2" y1="365.7" x2="479.1" y2="355.3" stroke="#1f2937" stroke-width="2"/>
  <line x1="496.5" y1="304" x2="496.5" y2="285" stroke="#1f2937" stroke-width="2"/>
  <line x1="503.5" y1="304" x2="503.5" y2="285" stroke="#1f2937" stroke-width="2"/>
  <text x="500" y="280" font-size="16" fill="#1f2937" text-anchor="middle">N</text>
  <text x="507" y="280" font-size="16" fill="#1f2937">H<tspan dy="4" font-size="11">2</tspan></text>
  <circle cx="482" cy="266" r="7" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="478" y1="266" x2="486" y2="266" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="482" y1="262" x2="482" y2="270" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="453" cy="310" r="7" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="449" y1="310" x2="457" y2="310" stroke="#dc2626" stroke-width="1.5"/>
  <text x="440" y="300" font-size="13" fill="#dc2626" text-anchor="end">ortho</text>
  <text x="500" y="424" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">V</text>

  <!-- explanation box -->
  <rect x="566" y="262" width="186" height="140" rx="8" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb" stroke-width="1.5"/>
  <text x="576" y="284" font-size="13" fill="#1f2937">Lone pair on N is</text>
  <text x="576" y="301" font-size="13" fill="#1f2937">delocalised into the ring:</text>
  <text x="576" y="322" font-size="13" fill="#1f2937">• extra electron density</text>
  <text x="586" y="339" font-size="13" fill="#1f2937">at ortho and para C</text>
  <text x="576" y="360" font-size="13" fill="#1f2937">• lone pair less free to</text>
  <text x="586" y="377" font-size="13" fill="#1f2937">accept H⁺, so aniline is</text>
  <text x="586" y="394" font-size="13" fill="#1f2937">a weaker base than NH<tspan dy="4" font-size="10">3</tspan></text>

  <text x="380" y="458" font-size="14" fill="#1f2937" text-anchor="middle">I, II: Kekulé structures.  III, IV, V: C=N⁺ double bond, negative charge on ortho/para carbon.</text>
</svg>
