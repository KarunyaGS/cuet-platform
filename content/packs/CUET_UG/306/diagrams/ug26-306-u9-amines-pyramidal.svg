  <text x="520" y="322" font-size="15" fill="#1f2937" text-anchor="middle">(b) Trimethylamine, (CH<tspan dy="4" font-size="11">3</tspan><tspan dy="-4">)</tspan><tspan dy="4" font-size="11">3</tspan><tspan dy="-4">N</tspan></text>

  <!-- legend -->
  <text x="360" y="356" font-size="13" fill="#1f2937" text-anchor="middle">Wedge = bond towards the viewer; hashed wedge = bond away from the viewer.</text>
  <text x="360" y="376" font-size="13" fill="#1f2937" text-anchor="middle">Lone pair–bond pair repulsion squeezes the bond angle below the tetrahedral 109.5°.</text>
