<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" width="860" height="600" font-family="Arial, Helvetica, sans-serif">
  <text x="430" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>Telling phenol and the three classes of alcohol apart</tspan></text>
  <rect x="240.0" y="47.0" width="380" height="38" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="430" y="71.25" font-size="15" fill="#1f2937" text-anchor="middle"><tspan>Unknown compound containing an –OH group</tspan></text>
  <line x1="430" y1="86" x2="430.0" y2="104.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="430,114 425.0,103.0 435.0,103.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <rect x="280.0" y="123.0" width="300" height="38" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="430" y="147.25" font-size="15" fill="#1f2937" text-anchor="middle"><tspan>Add neutral FeCl</tspan><tspan dy="4.2" font-size="10.8">3</tspan><tspan dy="-4.2" font-size="15"> solution</tspan></text>
  <line x1="350" y1="162" x2="169.5358266513414" y2="218.98868632062903" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="160,222 169.0,213.9 172.0,223.5" fill="#1f2937" stroke="none" stroke-width="1"/>
  <line x1="510" y1="162" x2="501.6439898730536" y2="212.13606076167855" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="500,222 496.9,210.3 506.7,212.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <text x="40" y="196" font-size="13" fill="#dc2626" text-anchor="start" font-weight="bold"><tspan>violet / blue-violet colour</tspan></text>
  <text x="580" y="200" font-size="13" fill="#059669" text-anchor="start" font-weight="bold"><tspan>no colour change</tspan></text>
  <rect x="50.0" y="226.0" width="180" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="140" y="253.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>Phenol</tspan></text>
  <text x="140" y="290" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>also dissolves in aq. NaOH</tspan></text>
  <text x="140" y="306" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>and gives a white ppt with</tspan></text>
  <text x="140" y="322" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>bromine water</tspan></text>
  <rect x="410.0" y="226.0" width="180" height="44" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="500" y="253.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>An alcohol</tspan></text>
  <line x1="500" y1="271" x2="500.0" y2="296.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="500,306 495.0,295.0 505.0,295.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <rect x="325.0" y="308.0" width="350" height="52" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="329.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>Lucas reagent (conc. HCl + anhydrous ZnCl</tspan><tspan dy="3.92" font-size="10.1">2</tspan><tspan dy="-3.92" font-size="14">),</tspan></text>
  <text x="500" y="347.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>shake at room temperature</tspan></text>
  <line x1="410" y1="361" x2="279.1192150517511" y2="419.89635322671205" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="270,424 278.0,414.9 282.1,424.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <line x1="500" y1="361" x2="500.0" y2="414.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="500,424 495.0,413.0 505.0,413.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <line x1="590" y1="361" x2="720.8807849482489" y2="419.89635322671205" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="730,424 717.9,424.0 722.0,414.9" fill="#1f2937" stroke="none" stroke-width="1"/>
  <text x="318" y="386" font-size="13" fill="#2563eb" text-anchor="end" font-weight="bold"><tspan>at once</tspan></text>
  <text x="512" y="396" font-size="13" fill="#2563eb" text-anchor="start" font-weight="bold"><tspan>in about 5 min</tspan></text>
  <text x="690" y="386" font-size="13" fill="#2563eb" text-anchor="start" font-weight="bold"><tspan>no turbidity</tspan></text>
  <rect x="170.0" y="420.0" width="200" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="270" y="444.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>Cloudiness appears</tspan></text>
  <text x="270" y="464.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>immediately</tspan></text>
  <text x="270" y="484.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>3° alcohol</tspan></text>
  <text x="270" y="504.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>(CH</tspan><tspan dy="3.92" font-size="10.1">3</tspan><tspan dy="-3.92" font-size="14">)</tspan><tspan dy="3.92" font-size="10.1">3</tspan><tspan dy="-3.92" font-size="14">C–OH</tspan></text>
  <rect x="400.0" y="420.0" width="200" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="444.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>Cloudiness after</tspan></text>
  <text x="500" y="464.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>about 5 minutes</tspan></text>
  <text x="500" y="484.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>2° alcohol</tspan></text>
  <text x="500" y="504.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>CH</tspan><tspan dy="3.92" font-size="10.1">3</tspan><tspan dy="-3.92" font-size="14">CH(OH)CH</tspan><tspan dy="3.92" font-size="10.1">2</tspan><tspan dy="-3.92" font-size="14">CH</tspan><tspan dy="3.92" font-size="10.1">3</tspan></text>
  <rect x="630.0" y="420.0" width="200" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="730" y="444.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>Stays clear at room</tspan></text>
  <text x="730" y="464.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>temperature</tspan></text>
  <text x="730" y="484.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>1° alcohol</tspan></text>
  <text x="730" y="504.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>CH</tspan><tspan dy="3.92" font-size="10.1">3</tspan><tspan dy="-3.92" font-size="14">CH</tspan><tspan dy="3.92" font-size="10.1">2</tspan><tspan dy="-3.92" font-size="14">CH</tspan><tspan dy="3.92" font-size="10.1">2</tspan><tspan dy="-3.92" font-size="14">CH</tspan><tspan dy="3.92" font-size="10.1">2</tspan><tspan dy="-3.92" font-size="14">OH</tspan></text>
  <text x="430" y="560" font-size="13" fill="#4b5563" text-anchor="middle" font-style="italic"><tspan>The cloudiness is the insoluble alkyl chloride separating out: R–OH + HCl → R–Cl + H</tspan><tspan dy="3.64" font-size="9.4">2</tspan><tspan dy="-3.64" font-size="13">O.</tspan></text>
  <text x="430" y="580" font-size="13" fill="#4b5563" text-anchor="middle" font-style="italic"><tspan>Reliable for alcohols of about 3 to 6 carbons, which dissolve in the reagent.</tspan></text>
</svg>
