  <text x="458" y="375" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>OH</tspan></text>
  <rect x="190" y="296" width="106" height="132" rx="12" fill="none" stroke="#d97706" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="243" y="284" font-size="14" fill="#d97706" text-anchor="middle" font-weight="bold"><tspan>peptide bond</tspan></text>
  <text x="243" y="446" font-size="14" fill="#d97706" text-anchor="middle" font-weight="bold"><tspan>–CO–NH–</tspan></text>
  <text x="78" y="430" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold"><tspan>N-terminus</tspan></text>
  <text x="458" y="404" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold"><tspan>C-terminus</tspan></text>
  <text x="530" y="375" font-size="18" fill="#dc2626" text-anchor="start" font-weight="bold"><tspan>+  H</tspan><tspan dy="5.04" font-size="13.0">2</tspan><tspan dy="-5.04" font-size="18">O</tspan></text>
  <text x="430" y="480" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>n amino acids joined in a chain contain n – 1 peptide bonds and release n – 1 water molecules.</tspan></text>
  <text x="430" y="502" font-size="13" fill="#4b5563" text-anchor="middle" font-style="italic"><tspan>The –OH comes from the carboxyl group of glycine and the H from the amino group of alanine.</tspan></text>
