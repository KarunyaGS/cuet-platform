<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Arial, Helvetica, sans-serif">
<text x="190" y="24" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Conductivity κ rises with concentration</text>
<text x="570" y="24" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Molar conductivity Λm rises on dilution</text>
<line x1="70" y1="290" x2="360" y2="290" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><polygon points="368.0,290.0 359.6,286.7 359.6,293.3" fill="#1f2937"/><line x1="70" y1="290" x2="70" y2="60" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><polygon points="70.0,52.0 66.7,60.4 73.3,60.4" fill="#1f2937"/><text x="215" y="328" font-size="14" fill="#1f2937" text-anchor="middle">concentration c (mol L<tspan dy="-5" font-size="75%">-1</tspan><tspan dy="5">)</tspan></text><text x="24" y="175" font-size="14" fill="#1f2937" text-anchor="middle" transform="rotate(-90 24 175)">κ (S cm<tspan dy="-5" font-size="75%">-1</tspan><tspan dy="5">)</tspan></text>
<path d="M70,290 C110,170 200,110 340,80" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="300" y="70" font-size="13" fill="#2563eb" text-anchor="end">strong electrolyte</text>
<path d="M70,290 C150,240 250,205 340,185" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="345" y="175" font-size="13" fill="#dc2626" text-anchor="end">weak electrolyte</text>
<text x="390" y="345" font-size="13" fill="#6b7280" text-anchor="middle">Both graphs are illustrative shapes, not to scale.</text>
<line x1="450" y1="290" x2="740" y2="290" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><polygon points="748.0,290.0 739.6,286.7 739.6,293.3" fill="#1f2937"/><line x1="450" y1="290" x2="450" y2="60" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><polygon points="450.0,52.0 446.7,60.4 453.3,60.4" fill="#1f2937"/><text x="595" y="328" font-size="14" fill="#1f2937" text-anchor="middle">√c  (mol L<tspan dy="-5" font-size="75%">-1</tspan><tspan dy="5">)</tspan><tspan dy="-5" font-size="75%">1/2</tspan></text><text x="404" y="175" font-size="14" fill="#1f2937" text-anchor="middle" transform="rotate(-90 404 175)">Λm (S cm<tspan dy="-5" font-size="75%">2</tspan><tspan dy="5"> mol</tspan><tspan dy="-5" font-size="75%">-1</tspan><tspan dy="5">)</tspan></text>
<line x1="450" y1="90" x2="690" y2="170" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="450" cy="90" r="4" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<text x="460" y="82" font-size="13" fill="#2563eb">Λm° (intercept at c = 0)</text>
<text x="690" y="200" font-size="13" fill="#2563eb" text-anchor="end">strong electrolyte:</text>
<text x="690" y="216" font-size="13" fill="#2563eb" text-anchor="end">nearly straight line</text>
<path d="M690,265 C620,262 510,240 472,175" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M472,175 C462,150 457,115 455,60" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="690" y="243" font-size="13" fill="#dc2626" text-anchor="end">weak electrolyte</text>
<text x="712" y="104" font-size="13" fill="#dc2626" text-anchor="end">dashed: very steep rise at low c,</text>
<text x="712" y="119" font-size="13" fill="#dc2626" text-anchor="end">so Λm° cannot be extrapolated</text>
</svg>
