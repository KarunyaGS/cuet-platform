<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" font-family="Arial, Helvetica, sans-serif">
  <!-- (a) octahedral: M at (150,170) -->
  <g stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" fill="none" opacity="0.8">
    <polygon points="60,180 115,215 240,160 185,125"/>
    <line x1="150" y1="75" x2="60" y2="180"/><line x1="150" y1="75" x2="115" y2="215"/>
    <line x1="150" y1="75" x2="240" y2="160"/><line x1="150" y1="75" x2="185" y2="125"/>
    <line x1="150" y1="265" x2="60" y2="180"/><line x1="150" y1="265" x2="115" y2="215"/>
    <line x1="150" y1="265" x2="240" y2="160"/><line x1="150" y1="265" x2="185" y2="125"/>
  </g>
  <g stroke="#1f2937" stroke-width="2.5">
    <line x1="150" y1="170" x2="150" y2="75"/><line x1="150" y1="170" x2="150" y2="265"/>
    <line x1="150" y1="170" x2="60" y2="180"/><line x1="150" y1="170" x2="240" y2="160"/>
    <line x1="150" y1="170" x2="115" y2="215"/><line x1="150" y1="170" x2="185" y2="125"/>
  </g>
  <g fill="#ffffff" stroke="#059669" stroke-width="2">
    <circle cx="150" cy="75" r="14"/><circle cx="150" cy="265" r="14"/><circle cx="60" cy="180" r="14"/>
    <circle cx="240" cy="160" r="14"/><circle cx="115" cy="215" r="14"/><circle cx="185" cy="125" r="14"/>
  </g>
  <circle cx="150" cy="170" r="18" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
  <g font-size="14" fill="#1f2937" text-anchor="middle">
    <text x="150" y="175" font-weight="bold">M</text>
    <text x="150" y="80">L</text><text x="150" y="270">L</text><text x="60" y="185">L</text>
    <text x="240" y="165">L</text><text x="115" y="220">L</text><text x="185" y="130">L</text>
  </g>

  <!-- (b) tetrahedral: M at (450,180) -->
  <g stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" fill="none" opacity="0.8">
    <line x1="450" y1="75" x2="365" y2="205"/><line x1="450" y1="75" x2="530" y2="195"/>
    <line x1="450" y1="75" x2="450" y2="250"/><line x1="365" y1="205" x2="530" y2="195"/>
    <line x1="365" y1="205" x2="450" y2="250"/><line x1="530" y1="195" x2="450" y2="250"/>
  </g>
  <g stroke="#1f2937" stroke-width="2.5">
    <line x1="450" y1="170" x2="450" y2="75"/><line x1="450" y1="170" x2="365" y2="205"/>
    <line x1="450" y1="170" x2="530" y2="195"/><line x1="450" y1="170" x2="450" y2="250"/>
  </g>
  <g fill="#ffffff" stroke="#059669" stroke-width="2">
    <circle cx="450" cy="75" r="14"/><circle cx="365" cy="205" r="14"/>
    <circle cx="530" cy="195" r="14"/><circle cx="450" cy="250" r="14"/>
  </g>
  <circle cx="450" cy="170" r="18" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
  <g font-size="14" fill="#1f2937" text-anchor="middle">
    <text x="450" y="175" font-weight="bold">M</text>
    <text x="450" y="80">L</text><text x="365" y="210">L</text><text x="530" y="200">L</text><text x="450" y="255">L</text>
  </g>

  <!-- (c) square planar: M at (750,170) -->
  <g stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" fill="none" opacity="0.8">
    <polygon points="655,180 710,215 845,160 790,125"/>
  </g>
  <g stroke="#1f2937" stroke-width="2.5">
    <line x1="750" y1="170" x2="655" y2="180"/><line x1="750" y1="170" x2="845" y2="160"/>
    <line x1="750" y1="170" x2="710" y2="215"/><line x1="750" y1="170" x2="790" y2="125"/>
  </g>
  <g fill="#ffffff" stroke="#059669" stroke-width="2">
    <circle cx="655" cy="180" r="14"/><circle cx="845" cy="160" r="14"/>
    <circle cx="710" cy="215" r="14"/><circle cx="790" cy="125" r="14"/>
  </g>
  <circle cx="750" cy="170" r="18" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
  <g font-size="14" fill="#1f2937" text-anchor="middle">
    <text x="750" y="175" font-weight="bold">M</text>
    <text x="655" y="185">L</text><text x="845" y="165">L</text><text x="710" y="220">L</text><text x="790" y="130">L</text>
  </g>

  <!-- captions -->
  <g font-size="15" fill="#1f2937" text-anchor="middle">
    <text x="150" y="305" font-weight="bold">(a) Octahedral</text>
    <text x="150" y="327">coordination number 6</text>
    <text x="150" y="350">e.g. [Co(NH<tspan font-size="11" dy="4">3</tspan><tspan dy="-4">)</tspan><tspan font-size="11" dy="4">6</tspan><tspan dy="-4">]</tspan><tspan font-size="11" dy="-6">3+</tspan></text>
    <text x="450" y="305" font-weight="bold">(b) Tetrahedral</text>
    <text x="450" y="327">coordination number 4</text>
    <text x="450" y="350">e.g. [Ni(CO)<tspan font-size="11" dy="4">4</tspan><tspan dy="-4">]</tspan></text>
    <text x="750" y="305" font-weight="bold">(c) Square planar</text>
    <text x="750" y="327">coordination number 4</text>
    <text x="750" y="350">e.g. [Ni(CN)<tspan font-size="11" dy="4">4</tspan><tspan dy="-4">]</tspan><tspan font-size="11" dy="-6">2−</tspan></text>
  </g>
  <text x="450" y="28" font-size="15" fill="#2563eb" text-anchor="middle">Dashed blue lines outline the coordination polyhedron; M = central metal, L = donor atom of a ligand</text>
</svg>
