<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Arial, Helvetica, sans-serif">
  <!-- panel separators -->
  <line x1="300" y1="20" x2="300" y2="310" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="600" y1="20" x2="600" y2="310" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- (a) methanol -->
  <text x="150" y="36" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">(a) Methanol, CH<tspan font-size="11" dy="4">3</tspan><tspan dy="-4">OH</tspan></text>
  <g stroke="#1f2937" stroke-width="2.2">
    <line x1="140" y1="137" x2="97" y2="168"/>
    <line x1="160" y1="137" x2="203" y2="168"/>
  </g>
  <text x="150" y="136" font-size="20" font-weight="bold" fill="#dc2626" text-anchor="middle">O</text>
  <g fill="#1f2937">
    <circle cx="133" cy="113" r="2.2"/><circle cx="138" cy="107" r="2.2"/>
    <circle cx="162" cy="107" r="2.2"/><circle cx="167" cy="113" r="2.2"/>
  </g>
  <text x="96" y="187" font-size="18" fill="#1f2937" text-anchor="end">H<tspan font-size="12" dy="4">3</tspan><tspan dy="-4">C</tspan></text>
  <text x="212" y="187" font-size="18" fill="#1f2937">H</text>
  <path d="M 131 149 A 24 24 0 0 0 169 149" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <text x="150" y="180" font-size="15" fill="#2563eb" text-anchor="middle">108.9°</text>
  <text x="150" y="228" font-size="14" fill="#1f2937" text-anchor="middle">C–O bond: 142 pm</text>
  <text x="150" y="250" font-size="14" fill="#1f2937" text-anchor="middle">O is sp<tspan font-size="10" dy="-6">3</tspan><tspan dy="6"> hybridised;</tspan></text>
  <text x="150" y="270" font-size="14" fill="#1f2937" text-anchor="middle">lone-pair repulsion makes the</text>
  <text x="150" y="290" font-size="14" fill="#1f2937" text-anchor="middle">angle a little below 109.5°</text>

  <!-- (b) phenol -->
  <text x="450" y="36" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">(b) Phenol, C<tspan font-size="11" dy="4">6</tspan><tspan dy="-4">H</tspan><tspan font-size="11" dy="4">5</tspan><tspan dy="-4">OH</tspan></text>
  <polygon points="400,177 432.9,196 432.9,234 400,253 367.1,234 367.1,196" fill="none" stroke="#1f2937" stroke-width="2.2"/>
  <g stroke="#1f2937" stroke-width="2">
    <line x1="425.7" y1="204.6" x2="425.7" y2="225.4"/>
    <line x1="396.1" y1="242.4" x2="378.2" y2="232"/>
    <line x1="378.2" y1="198" x2="396.1" y2="187.6"/>
  </g>
  <line x1="400" y1="177" x2="400" y2="142" stroke="#1f2937" stroke-width="2.2"/>
  <text x="400" y="136" font-size="20" font-weight="bold" fill="#dc2626" text-anchor="middle">O</text>
  <g fill="#1f2937">
    <circle cx="385" cy="118" r="2.2"/><circle cx="385" cy="126" r="2.2"/>
    <circle cx="396" cy="106" r="2.2"/><circle cx="404" cy="106" r="2.2"/>
  </g>
  <line x1="412" y1="124" x2="446" y2="112" stroke="#1f2937" stroke-width="2.2"/>
  <text x="450" y="115" font-size="18" fill="#1f2937">H</text>
  <path d="M 400 152 A 22 22 0 0 0 420 120" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <text x="426" y="152" font-size="15" fill="#2563eb">109°</text>
  <text x="352" y="166" font-size="13" fill="#1f2937" text-anchor="end">sp<tspan font-size="10" dy="-6">2</tspan><tspan dy="6"> carbon</tspan></text>
  <line x1="355" y1="168" x2="394" y2="176" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="450" y="280" font-size="14" fill="#1f2937" text-anchor="middle">C–O bond: 136 pm (shorter)</text>
  <text x="450" y="300" font-size="14" fill="#1f2937" text-anchor="middle">partial double-bond character</text>

  <!-- (c) methoxymethane -->
  <text x="750" y="36" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">(c) Methoxymethane, CH<tspan font-size="11" dy="4">3</tspan><tspan dy="-4">OCH</tspan><tspan font-size="11" dy="4">3</tspan></text>
  <g stroke="#1f2937" stroke-width="2.2">
    <line x1="740" y1="137" x2="694" y2="168"/>
    <line x1="760" y1="137" x2="806" y2="168"/>
  </g>
  <text x="750" y="136" font-size="20" font-weight="bold" fill="#dc2626" text-anchor="middle">O</text>
  <g fill="#1f2937">
    <circle cx="733" cy="113" r="2.2"/><circle cx="738" cy="107" r="2.2"/>
    <circle cx="762" cy="107" r="2.2"/><circle cx="767" cy="113" r="2.2"/>
  </g>
  <text x="694" y="187" font-size="18" fill="#1f2937" text-anchor="end">H<tspan font-size="12" dy="4">3</tspan><tspan dy="-4">C</tspan></text>
  <text x="806" y="187" font-size="18" fill="#1f2937">CH<tspan font-size="12" dy="4">3</tspan></text>
  <path d="M 730 150 A 24 24 0 0 0 770 150" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <text x="750" y="181" font-size="15" fill="#2563eb" text-anchor="middle">111.7°</text>
  <text x="750" y="228" font-size="14" fill="#1f2937" text-anchor="middle">C–O bond: 141 pm</text>
  <text x="750" y="250" font-size="14" fill="#1f2937" text-anchor="middle">angle above 109.5° because the</text>
  <text x="750" y="270" font-size="14" fill="#1f2937" text-anchor="middle">two bulky alkyl groups</text>
  <text x="750" y="290" font-size="14" fill="#1f2937" text-anchor="middle">repel each other</text>
</svg>
