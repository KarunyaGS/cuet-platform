<line x1="90" y1="90" x2="490" y2="235" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
<circle cx="90" cy="90" r="4" fill="#dc2626" stroke="#dc2626" stroke-width="2"/>
<text x="100" y="78" font-size="13" fill="#dc2626" font-weight="bold">intercept = ln A  (at 1/T = 0)</text>
