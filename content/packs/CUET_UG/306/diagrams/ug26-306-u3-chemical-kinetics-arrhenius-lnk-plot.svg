<text x="330" y="140" font-size="13" fill="#1f2937" text-anchor="middle">Δ(1/T)</text>
<text x="418" y="182" font-size="13" fill="#1f2937">Δ ln k</text>
<text x="220" y="205" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">slope = −E<tspan dy="4" font-size="75%">a</tspan><tspan dy="-4">/R</tspan></text>
<text x="220" y="224" font-size="13" fill="#dc2626" text-anchor="middle">(so E<tspan dy="4" font-size="75%">a</tspan><tspan dy="-4"> = −slope × R)</tspan></text>
<line x1="470" y1="282" x2="217" y2="282" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/><polygon points="210.0,282.0 217.4,285.0 217.4,279.0" fill="#6b7280"/>
