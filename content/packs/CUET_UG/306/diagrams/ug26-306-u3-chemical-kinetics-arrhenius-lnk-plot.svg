<text x="340" y="24" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Arrhenius plot: ln k = ln A − E<tspan dy="4" font-size="75%">a</tspan><tspan dy="-4">/RT</tspan></text>
