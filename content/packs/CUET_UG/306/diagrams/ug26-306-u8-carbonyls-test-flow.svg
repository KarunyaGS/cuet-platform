<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" width="860" height="640" font-family="Arial, Helvetica, sans-serif">
  <text x="430" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>Which test tells which carbonyl compound apart?</tspan></text>
  <rect x="180.0" y="46.0" width="300" height="48" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="330" y="65.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>Unknown liquid: carbonyl compound</tspan></text>
  <text x="330" y="83.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>or carboxylic acid?</tspan></text>
  <line x1="330" y1="95" x2="330.0" y2="114.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="330,124 325.0,113.0 335.0,113.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <rect x="180.0" y="129.0" width="300" height="38" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="330" y="152.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>2,4-DNP (2,4-dinitrophenylhydrazine)</tspan></text>
  <line x1="482" y1="148" x2="576.0" y2="148.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="586,148 575.0,153.0 575.0,143.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <text x="534" y="138" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold"><tspan>no ppt</tspan></text>
  <rect x="600.0" y="115.0" width="240" height="66" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="720" y="135.55" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>Not an aldehyde or ketone.</tspan></text>
  <text x="720" y="152.55" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>–COOH? NaHCO</tspan><tspan dy="3.64" font-size="9.4">3</tspan><tspan dy="-3.64" font-size="13"> gives</tspan></text>
  <text x="720" y="169.55" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>CO</tspan><tspan dy="3.64" font-size="9.4">2</tspan><tspan dy="-3.64" font-size="13"> bubbles</tspan></text>
  <line x1="330" y1="167" x2="330.0" y2="196.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="330,206 325.0,195.0 335.0,195.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <text x="342" y="192" font-size="13" fill="#dc2626" text-anchor="start" font-weight="bold"><tspan>orange / yellow ppt: C=O present</tspan></text>
  <rect x="185.0" y="213.0" width="290" height="38" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="330" y="236.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>Tollens' reagent, warm water bath</tspan></text>
  <line x1="250" y1="251" x2="178.24041924199366" y2="300.3347117711293" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="170,306 176.2,295.6 181.9,303.9" fill="#1f2937" stroke="none" stroke-width="1"/>
  <line x1="410" y1="251" x2="550.611236841134" y2="302.55745350841573" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="560,306 548.0,306.9 551.4,297.5" fill="#1f2937" stroke="none" stroke-width="1"/>
  <text x="180" y="282" font-size="13" fill="#dc2626" text-anchor="end" font-weight="bold"><tspan>silver mirror: aldehyde</tspan></text>
  <text x="500" y="282" font-size="13" fill="#059669" text-anchor="start" font-weight="bold"><tspan>no mirror: ketone</tspan></text>
  <rect x="65.0" y="313.0" width="210" height="38" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="170" y="336.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>Fehling's solution, heat</tspan></text>
  <rect x="455.0" y="308.0" width="210" height="48" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="560" y="327.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>Iodoform test</tspan></text>
  <text x="560" y="345.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>(I</tspan><tspan dy="3.92" font-size="10.1">2</tspan><tspan dy="-3.92" font-size="14"> + NaOH, warm)</tspan></text>
  <line x1="120" y1="351" x2="94.41319655469137" y2="403.0265003387942" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="90,412 90.4,399.9 99.3,404.3" fill="#1f2937" stroke="none" stroke-width="1"/>
  <line x1="220" y1="351" x2="254.5164303777976" y2="403.6375563261413" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="260,412 249.8,405.5 258.1,400.1" fill="#1f2937" stroke="none" stroke-width="1"/>
  <line x1="510" y1="357" x2="475.8817169767505" y2="403.9126391569681" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="470,412 472.4,400.2 480.5,406.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <line x1="610" y1="357" x2="662.6284585979926" y2="405.2427537148265" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="670,412 658.5,408.3 665.3,400.9" fill="#1f2937" stroke="none" stroke-width="1"/>
  <text x="92" y="382" font-size="13" fill="#dc2626" text-anchor="end" font-weight="bold"><tspan>red-brown</tspan></text>
  <text x="92" y="398" font-size="13" fill="#dc2626" text-anchor="end" font-weight="bold"><tspan>ppt</tspan></text>
  <text x="246" y="392" font-size="13" fill="#059669" text-anchor="start" font-weight="bold"><tspan>no ppt</tspan></text>
  <text x="460" y="388" font-size="13" fill="#dc2626" text-anchor="end" font-weight="bold"><tspan>yellow ppt</tspan></text>
  <text x="656" y="392" font-size="13" fill="#059669" text-anchor="start" font-weight="bold"><tspan>no ppt</tspan></text>
  <rect x="15.0" y="422.0" width="150" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="90" y="449.9" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>Aliphatic</tspan></text>
  <text x="90" y="467.9" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>aldehyde</tspan></text>
  <rect x="195.0" y="416.0" width="170" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="280" y="440.9" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>Aromatic</tspan></text>
  <text x="280" y="458.9" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>aldehyde</tspan></text>
  <text x="280" y="476.9" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>(benzaldehyde)</tspan></text>
  <rect x="385.0" y="422.0" width="150" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="460" y="449.9" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>Methyl ketone</tspan></text>
  <text x="460" y="467.9" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>CH</tspan><tspan dy="3.92" font-size="10.1">3</tspan><tspan dy="-3.92" font-size="14">CO–R</tspan></text>
  <rect x="605.0" y="422.0" width="150" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="680" y="458.9" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>Other ketone</tspan></text>
  <text x="430" y="560" font-size="13" fill="#4b5563" text-anchor="middle" font-style="italic"><tspan>Ethanal also gives the iodoform test (it has CH</tspan><tspan dy="3.64" font-size="9.4">3</tspan><tspan dy="-3.64" font-size="13">CO–). Methanal and propanal do not.</tspan></text>
  <text x="430" y="578" font-size="13" fill="#4b5563" text-anchor="middle" font-style="italic"><tspan>Both aldehydes and ketones react with 2,4-DNP, so that test only shows that C=O is present.</tspan></text>
  <text x="430" y="610" font-size="13" fill="#4b5563" text-anchor="middle" font-style="italic"><tspan>Tollens' and Fehling's reagents oxidise aldehydes; ketones resist oxidation.</tspan></text>
</svg>
