  <line x1="810" y1="238" x2="845" y2="210" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="801" y="172" width="18" height="20" rx="2" fill="#ffffff" stroke="none" stroke-width="0"/>
  <text x="810" y="187" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold"><tspan>O</tspan></text>
