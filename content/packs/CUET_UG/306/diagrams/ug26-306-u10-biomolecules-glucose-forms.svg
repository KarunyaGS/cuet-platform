  <path d="M180,300 C250,286 250,128 172,102" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/>
  <polygon points="166,100 180,96 176,108" fill="#dc2626" stroke="none" stroke-width="1"/>
  <text x="262" y="150" font-size="13" fill="#dc2626" text-anchor="start"><tspan>C-5 –OH</tspan></text>
  <text x="262" y="167" font-size="13" fill="#dc2626" text-anchor="start"><tspan>attacks C-1</tspan></text>
  <text x="262" y="184" font-size="13" fill="#dc2626" text-anchor="start"><tspan>(the CHO</tspan></text>
  <text x="262" y="201" font-size="13" fill="#dc2626" text-anchor="start"><tspan>carbon)</tspan></text>
  <line x1="353" y1="256" x2="387.0" y2="256.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
