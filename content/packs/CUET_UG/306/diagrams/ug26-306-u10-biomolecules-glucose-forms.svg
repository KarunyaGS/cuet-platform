  <text x="735" y="135" font-size="15" fill="#1f2937" text-anchor="middle"><tspan>CH</tspan><tspan dy="4.2" font-size="10.8">2</tspan><tspan dy="-4.2" font-size="15">OH</tspan></text>
  <text x="859" y="206" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>1</tspan></text>
  <text x="824" y="254" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>2</tspan></text>
