  <text x="719" y="172" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>5</tspan></text>
  <text x="500" y="95" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>α-D-glucopyranose</tspan></text>
  <text x="500" y="115" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>C-1 –OH points down</tspan></text>
  <text x="770" y="95" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>β-D-glucopyranose</tspan></text>
  <text x="770" y="115" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>C-1 –OH points up</tspan></text>
  <text x="500" y="318" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>specific rotation +111°</tspan></text>
  <text x="770" y="318" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>specific rotation +19.2°</tspan></text>
  <text x="635" y="215" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>⇌</tspan></text>
  <text x="635" y="236" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>via open chain</tspan></text>
  <rect x="30" y="398" width="840" height="140" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="48" y="424" font-size="14" fill="#1f2937" text-anchor="start"><tspan>The six-membered ring has one O atom (like pyran), so it is called the pyranose form.</tspan></text>
  <text x="48" y="450" font-size="14" fill="#1f2937" text-anchor="start"><tspan>The two ring forms differ only at C-1, the anomeric carbon: they are anomers, not enantiomers.</tspan></text>
  <text x="48" y="476" font-size="14" fill="#1f2937" text-anchor="start"><tspan>In D-glucose every –OH on the right of the Fischer chain points down in the ring, and every –OH on the left points up.</tspan></text>
  <text x="48" y="502" font-size="14" fill="#1f2937" text-anchor="start"><tspan>In water either form slowly changes to an equilibrium mixture, rotation +52.5° (mutarotation).</tspan></text>
</svg>
