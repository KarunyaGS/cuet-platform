<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="Arial, Helvetica, sans-serif">
  <text x="430" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>Which mechanism does each type of alkyl halide prefer?</tspan></text>
  <text x="210" y="64" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold"><tspan>SN2 (one step, backside attack)</tspan></text>
  <line x1="40" y1="330" x2="380.0" y2="330.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="390,330 379.0,335.0 379.0,325.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <line x1="40" y1="330" x2="40.0" y2="110.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="40,100 45.0,111.0 35.0,111.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <text x="22" y="215" font-size="13" fill="#1f2937" text-anchor="middle" transform="rotate(-90 22 215)">Relative rate (qualitative)</text>
  <rect x="62" y="125" width="52" height="205" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="88" y="352" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>CH</tspan><tspan dy="3.64" font-size="9.4">3</tspan><tspan dy="-3.64" font-size="13">–X</tspan></text>
  <rect x="142" y="180" width="52" height="150" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="168" y="352" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>1°</tspan></text>
  <text x="168" y="367" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>(RCH</tspan><tspan dy="3.64" font-size="9.4">2</tspan><tspan dy="-3.64" font-size="13">X)</tspan></text>
  <rect x="222" y="265" width="52" height="65" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="248" y="352" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>2°</tspan></text>
  <text x="248" y="367" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>(R</tspan><tspan dy="3.64" font-size="9.4">2</tspan><tspan dy="-3.64" font-size="13">CHX)</tspan></text>
  <rect x="302" y="322" width="52" height="8" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="328" y="352" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>3°</tspan></text>
  <text x="328" y="367" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>(R</tspan><tspan dy="3.64" font-size="9.4">3</tspan><tspan dy="-3.64" font-size="13">CX)</tspan></text>
  <text x="210" y="385" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>Fewer groups around carbon:</tspan></text>
  <text x="210" y="403" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>easier backside attack, faster</tspan></text>
  <text x="640" y="64" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold"><tspan>SN1 (carbocation intermediate)</tspan></text>
  <line x1="470" y1="330" x2="810.0" y2="330.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="820,330 809.0,335.0 809.0,325.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <line x1="470" y1="330" x2="470.0" y2="110.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="470,100 475.0,111.0 465.0,111.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <text x="452" y="215" font-size="13" fill="#1f2937" text-anchor="middle" transform="rotate(-90 452 215)">Relative rate (qualitative)</text>
  <rect x="492" y="322" width="52" height="8" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="518" y="352" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>CH</tspan><tspan dy="3.64" font-size="9.4">3</tspan><tspan dy="-3.64" font-size="13">–X</tspan></text>
  <rect x="572" y="302" width="52" height="28" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="598" y="352" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>1°</tspan></text>
  <text x="598" y="367" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>(RCH</tspan><tspan dy="3.64" font-size="9.4">2</tspan><tspan dy="-3.64" font-size="13">X)</tspan></text>
  <rect x="652" y="220" width="52" height="110" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="678" y="352" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>2°</tspan></text>
  <text x="678" y="367" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>(R</tspan><tspan dy="3.64" font-size="9.4">2</tspan><tspan dy="-3.64" font-size="13">CHX)</tspan></text>
  <rect x="732" y="125" width="52" height="205" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="758" y="352" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>3°</tspan></text>
  <text x="758" y="367" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>(R</tspan><tspan dy="3.64" font-size="9.4">3</tspan><tspan dy="-3.64" font-size="13">CX)</tspan></text>
  <text x="640" y="385" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>More alkyl groups: more stable</tspan></text>
  <text x="640" y="403" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>carbocation, faster</tspan></text>
  <text x="430" y="442" font-size="13" fill="#4b5563" text-anchor="middle" font-style="italic"><tspan>Bar heights show the order only. They are not measured values.</tspan></text>
  <text x="430" y="460" font-size="13" fill="#4b5563" text-anchor="middle" font-style="italic"><tspan>Allylic and benzylic halides react quickly by both routes; vinyl and aryl halides react by neither.</tspan></text>
</svg>
