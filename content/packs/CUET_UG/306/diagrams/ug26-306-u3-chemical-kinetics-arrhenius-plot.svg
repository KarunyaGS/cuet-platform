<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="Arial, Helvetica, sans-serif">
  <line x1="80" y1="380" x2="606" y2="380" stroke="#1f2937" stroke-width="2"/>
  <polygon points="616,380 604,374 604,386" fill="#1f2937"/>
  <line x1="80" y1="380" x2="80" y2="52" stroke="#1f2937" stroke-width="2"/>
  <polygon points="80,42 74,54 86,54" fill="#1f2937"/>
  <text x="92" y="46" font-size="15" fill="#1f2937">ln k  (k in s⁻¹)</text>
  <text x="616" y="404" font-size="15" fill="#1f2937" text-anchor="end">1/T (K⁻¹)</text>
  <text x="72" y="398" font-size="13" fill="#1f2937" text-anchor="end">0</text>

  <!-- extrapolated part (dashed) and measured part (solid); y = 90 + 0.5(x - 80) -->
  <line x1="80" y1="90" x2="370" y2="235" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="370" y1="235" x2="560" y2="330" stroke="#2563eb" stroke-width="2.5"/>
  <g fill="#2563eb">
    <circle cx="380" cy="240" r="5"/><circle cx="420" cy="260" r="5"/><circle cx="460" cy="280" r="5"/>
    <circle cx="500" cy="300" r="5"/><circle cx="540" cy="320" r="5"/>
  </g>
  <circle cx="80" cy="90" r="5" fill="#dc2626"/>
  <text x="92" y="84" font-size="15" fill="#dc2626">intercept = ln A</text>

  <!-- slope triangle -->
  <line x1="420" y1="260" x2="500" y2="260" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="500" y1="260" x2="500" y2="300" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="460" y="252" font-size="14" fill="#1f2937" text-anchor="middle">Δ(1/T)</text>
  <text x="508" y="285" font-size="14" fill="#1f2937">Δ(ln k)</text>
  <text x="300" y="300" font-size="15" fill="#dc2626" text-anchor="middle">slope = −Eₐ/R</text>

  <text x="250" y="140" font-size="15" fill="#1f2937">ln k = ln A − (Eₐ/R)(1/T)</text>
  <text x="250" y="162" font-size="13" fill="#1f2937">measured points (solid), extrapolated to 1/T = 0 (dashed)</text>

  <!-- temperature direction -->
  <line x1="560" y1="420" x2="420" y2="420" stroke="#d97706" stroke-width="2"/>
  <polygon points="410,420 422,414 422,426" fill="#d97706"/>
  <text x="400" y="425" font-size="13" fill="#d97706" text-anchor="end">temperature increases to the left</text>
</svg>
