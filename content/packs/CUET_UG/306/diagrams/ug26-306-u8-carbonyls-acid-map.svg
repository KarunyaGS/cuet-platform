  <text x="563.0" y="278.0" font-size="13" fill="#2563eb" text-anchor="middle"><tspan>then H</tspan><tspan dy="3.64" font-size="9.4">2</tspan><tspan dy="-3.64" font-size="13">O</tspan></text>
