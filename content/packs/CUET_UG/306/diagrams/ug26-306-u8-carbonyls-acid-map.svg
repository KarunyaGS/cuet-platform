  <text x="84.0" y="165.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>or aldehyde</tspan></text>
  <line x1="156.0" y1="206.0" x2="278.0" y2="206.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
