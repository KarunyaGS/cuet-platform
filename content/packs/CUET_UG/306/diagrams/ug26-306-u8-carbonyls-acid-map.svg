  <text x="781.0" y="84.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>(NaHCO</tspan><tspan dy="3.92" font-size="10.1">3</tspan><tspan dy="-3.92" font-size="14">: CO</tspan><tspan dy="3.92" font-size="10.1">2</tspan><tspan dy="-3.92" font-size="14"> fizz)</tspan></text>
