  <text x="216.0" y="305.0" font-size="13" fill="#059669" text-anchor="middle"><tspan>KMnO</tspan><tspan dy="3.64" font-size="9.4">4</tspan><tspan dy="-3.64" font-size="13">, heat</tspan></text>
  <rect x="14.0" y="293.0" width="140" height="42" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="84.0" y="309.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>alkylbenzene</tspan></text>
  <text x="84.0" y="327.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>e.g. toluene</tspan></text>
  <text x="84.0" y="38" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold"><tspan>made from</tspan></text>
  <text x="781.0" y="38" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold"><tspan>converted to</tspan></text>
  <text x="450.0" y="476" font-size="13" fill="#4b5563" text-anchor="middle" font-style="italic"><tspan>Tertiary-butyl benzene is not oxidised: the ring carbon needs at least one hydrogen.</tspan></text>
