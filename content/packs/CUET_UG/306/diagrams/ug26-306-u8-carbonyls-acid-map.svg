  <text x="216.0" y="251.0" font-size="13" fill="#059669" text-anchor="middle"><tspan>then H</tspan><tspan dy="3.64" font-size="9.4">3</tspan><tspan dy="-3.64" font-size="13">O</tspan><tspan dy="-4.94" font-size="9.4">+</tspan></text>
  <rect x="14.0" y="239.0" width="140" height="42" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
