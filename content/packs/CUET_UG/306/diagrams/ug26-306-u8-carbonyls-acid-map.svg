  <text x="364.0" y="258.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>R–COOH</tspan></text>
  <line x1="424.0" y1="233.0" x2="450.0" y2="233.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
