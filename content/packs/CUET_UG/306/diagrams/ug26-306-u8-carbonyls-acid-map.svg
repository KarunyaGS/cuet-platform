<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 488" width="900" height="488" font-family="Arial, Helvetica, sans-serif">
  <text x="450.0" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>Carboxylic acid reaction map</tspan></text>
