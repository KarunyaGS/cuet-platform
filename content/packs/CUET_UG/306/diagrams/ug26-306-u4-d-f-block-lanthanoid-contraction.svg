<text x="520" y="306" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Ti</text>
<text x="520" y="131.6" font-size="13" fill="#1f2937" text-anchor="middle">~147 pm</text>
<rect x="570" y="98" width="50" height="192" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="595" y="306" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Zr</text>
<text x="595" y="90" font-size="13" fill="#1f2937" text-anchor="middle">~160 pm</text>
<rect x="645" y="101.19999999999999" width="50" height="188.8" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<text x="670" y="306" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Hf</text>
<text x="670" y="93.19999999999999" font-size="13" fill="#1f2937" text-anchor="middle">~159 pm</text>
<text x="595" y="60" font-size="13" fill="#1f2937" text-anchor="middle">Zr and Hf are almost equal in size:</text>
<text x="595" y="76" font-size="13" fill="#1f2937" text-anchor="middle">the 4f contraction cancels the new shell</text>
