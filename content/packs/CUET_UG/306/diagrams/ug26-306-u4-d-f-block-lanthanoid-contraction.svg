<circle cx="345" cy="215" r="5" fill="#dc2626" stroke="#dc2626" stroke-width="2"/>
<text x="105" y="58" font-size="13" fill="#dc2626" font-weight="bold">La<tspan dy="-5" font-size="75%">3+</tspan><tspan dy="5">: about 106 pm</tspan></text>
<text x="345" y="240" font-size="13" fill="#dc2626" text-anchor="end" font-weight="bold">Lu<tspan dy="-5" font-size="75%">3+</tspan><tspan dy="5">: about 85 pm</tspan></text>
<text x="200" y="120" font-size="13" fill="#1f2937">steady decrease across</text>
<text x="200" y="136" font-size="13" fill="#1f2937">the fourteen 4f elements</text>
<text x="230" y="24" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Lanthanoid contraction</text>
