  <text x="150" y="271" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>opposite to the leaving group X</tspan></text>
  <text x="450" y="255" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>C–Nu forming while C–X breaking;</tspan></text>
  <text x="450" y="271" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>three groups lie in one plane</tspan></text>
  <text x="735" y="255" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>groups flipped like an umbrella</tspan></text>
  <text x="735" y="271" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>in a gale: inverted configuration</tspan></text>
