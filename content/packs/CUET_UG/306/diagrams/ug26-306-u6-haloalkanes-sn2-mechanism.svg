  <text x="624" y="326" font-size="14" fill="#1f2937" text-anchor="start"><tspan>One step, no intermediate</tspan></text>
  <text x="624" y="345" font-size="14" fill="#1f2937" text-anchor="start"></text>
  <text x="624" y="364" font-size="14" fill="#1f2937" text-anchor="start"><tspan>Rate = k [R–X][Nu</tspan><tspan dy="-5.32" font-size="10.1">−</tspan><tspan dy="5.32" font-size="14">]</tspan></text>
  <text x="624" y="383" font-size="14" fill="#1f2937" text-anchor="start"><tspan>(second order)</tspan></text>
  <text x="624" y="402" font-size="14" fill="#1f2937" text-anchor="start"></text>
  <text x="624" y="421" font-size="14" fill="#1f2937" text-anchor="start"><tspan>Methyl &gt; 1° &gt; 2° &gt;&gt; 3°:</tspan></text>
