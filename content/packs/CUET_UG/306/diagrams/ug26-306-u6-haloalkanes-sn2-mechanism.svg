  <text x="624" y="459" font-size="14" fill="#1f2937" text-anchor="start"><tspan>backside attack</tspan></text>
  <text x="624" y="478" font-size="14" fill="#1f2937" text-anchor="start"></text>
  <text x="624" y="497" font-size="14" fill="#1f2937" text-anchor="start"><tspan>Needs a strong Nu</tspan><tspan dy="-5.32" font-size="10.1">−</tspan><tspan dy="5.32" font-size="14">;</tspan></text>
  <text x="624" y="516" font-size="14" fill="#1f2937" text-anchor="start"><tspan>favoured by polar aprotic</tspan></text>
  <text x="624" y="535" font-size="14" fill="#1f2937" text-anchor="start"><tspan>solvents</tspan></text>
