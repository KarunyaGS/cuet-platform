<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="Arial, Helvetica, sans-serif">
  <text x="380" y="28" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">Octahedral complex of type [MA<tspan font-size="11" dy="4">4</tspan><tspan dy="-4">B</tspan><tspan font-size="11" dy="4">2</tspan><tspan dy="-4">]</tspan></text>

  <!-- cis-[Co(NH3)4Cl2]+ centre (190,165) -->
  <polygon points="100,173 152,213 280,157 228,117" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g stroke="#1f2937" stroke-width="2.5">
    <line x1="190" y1="165" x2="190" y2="75"/><line x1="190" y1="165" x2="190" y2="255"/>
    <line x1="190" y1="165" x2="100" y2="173"/><line x1="190" y1="165" x2="280" y2="157"/>
    <line x1="190" y1="165" x2="152" y2="213"/><line x1="190" y1="165" x2="228" y2="117"/>
  </g>
  <!-- trans-[Co(NH3)4Cl2]+ centre (570,165) -->
  <polygon points="480,173 532,213 660,157 608,117" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g stroke="#1f2937" stroke-width="2.5">
    <line x1="570" y1="165" x2="570" y2="75"/><line x1="570" y1="165" x2="570" y2="255"/>
    <line x1="570" y1="165" x2="480" y2="173"/><line x1="570" y1="165" x2="660" y2="157"/>
    <line x1="570" y1="165" x2="532" y2="213"/><line x1="570" y1="165" x2="608" y2="117"/>
  </g>

  <!-- Cl ligands (green circles) -->
  <g fill="#ecfdf5" stroke="#059669" stroke-width="2">
    <circle cx="190" cy="75" r="17"/><circle cx="280" cy="157" r="17"/>
    <circle cx="570" cy="75" r="17"/><circle cx="570" cy="255" r="17"/>
  </g>
  <g font-size="14" fill="#059669" text-anchor="middle" font-weight="bold">
    <text x="190" y="80">Cl</text><text x="280" y="162">Cl</text>
    <text x="570" y="80">Cl</text><text x="570" y="260">Cl</text>
  </g>
  <!-- NH3 ligands (boxes) -->
  <g fill="#ffffff" stroke="#2563eb" stroke-width="1.5">
    <rect x="170" y="244" width="40" height="22" rx="5"/><rect x="80" y="162" width="40" height="22" rx="5"/>
    <rect x="132" y="202" width="40" height="22" rx="5"/><rect x="208" y="106" width="40" height="22" rx="5"/>
    <rect x="460" y="162" width="40" height="22" rx="5"/><rect x="640" y="146" width="40" height="22" rx="5"/>
    <rect x="512" y="202" width="40" height="22" rx="5"/><rect x="588" y="106" width="40" height="22" rx="5"/>
  </g>
  <g font-size="13" fill="#1f2937" text-anchor="middle">
    <text x="190" y="260">NH<tspan font-size="10" dy="3">3</tspan></text>
    <text x="100" y="178">NH<tspan font-size="10" dy="3">3</tspan></text>
    <text x="152" y="218">NH<tspan font-size="10" dy="3">3</tspan></text>
    <text x="228" y="122">NH<tspan font-size="10" dy="3">3</tspan></text>
    <text x="480" y="178">NH<tspan font-size="10" dy="3">3</tspan></text>
    <text x="660" y="162">NH<tspan font-size="10" dy="3">3</tspan></text>
    <text x="532" y="218">NH<tspan font-size="10" dy="3">3</tspan></text>
    <text x="608" y="122">NH<tspan font-size="10" dy="3">3</tspan></text>
  </g>
  <g fill="#dbeafe" stroke="#1f2937" stroke-width="2">
    <circle cx="190" cy="165" r="17"/><circle cx="570" cy="165" r="17"/>
  </g>
  <g font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">
    <text x="190" y="170">Co</text><text x="570" y="170">Co</text>
  </g>
  <g font-size="15" fill="#1f2937" text-anchor="middle">
    <text x="190" y="298" font-weight="bold">cis-[Co(NH<tspan font-size="11" dy="4">3</tspan><tspan dy="-4">)</tspan><tspan font-size="11" dy="4">4</tspan><tspan dy="-4">Cl</tspan><tspan font-size="11" dy="4">2</tspan><tspan dy="-4">]</tspan><tspan font-size="11" dy="-6">+</tspan></text>
    <text x="190" y="320">two Cl adjacent: Cl–Co–Cl = 90°</text>
    <text x="570" y="298" font-weight="bold">trans-[Co(NH<tspan font-size="11" dy="4">3</tspan><tspan dy="-4">)</tspan><tspan font-size="11" dy="4">4</tspan><tspan dy="-4">Cl</tspan><tspan font-size="11" dy="4">2</tspan><tspan dy="-4">]</tspan><tspan font-size="11" dy="-6">+</tspan></text>
    <text x="570" y="320">two Cl opposite: Cl–Co–Cl = 180°</text>
  </g>

  <line x1="20" y1="342" x2="740" y2="342" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="380" y="372" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">Square planar complex of type [MA<tspan font-size="11" dy="4">2</tspan><tspan dy="-4">B</tspan><tspan font-size="11" dy="4">2</tspan><tspan dy="-4">]</tspan></text>

  <!-- cis-[Pt(NH3)2Cl2] centre (190,480) -->
  <g stroke="#1f2937" stroke-width="2.5">
    <line x1="190" y1="480" x2="190" y2="410"/><line x1="190" y1="480" x2="190" y2="550"/>
    <line x1="190" y1="480" x2="110" y2="480"/><line x1="190" y1="480" x2="270" y2="480"/>
    <line x1="570" y1="480" x2="570" y2="410"/><line x1="570" y1="480" x2="570" y2="550"/>
    <line x1="570" y1="480" x2="490" y2="480"/><line x1="570" y1="480" x2="650" y2="480"/>
  </g>
  <g fill="#ecfdf5" stroke="#059669" stroke-width="2">
    <circle cx="190" cy="410" r="17"/><circle cx="270" cy="480" r="17"/>
    <circle cx="490" cy="480" r="17"/><circle cx="650" cy="480" r="17"/>
  </g>
  <g font-size="14" fill="#059669" text-anchor="middle" font-weight="bold">
    <text x="190" y="415">Cl</text><text x="270" y="485">Cl</text>
    <text x="490" y="485">Cl</text><text x="650" y="485">Cl</text>
  </g>
  <g fill="#ffffff" stroke="#2563eb" stroke-width="1.5">
    <rect x="90" y="469" width="40" height="22" rx="5"/><rect x="170" y="539" width="40" height="22" rx="5"/>
    <rect x="550" y="399" width="40" height="22" rx="5"/><rect x="550" y="539" width="40" height="22" rx="5"/>
  </g>
  <g font-size="13" fill="#1f2937" text-anchor="middle">
    <text x="110" y="485">NH<tspan font-size="10" dy="3">3</tspan></text>
    <text x="190" y="555">NH<tspan font-size="10" dy="3">3</tspan></text>
    <text x="570" y="415">NH<tspan font-size="10" dy="3">3</tspan></text>
    <text x="570" y="555">NH<tspan font-size="10" dy="3">3</tspan></text>
  </g>
  <g fill="#dbeafe" stroke="#1f2937" stroke-width="2">
    <circle cx="190" cy="480" r="17"/><circle cx="570" cy="480" r="17"/>
  </g>
  <g font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">
    <text x="190" y="485">Pt</text><text x="570" y="485">Pt</text>
  </g>
  <g font-size="15" fill="#1f2937" text-anchor="middle">
    <text x="190" y="598" font-weight="bold">cis-[Pt(NH<tspan font-size="11" dy="4">3</tspan><tspan dy="-4">)</tspan><tspan font-size="11" dy="4">2</tspan><tspan dy="-4">Cl</tspan><tspan font-size="11" dy="4">2</tspan><tspan dy="-4">]</tspan> (cisplatin)</text>
    <text x="190" y="620">Cl–Pt–Cl = 90°</text>
    <text x="570" y="598" font-weight="bold">trans-[Pt(NH<tspan font-size="11" dy="4">3</tspan><tspan dy="-4">)</tspan><tspan font-size="11" dy="4">2</tspan><tspan dy="-4">Cl</tspan><tspan font-size="11" dy="4">2</tspan><tspan dy="-4">]</tspan></text>
    <text x="570" y="620">Cl–Pt–Cl = 180°</text>
  </g>
</svg>
