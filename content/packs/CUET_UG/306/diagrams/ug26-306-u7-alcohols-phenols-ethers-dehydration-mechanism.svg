<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" font-family="Arial, Helvetica, sans-serif">
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">Acid-catalysed dehydration of ethanol (conc. H<tspan font-size="12" dy="4">2</tspan><tspan dy="-4">SO</tspan><tspan font-size="12" dy="4">4</tspan><tspan dy="-4">, 443 K) gives ethene</tspan></text>

  <!-- ================= STEP 1 ================= -->
  <text x="30" y="62" font-size="15" font-weight="bold" fill="#2563eb">Step 1: protonation of the alcohol (fast, reversible)</text>
  <g transform="translate(0,20)">
    <g font-size="18" fill="#1f2937">
      <text x="84" y="100" text-anchor="end">H<tspan font-size="12" dy="4">3</tspan><tspan dy="-4">C</tspan></text>
      <text x="114" y="100">CH<tspan font-size="12" dy="4">2</tspan></text>
      <text x="184" y="100" text-anchor="middle" fill="#dc2626" font-weight="bold">O</text>
      <text x="219" y="100">H</text>
      <text x="250" y="100">+</text>
      <text x="268" y="100">H<tspan font-size="12" dy="-7">+</tspan></text>
    </g>
    <g stroke="#1f2937" stroke-width="2">
      <line x1="88" y1="94" x2="110" y2="94"/>
      <line x1="150" y1="94" x2="172" y2="94"/>
      <line x1="196" y1="94" x2="216" y2="94"/>
    </g>
    <g fill="#1f2937">
      <circle cx="180" cy="77" r="2"/><circle cx="188" cy="77" r="2"/>
      <circle cx="180" cy="109" r="2"/><circle cx="188" cy="109" r="2"/>
    </g>
    <!-- curved arrow: O lone pair to H+ -->
    <path d="M 186 114 Q 230 150 270 112" fill="none" stroke="#dc2626" stroke-width="1.8"/>
    <polygon points="274,108 270.3,118.5 263.4,111.3" fill="#dc2626"/>
    <!-- equilibrium arrows -->
    <g stroke="#1f2937" stroke-width="2">
      <line x1="310" y1="89" x2="368" y2="89"/>
      <line x1="312" y1="99" x2="370" y2="99"/>
    </g>
    <polygon points="372,89 360,83 360,89" fill="#1f2937"/>
    <polygon points="308,99 320,105 320,99" fill="#1f2937"/>
    <!-- product: protonated ethanol -->
    <g font-size="18" fill="#1f2937">
      <text x="450" y="100" text-anchor="end">H<tspan font-size="12" dy="4">3</tspan><tspan dy="-4">C</tspan></text>
      <text x="480" y="100">CH<tspan font-size="12" dy="4">2</tspan></text>
      <text x="550" y="100" text-anchor="middle" fill="#dc2626" font-weight="bold">O</text>
      <text x="585" y="100">H</text>
      <text x="550" y="56" text-anchor="middle">H</text>
    </g>
    <g stroke="#1f2937" stroke-width="2">
      <line x1="454" y1="94" x2="476" y2="94"/>
      <line x1="516" y1="94" x2="538" y2="94"/>
      <line x1="562" y1="94" x2="582" y2="94"/>
      <line x1="550" y1="80" x2="550" y2="61"/>
    </g>
    <circle cx="568" cy="76" r="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="564" y1="76" x2="572" y2="76" stroke="#dc2626" stroke-width="1.8"/>
    <line x1="568" y1="72" x2="568" y2="80" stroke="#dc2626" stroke-width="1.8"/>
    <circle cx="546" cy="109" r="2" fill="#1f2937"/><circle cx="554" cy="109" r="2" fill="#1f2937"/>
    <text x="150" y="140" font-size="14" fill="#1f2937" text-anchor="middle">ethanol</text>
    <text x="530" y="140" font-size="14" fill="#1f2937" text-anchor="middle">protonated ethanol (ethyloxonium ion)</text>
  </g>

  <!-- ================= STEP 2 ================= -->
  <line x1="30" y1="178" x2="870" y2="178" stroke="#d1d5db" stroke-width="1"/>
  <text x="30" y="204" font-size="15" font-weight="bold" fill="#2563eb">Step 2: loss of water gives a carbocation (slow, rate-determining)</text>
  <g transform="translate(0,34)">
    <g font-size="18" fill="#1f2937">
      <text x="84" y="250" text-anchor="end">H<tspan font-size="12" dy="4">3</tspan><tspan dy="-4">C</tspan></text>
      <text x="114" y="250">CH<tspan font-size="12" dy="4">2</tspan></text>
      <text x="184" y="250" text-anchor="middle" fill="#dc2626" font-weight="bold">O</text>
      <text x="219" y="250">H</text>
      <text x="184" y="206" text-anchor="middle">H</text>
    </g>
    <g stroke="#1f2937" stroke-width="2">
      <line x1="88" y1="244" x2="110" y2="244"/>
      <line x1="150" y1="244" x2="172" y2="244"/>
      <line x1="196" y1="244" x2="216" y2="244"/>
      <line x1="184" y1="230" x2="184" y2="211"/>
    </g>
    <circle cx="202" cy="226" r="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="198" y1="226" x2="206" y2="226" stroke="#dc2626" stroke-width="1.8"/>
    <line x1="202" y1="222" x2="202" y2="230" stroke="#dc2626" stroke-width="1.8"/>
    <!-- curved arrow: C-O bond pair moves to O -->
    <path d="M 160 249 Q 162 284 180 268" fill="none" stroke="#dc2626" stroke-width="1.8"/>
    <polygon points="184,265 177.7,275.5 172.6,267.3" fill="#dc2626"/>
    <!-- arrow -->
    <line x1="262" y1="244" x2="330" y2="244" stroke="#1f2937" stroke-width="2"/>
    <polygon points="340,244 328,238 328,250" fill="#1f2937"/>
    <text x="300" y="234" font-size="13" fill="#1f2937" text-anchor="middle">slow</text>
    <!-- products -->
    <g font-size="18" fill="#1f2937">
      <text x="420" y="250" text-anchor="end">H<tspan font-size="12" dy="4">3</tspan><tspan dy="-4">C</tspan></text>
      <text x="450" y="250">CH<tspan font-size="12" dy="4">2</tspan></text>
      <text x="515" y="250">+</text>
      <text x="540" y="250">H<tspan font-size="12" dy="4">2</tspan><tspan dy="-4">O</tspan></text>
    </g>
    <line x1="424" y1="244" x2="446" y2="244" stroke="#1f2937" stroke-width="2"/>
    <circle cx="457" cy="223" r="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="453" y1="223" x2="461" y2="223" stroke="#dc2626" stroke-width="1.8"/>
    <line x1="457" y1="219" x2="457" y2="227" stroke="#dc2626" stroke-width="1.8"/>
    <text x="150" y="295" font-size="14" fill="#1f2937" text-anchor="middle">protonated ethanol</text>
    <text x="440" y="295" font-size="14" fill="#1f2937" text-anchor="middle">ethyl carbocation</text>
    <text x="660" y="244" font-size="14" fill="#1f2937">Carbocation stability: 3° &gt; 2° &gt; 1°,</text>
    <text x="660" y="264" font-size="14" fill="#1f2937">so ease of dehydration of</text>
    <text x="660" y="284" font-size="14" fill="#1f2937">alcohols is 3° &gt; 2° &gt; 1°</text>
  </g>

  <!-- ================= STEP 3 ================= -->
  <line x1="30" y1="350" x2="870" y2="350" stroke="#d1d5db" stroke-width="1"/>
  <text x="30" y="378" font-size="15" font-weight="bold" fill="#2563eb">Step 3: loss of a proton from the carbon next to C<tspan font-size="11" dy="-6">+</tspan><tspan dy="6"> forms the C=C bond</tspan></text>
  <g transform="translate(0,48)">
    <g font-size="18" fill="#1f2937" text-anchor="middle">
      <text x="80" y="440">H</text>
      <text x="120" y="440">C</text>
      <text x="120" y="398">H</text>
      <text x="120" y="482">H</text>
      <text x="190" y="440">C</text>
      <text x="190" y="398">H</text>
      <text x="190" y="482">H</text>
    </g>
    <g stroke="#1f2937" stroke-width="2">
      <line x1="88" y1="434" x2="110" y2="434"/>
      <line x1="130" y1="434" x2="180" y2="434"/>
      <line x1="120" y1="422" x2="120" y2="404"/>
      <line x1="120" y1="446" x2="120" y2="464"/>
      <line x1="190" y1="422" x2="190" y2="404"/>
      <line x1="190" y1="446" x2="190" y2="464"/>
    </g>
    <circle cx="208" cy="420" r="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="204" y1="420" x2="212" y2="420" stroke="#dc2626" stroke-width="1.8"/>
    <line x1="208" y1="416" x2="208" y2="424" stroke="#dc2626" stroke-width="1.8"/>
    <!-- curved arrow: C-H bond pair to C-C -->
    <path d="M 124 412 Q 152 402 154 426" fill="none" stroke="#dc2626" stroke-width="1.8"/>
    <polygon points="154.3,431 158.5,420.6 148.5,421.4" fill="#dc2626"/>
    <text x="18" y="400" font-size="13" fill="#dc2626">H lost as H<tspan font-size="10" dy="-6">+</tspan></text>
    <!-- arrow -->
    <line x1="262" y1="434" x2="330" y2="434" stroke="#1f2937" stroke-width="2"/>
    <polygon points="340,434 328,428 328,440" fill="#1f2937"/>
    <text x="300" y="424" font-size="13" fill="#1f2937" text-anchor="middle">fast</text>
    <!-- products -->
    <g font-size="18" fill="#1f2937">
      <text x="420" y="440" text-anchor="end">H<tspan font-size="12" dy="4">2</tspan><tspan dy="-4">C</tspan></text>
      <text x="456" y="440">CH<tspan font-size="12" dy="4">2</tspan></text>
      <text x="515" y="440">+</text>
      <text x="540" y="440">H<tspan font-size="12" dy="-7">+</tspan></text>
    </g>
    <g stroke="#1f2937" stroke-width="2">
      <line x1="424" y1="429" x2="452" y2="429"/>
      <line x1="424" y1="438" x2="452" y2="438"/>
    </g>
    <text x="150" y="508" font-size="14" fill="#1f2937" text-anchor="middle">ethyl carbocation</text>
    <text x="440" y="508" font-size="14" fill="#1f2937" text-anchor="middle">ethene</text>
    <text x="660" y="430" font-size="14" fill="#1f2937">H<tspan font-size="10" dy="-6">+</tspan><tspan dy="6"> is given back, so the</tspan></text>
    <text x="660" y="450" font-size="14" fill="#1f2937">acid acts as a catalyst</text>
  </g>
</svg>
