<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="Arial, Helvetica, sans-serif">
  <line x1="120" y1="390" x2="650" y2="390" stroke="#1f2937" stroke-width="2"/>
  <polygon points="660,390 648,384 648,396" fill="#1f2937"/>
  <line x1="120" y1="390" x2="120" y2="80" stroke="#1f2937" stroke-width="2"/>
  <polygon points="120,68 114,80 126,80" fill="#1f2937"/>
  <line x1="620" y1="390" x2="620" y2="80" stroke="#1f2937" stroke-width="2"/>
  <text x="40" y="240" font-size="15" fill="#1f2937" text-anchor="middle" transform="rotate(-90 40 240)">Vapour pressure p (bar)</text>
  <line x1="120" y1="260" x2="620" y2="390" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="120" y1="390" x2="620" y2="120" stroke="#059669" stroke-width="2.5"/>
  <line x1="120" y1="260" x2="620" y2="120" stroke="#dc2626" stroke-width="3"/>
  <text x="112" y="265" font-size="15" fill="#2563eb" text-anchor="end">p₁°</text>
  <text x="628" y="125" font-size="15" fill="#059669">p₂°</text>
  <text x="112" y="395" font-size="14" fill="#1f2937" text-anchor="end">0</text>
  <text x="160" y="188" font-size="15" fill="#dc2626">total pressure p = p₁ + p₂</text>
  <text x="470" y="205" font-size="15" fill="#059669">p₂ = x₂ p₂°</text>
  <text x="178" y="320" font-size="15" fill="#2563eb">p₁ = x₁ p₁°</text>
  <line x1="420" y1="390" x2="420" y2="176" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="420" cy="338" r="4" fill="#2563eb"/>
  <circle cx="420" cy="228" r="4" fill="#059669"/>
  <circle cx="420" cy="176" r="4" fill="#dc2626"/>
  <text x="428" y="382" font-size="13" fill="#6b7280">x₂ = 0.6</text>
  <text x="120" y="414" font-size="14" fill="#1f2937" text-anchor="middle">x₁ = 1</text>
  <text x="120" y="432" font-size="14" fill="#1f2937" text-anchor="middle">x₂ = 0</text>
  <text x="620" y="414" font-size="14" fill="#1f2937" text-anchor="middle">x₁ = 0</text>
  <text x="620" y="432" font-size="14" fill="#1f2937" text-anchor="middle">x₂ = 1</text>
  <text x="370" y="424" font-size="15" fill="#1f2937" text-anchor="middle">Mole fraction (x₂ increases to the right)</text>
  <text x="130" y="60" font-size="13" fill="#2563eb">pure component 1</text>
  <text x="610" y="60" font-size="13" fill="#059669" text-anchor="end">pure component 2</text>
  <text x="380" y="462" font-size="14" fill="#1f2937" text-anchor="middle">Ideal solution at constant temperature: all three lines are straight (Raoult's law)</text>
</svg>
