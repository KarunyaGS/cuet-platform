<text x="310" y="24" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Ideal solution: both partial pressures are straight lines</text>
<text x="310" y="378" font-size="13" fill="#6b7280" text-anchor="middle">Illustrative values with p<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">° &gt; p</tspan><tspan dy="4" font-size="75%">1</tspan><tspan dy="-4">° (component 2 more volatile).</tspan></text>
