<text x="400" y="250" font-size="14" fill="#2563eb" font-weight="bold">p<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4"> = x</tspan><tspan dy="4" font-size="75%">1</tspan><tspan dy="-4">p</tspan><tspan dy="4" font-size="75%">1</tspan><tspan dy="-4">°</tspan></text>
