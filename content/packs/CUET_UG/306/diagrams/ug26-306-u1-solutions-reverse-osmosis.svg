<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Arial, Helvetica, sans-serif">
  <!-- liquids -->
  <rect x="82" y="182" width="296" height="196" fill="#fde68a"/>
  <rect x="384" y="250" width="294" height="128" fill="#dbeafe"/>
  <!-- container -->
  <polyline points="80,110 80,380 680,380 680,110" fill="none" stroke="#1f2937" stroke-width="2.5"/>
  <line x1="386" y1="250" x2="678" y2="250" stroke="#2563eb" stroke-width="1.5"/>
  <!-- membrane -->
  <line x1="381" y1="110" x2="381" y2="380" stroke="#059669" stroke-width="4" stroke-dasharray="6 3"/>
  <!-- piston on sea water -->
  <rect x="84" y="166" width="294" height="16" fill="#9ca3af" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="230" y1="166" x2="230" y2="90" stroke="#1f2937" stroke-width="4"/>
  <line x1="300" y1="60" x2="300" y2="146" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="300,160 294,146 306,146" fill="#dc2626"/>
  <line x1="160" y1="60" x2="160" y2="146" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="160,160 154,146 166,146" fill="#dc2626"/>
  <text x="230" y="40" font-size="15" fill="#dc2626" text-anchor="middle">applied pressure greater than π</text>
  <!-- salt ions retained -->
  <circle cx="130" cy="240" r="6" fill="#dc2626"/><circle cx="190" cy="300" r="6" fill="#dc2626"/>
  <circle cx="250" cy="225" r="6" fill="#dc2626"/><circle cx="330" cy="358" r="6" fill="#dc2626"/>
  <circle cx="150" cy="345" r="6" fill="#dc2626"/><circle cx="340" cy="230" r="6" fill="#dc2626"/>
  <text x="105" y="210" font-size="14" fill="#1f2937">sea water (salt solution)</text>
  <text x="100" y="372" font-size="13" fill="#dc2626">salt ions cannot pass</text>
  <!-- water flow arrows (reverse of osmosis) -->
  <line x1="300" y1="270" x2="452" y2="270" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="464,270 452,264 452,276" fill="#2563eb"/>
  <line x1="300" y1="300" x2="452" y2="300" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="464,300 452,294 452,306" fill="#2563eb"/>
  <line x1="300" y1="330" x2="452" y2="330" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="464,330 452,324 452,336" fill="#2563eb"/>
  <text x="485" y="290" font-size="14" fill="#2563eb">water molecules forced</text>
  <text x="485" y="307" font-size="14" fill="#2563eb">through the membrane</text>
  <text x="560" y="355" font-size="14" fill="#1f2937" text-anchor="middle">fresh (pure) water</text>
  <text x="395" y="100" font-size="14" fill="#059669">semipermeable membrane</text>
  <text x="395" y="117" font-size="14" fill="#059669">(e.g. cellulose acetate film)</text>
  <text x="380" y="420" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Reverse osmosis: solvent flows from the solution side to the pure-solvent side</text>
</svg>
