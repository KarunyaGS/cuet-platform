<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 716" width="860" height="716" font-family="Arial, Helvetica, sans-serif">
  <text x="430" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>SN1: two steps, carbocation intermediate, racemisation</tspan></text>
  <text x="150" y="62" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="bold"><tspan>Step 1 (slow)</tspan></text>
  <text x="440" y="62" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="bold"><tspan>Carbocation (planar)</tspan></text>
  <text x="735" y="62" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="bold"><tspan>Step 2 (fast)</tspan></text>
  <line x1="140" y1="190" x2="190" y2="190" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="208" y="195" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold"><tspan>X</tspan></text>
  <line x1="130" y1="179" x2="130" y2="140" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="130" y="135" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>R</tspan><tspan dy="-5.32" font-size="10.1">1</tspan></text>
  <polygon points="123,196 83.1,217.9 88.9,226.1" fill="#1f2937" stroke="none" stroke-width="1"/>
  <text x="72" y="241" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>R</tspan><tspan dy="-5.32" font-size="10.1">2</tspan></text>
  <line x1="134" y1="201" x2="152" y2="230" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"/>
  <text x="160" y="249" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>R</tspan><tspan dy="-5.32" font-size="10.1">3</tspan></text>
  <text x="130" y="195" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>C</tspan></text>
  <line x1="215" y1="190" x2="275.0" y2="190.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="285,190 274.0,195.0 274.0,185.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <text x="250" y="175" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold"><tspan>slow</tspan></text>
  <line x1="426" y1="179" x2="426" y2="140" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="426" y="135" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>R</tspan><tspan dy="-5.32" font-size="10.1">1</tspan></text>
  <line x1="420" y1="196" x2="378" y2="220" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="362" y="235" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>R</tspan><tspan dy="-5.32" font-size="10.1">2</tspan></text>
  <line x1="440" y1="196" x2="482" y2="220" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="498" y="235" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>R</tspan><tspan dy="-5.32" font-size="10.1">3</tspan></text>
  <text x="430" y="195" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>C</tspan><tspan dy="-6.08" font-size="11.5">+</tspan></text>
  <text x="430" y="270" font-size="13" fill="#4b5563" text-anchor="middle" font-style="italic"><tspan>sp</tspan><tspan dy="-4.94" font-size="9.4">2</tspan><tspan dy="4.94" font-size="13">, trigonal planar, 120°</tspan></text>
  <text x="325" y="128" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold"><tspan>X</tspan><tspan dy="-6.08" font-size="11.5">−</tspan></text>
  <line x1="352" y1="164" x2="338.4326645318008" y2="147.41770109442325" stroke="#059669" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="3 3"/>
  <polygon points="334,142 342.2,145.7 336.0,150.7" fill="#059669" stroke="none" stroke-width="1"/>
  <line x1="520" y1="190" x2="580.0" y2="190.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="590,190 579.0,195.0 579.0,185.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <text x="737" y="106" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold"><tspan>Nu</tspan><tspan dy="-6.08" font-size="11.5">−</tspan></text>
  <line x1="737" y1="116" x2="737.0" y2="158.0" stroke="#dc2626" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="737,168 732.0,157.0 742.0,157.0" fill="#dc2626" stroke="none" stroke-width="1"/>
  <text x="769" y="140" font-size="13" fill="#4b5563" text-anchor="start"><tspan>face 1</tspan></text>
  <text x="737" y="284" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold"><tspan>Nu</tspan><tspan dy="-6.08" font-size="11.5">−</tspan></text>
  <line x1="737" y1="262" x2="737.0" y2="222.0" stroke="#dc2626" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="737,212 742.0,223.0 732.0,223.0" fill="#dc2626" stroke="none" stroke-width="1"/>
  <text x="769" y="244" font-size="13" fill="#4b5563" text-anchor="start"><tspan>face 2</tspan></text>
  <line x1="725" y1="194" x2="683" y2="212" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="665" y="225" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>R</tspan><tspan dy="-5.32" font-size="10.1">1</tspan></text>
  <line x1="747" y1="194" x2="789" y2="212" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="807" y="225" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>R</tspan><tspan dy="-5.32" font-size="10.1">2</tspan></text>
  <text x="735" y="195" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>C</tspan><tspan dy="-6.08" font-size="11.5">+</tspan></text>
  <text x="150" y="312" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>The C–X bond breaks first,</tspan></text>
  <text x="150" y="328" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>by itself, unaided by Nu</tspan><tspan dy="-4.94" font-size="9.4">−</tspan></text>
  <text x="440" y="312" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>R</tspan><tspan dy="-4.94" font-size="9.4">1</tspan><tspan dy="4.94" font-size="13">, R</tspan><tspan dy="-4.94" font-size="9.4">2</tspan><tspan dy="4.94" font-size="13">, R</tspan><tspan dy="-4.94" font-size="9.4">3</tspan><tspan dy="4.94" font-size="13"> and C</tspan><tspan dy="-4.94" font-size="9.4">+</tspan><tspan dy="4.94" font-size="13"> lie in one</tspan></text>
  <text x="440" y="328" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>plane: either face is open</tspan></text>
  <text x="735" y="312" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>Both faces attacked equally: equal</tspan></text>
  <text x="735" y="328" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>amounts of both enantiomers</tspan></text>
  <text x="735" y="344" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>(R</tspan><tspan dy="-4.94" font-size="9.4">3</tspan><tspan dy="4.94" font-size="13"> is hidden behind C</tspan><tspan dy="-4.94" font-size="9.4">+</tspan><tspan dy="4.94" font-size="13"> here)</tspan></text>
  <line x1="90" y1="660" x2="550.0" y2="660.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="560,660 549.0,665.0 549.0,655.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <line x1="90" y1="660" x2="90.0" y2="395.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="90,385 95.0,396.0 85.0,396.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <text x="325.0" y="686" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>Reaction coordinate</tspan></text>
  <text x="60" y="522.5" font-size="14" fill="#1f2937" text-anchor="middle" transform="rotate(-90 60 522.5)">Potential energy</text>
  <path d="M105,595 L150,595 C180,595 190,437 235,437 C280,437 280,513 315,513 C345,513 345,477 380,477 C418,477 428,620 480,620 L545,620" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="128" y="583" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>R–X + Nu</tspan><tspan dy="-5.32" font-size="10.1">−</tspan></text>
  <text x="235" y="421" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold"><tspan>TS 1 (higher)</tspan></text>
  <text x="190" y="467" font-size="13" fill="#dc2626" text-anchor="end" font-weight="bold"><tspan>slow step</tspan></text>
  <text x="315" y="537" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>R</tspan><tspan dy="3.92" font-size="10.1">3</tspan><tspan dy="-3.92" font-size="14">C</tspan><tspan dy="-5.32" font-size="10.1">+</tspan><tspan dy="5.32" font-size="14"> + X</tspan><tspan dy="-5.32" font-size="10.1">−</tspan><tspan dy="5.32" font-size="14"> + Nu</tspan><tspan dy="-5.32" font-size="10.1">−</tspan></text>
  <text x="315" y="554" font-size="13" fill="#4b5563" text-anchor="middle" font-style="italic"><tspan>intermediate</tspan></text>
  <text x="392" y="462" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold"><tspan>TS 2</tspan></text>
  <text x="505" y="610" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>R–Nu + X</tspan><tspan dy="-5.32" font-size="10.1">−</tspan></text>
  <text x="320" y="706" font-size="13" fill="#4b5563" text-anchor="middle" font-style="italic"><tspan>Illustrative shape only, not to scale</tspan></text>
  <rect x="610" y="395" width="238" height="262" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="624" y="421" font-size="14" fill="#1f2937" text-anchor="start"><tspan>Two steps, one intermediate</tspan></text>
  <text x="624" y="440" font-size="14" fill="#1f2937" text-anchor="start"></text>
  <text x="624" y="459" font-size="14" fill="#1f2937" text-anchor="start"><tspan>Rate = k [R–X]</tspan></text>
  <text x="624" y="478" font-size="14" fill="#1f2937" text-anchor="start"><tspan>(first order: Nu</tspan><tspan dy="-5.32" font-size="10.1">−</tspan><tspan dy="5.32" font-size="14"> absent)</tspan></text>
  <text x="624" y="497" font-size="14" fill="#1f2937" text-anchor="start"></text>
  <text x="624" y="516" font-size="14" fill="#1f2937" text-anchor="start"><tspan>3° &gt; 2° &gt; 1° &gt; methyl:</tspan></text>
  <text x="624" y="535" font-size="14" fill="#1f2937" text-anchor="start"><tspan>the tertiary carbocation is</tspan></text>
  <text x="624" y="554" font-size="14" fill="#1f2937" text-anchor="start"><tspan>the most stable</tspan></text>
  <text x="624" y="573" font-size="14" fill="#1f2937" text-anchor="start"></text>
  <text x="624" y="592" font-size="14" fill="#1f2937" text-anchor="start"><tspan>Favoured by polar protic</tspan></text>
  <text x="624" y="611" font-size="14" fill="#1f2937" text-anchor="start"><tspan>solvents and weak Nu</tspan><tspan dy="-5.32" font-size="10.1">−</tspan></text>
</svg>
