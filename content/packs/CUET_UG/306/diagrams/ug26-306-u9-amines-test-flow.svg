<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" width="860" height="620" font-family="Arial, Helvetica, sans-serif">
  <text x="430" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>Telling primary, secondary and tertiary amines apart</tspan></text>
  <rect x="250.0" y="47.0" width="360" height="38" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="430" y="71.25" font-size="15" fill="#1f2937" text-anchor="middle"><tspan>Unknown amine (not a salt, not an amide)</tspan></text>
  <line x1="430" y1="86" x2="430.0" y2="106.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="430,116 425.0,105.0 435.0,105.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <rect x="220.0" y="120.0" width="420" height="52" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="430" y="141.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>Hinsberg test: shake with benzenesulfonyl chloride</tspan></text>
  <text x="430" y="159.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>(C</tspan><tspan dy="3.92" font-size="10.1">6</tspan><tspan dy="-3.92" font-size="14">H</tspan><tspan dy="3.92" font-size="10.1">5</tspan><tspan dy="-3.92" font-size="14">SO</tspan><tspan dy="3.92" font-size="10.1">2</tspan><tspan dy="-3.92" font-size="14">Cl) and aqueous KOH</tspan></text>
  <line x1="330" y1="172" x2="159.4221469027914" y2="232.64990332345195" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="150,236 158.7,227.6 162.0,237.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <line x1="430" y1="172" x2="430.0" y2="226.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="430,236 425.0,225.0 435.0,225.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <line x1="530" y1="172" x2="700.5778530972086" y2="232.64990332345195" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="710,236 698.0,237.0 701.3,227.6" fill="#1f2937" stroke="none" stroke-width="1"/>
  <text x="150" y="206" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold"><tspan>sulfonamide formed,</tspan></text>
  <text x="150" y="222" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold"><tspan>dissolves in KOH</tspan></text>
  <text x="444" y="212" font-size="13" fill="#2563eb" text-anchor="start" font-weight="bold"><tspan>sulfonamide formed,</tspan></text>
  <text x="444" y="228" font-size="13" fill="#2563eb" text-anchor="start" font-weight="bold"><tspan>insoluble in KOH</tspan></text>
  <text x="720" y="206" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold"><tspan>no sulfonamide</tspan></text>
  <text x="720" y="222" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold"><tspan>(no reaction)</tspan></text>
  <rect x="45.0" y="252.0" width="210" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="150" y="279.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>Primary amine</tspan></text>
  <rect x="325.0" y="252.0" width="210" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="430" y="279.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>Secondary amine</tspan></text>
  <rect x="605.0" y="252.0" width="210" height="44" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="710" y="279.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>Tertiary amine</tspan></text>
  <text x="150" y="330" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>N-alkylbenzenesulfonamide has an</tspan></text>
  <text x="150" y="346" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>acidic N–H, so it forms a</tspan></text>
  <text x="150" y="362" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>soluble salt with KOH</tspan></text>
  <text x="430" y="330" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>N,N-dialkylbenzenesulfonamide</tspan></text>
  <text x="430" y="346" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>has no N–H: nothing acidic</tspan></text>
  <text x="430" y="362" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>to dissolve it</tspan></text>
  <text x="710" y="330" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>No N–H and no way to</tspan></text>
  <text x="710" y="346" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>form a stable sulfonamide</tspan></text>
  <text x="430" y="408" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>Confirm with a second test</tspan></text>
  <line x1="40" y1="416" x2="820" y2="416" stroke="#4b5563" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
  <rect x="35.0" y="438.0" width="230" height="104" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="150" y="467.55" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>Carbylamine test</tspan></text>
  <text x="150" y="485.55" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>CHCl</tspan><tspan dy="3.64" font-size="9.4">3</tspan><tspan dy="-3.64" font-size="13"> + alc. KOH, warm:</tspan></text>
  <text x="150" y="503.55" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>foul-smelling isocyanide</tspan></text>
  <text x="150" y="521.55" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>(only primary amines)</tspan></text>
  <rect x="315.0" y="438.0" width="230" height="104" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="430" y="467.55" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>Nitrous acid</tspan></text>
  <text x="430" y="485.55" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>(NaNO</tspan><tspan dy="3.64" font-size="9.4">2</tspan><tspan dy="-3.64" font-size="13"> + HCl):</tspan></text>
  <text x="430" y="503.55" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>yellow oily N-nitrosoamine</tspan></text>
  <text x="430" y="521.55" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>R</tspan><tspan dy="3.64" font-size="9.4">2</tspan><tspan dy="-3.64" font-size="13">N–N=O</tspan></text>
  <rect x="595.0" y="438.0" width="230" height="104" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="710" y="467.55" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>Nitrous acid</tspan></text>
  <text x="710" y="485.55" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>(aliphatic tertiary amine):</tspan></text>
  <text x="710" y="503.55" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>dissolves, forming a salt;</tspan></text>
  <text x="710" y="521.55" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>no gas, no oil</tspan></text>
  <text x="430" y="586" font-size="13" fill="#4b5563" text-anchor="middle" font-style="italic"><tspan>Aliphatic primary amines with nitrous acid give N</tspan><tspan dy="3.64" font-size="9.4">2</tspan><tspan dy="-3.64" font-size="13"> gas and an alcohol; aromatic ones give a diazonium salt at 273–278 K.</tspan></text>
  <text x="430" y="606" font-size="13" fill="#4b5563" text-anchor="middle" font-style="italic"><tspan>Acylation also separates them: primary and secondary form amides, tertiary does not.</tspan></text>
</svg>
