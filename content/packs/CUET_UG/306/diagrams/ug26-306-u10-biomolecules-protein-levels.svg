  <text x="525" y="264" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>right-handed coil</tspan></text>
  <polyline points="645.0,119.0 664.1,105.0 683.2,119.0 702.4,105.0 721.5,119.0 740.6,105.0 759.8,119.0 778.9,105.0 798.0,119.0" fill="none" stroke="#059669" stroke-width="2.6" stroke-linejoin="round"/>
