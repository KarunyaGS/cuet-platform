  <line x1="778.875" y1="158" x2="778.875" y2="180" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 3"/>
  <text x="727" y="232" font-size="14" fill="#059669" text-anchor="middle" font-weight="bold"><tspan>β-pleated sheet</tspan></text>
  <text x="727" y="250" font-size="13" fill="#4b5563" text-anchor="middle"><tspan>neighbouring chains side by side</tspan></text>
  <text x="640" y="284" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>held by C=O ··· H–N hydrogen bonds (red dashes)</tspan></text>
  <text x="220" y="336" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>3. Tertiary: folding of one chain in 3-D</tspan></text>
