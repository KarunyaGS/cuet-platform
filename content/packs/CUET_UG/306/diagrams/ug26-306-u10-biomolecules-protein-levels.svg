  <line x1="160" y1="372" x2="150" y2="420" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="4 3"/>
  <line x1="230" y1="385" x2="205" y2="430" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="4 3"/>
  <text x="284" y="392" font-size="13" fill="#d97706" text-anchor="start" font-weight="bold"><tspan>disulfide bridge</tspan></text>
  <text x="284" y="408" font-size="13" fill="#d97706" text-anchor="start"><tspan>S–S (covalent)</tspan></text>
  <text x="284" y="436" font-size="13" fill="#2563eb" text-anchor="start" font-weight="bold"><tspan>hydrogen bond</tspan></text>
  <text x="284" y="464" font-size="13" fill="#dc2626" text-anchor="start" font-weight="bold"><tspan>ionic (salt) bridge</tspan></text>
  <text x="284" y="492" font-size="13" fill="#1f2937" text-anchor="start"><tspan>van der Waals and</tspan></text>
  <text x="284" y="508" font-size="13" fill="#1f2937" text-anchor="start"><tspan>hydrophobic forces</tspan></text>
  <text x="640" y="336" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>4. Quaternary: subunits together</tspan></text>
  <ellipse cx="590" cy="420" rx="42" ry="32" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
