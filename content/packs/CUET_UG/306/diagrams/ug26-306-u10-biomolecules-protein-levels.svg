<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" width="860" height="580" font-family="Arial, Helvetica, sans-serif">
  <text x="430" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>Four levels of protein structure</tspan></text>
  <rect x="20" y="44" width="400" height="250" rx="10" fill="#ffffff" stroke="#4b5563" stroke-width="1.3"/>
  <rect x="440" y="44" width="400" height="250" rx="10" fill="#ffffff" stroke="#4b5563" stroke-width="1.3"/>
  <rect x="20" y="310" width="400" height="250" rx="10" fill="#ffffff" stroke="#4b5563" stroke-width="1.3"/>
  <rect x="440" y="310" width="400" height="250" rx="10" fill="#ffffff" stroke="#4b5563" stroke-width="1.3"/>
  <text x="220" y="70" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>1. Primary: the amino acid sequence</tspan></text>
  <circle cx="72" cy="160" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="72" y="165" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>Gly</tspan></text>
  <line x1="89" y1="160" x2="113" y2="160" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="130" cy="160" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="130" y="165" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>Ala</tspan></text>
  <line x1="147" y1="160" x2="171" y2="160" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="188" cy="160" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="188" y="165" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>Ser</tspan></text>
  <line x1="205" y1="160" x2="229" y2="160" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="246" cy="160" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="246" y="165" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>Val</tspan></text>
  <line x1="263" y1="160" x2="287" y2="160" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="304" cy="160" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="304" y="165" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>Lys</tspan></text>
  <line x1="321" y1="160" x2="345" y2="160" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="362" cy="160" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="362" y="165" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>Glu</tspan></text>
  <text x="72" y="128" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold"><tspan>N-end</tspan></text>
  <text x="362" y="128" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold"><tspan>C-end</tspan></text>
  <text x="217.0" y="205" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>each line = a peptide bond (covalent)</tspan></text>
  <text x="220" y="250" font-size="13" fill="#4b5563" text-anchor="middle" font-style="italic"><tspan>The order of amino acids is fixed by the gene.</tspan></text>
  <text x="220" y="268" font-size="13" fill="#4b5563" text-anchor="middle" font-style="italic"><tspan>Sequence shown is only an example.</tspan></text>
  <text x="640" y="70" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>2. Secondary: local folding</tspan></text>
  <path d="M493,104 C493,122 557,122 557,104" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M557,104 C557,92 493,116 493,128" fill="none" stroke="#4b5563" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
