  <path d="M664,508 C666.7,504.0 674.7,483.7 680,484 C685.3,484.3 690.3,509.3 696,510 C701.7,510.7 711.0,491.7 714,488 " fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="690" y="526" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold"><tspan>α</tspan></text>
  <text x="640" y="364" font-size="13" fill="#1f2937" text-anchor="middle"><tspan>e.g. haemoglobin: 4 polypeptide chains</tspan></text>
  <text x="640" y="552" font-size="13" fill="#4b5563" text-anchor="middle" font-style="italic"><tspan>subunits held by non-covalent forces</tspan></text>
</svg>
