<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="Arial, Helvetica, sans-serif">
  <!-- x = 80 + 10 t (s), y = 370 - 280 c (mol/L); [R] = exp(-0.05 t), [P] = 1 - [R] -->
  <line x1="80" y1="370" x2="606" y2="370" stroke="#1f2937" stroke-width="2"/>
  <polygon points="616,370 604,364 604,376" fill="#1f2937"/>
  <line x1="80" y1="370" x2="80" y2="62" stroke="#1f2937" stroke-width="2"/>
  <polygon points="80,52 74,64 86,64" fill="#1f2937"/>
  <text x="92" y="56" font-size="15" fill="#1f2937">Concentration (mol L⁻¹)</text>
  <text x="616" y="410" font-size="15" fill="#1f2937" text-anchor="end">Time t (s)</text>
  <g stroke="#1f2937" stroke-width="1.5">
    <line x1="180" y1="370" x2="180" y2="376"/><line x1="280" y1="370" x2="280" y2="376"/>
    <line x1="380" y1="370" x2="380" y2="376"/><line x1="480" y1="370" x2="480" y2="376"/>
    <line x1="580" y1="370" x2="580" y2="376"/>
    <line x1="74" y1="300" x2="80" y2="300"/><line x1="74" y1="230" x2="80" y2="230"/>
    <line x1="74" y1="160" x2="80" y2="160"/><line x1="74" y1="90" x2="80" y2="90"/>
  </g>
  <g font-size="13" fill="#1f2937" text-anchor="middle">
    <text x="80" y="390">0</text><text x="180" y="390">10</text><text x="280" y="390">20</text>
    <text x="380" y="390">30</text><text x="480" y="390">40</text><text x="580" y="390">50</text>
  </g>
  <g font-size="13" fill="#1f2937" text-anchor="end">
    <text x="70" y="304">0.25</text><text x="70" y="234">0.50</text><text x="70" y="164">0.75</text><text x="70" y="94">1.00</text>
  </g>

  <!-- curves -->
  <path d="M80.0,90.0 L92.5,107.0 L105.0,122.9 L117.5,137.9 L130.0,151.9 L142.5,165.1 L155.0,177.6 L167.5,189.2 L180.0,200.2 L192.5,210.5 L205.0,220.1 L217.5,229.2 L230.0,237.7 L242.5,245.8 L255.0,253.3 L267.5,260.4 L280.0,267.0 L292.5,273.2 L305.0,279.1 L317.5,284.6 L330.0,289.8 L342.5,294.6 L355.0,299.2 L367.5,303.5 L380.0,307.5 L392.5,311.3 L405.0,314.9 L417.5,318.2 L430.0,321.3 L442.5,324.3 L455.0,327.1 L467.5,329.7 L480.0,332.1 L492.5,334.4 L505.0,336.6 L517.5,338.6 L530.0,340.5 L542.5,342.3 L555.0,344.0 L567.5,345.5 L580.0,347.0" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M80.0,370.0 L92.5,353.0 L105.0,337.1 L117.5,322.1 L130.0,308.1 L142.5,294.9 L155.0,282.4 L167.5,270.8 L180.0,259.8 L192.5,249.5 L205.0,239.9 L217.5,230.8 L230.0,222.3 L242.5,214.2 L255.0,206.7 L267.5,199.6 L280.0,193.0 L292.5,186.8 L305.0,180.9 L317.5,175.4 L330.0,170.2 L342.5,165.4 L355.0,160.8 L367.5,156.5 L380.0,152.5 L392.5,148.7 L405.0,145.1 L417.5,141.8 L430.0,138.7 L442.5,135.7 L455.0,132.9 L467.5,130.3 L480.0,127.9 L492.5,125.6 L505.0,123.4 L517.5,121.4 L530.0,119.5 L542.5,117.7 L555.0,116.0 L567.5,114.5 L580.0,113.0" fill="none" stroke="#059669" stroke-width="2.5"/>
  <text x="588" y="352" font-size="15" fill="#2563eb">[R]</text>
  <text x="588" y="118" font-size="15" fill="#059669">[P]</text>

  <!-- tangent at A (t = 10 s) -->
  <line x1="100" y1="132.3" x2="280" y2="285.1" stroke="#dc2626" stroke-width="2"/>
  <circle cx="180" cy="200.2" r="4.5" fill="#dc2626"/>
  <text x="190" y="192" font-size="15" fill="#dc2626">A</text>
  <text x="196" y="104" font-size="14" fill="#dc2626">Tangent at A (t = 10 s):</text>
  <text x="196" y="122" font-size="14" fill="#dc2626">slope = −(instantaneous rate)</text>

  <!-- chord BC (t = 25 s to 45 s) -->
  <line x1="330" y1="289.8" x2="530" y2="340.5" stroke="#d97706" stroke-width="2.5"/>
  <line x1="330" y1="289.8" x2="530" y2="289.8" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="530" y1="289.8" x2="530" y2="340.5" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="330" cy="289.8" r="4.5" fill="#d97706"/>
  <circle cx="530" cy="340.5" r="4.5" fill="#d97706"/>
  <text x="324" y="283" font-size="15" fill="#d97706" text-anchor="end">B</text>
  <text x="526" y="360" font-size="15" fill="#d97706" text-anchor="end">C</text>
  <text x="440" y="306" font-size="14" fill="#1f2937" text-anchor="middle">Δt</text>
  <text x="538" y="320" font-size="14" fill="#1f2937">Δ[R]</text>
  <text x="372" y="246" font-size="14" fill="#d97706">Chord BC: slope = −(average rate)</text>
  <text x="372" y="264" font-size="14" fill="#d97706">average rate = −Δ[R]/Δt</text>

  <!-- legend -->
  <line x1="400" y1="68" x2="430" y2="68" stroke="#2563eb" stroke-width="2.5"/>
  <text x="438" y="73" font-size="14" fill="#1f2937">[R]: reactant, falls</text>
  <line x1="400" y1="90" x2="430" y2="90" stroke="#059669" stroke-width="2.5"/>
  <text x="438" y="95" font-size="14" fill="#1f2937">[P]: product, rises</text>
</svg>
