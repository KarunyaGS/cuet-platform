<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" font-family="Arial, Helvetica, sans-serif">
<line x1="60" y1="290" x2="320" y2="290" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><polygon points="328.0,290.0 319.6,286.7 319.6,293.3" fill="#1f2937"/><line x1="60" y1="290" x2="60" y2="70" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><polygon points="60.0,62.0 56.7,70.4 63.3,70.4" fill="#1f2937"/><text x="190" y="328" font-size="14" fill="#1f2937" text-anchor="middle">time t</text><text x="24" y="180" font-size="14" fill="#1f2937" text-anchor="middle" transform="rotate(-90 24 180)">[R]</text>
<text x="190" y="22" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Zero order</text>
<line x1="60" y1="70" x2="295" y2="260" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
<circle cx="60" cy="70" r="4" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<text x="70" y="60" font-size="13" fill="#2563eb" font-weight="bold">intercept = [R]<tspan dy="4" font-size="75%">0</tspan></text>
<text x="210" y="153" font-size="13" fill="#2563eb" font-weight="bold">slope = −k</text>
<line x1="400" y1="290" x2="660" y2="290" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><polygon points="668.0,290.0 659.6,286.7 659.6,293.3" fill="#1f2937"/><line x1="400" y1="290" x2="400" y2="70" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><polygon points="400.0,62.0 396.7,70.4 403.3,70.4" fill="#1f2937"/><text x="530" y="328" font-size="14" fill="#1f2937" text-anchor="middle">time t</text><text x="364" y="180" font-size="14" fill="#1f2937" text-anchor="middle" transform="rotate(-90 364 180)">ln [R]</text>
<text x="530" y="22" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">First order</text>
<line x1="400" y1="70" x2="635" y2="230" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
<circle cx="400" cy="70" r="4" fill="#dc2626" stroke="#dc2626" stroke-width="2"/>
<text x="410" y="60" font-size="13" fill="#dc2626" font-weight="bold">intercept = ln [R]<tspan dy="4" font-size="75%">0</tspan></text>
<text x="550" y="138" font-size="13" fill="#dc2626" font-weight="bold">slope = −k</text>
<text x="190" y="358" font-size="13" fill="#6b7280" text-anchor="middle">[R] falls linearly until it reaches 0</text>
<text x="530" y="358" font-size="13" fill="#6b7280" text-anchor="middle">ln [R] falls linearly; [R] never reaches exactly 0</text>
</svg>
