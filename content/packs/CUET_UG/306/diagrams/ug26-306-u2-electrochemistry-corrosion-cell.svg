<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="Arial, Helvetica, sans-serif">
<rect x="40" y="190" width="560" height="60" fill="#d1d5db" stroke="#1f2937" stroke-width="2"/>
<text x="560" y="225" font-size="14" fill="#1f2937" text-anchor="end" font-weight="bold">iron (Fe)</text>
<path d="M120,190 C120,90 200,45 320,45 C440,45 520,90 520,190 Z" fill="#bfdbfe" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="320" y="95" font-size="13" fill="#1f2937" text-anchor="middle">water drop with dissolved</text>
<text x="320" y="113" font-size="13" fill="#1f2937" text-anchor="middle">O<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4"> and CO</tspan><tspan dy="4" font-size="75%">2</tspan></text>
<rect x="150" y="190" width="70" height="60" fill="#9ca3af" stroke="none" stroke-width="0"/>
<text x="185" y="225" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">pit</text>
<line x1="185" y1="180" x2="185" y2="147" stroke="#d97706" stroke-width="2" stroke-linecap="round"/><polygon points="185.0,140.0 182.0,147.4 188.0,147.4" fill="#d97706"/>
<text x="185" y="132" font-size="13" fill="#d97706" text-anchor="middle">Fe<tspan dy="-5" font-size="75%">2+</tspan><tspan dy="5"> into drop</tspan></text>
<line x1="240" y1="225" x2="413" y2="225" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><polygon points="420.0,225.0 412.6,222.0 412.6,228.0" fill="#dc2626"/>
<text x="330" y="215" font-size="13" fill="#dc2626" text-anchor="middle">e<tspan dy="-5" font-size="75%">-</tspan><tspan dy="5"> flow through the metal</tspan></text>
<line x1="450" y1="140" x2="450" y2="175" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><polygon points="450.0,182.0 453.0,174.6 447.0,174.6" fill="#2563eb"/>
<text x="450" y="132" font-size="13" fill="#2563eb" text-anchor="middle">O<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4"> takes up e</tspan><tspan dy="-5" font-size="75%">-</tspan></text>
<text x="60" y="285" font-size="14" fill="#d97706" font-weight="bold">Anode (−), at the pit: Fe → Fe<tspan dy="-5" font-size="75%">2+</tspan><tspan dy="5"> + 2e</tspan><tspan dy="-5" font-size="75%">-</tspan></text>
<text x="60" y="308" font-size="14" fill="#2563eb" font-weight="bold">Cathode (+), exposed surface: O<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4"> + 4H</tspan><tspan dy="-5" font-size="75%">+</tspan><tspan dy="5"> + 4e</tspan><tspan dy="-5" font-size="75%">-</tspan><tspan dy="5"> → 2H</tspan><tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">O</tspan></text>
<text x="60" y="334" font-size="13" fill="#1f2937">Fe<tspan dy="-5" font-size="75%">2+</tspan><tspan dy="5"> is then oxidised by air to Fe</tspan><tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">O</tspan><tspan dy="4" font-size="75%">3</tspan><tspan dy="-4">·xH</tspan><tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">O (rust).</tspan></text>
</svg>
