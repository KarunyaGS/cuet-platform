<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="Arial, Helvetica, sans-serif">
  <text x="430" y="26" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>Classification of carbohydrates by hydrolysis</tspan></text>
  <rect x="330.0" y="46.0" width="200" height="40" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="430" y="71.6" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan>Carbohydrates</tspan></text>
  <line x1="430" y1="86" x2="430" y2="106" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <rect x="80.0" y="140.0" width="200" height="56" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="180" y="163.4" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>Monosaccharides</tspan></text>
  <text x="180" y="182.4" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>do not hydrolyse further</tspan></text>
  <line x1="430" y1="86" x2="430" y2="106" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <rect x="355.0" y="140.0" width="230" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="470" y="163.4" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>Oligosaccharides</tspan></text>
  <text x="470" y="182.4" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>2 to 10 monosaccharide units</tspan></text>
  <line x1="430" y1="86" x2="430" y2="106" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <rect x="625.0" y="140.0" width="230" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="740" y="163.4" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>Polysaccharides</tspan></text>
  <text x="740" y="182.4" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>many monosaccharide units</tspan></text>
  <line x1="180" y1="106" x2="740" y2="106" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="430" y1="86" x2="430" y2="106" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="180" y1="106" x2="180.0" y2="128.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="180,138 175.0,127.0 185.0,127.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <line x1="470" y1="106" x2="470.0" y2="128.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="470,138 465.0,127.0 475.0,127.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <line x1="740" y1="106" x2="740.0" y2="128.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="740,138 735.0,127.0 745.0,127.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <line x1="95" y1="230" x2="265" y2="230" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="95" y1="230" x2="95.0" y2="252.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="95,262 90.0,251.0 100.0,251.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <line x1="265" y1="230" x2="265.0" y2="252.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="265,262 260.0,251.0 270.0,251.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <line x1="180" y1="196" x2="180" y2="230" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <rect x="20.0" y="268.0" width="150" height="92" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="95" y="290.4" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>Aldoses</tspan></text>
  <text x="95" y="309.4" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>(–CHO group)</tspan></text>
  <text x="95" y="328.4" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>glucose,</tspan></text>
  <text x="95" y="347.4" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>ribose</tspan></text>
  <rect x="190.0" y="268.0" width="150" height="92" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="265" y="299.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>Ketoses</tspan></text>
  <text x="265" y="318.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>(C=O in chain)</tspan></text>
  <text x="265" y="337.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>fructose</tspan></text>
  <line x1="470" y1="196" x2="470.0" y2="252.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="470,262 465.0,251.0 475.0,251.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <rect x="365.0" y="268.0" width="210" height="92" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="470" y="299.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>Disaccharides</tspan></text>
  <text x="470" y="318.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>sucrose,</tspan></text>
  <text x="470" y="337.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>maltose, lactose</tspan></text>
  <line x1="740" y1="196" x2="740.0" y2="252.0" stroke="#1f2937" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="740,262 735.0,251.0 745.0,251.0" fill="#1f2937" stroke="none" stroke-width="1"/>
  <rect x="645.0" y="268.0" width="190" height="92" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="740" y="299.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>Starch,</tspan></text>
  <text x="740" y="318.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>cellulose,</tspan></text>
  <text x="740" y="337.9" font-size="14" fill="#1f2937" text-anchor="middle"><tspan>glycogen</tspan></text>
  <path d="M25,374 L25,384 L585,384 L585,374" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="305" y="404" font-size="14" fill="#059669" text-anchor="middle" font-weight="bold"><tspan>SUGARS: sweet, crystalline, soluble in water</tspan></text>
  <path d="M645,374 L645,384 L835,384 L835,374" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="740" y="404" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold"><tspan>NON-SUGARS: not sweet</tspan></text>
  <text x="430" y="438" font-size="13" fill="#4b5563" text-anchor="middle" font-style="italic"><tspan>Reducing sugars: all monosaccharides, maltose, lactose.   Non-reducing: sucrose and the polysaccharides.</tspan></text>
  <text x="430" y="458" font-size="13" fill="#4b5563" text-anchor="middle" font-style="italic"><tspan>Glucose is an aldohexose, fructose a ketohexose, ribose an aldopentose.</tspan></text>
</svg>
