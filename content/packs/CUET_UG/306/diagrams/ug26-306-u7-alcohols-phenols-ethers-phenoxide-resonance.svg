<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" font-family="Arial, Helvetica, sans-serif">
  <text x="450" y="30" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">Resonance structures of the phenoxide ion, C<tspan font-size="12" dy="4">6</tspan><tspan dy="-4">H</tspan><tspan font-size="12" dy="4">5</tspan><tspan dy="-4">O</tspan><tspan font-size="12" dy="-6">−</tspan></text>

  <!-- ring outlines -->
  <g fill="none" stroke="#1f2937" stroke-width="2.2">
    <polygon points="90,118 117.7,134 117.7,166 90,182 62.3,166 62.3,134"/>
    <polygon points="270,118 297.7,134 297.7,166 270,182 242.3,166 242.3,134"/>
    <polygon points="450,118 477.7,134 477.7,166 450,182 422.3,166 422.3,134"/>
    <polygon points="630,118 657.7,134 657.7,166 630,182 602.3,166 602.3,134"/>
    <polygon points="810,118 837.7,134 837.7,166 810,182 782.3,166 782.3,134"/>
  </g>
  <!-- ring double bonds -->
  <g stroke="#1f2937" stroke-width="2">
    <line x1="111.6" y1="141.3" x2="111.6" y2="158.7"/>
    <line x1="86.8" y1="173.1" x2="71.6" y2="164.4"/>
    <line x1="71.6" y1="135.6" x2="86.8" y2="126.9"/>
    <line x1="273.2" y1="126.9" x2="288.4" y2="135.6"/>
    <line x1="288.4" y1="164.4" x2="273.2" y2="173.1"/>
    <line x1="248.4" y1="158.7" x2="248.4" y2="141.3"/>
    <line x1="468.4" y1="164.4" x2="453.2" y2="173.1"/>
    <line x1="428.4" y1="158.7" x2="428.4" y2="141.3"/>
    <line x1="651.6" y1="141.3" x2="651.6" y2="158.7"/>
    <line x1="608.4" y1="158.7" x2="608.4" y2="141.3"/>
    <line x1="831.6" y1="141.3" x2="831.6" y2="158.7"/>
    <line x1="806.8" y1="173.1" x2="791.6" y2="164.4"/>
  </g>
  <!-- C-O bonds: single in I and II, double in III, IV, V -->
  <g stroke="#1f2937" stroke-width="2.2">
    <line x1="90" y1="118" x2="90" y2="98"/>
    <line x1="270" y1="118" x2="270" y2="98"/>
    <line x1="446" y1="118" x2="446" y2="98"/><line x1="454" y1="118" x2="454" y2="98"/>
    <line x1="626" y1="118" x2="626" y2="98"/><line x1="634" y1="118" x2="634" y2="98"/>
    <line x1="806" y1="118" x2="806" y2="98"/><line x1="814" y1="118" x2="814" y2="98"/>
  </g>
  <g font-size="20" font-weight="bold" fill="#dc2626" text-anchor="middle">
    <text x="90" y="94">O</text><text x="270" y="94">O</text><text x="450" y="94">O</text><text x="630" y="94">O</text><text x="810" y="94">O</text>
  </g>
  <!-- negative charges -->
  <g fill="#ffffff" stroke="#dc2626" stroke-width="1.5">
    <circle cx="106" cy="72" r="7"/>
    <circle cx="286" cy="72" r="7"/>
    <circle cx="491" cy="124" r="7"/>
    <circle cx="630" cy="197" r="7"/>
    <circle cx="769" cy="124" r="7"/>
  </g>
  <g stroke="#dc2626" stroke-width="1.8">
    <line x1="102" y1="72" x2="110" y2="72"/>
    <line x1="282" y1="72" x2="290" y2="72"/>
    <line x1="487" y1="124" x2="495" y2="124"/>
    <line x1="626" y1="197" x2="634" y2="197"/>
    <line x1="765" y1="124" x2="773" y2="124"/>
  </g>

  <!-- resonance arrows -->
  <g stroke="#2563eb" stroke-width="2">
    <line x1="146" y1="150" x2="214" y2="150"/>
    <line x1="326" y1="150" x2="394" y2="150"/>
    <line x1="506" y1="150" x2="574" y2="150"/>
    <line x1="686" y1="150" x2="754" y2="150"/>
  </g>
  <g fill="#2563eb">
    <polygon points="138,150 148,145 148,155"/><polygon points="222,150 212,145 212,155"/>
    <polygon points="318,150 328,145 328,155"/><polygon points="402,150 392,145 392,155"/>
    <polygon points="498,150 508,145 508,155"/><polygon points="582,150 572,145 572,155"/>
    <polygon points="678,150 688,145 688,155"/><polygon points="762,150 752,145 752,155"/>
  </g>

  <!-- labels -->
  <g font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">
    <text x="90" y="232">I</text><text x="270" y="232">II</text><text x="450" y="232">III</text><text x="630" y="232">IV</text><text x="810" y="232">V</text>
  </g>
  <g font-size="13" fill="#1f2937" text-anchor="middle">
    <text x="90" y="252">charge on O</text>
    <text x="270" y="252">charge on O</text>
    <text x="450" y="252">charge on ortho C</text>
    <text x="630" y="252">charge on para C</text>
    <text x="810" y="252">charge on ortho C</text>
  </g>

  <!-- explanation -->
  <rect x="40" y="272" width="820" height="84" rx="8" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb" stroke-width="1.2"/>
  <text x="56" y="296" font-size="14" fill="#1f2937">• The negative charge is spread over the oxygen atom and the two ortho and the para carbon atoms.</text>
  <text x="56" y="318" font-size="14" fill="#1f2937">• No structure needs separation of opposite charges, so delocalisation stabilises phenoxide more than phenol.</text>
  <text x="56" y="340" font-size="14" fill="#1f2937">• This extra stability of the conjugate base is why phenol (pK<tspan font-size="10" dy="4">a</tspan><tspan dy="-4"> ≈ 10) is far more acidic than ethanol (pK</tspan><tspan font-size="10" dy="4">a</tspan><tspan dy="-4"> ≈ 15.9).</tspan></text>
</svg>
