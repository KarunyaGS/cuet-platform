<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="Arial, Helvetica, sans-serif">
  <!-- diazotisation -->
  <text x="450" y="32" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">C<tspan dy="4" font-size="11">6</tspan><tspan dy="-4">H</tspan><tspan dy="4" font-size="11">5</tspan><tspan dy="-4">NH</tspan><tspan dy="4" font-size="11">2</tspan><tspan dy="-4" font-weight="normal"> (aniline)</tspan></text>
  <line x1="450" y1="42" x2="450" y2="106" stroke="#1f2937" stroke-width="2"/>
  <polygon points="450,116 445,105 455,105" fill="#1f2937"/>
  <text x="462" y="70" font-size="13" fill="#2563eb">NaNO<tspan dy="4" font-size="10">2</tspan><tspan dy="-4"> + HCl (excess)</tspan></text>
  <text x="462" y="88" font-size="13" fill="#2563eb">273–278 K: diazotisation</text>

  <!-- central diazonium salt -->
  <rect x="370" y="118" width="160" height="274" rx="10" fill="#2563eb" fill-opacity="0.07" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="236" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold">C<tspan dy="4" font-size="12">6</tspan><tspan dy="-4">H</tspan><tspan dy="4" font-size="12">5</tspan><tspan dy="-4">N</tspan><tspan dy="4" font-size="12">2</tspan><tspan dy="-11" font-size="12">+</tspan><tspan dy="7">Cl</tspan><tspan dy="-7" font-size="12">−</tspan></text>
  <text x="450" y="264" font-size="14" fill="#1f2937" text-anchor="middle">benzene-</text>
  <text x="450" y="282" font-size="14" fill="#1f2937" text-anchor="middle">diazonium</text>
  <text x="450" y="300" font-size="14" fill="#1f2937" text-anchor="middle">chloride</text>

  <text x="190" y="112" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">N₂ displaced (N₂ gas evolved)</text>
  <text x="710" y="112" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">N₂ displaced (N₂ gas evolved)</text>

  <!-- left spokes -->
  <g stroke="#1f2937" stroke-width="2">
    <line x1="370" y1="150" x2="210" y2="150"/>
    <line x1="370" y1="215" x2="210" y2="215"/>
    <line x1="370" y1="280" x2="210" y2="280"/>
    <line x1="370" y1="345" x2="210" y2="345"/>
  </g>
  <g fill="#1f2937">
    <polygon points="202,150 212,145 212,155"/>
    <polygon points="202,215 212,210 212,220"/>
    <polygon points="202,280 212,275 212,285"/>
    <polygon points="202,345 212,340 212,350"/>
  </g>
  <g font-size="13" fill="#2563eb" text-anchor="middle">
    <text x="290" y="142">CuCl / HCl</text>
    <text x="290" y="207">CuBr / HBr</text>
    <text x="290" y="272">CuCN / KCN</text>
    <text x="290" y="337">KI, warm</text>
  </g>
  <g font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">
    <text x="290" y="166">Sandmeyer</text>
    <text x="290" y="231">Sandmeyer</text>
    <text x="290" y="296">Sandmeyer</text>
  </g>
  <g font-size="15" fill="#1f2937" text-anchor="end">
    <text x="196" y="155">C<tspan dy="4" font-size="11">6</tspan><tspan dy="-4">H</tspan><tspan dy="4" font-size="11">5</tspan><tspan dy="-4">Cl (chlorobenzene)</tspan></text>
    <text x="196" y="220">C<tspan dy="4" font-size="11">6</tspan><tspan dy="-4">H</tspan><tspan dy="4" font-size="11">5</tspan><tspan dy="-4">Br (bromobenzene)</tspan></text>
    <text x="196" y="285">C<tspan dy="4" font-size="11">6</tspan><tspan dy="-4">H</tspan><tspan dy="4" font-size="11">5</tspan><tspan dy="-4">CN (benzonitrile)</tspan></text>
    <text x="196" y="350">C<tspan dy="4" font-size="11">6</tspan><tspan dy="-4">H</tspan><tspan dy="4" font-size="11">5</tspan><tspan dy="-4">I (iodobenzene)</tspan></text>
  </g>

  <!-- right spokes -->
  <g stroke="#1f2937" stroke-width="2">
    <line x1="530" y1="150" x2="690" y2="150"/>
    <line x1="530" y1="215" x2="690" y2="215"/>
    <line x1="530" y1="280" x2="690" y2="280"/>
    <line x1="530" y1="345" x2="690" y2="345"/>
  </g>
  <g fill="#1f2937">
    <polygon points="698,150 688,145 688,155"/>
    <polygon points="698,215 688,210 688,220"/>
    <polygon points="698,280 688,275 688,285"/>
    <polygon points="698,345 688,340 688,350"/>
  </g>
  <g font-size="13" fill="#2563eb" text-anchor="middle">
    <text x="610" y="142">HBF<tspan dy="4" font-size="10">4</tspan><tspan dy="-4">, then heat</tspan></text>
    <text x="610" y="207">H<tspan dy="4" font-size="10">3</tspan><tspan dy="-4">PO</tspan><tspan dy="4" font-size="10">2</tspan><tspan dy="-4"> or CH</tspan><tspan dy="4" font-size="10">3</tspan><tspan dy="-4">CH</tspan><tspan dy="4" font-size="10">2</tspan><tspan dy="-4">OH</tspan></text>
    <text x="610" y="272">H<tspan dy="4" font-size="10">2</tspan><tspan dy="-4">O, warm</tspan></text>
    <text x="610" y="337">HBF<tspan dy="4" font-size="10">4</tspan><tspan dy="-4">; NaNO</tspan><tspan dy="4" font-size="10">2</tspan><tspan dy="-4">, Cu, heat</tspan></text>
  </g>
  <g font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">
    <text x="610" y="166">Balz–Schiemann</text>
    <text x="610" y="231">reduction</text>
    <text x="610" y="296">hydrolysis</text>
  </g>
  <g font-size="15" fill="#1f2937">
    <text x="704" y="155">C<tspan dy="4" font-size="11">6</tspan><tspan dy="-4">H</tspan><tspan dy="4" font-size="11">5</tspan><tspan dy="-4">F (fluorobenzene)</tspan></text>
    <text x="704" y="220">C<tspan dy="4" font-size="11">6</tspan><tspan dy="-4">H</tspan><tspan dy="4" font-size="11">6</tspan><tspan dy="-4"> (benzene)</tspan></text>
    <text x="704" y="285">C<tspan dy="4" font-size="11">6</tspan><tspan dy="-4">H</tspan><tspan dy="4" font-size="11">5</tspan><tspan dy="-4">OH (phenol)</tspan></text>
    <text x="704" y="350">C<tspan dy="4" font-size="11">6</tspan><tspan dy="-4">H</tspan><tspan dy="4" font-size="11">5</tspan><tspan dy="-4">NO</tspan><tspan dy="4" font-size="11">2</tspan><tspan dy="-4"> (nitrobenzene)</tspan></text>
  </g>

  <!-- coupling -->
  <line x1="420" y1="392" x2="306" y2="461" stroke="#d97706" stroke-width="2"/>
  <polygon points="296,468 303.6,457.4 308.8,466" fill="#d97706"/>
  <line x1="480" y1="392" x2="594" y2="461" stroke="#d97706" stroke-width="2"/>
  <polygon points="604,468 591.2,466 596.4,457.4" fill="#d97706"/>
  <text x="330" y="418" font-size="13" fill="#2563eb" text-anchor="end">phenol, OH⁻</text>
  <text x="330" y="434" font-size="13" fill="#2563eb" text-anchor="end">(pH 9–10), cold</text>
  <text x="570" y="418" font-size="13" fill="#2563eb">aniline, H⁺</text>
  <text x="570" y="434" font-size="13" fill="#2563eb">(pH 4–5), cold</text>
  <text x="280" y="490" font-size="15" fill="#1f2937" text-anchor="middle">p-hydroxyazobenzene</text>
  <text x="280" y="508" font-size="13" fill="#d97706" text-anchor="middle">(orange dye)</text>
  <text x="620" y="490" font-size="15" fill="#1f2937" text-anchor="middle">p-aminoazobenzene</text>
  <text x="620" y="508" font-size="13" fill="#d97706" text-anchor="middle">(yellow dye)</text>
  <text x="450" y="540" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Coupling: the –N=N– (azo) group is retained</text>
</svg>
