<path d="M215,300 V190 H485 V300" fill="none" stroke="#fef3c7" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M170,100 V50 H328" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M372,50 H530 V100" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="350" cy="50" r="22" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<text x="350" y="56" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">V</text>
<line x1="235" y1="50" x2="267" y2="50" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><polygon points="275.0,50.0 266.6,46.7 266.6,53.3" fill="#dc2626"/>
<line x1="425" y1="50" x2="457" y2="50" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><polygon points="465.0,50.0 456.6,46.7 456.6,53.3" fill="#dc2626"/>
<text x="255" y="40" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">e<tspan dy="-5" font-size="75%">-</tspan></text>
<text x="445" y="40" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">e<tspan dy="-5" font-size="75%">-</tspan></text>
<text x="350" y="18" font-size="14" fill="#dc2626" text-anchor="middle">Electrons flow in the wire from Zn (anode) to Cu (cathode)</text>
<line x1="465" y1="84" x2="243" y2="84" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><polygon points="235.0,84.0 243.4,87.3 243.4,80.7" fill="#2563eb"/>
<text x="350" y="104" font-size="13" fill="#2563eb" text-anchor="middle">conventional current: Cu to Zn</text>
<text x="150" y="135" font-size="14" fill="#1f2937" text-anchor="end" font-weight="bold">Zn anode (−)</text>
<text x="550" y="135" font-size="14" fill="#1f2937" font-weight="bold">Cu cathode (+)</text>
<text x="150" y="155" font-size="13" fill="#6b7280" text-anchor="end">oxidation</text>
<text x="550" y="155" font-size="13" fill="#6b7280">reduction</text>
<text x="170" y="365" font-size="13" fill="#1f2937" text-anchor="middle">ZnSO<tspan dy="4" font-size="75%">4</tspan><tspan dy="-4">(aq)</tspan></text>
<text x="530" y="365" font-size="13" fill="#1f2937" text-anchor="middle">CuSO<tspan dy="4" font-size="75%">4</tspan><tspan dy="-4">(aq)</tspan></text>
<text x="350" y="170" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">salt bridge (KCl or KNO<tspan dy="4" font-size="75%">3</tspan><tspan dy="-4"> in agar)</tspan></text>
<text x="350" y="222" font-size="13" fill="#059669" text-anchor="middle">K<tspan dy="-5" font-size="75%">+</tspan><tspan dy="5"> moves to Cu side</tspan></text>
<text x="350" y="242" font-size="13" fill="#d97706" text-anchor="middle">Cl<tspan dy="-5" font-size="75%">-</tspan><tspan dy="5"> moves to Zn side</tspan></text>
<text x="170" y="385" font-size="13" fill="#6b7280" text-anchor="middle">rod dissolves</text>
<text x="530" y="385" font-size="13" fill="#6b7280" text-anchor="middle">Cu deposits on rod</text>
<text x="180" y="430" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Zn → Zn<tspan dy="-5" font-size="75%">2+</tspan><tspan dy="5"> + 2e</tspan><tspan dy="-5" font-size="75%">-</tspan></text>
<text x="520" y="430" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Cu<tspan dy="-5" font-size="75%">2+</tspan><tspan dy="5"> + 2e</tspan><tspan dy="-5" font-size="75%">-</tspan><tspan dy="5"> → Cu</tspan></text>
</svg>
