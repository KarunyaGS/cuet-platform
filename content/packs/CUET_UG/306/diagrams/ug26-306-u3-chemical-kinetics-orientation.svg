<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Arial, Helvetica, sans-serif">
  <!-- Row 1: proper orientation -->
  <text x="20" y="34" font-size="15" fill="#059669" font-weight="bold">(a) Proper orientation: OH⁻ strikes the carbon atom on the side away from Br</text>
  <!-- OH- -->
  <circle cx="58" cy="110" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="82" cy="110" r="16" fill="#dc2626" stroke="#1f2937" stroke-width="1.5"/>
  <text x="70" y="150" font-size="14" fill="#1f2937" text-anchor="middle">OH⁻</text>
  <line x1="106" y1="110" x2="160" y2="110" stroke="#1f2937" stroke-width="2"/>
  <polygon points="170,110 158,104 158,116" fill="#1f2937"/>
  <!-- CH3Br -->
  <circle cx="206" cy="84" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="206" cy="136" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="196" cy="98" r="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="226" cy="110" r="16" fill="#4b5563" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="266" cy="110" r="22" fill="#d97706" stroke="#1f2937" stroke-width="1.5"/>
  <text x="236" y="166" font-size="14" fill="#1f2937" text-anchor="middle">CH₃Br</text>
  <!-- arrow to products -->
  <line x1="310" y1="110" x2="380" y2="110" stroke="#059669" stroke-width="2.5"/>
  <polygon points="392,110 378,103 378,117" fill="#059669"/>
  <!-- CH3OH -->
  <circle cx="420" cy="110" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="444" cy="110" r="16" fill="#dc2626" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="476" cy="110" r="16" fill="#4b5563" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="494" cy="88" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="494" cy="132" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="500" cy="110" r="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="460" y="166" font-size="14" fill="#1f2937" text-anchor="middle">CH₃OH</text>
  <text x="540" y="116" font-size="18" fill="#1f2937">+</text>
  <circle cx="592" cy="110" r="22" fill="#d97706" stroke="#1f2937" stroke-width="1.5"/>
  <text x="592" y="166" font-size="14" fill="#1f2937" text-anchor="middle">Br⁻</text>
  <text x="640" y="104" font-size="14" fill="#059669">effective</text>
  <text x="640" y="122" font-size="14" fill="#059669">collision</text>

  <!-- Row 2: improper orientation -->
  <text x="20" y="226" font-size="15" fill="#dc2626" font-weight="bold">(b) Improper orientation: OH⁻ strikes the Br end of the molecule</text>
  <circle cx="106" cy="274" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="106" cy="326" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="96" cy="288" r="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="126" cy="300" r="16" fill="#4b5563" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="166" cy="300" r="22" fill="#d97706" stroke="#1f2937" stroke-width="1.5"/>
  <text x="136" y="356" font-size="14" fill="#1f2937" text-anchor="middle">CH₃Br</text>
  <line x1="262" y1="300" x2="200" y2="300" stroke="#1f2937" stroke-width="2"/>
  <polygon points="190,300 202,294 202,306" fill="#1f2937"/>
  <circle cx="276" cy="300" r="16" fill="#dc2626" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="300" cy="300" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="288" y="340" font-size="14" fill="#1f2937" text-anchor="middle">OH⁻</text>
  <line x1="340" y1="300" x2="410" y2="300" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="422,300 408,293 408,307" fill="#dc2626"/>
  <text x="440" y="294" font-size="14" fill="#dc2626">no product: the molecules</text>
  <text x="440" y="312" font-size="14" fill="#dc2626">simply bounce apart</text>
  <text x="440" y="330" font-size="14" fill="#dc2626">(ineffective collision)</text>

  <!-- key -->
  <circle cx="30" cy="384" r="7" fill="#4b5563" stroke="#1f2937" stroke-width="1"/><text x="42" y="389" font-size="13" fill="#1f2937">C</text>
  <circle cx="80" cy="384" r="7" fill="#dc2626" stroke="#1f2937" stroke-width="1"/><text x="92" y="389" font-size="13" fill="#1f2937">O</text>
  <circle cx="130" cy="384" r="7" fill="#d97706" stroke="#1f2937" stroke-width="1"/><text x="142" y="389" font-size="13" fill="#1f2937">Br</text>
  <circle cx="186" cy="384" r="6" fill="#ffffff" stroke="#1f2937" stroke-width="1"/><text x="198" y="389" font-size="13" fill="#1f2937">H</text>
</svg>
