<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Arial, Helvetica, sans-serif">
  <line x1="440" y1="20" x2="440" y2="270" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="220" y="30" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">(a) Ethanol molecules H-bonded to one another</text>
  <text x="670" y="30" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">(b) Ethanol H-bonded to water</text>

  <!-- (a) chain of ethanol molecules -->
  <g font-size="17" fill="#1f2937" text-anchor="middle">
    <text x="58" y="84">C<tspan font-size="11" dy="4">2</tspan><tspan dy="-4">H</tspan><tspan font-size="11" dy="4">5</tspan></text>
    <text x="155" y="146">H</text>
    <text x="205" y="228">C<tspan font-size="11" dy="4">2</tspan><tspan dy="-4">H</tspan><tspan font-size="11" dy="4">5</tspan></text>
    <text x="250" y="152">H</text>
    <text x="300" y="72">C<tspan font-size="11" dy="4">2</tspan><tspan dy="-4">H</tspan><tspan font-size="11" dy="4">5</tspan></text>
    <text x="345" y="146">H</text>
  </g>
  <g font-size="18" font-weight="bold" fill="#dc2626" text-anchor="middle">
    <text x="110" y="118">O</text>
    <text x="205" y="178">O</text>
    <text x="300" y="118">O</text>
  </g>
  <g stroke="#1f2937" stroke-width="2">
    <line x1="74" y1="88" x2="101" y2="103"/>
    <line x1="119" y1="117" x2="147" y2="133"/>
    <line x1="205" y1="181" x2="205" y2="207"/>
    <line x1="213" y1="166" x2="243" y2="148"/>
    <line x1="300" y1="99" x2="300" y2="80"/>
    <line x1="309" y1="117" x2="337" y2="133"/>
  </g>
  <g stroke="#2563eb" stroke-width="2.2" stroke-dasharray="3 4">
    <line x1="164" y1="146" x2="196" y2="164"/>
    <line x1="258" y1="140" x2="291" y2="119"/>
    <line x1="354" y1="146" x2="388" y2="166"/>
  </g>
  <text x="400" y="176" font-size="18" fill="#2563eb">…</text>
  <g font-size="13" fill="#d97706">
    <text x="84" y="128">δ−</text>
    <text x="152" y="124">δ+</text>
  </g>
  <text x="140" y="262" font-size="14" fill="#2563eb" text-anchor="middle">hydrogen bond (O–H ··· O)</text>
  <line x1="150" y1="248" x2="178" y2="158" stroke="#9ca3af" stroke-width="1.2"/>

  <!-- (b) ethanol + water -->
  <g font-size="17" fill="#1f2937" text-anchor="middle">
    <text x="520" y="84">C<tspan font-size="11" dy="4">2</tspan><tspan dy="-4">H</tspan><tspan font-size="11" dy="4">5</tspan></text>
    <text x="606" y="160">H</text>
    <text x="728" y="176">H</text>
    <text x="690" y="250">H</text>
    <text x="536" y="171">H</text>
    <text x="470" y="226">H</text>
  </g>
  <g font-size="18" font-weight="bold" fill="#dc2626" text-anchor="middle">
    <text x="566" y="126">O</text>
    <text x="672" y="200">O</text>
    <text x="506" y="200">O</text>
  </g>
  <g font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="520" y="58" fill="#6b7280">ethanol</text>
  </g>
  <g stroke="#1f2937" stroke-width="2">
    <!-- ethanol -->
    <line x1="537" y1="88" x2="557" y2="111"/>
    <line x1="575" y1="126" x2="598" y2="145"/>
    <!-- water 1 -->
    <line x1="681" y1="190" x2="718" y2="172"/>
    <line x1="676" y1="204" x2="686" y2="232"/>
    <!-- water 2 -->
    <line x1="513" y1="186" x2="530" y2="172"/>
    <line x1="498" y1="203" x2="477" y2="216"/>
  </g>
  <g stroke="#2563eb" stroke-width="2.2" stroke-dasharray="3 4">
    <line x1="615" y1="160" x2="660" y2="185"/>
    <line x1="542" y1="156" x2="558" y2="133"/>
  </g>
  <text x="748" y="222" font-size="13" fill="#6b7280" text-anchor="middle">water</text>
  <text x="478" y="258" font-size="13" fill="#6b7280" text-anchor="middle">water</text>
  <text x="780" y="110" font-size="14" fill="#2563eb" text-anchor="middle">ethanol H ··· O water</text>
  <line x1="760" y1="116" x2="642" y2="170" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="600" y="232" font-size="14" fill="#2563eb" text-anchor="middle">water H</text>
  <text x="600" y="250" font-size="14" fill="#2563eb" text-anchor="middle">··· O ethanol</text>
  <line x1="580" y1="218" x2="552" y2="148" stroke="#9ca3af" stroke-width="1.2"/>

  <!-- notes -->
  <text x="450" y="304" font-size="14" fill="#1f2937" text-anchor="middle">(a) Extra energy is needed to break these bonds, so alcohols boil far higher than ethers and alkanes of similar mass.</text>
  <text x="450" y="326" font-size="14" fill="#1f2937" text-anchor="middle">(b) H-bonds with water make lower alcohols soluble; a longer alkyl (hydrophobic) part lowers solubility.</text>
</svg>
