<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Arial, Helvetica, sans-serif">
  <!-- deuteron -->
  <circle cx="92" cy="105" r="16" fill="#dc2626" stroke="#1f2937" stroke-width="1"/>
  <circle cx="120" cy="105" r="16" fill="#2563eb" stroke="#1f2937" stroke-width="1"/>
  <text x="106" y="70" font-size="14" fill="#1f2937" text-anchor="middle">H-2 (deuteron)</text>
  <!-- triton -->
  <circle cx="86" cy="250" r="16" fill="#dc2626" stroke="#1f2937" stroke-width="1"/>
  <circle cx="114" cy="250" r="16" fill="#2563eb" stroke="#1f2937" stroke-width="1"/>
  <circle cx="100" cy="226" r="16" fill="#2563eb" stroke="#1f2937" stroke-width="1"/>
  <text x="100" y="295" font-size="14" fill="#1f2937" text-anchor="middle">H-3 (triton)</text>
  <!-- approach -->
  <line x1="145" y1="112" x2="270" y2="157" stroke="#1f2937" stroke-width="2"/>
  <polygon points="281,161 267.6,162.4 271.6,151.1" fill="#1f2937"/>
  <line x1="140" y1="240" x2="270" y2="190" stroke="#1f2937" stroke-width="2"/>
  <polygon points="281,186 271.8,195.8 267.5,184.6" fill="#1f2937"/>
  <!-- fusion zone -->
  <circle cx="325" cy="172" r="38" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="325" y="177" font-size="14" fill="#1f2937" text-anchor="middle">fuse</text>
  <text x="325" y="235" font-size="13" fill="#4b5563" text-anchor="middle">must overcome</text>
  <text x="325" y="251" font-size="13" fill="#4b5563" text-anchor="middle">Coulomb repulsion:</text>
  <text x="325" y="267" font-size="13" fill="#4b5563" text-anchor="middle">very high temperature</text>
  <!-- products -->
  <line x1="365" y1="158" x2="508" y2="108" stroke="#1f2937" stroke-width="2"/>
  <polygon points="519,104 509.6,113.6 505.6,102.3" fill="#1f2937"/>
  <line x1="365" y1="186" x2="508" y2="237" stroke="#1f2937" stroke-width="2"/>
  <polygon points="519,241 505.6,242.3 509.6,231.0" fill="#1f2937"/>
  <!-- helium-4 -->
  <circle cx="566" cy="86" r="16" fill="#dc2626" stroke="#1f2937" stroke-width="1"/>
  <circle cx="594" cy="86" r="16" fill="#2563eb" stroke="#1f2937" stroke-width="1"/>
  <circle cx="566" cy="114" r="16" fill="#2563eb" stroke="#1f2937" stroke-width="1"/>
  <circle cx="594" cy="114" r="16" fill="#dc2626" stroke="#1f2937" stroke-width="1"/>
  <text x="580" y="52" font-size="14" fill="#1f2937" text-anchor="middle">He-4 (α-particle)</text>
  <text x="625" y="105" font-size="14" fill="#059669">kinetic energy ≈ 3.5 MeV</text>
  <!-- neutron -->
  <circle cx="575" cy="250" r="16" fill="#2563eb" stroke="#1f2937" stroke-width="1"/>
  <text x="575" y="290" font-size="14" fill="#1f2937" text-anchor="middle">neutron</text>
  <text x="605" y="255" font-size="14" fill="#059669">kinetic energy ≈ 14.1 MeV</text>
  <!-- legend -->
  <circle cx="760" cy="300" r="9" fill="#dc2626"/>
  <text x="776" y="305" font-size="13" fill="#1f2937">proton</text>
  <circle cx="760" cy="326" r="9" fill="#2563eb"/>
  <text x="776" y="331" font-size="13" fill="#1f2937">neutron</text>
  <!-- equation -->
  <text x="370" y="330" font-size="16" fill="#1f2937" text-anchor="middle">H-2 + H-3 → He-4 + n + 17.6 MeV</text>
  <text x="370" y="352" font-size="13" fill="#4b5563" text-anchor="middle">Lighter neutron carries about 4/5 of the energy (equal and opposite momenta)</text>
</svg>
