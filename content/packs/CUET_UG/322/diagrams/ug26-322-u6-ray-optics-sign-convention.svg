<text x="30" y="288" font-size="14" fill="#1f2937" text-anchor="start">Origin at the pole P. All distances are measured from P.</text>
<text x="30" y="310" font-size="14" fill="#1f2937" text-anchor="start">Positive direction (+x): the direction of the incident light, to the right of P (behind the mirror).</text>
<text x="30" y="332" font-size="14" fill="#1f2937" text-anchor="start">Negative direction (−x): to the left of P. For a real object u &lt; 0; for a concave mirror f &lt; 0 and R &lt; 0.</text>
<text x="30" y="354" font-size="14" fill="#1f2937" text-anchor="start">Heights are positive above the principal axis (+y) and negative below it (−y).</text>
