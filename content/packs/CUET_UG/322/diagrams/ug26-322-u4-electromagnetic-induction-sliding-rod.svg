<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, Helvetica, sans-serif" fill="none">
  <!-- magnetic field into the page -->
  <g font-size="18" fill="#2563eb" text-anchor="middle">
    <text x="140" y="135">×</text><text x="200" y="135">×</text><text x="260" y="135">×</text><text x="320" y="135">×</text><text x="370" y="135">×</text>
    <text x="490" y="135">×</text><text x="550" y="135">×</text><text x="610" y="135">×</text>
    <text x="140" y="205">×</text><text x="200" y="205">×</text><text x="260" y="205">×</text><text x="320" y="205">×</text><text x="370" y="205">×</text>
    <text x="490" y="205">×</text><text x="550" y="205">×</text><text x="610" y="205">×</text>
    <text x="140" y="275">×</text><text x="200" y="275">×</text><text x="260" y="275">×</text>
    <text x="490" y="275">×</text><text x="550" y="275">×</text><text x="610" y="275">×</text>
  </g>
  <text x="560" y="45" text-anchor="middle" font-size="14" fill="#2563eb">× uniform field B, into the page</text>

  <!-- rails -->
  <line x1="80" y1="90" x2="660" y2="90" stroke="#1f2937" stroke-width="2.5"/>
  <line x1="80" y1="290" x2="660" y2="290" stroke="#1f2937" stroke-width="2.5"/>
  <!-- resistor on the closed end -->
  <line x1="80" y1="90" x2="80" y2="160" stroke="#1f2937" stroke-width="2.5"/>
  <polyline points="80,160 68,167 92,179 68,191 92,203 68,215 80,222" stroke="#1f2937" stroke-width="2.5"/>
  <line x1="80" y1="222" x2="80" y2="290" stroke="#1f2937" stroke-width="2.5"/>
  <text x="50" y="196" text-anchor="middle" font-size="16" font-style="italic" fill="#1f2937">R</text>

  <!-- rod PQ -->
  <line x1="430" y1="74" x2="430" y2="306" stroke="#d97706" stroke-width="5"/>
  <text x="446" y="68" font-size="15" font-weight="bold" fill="#1f2937">P (+)</text>
  <text x="446" y="326" font-size="15" font-weight="bold" fill="#1f2937">Q (−)</text>

  <!-- velocity -->
  <line x1="440" y1="165" x2="515" y2="165" stroke="#059669" stroke-width="2.5"/>
  <polygon points="527,165 515,159 515,171" fill="#059669"/>
  <text x="537" y="170" font-size="15" font-style="italic" fill="#059669">v</text>

  <!-- magnetic force on rod -->
  <line x1="422" y1="245" x2="352" y2="245" stroke="#d97706" stroke-width="2.5"/>
  <polygon points="340,245 352,239 352,251" fill="#d97706"/>
  <text x="381" y="237" text-anchor="middle" font-size="13" fill="#d97706">F (magnetic)</text>

  <!-- induced current arrows -->
  <line x1="412" y1="215" x2="412" y2="140" stroke="#dc2626" stroke-width="2"/>
  <polygon points="412,128 406,140 418,140" fill="#dc2626"/>
  <text x="398" y="178" text-anchor="end" font-size="15" font-style="italic" fill="#dc2626">I</text>
  <polygon points="238,90 250,84 250,96" fill="#dc2626"/>
  <text x="244" y="78" text-anchor="middle" font-size="15" font-style="italic" fill="#dc2626">I</text>
  <polygon points="262,290 250,284 250,296" fill="#dc2626"/>
  <text x="256" y="314" text-anchor="middle" font-size="15" font-style="italic" fill="#dc2626">I</text>
  <polygon points="80,262 74,250 86,250" fill="#dc2626"/>

  <!-- dimension l -->
  <line x1="690" y1="102" x2="690" y2="278" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="690,92 685,103 695,103" fill="#1f2937"/>
  <polygon points="690,288 685,277 695,277" fill="#1f2937"/>
  <text x="700" y="196" font-size="18" font-style="italic" font-family="Times New Roman, serif" fill="#1f2937">l</text>

  <!-- dimension x -->
  <line x1="92" y1="350" x2="418" y2="350" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="82,350 93,345 93,355" fill="#1f2937"/>
  <polygon points="428,350 417,345 417,355" fill="#1f2937"/>
  <text x="255" y="370" text-anchor="middle" font-size="16" font-style="italic" fill="#1f2937">x</text>
</svg>
