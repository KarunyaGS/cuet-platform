<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="Arial, Helvetica, sans-serif" fill="none">
  <text x="350" y="40" text-anchor="middle" font-size="15" fill="#2563eb">Outer solenoid S<tspan font-size="11" dy="4">2</tspan><tspan dy="-4">: n</tspan><tspan font-size="11" dy="4">2</tspan><tspan dy="-4"> turns per metre, radius r</tspan><tspan font-size="11" dy="4">2</tspan><tspan dy="-4">, current I</tspan><tspan font-size="11" dy="4">2</tspan></text>

  <!-- outer solenoid: top row (current out of page) -->
  <g stroke="#2563eb" stroke-width="1.8">
    <circle cx="110" cy="90" r="7"/><circle cx="140" cy="90" r="7"/><circle cx="170" cy="90" r="7"/><circle cx="200" cy="90" r="7"/><circle cx="230" cy="90" r="7"/><circle cx="260" cy="90" r="7"/><circle cx="290" cy="90" r="7"/><circle cx="320" cy="90" r="7"/><circle cx="350" cy="90" r="7"/><circle cx="380" cy="90" r="7"/><circle cx="410" cy="90" r="7"/><circle cx="440" cy="90" r="7"/><circle cx="470" cy="90" r="7"/><circle cx="500" cy="90" r="7"/><circle cx="530" cy="90" r="7"/><circle cx="560" cy="90" r="7"/><circle cx="590" cy="90" r="7"/>
  </g>
  <g fill="#2563eb">
    <circle cx="110" cy="90" r="2"/><circle cx="140" cy="90" r="2"/><circle cx="170" cy="90" r="2"/><circle cx="200" cy="90" r="2"/><circle cx="230" cy="90" r="2"/><circle cx="260" cy="90" r="2"/><circle cx="290" cy="90" r="2"/><circle cx="320" cy="90" r="2"/><circle cx="350" cy="90" r="2"/><circle cx="380" cy="90" r="2"/><circle cx="410" cy="90" r="2"/><circle cx="440" cy="90" r="2"/><circle cx="470" cy="90" r="2"/><circle cx="500" cy="90" r="2"/><circle cx="530" cy="90" r="2"/><circle cx="560" cy="90" r="2"/><circle cx="590" cy="90" r="2"/>
  </g>
  <!-- outer solenoid: bottom row (current into page) -->
  <g stroke="#2563eb" stroke-width="1.8">
    <circle cx="110" cy="250" r="7"/><circle cx="140" cy="250" r="7"/><circle cx="170" cy="250" r="7"/><circle cx="200" cy="250" r="7"/><circle cx="230" cy="250" r="7"/><circle cx="260" cy="250" r="7"/><circle cx="290" cy="250" r="7"/><circle cx="320" cy="250" r="7"/><circle cx="350" cy="250" r="7"/><circle cx="380" cy="250" r="7"/><circle cx="410" cy="250" r="7"/><circle cx="440" cy="250" r="7"/><circle cx="470" cy="250" r="7"/><circle cx="500" cy="250" r="7"/><circle cx="530" cy="250" r="7"/><circle cx="560" cy="250" r="7"/><circle cx="590" cy="250" r="7"/>
  </g>
  <g font-size="12" fill="#2563eb" text-anchor="middle">
    <text x="110" y="254">×</text><text x="140" y="254">×</text><text x="170" y="254">×</text><text x="200" y="254">×</text><text x="230" y="254">×</text><text x="260" y="254">×</text><text x="290" y="254">×</text><text x="320" y="254">×</text><text x="350" y="254">×</text><text x="380" y="254">×</text><text x="410" y="254">×</text><text x="440" y="254">×</text><text x="470" y="254">×</text><text x="500" y="254">×</text><text x="530" y="254">×</text><text x="560" y="254">×</text><text x="590" y="254">×</text>
  </g>

  <!-- inner solenoid -->
  <g stroke="#dc2626" stroke-width="1.8">
    <circle cx="110" cy="135" r="6"/><circle cx="140" cy="135" r="6"/><circle cx="170" cy="135" r="6"/><circle cx="200" cy="135" r="6"/><circle cx="230" cy="135" r="6"/><circle cx="260" cy="135" r="6"/><circle cx="290" cy="135" r="6"/><circle cx="320" cy="135" r="6"/><circle cx="350" cy="135" r="6"/><circle cx="380" cy="135" r="6"/><circle cx="410" cy="135" r="6"/><circle cx="440" cy="135" r="6"/><circle cx="470" cy="135" r="6"/><circle cx="500" cy="135" r="6"/><circle cx="530" cy="135" r="6"/><circle cx="560" cy="135" r="6"/><circle cx="590" cy="135" r="6"/>
    <circle cx="110" cy="205" r="6"/><circle cx="140" cy="205" r="6"/><circle cx="170" cy="205" r="6"/><circle cx="200" cy="205" r="6"/><circle cx="230" cy="205" r="6"/><circle cx="260" cy="205" r="6"/><circle cx="290" cy="205" r="6"/><circle cx="320" cy="205" r="6"/><circle cx="350" cy="205" r="6"/><circle cx="380" cy="205" r="6"/><circle cx="410" cy="205" r="6"/><circle cx="440" cy="205" r="6"/><circle cx="470" cy="205" r="6"/><circle cx="500" cy="205" r="6"/><circle cx="530" cy="205" r="6"/><circle cx="560" cy="205" r="6"/><circle cx="590" cy="205" r="6"/>
  </g>
  <text x="350" y="234" text-anchor="middle" font-size="14" fill="#dc2626">Inner solenoid S<tspan font-size="10" dy="4">1</tspan><tspan dy="-4">: n</tspan><tspan font-size="10" dy="4">1</tspan><tspan dy="-4"> turns per metre, radius r</tspan><tspan font-size="10" dy="4">1</tspan></text>

  <!-- common axis and field B2 -->
  <line x1="60" y1="170" x2="640" y2="170" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 5"/>
  <line x1="240" y1="170" x2="448" y2="170" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="460,170 448,164 448,176" fill="#2563eb"/>
  <text x="345" y="160" text-anchor="middle" font-size="15" fill="#2563eb">B<tspan font-size="11" dy="4">2</tspan><tspan dy="-4"> = μ</tspan><tspan font-size="11" dy="4">0</tspan><tspan dy="-4">n</tspan><tspan font-size="11" dy="4">2</tspan><tspan dy="-4">I</tspan><tspan font-size="11" dy="4">2</tspan></text>
  <text x="652" y="175" font-size="13" fill="#6b7280">axis</text>

  <!-- radii -->
  <line x1="615" y1="170" x2="615" y2="146" stroke="#dc2626" stroke-width="1.8"/>
  <polygon points="615,137 610,148 620,148" fill="#dc2626"/>
  <text x="603" y="163" text-anchor="end" font-size="14" font-style="italic" fill="#dc2626">r<tspan font-size="10" dy="4">1</tspan></text>
  <line x1="640" y1="170" x2="640" y2="104" stroke="#2563eb" stroke-width="1.8"/>
  <polygon points="640,93 635,105 645,105" fill="#2563eb"/>
  <text x="650" y="128" font-size="14" font-style="italic" fill="#2563eb">r<tspan font-size="10" dy="4">2</tspan></text>

  <!-- length -->
  <line x1="112" y1="290" x2="588" y2="290" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="102,290 113,285 113,295" fill="#1f2937"/>
  <polygon points="598,290 587,285 587,295" fill="#1f2937"/>
  <text x="350" y="312" text-anchor="middle" font-size="15" fill="#1f2937"><tspan font-family="Times New Roman, serif" font-style="italic" font-size="18">l</tspan> (length of both solenoids)</text>
  <text x="350" y="340" text-anchor="middle" font-size="13" fill="#1f2937">Flux through each turn of S<tspan font-size="10" dy="4">1</tspan><tspan dy="-4"> = B</tspan><tspan font-size="10" dy="4">2</tspan><tspan dy="-4"> × πr</tspan><tspan font-size="10" dy="4">1</tspan><tspan font-size="10" dy="-10">2</tspan><tspan dy="6">  (only the inner area counts)</tspan></text>
</svg>
