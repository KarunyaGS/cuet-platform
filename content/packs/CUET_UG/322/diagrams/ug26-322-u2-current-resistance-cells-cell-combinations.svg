  <!-- cell 1 -->
  <line x1="50" y1="230" x2="80" y2="230" stroke="#1f2937" stroke-width="2"/>
  <line x1="80" y1="205" x2="80" y2="255" stroke="#1f2937" stroke-width="2"/>
  <line x1="94" y1="217" x2="94" y2="243" stroke="#1f2937" stroke-width="5"/>
