  <text x="74" y="200" font-size="14" fill="#1f2937" text-anchor="middle">+</text>
  <text x="87" y="280" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">ε<tspan font-size="11" dy="4">1</tspan></text>
  <text x="140" y="212" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">r<tspan font-size="11" dy="4">1</tspan></text>
  <!-- cell 2 -->
  <line x1="210" y1="230" x2="230" y2="230" stroke="#1f2937" stroke-width="2"/>
  <line x1="230" y1="205" x2="230" y2="255" stroke="#1f2937" stroke-width="2"/>
  <line x1="244" y1="217" x2="244" y2="243" stroke="#1f2937" stroke-width="5"/>
  <line x1="244" y1="230" x2="260" y2="230" stroke="#1f2937" stroke-width="2"/>
  <polyline points="260,230 265,219 275,241 285,219 295,241 305,219 315,241 320,230" fill="none" stroke="#dc2626" stroke-width="2"/>
  <line x1="320" y1="230" x2="370" y2="230" stroke="#1f2937" stroke-width="2"/>
  <text x="224" y="200" font-size="14" fill="#1f2937" text-anchor="middle">+</text>
  <text x="237" y="280" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">ε<tspan font-size="11" dy="4">2</tspan></text>
  <text x="290" y="212" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">r<tspan font-size="11" dy="4">2</tspan></text>
  <!-- nodes -->
  <circle cx="50" cy="230" r="5" fill="#1f2937"/>
  <circle cx="200" cy="230" r="5" fill="#1f2937"/>
  <circle cx="370" cy="230" r="5" fill="#1f2937"/>
  <text x="38" y="258" font-size="15" fill="#1f2937" text-anchor="middle">A</text>
  <text x="200" y="258" font-size="15" fill="#1f2937" text-anchor="middle">B</text>
  <text x="382" y="258" font-size="15" fill="#1f2937" text-anchor="middle">C</text>
  <text x="210" y="330" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">(a) Cells in series (− of one to + of next)</text>
  <text x="210" y="358" font-size="14" fill="#1f2937" text-anchor="middle">ε<tspan font-size="10" dy="4">eq</tspan><tspan dy="-4"> = ε</tspan><tspan font-size="10" dy="4">1</tspan><tspan dy="-4"> + ε</tspan><tspan font-size="10" dy="4">2</tspan><tspan dy="-4"> ,   r</tspan><tspan font-size="10" dy="4">eq</tspan><tspan dy="-4"> = r</tspan><tspan font-size="10" dy="4">1</tspan><tspan dy="-4"> + r</tspan><tspan font-size="10" dy="4">2</tspan></text>

  <!-- ================= Panel (b): parallel ================= -->
  <!-- external resistor -->
  <line x1="520" y1="150" x2="520" y2="70" stroke="#1f2937" stroke-width="2"/>
  <line x1="520" y1="70" x2="620" y2="70" stroke="#1f2937" stroke-width="2"/>
  <polyline points="620,70 628,56 644,84 660,56 676,84 692,56 708,84 716,70" fill="none" stroke="#1f2937" stroke-width="2"/>
  <line x1="716" y1="70" x2="820" y2="70" stroke="#1f2937" stroke-width="2"/>
  <line x1="820" y1="70" x2="820" y2="150" stroke="#1f2937" stroke-width="2"/>
  <text x="668" y="46" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">R</text>
  <polygon points="582,70 568,63 568,77" fill="#d97706"/>
  <text x="566" y="58" font-size="15" fill="#d97706" font-weight="bold">I</text>
  <!-- buses -->
  <line x1="520" y1="150" x2="520" y2="270" stroke="#1f2937" stroke-width="2"/>
  <line x1="820" y1="150" x2="820" y2="270" stroke="#1f2937" stroke-width="2"/>
  <circle cx="520" cy="150" r="5" fill="#1f2937"/>
  <circle cx="820" cy="150" r="5" fill="#1f2937"/>
  <text x="502" y="215" font-size="15" fill="#1f2937" text-anchor="middle">B<tspan font-size="11" dy="4">1</tspan></text>
  <text x="840" y="215" font-size="15" fill="#1f2937" text-anchor="middle">B<tspan font-size="11" dy="4">2</tspan></text>
  <!-- top branch: cell 1 -->
  <line x1="520" y1="150" x2="600" y2="150" stroke="#1f2937" stroke-width="2"/>
  <line x1="600" y1="127" x2="600" y2="173" stroke="#1f2937" stroke-width="2"/>
  <line x1="614" y1="139" x2="614" y2="161" stroke="#1f2937" stroke-width="5"/>
