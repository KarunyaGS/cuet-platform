  <polyline points="640,150 645,139 655,161 665,139 675,161 685,139 695,161 700,150" fill="none" stroke="#dc2626" stroke-width="2"/>
  <line x1="700" y1="150" x2="820" y2="150" stroke="#1f2937" stroke-width="2"/>
  <text x="594" y="122" font-size="14" fill="#1f2937" text-anchor="middle">+</text>
  <text x="607" y="195" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">ε<tspan font-size="11" dy="4">1</tspan></text>
  <text x="670" y="132" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">r<tspan font-size="11" dy="4">1</tspan></text>
  <polygon points="752,150 766,143 766,157" fill="#d97706"/>
  <text x="770" y="140" font-size="15" fill="#d97706" font-weight="bold">I<tspan font-size="11" dy="4">1</tspan></text>
  <!-- bottom branch: cell 2 -->
  <line x1="520" y1="270" x2="600" y2="270" stroke="#1f2937" stroke-width="2"/>
  <line x1="600" y1="247" x2="600" y2="293" stroke="#1f2937" stroke-width="2"/>
  <line x1="614" y1="259" x2="614" y2="281" stroke="#1f2937" stroke-width="5"/>
  <line x1="614" y1="270" x2="640" y2="270" stroke="#1f2937" stroke-width="2"/>
  <polyline points="640,270 645,259 655,281 665,259 675,281 685,259 695,281 700,270" fill="none" stroke="#dc2626" stroke-width="2"/>
  <line x1="700" y1="270" x2="820" y2="270" stroke="#1f2937" stroke-width="2"/>
  <text x="594" y="242" font-size="14" fill="#1f2937" text-anchor="middle">+</text>
  <text x="607" y="315" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">ε<tspan font-size="11" dy="4">2</tspan></text>
  <text x="670" y="252" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">r<tspan font-size="11" dy="4">2</tspan></text>
  <polygon points="752,270 766,263 766,277" fill="#d97706"/>
  <text x="770" y="260" font-size="15" fill="#d97706" font-weight="bold">I<tspan font-size="11" dy="4">2</tspan></text>
  <text x="670" y="345" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">(b) Cells in parallel (+ to +, − to −)</text>
  <text x="670" y="373" font-size="14" fill="#1f2937" text-anchor="middle">I = I<tspan font-size="10" dy="4">1</tspan><tspan dy="-4"> + I</tspan><tspan font-size="10" dy="4">2</tspan><tspan dy="-4"> ;  1/r</tspan><tspan font-size="10" dy="4">eq</tspan><tspan dy="-4"> = 1/r</tspan><tspan font-size="10" dy="4">1</tspan><tspan dy="-4"> + 1/r</tspan><tspan font-size="10" dy="4">2</tspan><tspan dy="-4"> ;  ε</tspan><tspan font-size="10" dy="4">eq</tspan><tspan dy="-4">/r</tspan><tspan font-size="10" dy="4">eq</tspan><tspan dy="-4"> = ε</tspan><tspan font-size="10" dy="4">1</tspan><tspan dy="-4">/r</tspan><tspan font-size="10" dy="4">1</tspan><tspan dy="-4"> + ε</tspan><tspan font-size="10" dy="4">2</tspan><tspan dy="-4">/r</tspan><tspan font-size="10" dy="4">2</tspan></text>
</svg>
