  <polyline points="150,80 158,66 174,94 190,66 206,94 222,66 238,94 246,80" fill="none" stroke="#1f2937" stroke-width="2"/>
  <line x1="246" y1="80" x2="370" y2="80" stroke="#1f2937" stroke-width="2"/>
  <line x1="370" y1="80" x2="370" y2="230" stroke="#1f2937" stroke-width="2"/>
  <text x="198" y="56" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">R</text>
  <polygon points="112,80 98,73 98,87" fill="#d97706"/>
  <text x="96" y="68" font-size="15" fill="#d97706" font-weight="bold">I</text>
