<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="Arial, Helvetica, sans-serif">
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1f2937">Plane wavefronts of a beam reflected at a plane mirror</text>
  <!-- mirror -->
  <line x1="90" y1="320" x2="590" y2="320" stroke="#1f2937" stroke-width="2.5"/>
  <path d="M100 320 l-10 12 M130 320 l-10 12 M160 320 l-10 12 M190 320 l-10 12 M220 320 l-10 12 M250 320 l-10 12 M280 320 l-10 12 M310 320 l-10 12 M340 320 l-10 12 M370 320 l-10 12 M400 320 l-10 12 M430 320 l-10 12 M460 320 l-10 12 M490 320 l-10 12 M520 320 l-10 12 M550 320 l-10 12 M580 320 l-10 12" stroke="#1f2937" stroke-width="1.3"/>
  <text x="600" y="326" font-size="14" fill="#1f2937">mirror</text>
  <!-- normal -->
  <line x1="330" y1="80" x2="330" y2="320" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- incident wavefronts -->
  <line x1="401" y1="287.9" x2="362.7" y2="320" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="374" y1="255.7" x2="297.3" y2="320" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="232.1" y1="319.9" x2="347" y2="223.5" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="205.1" y1="287.8" x2="320" y2="191.4" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="178.1" y1="255.6" x2="293" y2="159.2" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="151.1" y1="223.4" x2="266" y2="127" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="124.1" y1="191.3" x2="239" y2="94.8" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="97.1" y1="159.1" x2="212" y2="62.7" stroke="#2563eb" stroke-width="1.8"/>
  <!-- reflected wavefronts -->
  <line x1="367" y1="159.2" x2="481.9" y2="255.6" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="340" y1="191.4" x2="454.9" y2="287.8" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="313" y1="223.5" x2="427.9" y2="319.9" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="362.7" y1="320" x2="286" y2="255.7" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="297.3" y1="320" x2="259" y2="287.9" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="394" y1="127" x2="508.9" y2="223.4" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="421" y1="94.8" x2="535.9" y2="191.3" stroke="#dc2626" stroke-width="1.8"/>
  <!-- central ray of the beam -->
  <line x1="137.2" y1="90.2" x2="330" y2="320" stroke="#d97706" stroke-width="2"/>
  <line x1="330" y1="320" x2="522.8" y2="90.2" stroke="#d97706" stroke-width="2"/>
  <polygon points="204.7,170.6 194.1,165.1 201,159.3" fill="#d97706"/>
  <polygon points="474.6,147.6 471,159 464.1,153.2" fill="#d97706"/>
  <text x="306" y="268" font-size="15" fill="#d97706">i</text>
  <text x="344" y="268" font-size="15" fill="#d97706">r</text>
  <!-- labels -->
  <text x="40" y="60" font-size="14" fill="#2563eb">incident wavefronts</text>
  <text x="470" y="80" font-size="14" fill="#dc2626">reflected wavefronts</text>
  <text x="20" y="364" font-size="13" fill="#1f2937">Near the mirror each wavefront bends into a V: the part that has reached the mirror is already travelling back.</text>
  <text x="20" y="384" font-size="13" fill="#1f2937">Wavelength is unchanged; reflected and incident wavefronts make equal angles with the mirror,</text>
  <text x="20" y="404" font-size="13" fill="#1f2937">so the rays (amber, normal to the wavefronts) obey i = r. Drawn for i = 40°.</text>
</svg>
