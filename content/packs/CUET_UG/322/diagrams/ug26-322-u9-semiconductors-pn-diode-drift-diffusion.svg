<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 505" width="620" height="505" font-family="Arial, Helvetica, sans-serif">
<text x="20" y="28" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">Diffusion and drift currents in a p-n junction (conventional current)</text>
<text x="20" y="68" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold">Unbiased</text>
<rect x="120" y="85" width="90.0" height="60" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<rect x="270.0" y="85" width="90.0" height="60" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<rect x="210.0" y="85" width="60" height="60" rx="0" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
<text x="140" y="122" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">p</text>
<text x="340" y="122" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">n</text>
<text x="240" y="80" font-size="13" fill="#6b7280" text-anchor="middle">depletion region</text>
<line x1="145" y1="100" x2="320" y2="100" stroke="#dc2626" stroke-width="5.5"/>
<polygon points="335.0,100.0 320.6,93.5 320.6,106.5" fill="#dc2626"/>
<line x1="335" y1="132" x2="160" y2="132" stroke="#2563eb" stroke-width="5.5"/>
<polygon points="145.0,132.0 159.4,138.5 159.4,125.5" fill="#2563eb"/>
<text x="405" y="104" font-size="13" fill="#dc2626" text-anchor="start">diffusion current</text>
<text x="405" y="136" font-size="13" fill="#2563eb" text-anchor="start">drift current</text>
<text x="20" y="164" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">Result: net current = 0</text>
<text x="20" y="198" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold">Forward bias</text>
<rect x="120" y="215" width="103.0" height="60" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<rect x="257.0" y="215" width="103.0" height="60" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<rect x="223.0" y="215" width="34" height="60" rx="0" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
<text x="140" y="252" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">p</text>
<text x="340" y="252" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">n</text>
<text x="240" y="210" font-size="13" fill="#6b7280" text-anchor="middle">depletion region</text>
<line x1="145" y1="230" x2="320" y2="230" stroke="#dc2626" stroke-width="15"/>
<polygon points="335.0,230.0 313.0,220.1 313.0,239.9" fill="#dc2626"/>
<line x1="335" y1="262" x2="160" y2="262" stroke="#2563eb" stroke-width="5.5"/>
<polygon points="145.0,262.0 159.4,268.5 159.4,255.5" fill="#2563eb"/>
<text x="405" y="234" font-size="13" fill="#dc2626" text-anchor="start">diffusion current</text>
<text x="405" y="266" font-size="13" fill="#2563eb" text-anchor="start">drift current</text>
<text x="20" y="294" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">Result: large net forward current (p to n)</text>
<text x="20" y="328" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold">Reverse bias</text>
<rect x="120" y="345" width="74.0" height="60" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<rect x="286.0" y="345" width="74.0" height="60" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<rect x="194.0" y="345" width="92" height="60" rx="0" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
<text x="140" y="382" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">p</text>
<text x="340" y="382" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">n</text>
<text x="240" y="340" font-size="13" fill="#6b7280" text-anchor="middle">depletion region</text>
<line x1="145" y1="360" x2="320" y2="360" stroke="#dc2626" stroke-width="0.8"/>
<polygon points="335.0,360.0 324.4,355.2 324.4,364.8" fill="#dc2626"/>
<line x1="335" y1="392" x2="160" y2="392" stroke="#2563eb" stroke-width="5.5"/>
<polygon points="145.0,392.0 159.4,398.5 159.4,385.5" fill="#2563eb"/>
<text x="405" y="364" font-size="13" fill="#dc2626" text-anchor="start">diffusion current</text>
<text x="405" y="396" font-size="13" fill="#2563eb" text-anchor="start">drift current</text>
<text x="20" y="424" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">Result: very small net reverse current</text>
<text x="20" y="466" font-size="13" fill="#6b7280" text-anchor="start">Arrow thickness shows the relative size of each current (illustrative, not to scale).</text>
<text x="20" y="486" font-size="13" fill="#6b7280" text-anchor="start">Diffusion: majority carriers cross the junction. Drift: minority carriers swept across by the barrier field.</text>
</svg>
