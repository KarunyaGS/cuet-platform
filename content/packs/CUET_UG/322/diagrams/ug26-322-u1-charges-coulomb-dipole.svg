<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Arial, Helvetica, sans-serif">
  <!-- axial and equatorial lines -->
  <line x1="50" y1="160" x2="590" y2="160" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="320" y1="104" x2="320" y2="262" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="590" y="150" font-size="14" fill="#6b7280" text-anchor="end">axial line</text>
  <text x="320" y="282" font-size="14" fill="#6b7280" text-anchor="middle">equatorial line (perpendicular bisector)</text>
  <!-- dipole moment arrow -->
  <line x1="230" y1="80" x2="398" y2="80" stroke="#059669" stroke-width="2.5"/>
  <polygon points="412,80 397,73 397,87" fill="#059669"/>
  <text x="320" y="62" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold">p = q(2a), directed from −q to +q</text>
  <!-- charges -->
  <circle cx="200" cy="160" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="167" font-size="20" font-weight="bold" fill="#2563eb" text-anchor="middle">−</text>
  <circle cx="440" cy="160" r="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="440" y="166" font-size="18" font-weight="bold" fill="#dc2626" text-anchor="middle">+</text>
  <text x="200" y="130" font-size="15" fill="#2563eb" text-anchor="middle">−q</text>
  <text x="440" y="130" font-size="15" fill="#dc2626" text-anchor="middle">+q</text>
  <circle cx="320" cy="160" r="3.5" fill="#1f2937"/>
  <text x="330" y="180" font-size="15" fill="#1f2937">O</text>
  <!-- separation -->
  <line x1="200" y1="214" x2="440" y2="214" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="200" y1="206" x2="200" y2="222" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="320" y1="208" x2="320" y2="220" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="440" y1="206" x2="440" y2="222" stroke="#1f2937" stroke-width="1.5"/>
  <text x="260" y="236" font-size="15" font-style="italic" fill="#1f2937" text-anchor="middle">a</text>
  <text x="380" y="236" font-size="15" font-style="italic" fill="#1f2937" text-anchor="middle">a</text>
</svg>
