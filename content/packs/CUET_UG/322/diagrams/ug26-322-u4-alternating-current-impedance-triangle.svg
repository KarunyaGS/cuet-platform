<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" font-family="Arial, Helvetica, sans-serif">
<polygon points="110,270 450,270 450,110" fill="#eff6ff" stroke="none"/>
<line x1="110" y1="270" x2="450" y2="270" stroke="#059669" stroke-width="3"/>
<line x1="450" y1="270" x2="450" y2="110" stroke="#d97706" stroke-width="3"/>
<line x1="110" y1="270" x2="450" y2="110" stroke="#2563eb" stroke-width="3"/>
<rect x="436" y="256" width="14" height="14" rx="0" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="280" y="300" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold">R  (resistance, Ω)</text>
<text x="464" y="192" font-size="15" fill="#d97706" text-anchor="start" font-weight="bold">X_L − X_C</text>
<text x="464" y="212" font-size="13" fill="#1f2937" text-anchor="start">(net reactance, Ω)</text>
<text x="230" y="175" font-size="15" fill="#2563eb" text-anchor="end" font-weight="bold">Z  (impedance, Ω)</text>
<polyline fill="none" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round" points="170.0,270.0 170.0,268.7 169.9,267.4 169.9,266.0 169.8,264.7 169.6,263.4 169.5,262.1 169.3,260.8 169.1,259.5 168.8,258.2 168.6,256.9 168.3,255.6 167.9,254.3 167.6,253.1 167.2,251.8 166.8,250.6 166.3,249.3 165.9,248.1 165.4,246.9 164.8,245.7 164.3,244.5"/>
<text x="194" y="261" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">φ</text>
<text x="300" y="40" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Z² = R² + (X_L − X_C)²</text>
<text x="300" y="64" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">tan φ = (X_L − X_C) / R</text>
<text x="300" y="335" font-size="13" fill="#6b7280" text-anchor="middle">Drawn for X_L &gt; X_C: the circuit is inductive and the source voltage leads the current by φ</text>
</svg>
