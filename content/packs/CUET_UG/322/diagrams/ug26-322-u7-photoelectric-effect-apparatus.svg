<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="Arial, Helvetica, sans-serif">
  <!-- incident light -->
  <line x1="310" y1="14" x2="210" y2="122" stroke="#d97706" stroke-width="2.5"/>
  <polygon points="206,126 210,113 218,121" fill="#d97706"/>
  <line x1="345" y1="14" x2="210" y2="162" stroke="#d97706" stroke-width="2.5"/>
  <polygon points="206,166 210,153 218,160" fill="#d97706"/>
  <text x="352" y="30" font-size="15" fill="#1f2937">Monochromatic light (frequency ν, intensity I)</text>

  <!-- evacuated tube -->
  <rect x="140" y="70" width="440" height="150" rx="60" fill="#2563eb" fill-opacity="0.05" stroke="#1f2937" stroke-width="2"/>
  <rect x="238" y="64" width="84" height="12" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="232" y="58" font-size="14" fill="#1f2937" text-anchor="end">Quartz window</text>
  <text x="592" y="86" font-size="14" fill="#1f2937">Evacuated</text>
  <text x="592" y="103" font-size="14" fill="#1f2937">glass tube</text>

  <!-- emitter and collector -->
  <rect x="196" y="100" width="9" height="100" fill="#1f2937"/>
  <rect x="516" y="100" width="9" height="100" fill="#1f2937"/>
  <line x1="98" y1="150" x2="194" y2="150" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="92" y="146" font-size="15" fill="#1f2937" text-anchor="end">Emitter C</text>
  <text x="92" y="164" font-size="13" fill="#1f2937" text-anchor="end">(photosensitive</text>
  <text x="92" y="180" font-size="13" fill="#1f2937" text-anchor="end">metal plate)</text>
  <line x1="527" y1="150" x2="620" y2="150" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="626" y="155" font-size="15" fill="#1f2937">Collector A</text>

  <!-- photoelectrons -->
  <g fill="#2563eb">
    <circle cx="262" cy="128" r="6"/>
    <circle cx="330" cy="170" r="6"/>
    <circle cx="398" cy="132" r="6"/>
    <circle cx="456" cy="176" r="6"/>
  </g>
  <g stroke="#2563eb" stroke-width="2">
    <line x1="270" y1="128" x2="298" y2="128"/>
    <line x1="338" y1="170" x2="366" y2="170"/>
    <line x1="406" y1="132" x2="434" y2="132"/>
    <line x1="464" y1="176" x2="492" y2="176"/>
  </g>
  <g fill="#2563eb">
    <polygon points="306,128 296,123 296,133"/>
    <polygon points="374,170 364,165 364,175"/>
    <polygon points="442,132 432,127 432,137"/>
    <polygon points="500,176 490,171 490,181"/>
  </g>
  <text x="380" y="106" font-size="14" fill="#2563eb" text-anchor="middle">photoelectrons (e⁻) → A</text>

  <!-- leads -->
  <line x1="200" y1="200" x2="200" y2="280" stroke="#1f2937" stroke-width="2"/>
  <line x1="200" y1="320" x2="200" y2="420" stroke="#1f2937" stroke-width="2"/>
  <line x1="520" y1="200" x2="520" y2="420" stroke="#1f2937" stroke-width="2"/>

  <!-- microammeter -->
  <circle cx="200" cy="300" r="20" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="200" y="306" font-size="15" fill="#1f2937" text-anchor="middle">μA</text>
  <text x="228" y="296" font-size="14" fill="#1f2937">Microammeter</text>
  <text x="228" y="313" font-size="13" fill="#1f2937">(photocurrent)</text>

  <!-- voltmeter branch -->
  <line x1="200" y1="365" x2="340" y2="365" stroke="#1f2937" stroke-width="2"/>
  <line x1="380" y1="365" x2="520" y2="365" stroke="#1f2937" stroke-width="2"/>
  <circle cx="200" cy="365" r="4" fill="#1f2937"/>
  <circle cx="520" cy="365" r="4" fill="#1f2937"/>
  <circle cx="360" cy="365" r="20" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="360" y="371" font-size="15" fill="#1f2937" text-anchor="middle">V</text>
  <text x="390" y="352" font-size="14" fill="#1f2937">Voltmeter</text>

  <!-- battery, potential divider and commutator -->
  <line x1="200" y1="420" x2="290" y2="420" stroke="#1f2937" stroke-width="2"/>
  <line x1="290" y1="400" x2="290" y2="440" stroke="#1f2937" stroke-width="2"/>
  <line x1="302" y1="410" x2="302" y2="430" stroke="#1f2937" stroke-width="4"/>
  <line x1="314" y1="400" x2="314" y2="440" stroke="#1f2937" stroke-width="2"/>
  <line x1="326" y1="410" x2="326" y2="430" stroke="#1f2937" stroke-width="4"/>
  <line x1="326" y1="420" x2="390" y2="420" stroke="#1f2937" stroke-width="2"/>
  <line x1="282" y1="446" x2="330" y2="406" stroke="#dc2626" stroke-width="1.8"/>
  <polygon points="336,401 325,404 331,411" fill="#dc2626"/>
  <text x="308" y="466" font-size="13" fill="#1f2937" text-anchor="middle">Variable DC source</text>
  <text x="308" y="482" font-size="13" fill="#1f2937" text-anchor="middle">(potential divider)</text>
  <rect x="390" y="402" width="100" height="36" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="440" y="425" font-size="14" fill="#1f2937" text-anchor="middle">Commutator</text>
  <line x1="490" y1="420" x2="520" y2="420" stroke="#1f2937" stroke-width="2"/>
  <text x="440" y="458" font-size="13" fill="#1f2937" text-anchor="middle">(reverses the polarity</text>
  <text x="440" y="474" font-size="13" fill="#1f2937" text-anchor="middle">of A relative to C)</text>
</svg>
