<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial, Helvetica, sans-serif">
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1f2937">Cassegrain reflecting telescope</text>
  <!-- axis -->
  <line x1="20" y1="200" x2="700" y2="200" stroke="#1f2937" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- primary concave mirror with central hole -->
  <path d="M553.9 115 A600 600 0 0 1 559.9 188" fill="none" stroke="#1f2937" stroke-width="3"/>
  <path d="M559.9 212 A600 600 0 0 1 553.9 285" fill="none" stroke="#1f2937" stroke-width="3"/>
  <path d="M556 125 l10 -6 M558.6 150 l10 -6 M559.8 175 l10 -6 M559.8 225 l10 -6 M558.6 250 l10 -6 M556 275 l10 -6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="520" y="100" font-size="14" fill="#1f2937">primary concave mirror</text>
  <text x="520" y="315" font-size="13" fill="#1f2937">(objective, with central hole)</text>
  <!-- secondary convex mirror -->
  <path d="M338.6 175 A224 224 0 0 1 338.6 225" fill="none" stroke="#1f2937" stroke-width="3"/>
  <path d="M338.6 178 l-9 -5 M339.6 192 l-9 -5 M339.6 208 l-9 -5 M338.8 222 l-9 -5" stroke="#1f2937" stroke-width="1.3"/>
  <text x="196" y="160" font-size="14" fill="#1f2937">secondary</text>
  <text x="196" y="176" font-size="14" fill="#1f2937">convex mirror</text>
  <!-- incoming rays -->
  <line x1="40" y1="130" x2="555.9" y2="130" stroke="#2563eb" stroke-width="1.8"/>
  <polygon points="298,130 287,134.5 287,125.5" fill="#2563eb"/>
  <line x1="40" y1="270" x2="555.9" y2="270" stroke="#2563eb" stroke-width="1.8"/>
  <polygon points="298,270 287,274.5 287,265.5" fill="#2563eb"/>
  <text x="40" y="120" font-size="13" fill="#1f2937">parallel light from a distant star</text>
  <!-- reflected by primary towards F1, intercepted by secondary -->
  <line x1="555.9" y1="130" x2="339.2" y2="181.3" stroke="#2563eb" stroke-width="1.8"/>
  <polygon points="447.6,155.6 457.2,148.7 459.3,157.5" fill="#2563eb"/>
  <line x1="555.9" y1="270" x2="339.2" y2="218.7" stroke="#2563eb" stroke-width="1.8"/>
  <polygon points="447.6,244.4 459.3,242.5 457.2,251.3" fill="#2563eb"/>
  <line x1="339.2" y1="181.3" x2="260" y2="200" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="339.2" y1="218.7" x2="260" y2="200" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="260" cy="200" r="3" fill="#1f2937"/>
  <text x="196" y="226" font-size="13" fill="#1f2937">F1 (focus of primary)</text>
  <!-- reflected by secondary through the hole to F2 -->
  <line x1="339.2" y1="181.3" x2="640" y2="201.3" stroke="#2563eb" stroke-width="1.8"/>
  <polygon points="465.6,189.7 454.3,193.5 454.9,184.5" fill="#2563eb"/>
  <line x1="339.2" y1="218.7" x2="640" y2="198.7" stroke="#2563eb" stroke-width="1.8"/>
  <polygon points="465.6,210.3 454.9,215.5 454.3,206.5" fill="#2563eb"/>
  <circle cx="620" cy="200" r="3" fill="#dc2626"/>
  <text x="598" y="232" font-size="13" fill="#dc2626">F2 (image)</text>
  <!-- eyepiece and eye -->
  <path d="M662 176 Q670 200 662 224 Q654 200 662 176 Z" fill="#2563eb" fill-opacity="0.10" stroke="#1f2937" stroke-width="2"/>
  <text x="636" y="166" font-size="13" fill="#1f2937">eyepiece</text>
  <ellipse cx="690" cy="200" rx="9" ry="15" fill="none" stroke="#1f2937" stroke-width="1.8"/>
  <circle cx="685" cy="200" r="3.5" fill="#1f2937"/>
  <text x="20" y="344" font-size="13" fill="#1f2937">The convex secondary intercepts the converging beam before F1 and sends it back through the hole to F2.</text>
</svg>
