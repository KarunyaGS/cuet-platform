<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Arial, Helvetica, sans-serif">
  <!-- uniform field -->
  <line x1="40" y1="50" x2="700" y2="50" stroke="#059669" stroke-width="1.8"/>
  <polygon points="714,50 700,43 700,57" fill="#059669"/>
  <line x1="40" y1="340" x2="700" y2="340" stroke="#059669" stroke-width="1.8"/>
  <polygon points="714,340 700,333 700,347" fill="#059669"/>
  <text x="48" y="40" font-size="15" font-weight="bold" fill="#059669">uniform field B</text>
  <!-- lines of action -->
  <line x1="150" y1="148.4" x2="660" y2="148.4" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="150" y1="251.6" x2="660" y2="251.6" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- reference direction and angle -->
  <line x1="380" y1="200" x2="490" y2="200" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- magnet -->
  <g transform="translate(380,200) rotate(-35)">
    <rect x="-100" y="-12" width="100" height="24" fill="#2563eb" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="-12" width="100" height="24" fill="#dc2626" stroke="#1f2937" stroke-width="1.5"/>
    <text x="-55" y="6" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">S</text>
    <text x="55" y="6" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">N</text>
  </g>
  <path d="M 432 200 A 52 52 0 0 0 422.6 170.2" fill="none" stroke="#1f2937" stroke-width="1.8"/>
  <text x="440" y="192" font-size="15" font-weight="bold" fill="#1f2937">θ</text>
  <circle cx="380" cy="200" r="3" fill="#1f2937"/>
  <text x="390" y="230" font-size="14" font-weight="bold" fill="#1f2937">O</text>
  <!-- forces on the poles -->
  <circle cx="453.7" cy="148.4" r="4" fill="#1f2937"/>
  <line x1="458" y1="148.4" x2="522" y2="148.4" stroke="#dc2626" stroke-width="3"/>
  <polygon points="536,148.4 520,140.4 520,156.4" fill="#dc2626"/>
  <text x="500" y="136" font-size="14" font-weight="bold" fill="#dc2626">qm B</text>
  <circle cx="306.3" cy="251.6" r="4" fill="#1f2937"/>
  <line x1="302" y1="251.6" x2="238" y2="251.6" stroke="#dc2626" stroke-width="3"/>
  <polygon points="224,251.6 240,243.6 240,259.6" fill="#dc2626"/>
  <text x="222" y="278" font-size="14" font-weight="bold" fill="#dc2626">qm B</text>
  <!-- arm of the couple -->
  <line x1="620" y1="148.4" x2="620" y2="251.6" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="612" y1="148.4" x2="628" y2="148.4" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="612" y1="251.6" x2="628" y2="251.6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="630" y="205" font-size="14" font-weight="bold" fill="#1f2937">2l sin θ</text>
  <text x="478" y="118" font-size="13" fill="#1f2937">N pole</text>
  <text x="262" y="232" font-size="13" fill="#1f2937">S pole</text>
  <!-- notes -->
  <text x="380" y="370" font-size="13" fill="#1f2937" text-anchor="middle">Net force = 0. Torque = (qm B)(2l sin θ) = mB sin θ, which turns m (S to N) towards B.</text>
  <text x="380" y="390" font-size="13" fill="#1f2937" text-anchor="middle">Here the couple is clockwise, so θ decreases.</text>
</svg>
