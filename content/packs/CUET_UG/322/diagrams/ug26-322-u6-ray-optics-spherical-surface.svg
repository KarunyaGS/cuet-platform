<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Arial, Helvetica, sans-serif">
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1f2937">Refraction at a convex spherical surface (n1 &lt; n2)</text>
  <!-- denser medium bounded by the curved surface -->
  <path d="M363.4 135.7 A100 100 0 0 0 363.4 304.3 L720 304.3 L720 135.7 Z" fill="#2563eb" fill-opacity="0.08"/>
  <path d="M363.4 135.7 A100 100 0 0 0 363.4 304.3" fill="none" stroke="#1f2937" stroke-width="2.5"/>
  <text x="120" y="80" font-size="15" fill="#1f2937">medium 1: n1</text>
  <text x="560" y="160" font-size="15" fill="#1f2937">medium 2: n2</text>
  <!-- axis -->
  <line x1="40" y1="220" x2="740" y2="220" stroke="#1f2937" stroke-width="1.5"/>
  <!-- normal through C and N -->
  <line x1="440" y1="220" x2="301.4" y2="140" stroke="#1f2937" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="262" y="134" font-size="13" fill="#1f2937">normal</text>
  <!-- perpendicular NM -->
  <line x1="353.4" y1="170" x2="353.4" y2="220" stroke="#1f2937" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- incident ray and its extension -->
  <line x1="60" y1="220" x2="353.4" y2="170" stroke="#2563eb" stroke-width="2"/>
  <polygon points="221.4,192.5 211.3,198.8 209.8,189.9" fill="#2563eb"/>
  <line x1="353.4" y1="170" x2="422.4" y2="158.2" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- refracted ray -->
  <line x1="353.4" y1="170" x2="601.7" y2="220" stroke="#2563eb" stroke-width="2"/>
  <polygon points="477.5,195 465.9,197.2 467.6,188.4" fill="#2563eb"/>
  <!-- points -->
  <circle cx="60" cy="220" r="4" fill="#059669"/>
  <circle cx="353.4" cy="170" r="3" fill="#1f2937"/>
  <circle cx="340" cy="220" r="3" fill="#1f2937"/>
  <circle cx="440" cy="220" r="3.5" fill="#1f2937"/>
  <circle cx="601.7" cy="220" r="4" fill="#dc2626"/>
  <text x="52" y="244" font-size="15" fill="#059669">O</text>
  <text x="344" y="160" font-size="15" fill="#1f2937">N</text>
  <text x="356" y="238" font-size="13" fill="#1f2937">M</text>
  <text x="322" y="238" font-size="15" fill="#1f2937">P</text>
  <text x="436" y="242" font-size="15" fill="#1f2937">C</text>
  <text x="597" y="244" font-size="15" fill="#dc2626">I</text>
  <!-- angle labels -->
  <text x="120" y="214" font-size="14" fill="#d97706">α</text>
  <text x="408" y="214" font-size="14" fill="#d97706">β</text>
  <text x="560" y="214" font-size="14" fill="#d97706">γ</text>
  <path d="M402.7 161.6 A50 50 0 0 1 396.7 195" fill="none" stroke="#dc2626" stroke-width="1.2"/>
  <path d="M384.8 176.3 A32 32 0 0 1 381.1 186" fill="none" stroke="#dc2626" stroke-width="1.2"/>
  <text x="408" y="176" font-size="14" fill="#dc2626">i</text>
  <text x="392" y="190" font-size="13" fill="#dc2626">r</text>
  <!-- distances (Cartesian signs, light travels left to right) -->
  <line x1="60" y1="330" x2="340" y2="330" stroke="#1f2937" stroke-width="1.2"/>
  <polygon points="60,330 70,326 70,334" fill="#1f2937"/>
  <text x="140" y="324" font-size="13" fill="#1f2937">u = PO (negative)</text>
  <line x1="340" y1="352" x2="601.7" y2="352" stroke="#1f2937" stroke-width="1.2"/>
  <polygon points="601.7,352 591.7,348 591.7,356" fill="#1f2937"/>
  <text x="420" y="370" font-size="13" fill="#1f2937">v = PI (positive)</text>
  <line x1="340" y1="300" x2="440" y2="300" stroke="#1f2937" stroke-width="1.2"/>
  <polygon points="440,300 430,296 430,304" fill="#1f2937"/>
  <text x="378" y="318" font-size="13" fill="#1f2937">R = PC (+)</text>
  <line x1="340" y1="224" x2="340" y2="356" stroke="#1f2937" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text x="20" y="392" font-size="12" fill="#1f2937">Angles exaggerated; ray traced with Snell's law for n2/n1 = 2.0. For small apertures: i = α + β, r = β − γ.</text>
</svg>
