<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 450" font-family="Arial, Helvetica, sans-serif">
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1f2937">Plane wavefronts crossing into a slower medium (v1 = 1.5 v2)</text>
  <rect x="40" y="220" width="660" height="170" fill="#059669" fill-opacity="0.07"/>
  <line x1="40" y1="220" x2="700" y2="220" stroke="#1f2937" stroke-width="2.2"/>
  <!-- incident wavefronts (medium 1) -->
  <line x1="40" y1="98.6" x2="88.6" y2="50" stroke="#2563eb" stroke-width="1.6"/>
  <line x1="40" y1="169.3" x2="159.3" y2="50" stroke="#2563eb" stroke-width="1.6"/>
  <line x1="60" y1="220" x2="230" y2="50" stroke="#2563eb" stroke-width="1.6"/>
  <line x1="130.7" y1="220" x2="300.7" y2="50" stroke="#2563eb" stroke-width="1.6"/>
  <line x1="201.4" y1="220" x2="371.4" y2="50" stroke="#2563eb" stroke-width="1.6"/>
  <line x1="272.1" y1="220" x2="442.1" y2="50" stroke="#2563eb" stroke-width="1.6"/>
  <line x1="342.8" y1="220" x2="512.8" y2="50" stroke="#2563eb" stroke-width="1.6"/>
  <line x1="413.6" y1="220" x2="583.6" y2="50" stroke="#2563eb" stroke-width="1.6"/>
  <line x1="484.3" y1="220" x2="654.3" y2="50" stroke="#2563eb" stroke-width="1.6"/>
  <line x1="555" y1="220" x2="700" y2="75" stroke="#2563eb" stroke-width="1.6"/>
  <line x1="625.7" y1="220" x2="700" y2="145.7" stroke="#2563eb" stroke-width="1.6"/>
  <!-- refracted wavefronts (medium 2) -->
  <line x1="60" y1="220" x2="40" y2="230.7" stroke="#059669" stroke-width="1.6"/>
  <line x1="130.7" y1="220" x2="40" y2="268.5" stroke="#059669" stroke-width="1.6"/>
  <line x1="201.4" y1="220" x2="40" y2="306.3" stroke="#059669" stroke-width="1.6"/>
  <line x1="272.1" y1="220" x2="40" y2="344.1" stroke="#059669" stroke-width="1.6"/>
  <line x1="342.8" y1="220" x2="40" y2="381.9" stroke="#059669" stroke-width="1.6"/>
  <line x1="413.6" y1="220" x2="95.5" y2="390" stroke="#059669" stroke-width="1.6"/>
  <line x1="484.3" y1="220" x2="166.2" y2="390" stroke="#059669" stroke-width="1.6"/>
  <line x1="555" y1="220" x2="236.9" y2="390" stroke="#059669" stroke-width="1.6"/>
  <line x1="625.7" y1="220" x2="307.6" y2="390" stroke="#059669" stroke-width="1.6"/>
  <line x1="696.4" y1="220" x2="378.4" y2="390" stroke="#059669" stroke-width="1.6"/>
  <line x1="700" y1="255.9" x2="449.1" y2="390" stroke="#059669" stroke-width="1.6"/>
  <line x1="700" y1="293.7" x2="519.8" y2="390" stroke="#059669" stroke-width="1.6"/>
  <line x1="700" y1="331.5" x2="590.5" y2="390" stroke="#059669" stroke-width="1.6"/>
  <!-- rays (normals to the wavefronts) -->
  <line x1="343.9" y1="113.9" x2="450" y2="220" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="450" y1="220" x2="520.7" y2="352.3" stroke="#dc2626" stroke-width="2.2"/>
  <polygon points="407.6,177.6 396.6,173 403,166.6" fill="#dc2626"/>
  <polygon points="492.4,299.4 483.3,291.8 491.2,287.6" fill="#dc2626"/>
  <line x1="450" y1="120" x2="450" y2="330" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="430" y="160" font-size="15" fill="#dc2626">i</text>
  <text x="458" y="268" font-size="15" fill="#dc2626">r</text>
  <!-- labels -->
  <rect x="540" y="96" width="150" height="44" fill="#ffffff" fill-opacity="0.85"/>
  <text x="548" y="114" font-size="14" fill="#1f2937">medium 1: speed v1</text>
  <text x="548" y="132" font-size="14" fill="#2563eb">wavelength λ1</text>
  <rect x="520" y="340" width="176" height="44" fill="#ffffff" fill-opacity="0.85"/>
  <text x="528" y="358" font-size="14" fill="#1f2937">medium 2: speed v2 &lt; v1</text>
  <text x="528" y="376" font-size="14" fill="#059669">wavelength λ2 = λ1 v2/v1</text>
  <text x="20" y="414" font-size="13" fill="#1f2937">Each wavefront stays continuous at the boundary, so it bends; the rays (red) stay perpendicular to the wavefronts.</text>
  <text x="20" y="434" font-size="13" fill="#1f2937">Drawn for i = 45°: sin i / sin r = v1/v2 = 1.5 gives r = 28.1°; wavefront spacing falls from λ1 to λ1/1.5.</text>
</svg>
