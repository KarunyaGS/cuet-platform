<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Arial, Helvetica, sans-serif">
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1f2937">Dispersion of white light by a prism</text>
  <!-- prism -->
  <polygon points="330,70 179.9,330 480.1,330" fill="#2563eb" fill-opacity="0.08" stroke="#1f2937" stroke-width="2"/>
  <!-- white light -->
  <line x1="95.2" y1="258.1" x2="254.9" y2="200" stroke="#1f2937" stroke-width="3"/>
  <polygon points="183.1,226.2 174.3,234.2 171.2,225.7" fill="#1f2937"/>
  <text x="40" y="290" font-size="14" fill="#1f2937">white light</text>
  <!-- colours inside the prism -->
  <line x1="254.9" y1="200" x2="404" y2="198.2" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="254.9" y1="200" x2="405" y2="199.9" stroke="#d97706" stroke-width="1.8"/>
  <line x1="254.9" y1="200" x2="406" y2="201.6" stroke="#059669" stroke-width="1.8"/>
  <line x1="254.9" y1="200" x2="406.9" y2="203.2" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="254.9" y1="200" x2="407.8" y2="204.7" stroke="#7c3aed" stroke-width="1.8"/>
  <!-- emergent colours -->
  <line x1="404" y1="198.2" x2="690" y2="286.7" stroke="#dc2626" stroke-width="2"/>
  <polygon points="561.3,246.9 550.6,247.7 552.9,240.1" fill="#dc2626"/>
  <line x1="405" y1="199.9" x2="690" y2="302.6" stroke="#d97706" stroke-width="2"/>
  <polygon points="561.7,256.4 551,256.7 553.7,249.2" fill="#d97706"/>
  <line x1="406" y1="201.6" x2="690" y2="319.5" stroke="#059669" stroke-width="2"/>
  <polygon points="562.2,266.4 551.4,266.3 554.5,258.9" fill="#059669"/>
  <line x1="406.9" y1="203.2" x2="690" y2="337.9" stroke="#2563eb" stroke-width="2"/>
  <polygon points="562.6,277.3 551.9,276.6 555.3,269.4" fill="#2563eb"/>
  <line x1="407.8" y1="204.7" x2="690" y2="358.3" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="563,289.2 552.3,288 556.1,280.9" fill="#7c3aed"/>
  <!-- screen -->
  <line x1="694" y1="262" x2="694" y2="382" stroke="#1f2937" stroke-width="3"/>
  <text x="700" y="258" font-size="13" fill="#1f2937">screen</text>
  <text x="702" y="291" font-size="14" fill="#dc2626">Red</text>
  <text x="702" y="364" font-size="14" fill="#7c3aed">Violet</text>
  <!-- notes -->
  <text x="470" y="120" font-size="14" fill="#dc2626">red: least deviated (smallest n)</text>
  <text x="470" y="140" font-size="14" fill="#7c3aed">violet: most deviated (largest n)</text>
  <text x="20" y="396" font-size="13" fill="#1f2937">Spread exaggerated for clarity (traced with n = 1.50 for red to 1.62 for violet; real crown glass: about 1.51 to 1.53).</text>
  <text x="20" y="414" font-size="13" fill="#1f2937">Angular dispersion = δ(violet) − δ(red); for a thin prism it equals (nv − nr)A.</text>
</svg>
