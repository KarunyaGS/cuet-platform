<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Arial, Helvetica, sans-serif">
  <!-- surface S2: pot-shaped surface whose bottom lies in the gap between the plates -->
  <path d="M180,130 C225,130 255,64 305,64 L382,64 L382,336 L305,336 C255,336 225,270 180,270" fill="#d97706" fill-opacity="0.13" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5"/>
  <ellipse cx="382" cy="200" rx="15" ry="136" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5"/>

  <!-- wires -->
  <line x1="20" y1="200" x2="330" y2="200" stroke="#1f2937" stroke-width="2.2"/>
  <line x1="428" y1="200" x2="740" y2="200" stroke="#1f2937" stroke-width="2.2"/>

  <!-- capacitor plates -->
  <rect x="330" y="100" width="8" height="200" fill="#1f2937"/>
  <rect x="420" y="100" width="8" height="200" fill="#1f2937"/>
  <text x="334" y="92" font-size="14" fill="#1f2937" text-anchor="middle">+Q</text>
  <text x="440" y="92" font-size="14" fill="#1f2937" text-anchor="middle">−Q</text>

  <!-- E field in the gap (green) -->
  <g stroke="#059669" stroke-width="1.8">
    <line x1="342" y1="122" x2="404" y2="122"/>
    <line x1="342" y1="160" x2="404" y2="160"/>
    <line x1="342" y1="240" x2="404" y2="240"/>
    <line x1="342" y1="278" x2="404" y2="278"/>
  </g>
  <g fill="#059669">
    <polygon points="414,122 403,116 403,128"/>
    <polygon points="414,160 403,154 403,166"/>
    <polygon points="414,240 403,234 403,246"/>
    <polygon points="414,278 403,272 403,284"/>
  </g>
  <text x="404" y="218" font-size="14" fill="#059669" font-weight="bold">E</text>

  <!-- surface S1: flat disc bounded by the loop -->
  <ellipse cx="180" cy="200" rx="24" ry="70" fill="#2563eb" fill-opacity="0.18" stroke="#1f2937" stroke-width="2.2"/>
  <!-- wire drawn again over the disc so it visibly pierces S1 -->
  <line x1="156" y1="200" x2="204" y2="200" stroke="#1f2937" stroke-width="2.2"/>

  <!-- current arrow -->
  <polygon points="96,200 82,193 82,207" fill="#dc2626"/>
  <text x="84" y="186" font-size="16" fill="#dc2626" font-weight="bold">i</text>
  <polygon points="620,200 606,193 606,207" fill="#dc2626"/>
  <text x="608" y="186" font-size="16" fill="#dc2626" font-weight="bold">i</text>

  <!-- labels -->
  <text x="100" y="122" font-size="15" fill="#1f2937">loop C</text>
  <line x1="148" y1="126" x2="170" y2="138" stroke="#1f2937" stroke-width="1.5"/>
  <text x="118" y="292" font-size="16" fill="#2563eb" font-weight="bold">S<tspan font-size="12" dy="4">1</tspan></text>
  <line x1="134" y1="278" x2="170" y2="250" stroke="#2563eb" stroke-width="1.5"/>
  <text x="262" y="96" font-size="16" fill="#d97706" font-weight="bold">S<tspan font-size="12" dy="4">2</tspan></text>

  <!-- explanation -->
  <text x="20" y="372" font-size="14" fill="#1f2937"><tspan fill="#2563eb" font-weight="bold">S1</tspan> (flat disc): the wire carries conduction current i through it; Φ<tspan font-size="11" dy="3">E</tspan><tspan dy="-3"> through it does not change.</tspan></text>
  <text x="20" y="396" font-size="14" fill="#1f2937"><tspan fill="#d97706" font-weight="bold">S2</tspan> (pot-shaped, bottom in the gap): no charge crosses it, but the electric flux Φ<tspan font-size="11" dy="3">E</tspan><tspan dy="-3"> through it grows.</tspan></text>
  <text x="20" y="30" font-size="15" fill="#1f2937">Both surfaces have the same boundary (loop C), so ∮B·dl must give the same answer for both.</text>
</svg>
