<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Arial, Helvetica, sans-serif" fill="none">
  <!-- laminated soft-iron core -->
  <path d="M180,60 H500 V300 H180 Z M250,130 V230 H430 V130 Z" fill="#e5e7eb" fill-rule="evenodd" stroke="#1f2937" stroke-width="2.5"/>
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="180" y1="78" x2="500" y2="78"/><line x1="180" y1="95" x2="500" y2="95"/><line x1="180" y1="112" x2="500" y2="112"/>
    <line x1="180" y1="248" x2="500" y2="248"/><line x1="180" y1="265" x2="500" y2="265"/><line x1="180" y1="282" x2="500" y2="282"/>
  </g>

  <!-- flux arrows in the core -->
  <line x1="300" y1="95" x2="370" y2="95" stroke="#059669" stroke-width="3"/>
  <polygon points="382,95 370,89 370,101" fill="#059669"/>
  <line x1="380" y1="265" x2="310" y2="265" stroke="#059669" stroke-width="3"/>
  <polygon points="298,265 310,259 310,271" fill="#059669"/>
  <text x="340" y="173" text-anchor="middle" font-size="14" fill="#059669">the same flux Φ</text>
  <text x="340" y="191" text-anchor="middle" font-size="14" fill="#059669">links both coils</text>

  <!-- primary winding (left limb) -->
  <g stroke="#dc2626" stroke-width="2.5">
    <ellipse cx="215" cy="145" rx="48" ry="7"/><ellipse cx="215" cy="159" rx="48" ry="7"/><ellipse cx="215" cy="173" rx="48" ry="7"/>
    <ellipse cx="215" cy="187" rx="48" ry="7"/><ellipse cx="215" cy="201" rx="48" ry="7"/><ellipse cx="215" cy="215" rx="48" ry="7"/>
  </g>
  <polyline points="167,145 80,145 80,160" stroke="#dc2626" stroke-width="2"/>
  <polyline points="167,215 80,215 80,200" stroke="#dc2626" stroke-width="2"/>
  <circle cx="80" cy="180" r="20" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <path d="M68,180 q6,-12 12,0 q6,12 12,0" stroke="#1f2937" stroke-width="2"/>
  <text x="80" y="245" text-anchor="middle" font-size="14" fill="#dc2626">AC input V<tspan font-size="10" dy="4">p</tspan></text>
  <text x="215" y="40" text-anchor="middle" font-size="14" fill="#dc2626">primary coil</text>
  <text x="215" y="56" text-anchor="middle" font-size="14" fill="#dc2626">N<tspan font-size="10" dy="4">p</tspan><tspan dy="-4"> turns</tspan></text>

  <!-- secondary winding (right limb), more turns: step-up -->
  <g stroke="#2563eb" stroke-width="2.2">
    <ellipse cx="465" cy="140" rx="48" ry="6"/><ellipse cx="465" cy="148" rx="48" ry="6"/><ellipse cx="465" cy="156" rx="48" ry="6"/>
    <ellipse cx="465" cy="164" rx="48" ry="6"/><ellipse cx="465" cy="172" rx="48" ry="6"/><ellipse cx="465" cy="180" rx="48" ry="6"/>
    <ellipse cx="465" cy="188" rx="48" ry="6"/><ellipse cx="465" cy="196" rx="48" ry="6"/><ellipse cx="465" cy="204" rx="48" ry="6"/>
    <ellipse cx="465" cy="212" rx="48" ry="6"/><ellipse cx="465" cy="220" rx="48" ry="6"/>
  </g>
  <polyline points="513,140 600,140 600,152" stroke="#2563eb" stroke-width="2"/>
  <polyline points="600,152 592,158 608,164 592,170 608,176 592,182 608,188 592,194 608,200 600,206" stroke="#1f2937" stroke-width="2"/>
  <polyline points="600,206 600,220 513,220" stroke="#2563eb" stroke-width="2"/>
  <text x="618" y="183" font-size="14" fill="#1f2937">load</text>
  <text x="600" y="245" text-anchor="middle" font-size="14" fill="#2563eb">output V<tspan font-size="10" dy="4">s</tspan></text>
  <text x="465" y="40" text-anchor="middle" font-size="14" fill="#2563eb">secondary coil</text>
  <text x="465" y="56" text-anchor="middle" font-size="14" fill="#2563eb">N<tspan font-size="10" dy="4">s</tspan><tspan dy="-4"> turns</tspan></text>

  <text x="340" y="325" text-anchor="middle" font-size="14" fill="#1f2937">laminated soft-iron core</text>
  <text x="340" y="347" text-anchor="middle" font-size="13" fill="#1f2937">Here N<tspan font-size="9" dy="4">s</tspan><tspan dy="-4"> &gt; N</tspan><tspan font-size="9" dy="4">p</tspan><tspan dy="-4">: a step-up transformer, V</tspan><tspan font-size="9" dy="4">s</tspan><tspan dy="-4">/V</tspan><tspan font-size="9" dy="4">p</tspan><tspan dy="-4"> = N</tspan><tspan font-size="9" dy="4">s</tspan><tspan dy="-4">/N</tspan><tspan font-size="9" dy="4">p</tspan></text>
</svg>
