<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="Arial, Helvetica, sans-serif">
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1f2937">Refracting astronomical telescope in normal adjustment</text>
  <!-- axis -->
  <line x1="10" y1="200" x2="640" y2="200" stroke="#1f2937" stroke-width="1.5"/>
  <!-- objective -->
  <path d="M100 120 Q122 200 100 280 Q78 200 100 120 Z" fill="#2563eb" fill-opacity="0.10" stroke="#1f2937" stroke-width="2"/>
  <text x="62" y="110" font-size="14" fill="#1f2937">objective</text>
  <!-- eyepiece -->
  <path d="M475 160 Q487 200 475 250 Q463 200 475 160 Z" fill="#2563eb" fill-opacity="0.10" stroke="#1f2937" stroke-width="2"/>
  <text x="445" y="150" font-size="14" fill="#1f2937">eyepiece</text>
  <!-- common focus -->
  <circle cx="400" cy="200" r="3" fill="#1f2937"/>
  <text x="360" y="190" font-size="13" fill="#1f2937">Fo = Fe</text>
  <!-- intermediate image -->
  <line x1="400" y1="200" x2="400" y2="214" stroke="#d97706" stroke-width="2.5"/>
  <polygon points="400,221 396,211 404,211" fill="#d97706"/>
  <!-- incoming parallel rays from top of a distant object -->
  <line x1="20" y1="154.4" x2="100" y2="160" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="20" y1="194.4" x2="100" y2="200" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="20" y1="234.4" x2="100" y2="240" stroke="#2563eb" stroke-width="1.8"/>
  <polygon points="68,157.8 56.7,161.5 57.3,152.5" fill="#2563eb"/>
  <polygon points="68,197.8 56.7,201.5 57.3,192.5" fill="#2563eb"/>
  <polygon points="68,237.8 56.7,241.5 57.3,232.5" fill="#2563eb"/>
  <!-- through objective to the focal plane and on to the eyepiece -->
  <polyline points="100,160 400,221 475,236.25 620,195.65" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <polyline points="100,200 400,221 475,226.2 620,185.6" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <polyline points="100,240 400,221 475,216.25 620,175.65" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <polygon points="562,211.9 552.6,219.2 550.2,210.5" fill="#2563eb"/>
  <polygon points="562,201.8 552.6,209.1 550.2,200.5" fill="#2563eb"/>
  <polygon points="562,191.9 552.6,199.2 550.2,190.5" fill="#2563eb"/>
  <!-- angles -->
  <text x="34" y="222" font-size="15" fill="#dc2626">α</text>
  <text x="590" y="214" font-size="15" fill="#dc2626">β</text>
  <text x="586" y="160" font-size="13" fill="#1f2937">to eye</text>
  <!-- focal lengths -->
  <line x1="100" y1="310" x2="400" y2="310" stroke="#1f2937" stroke-width="1.2"/>
  <polygon points="100,310 110,306 110,314" fill="#1f2937"/>
  <polygon points="400,310 390,306 390,314" fill="#1f2937"/>
  <text x="230" y="302" font-size="14" fill="#1f2937">fo</text>
  <line x1="400" y1="310" x2="475" y2="310" stroke="#1f2937" stroke-width="1.2"/>
  <polygon points="400,310 410,306 410,314" fill="#1f2937"/>
  <polygon points="475,310 465,306 465,314" fill="#1f2937"/>
  <text x="430" y="302" font-size="14" fill="#1f2937">fe</text>
  <line x1="400" y1="222" x2="400" y2="316" stroke="#1f2937" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="475" y1="252" x2="475" y2="316" stroke="#1f2937" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="100" y1="282" x2="100" y2="316" stroke="#1f2937" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text x="20" y="340" font-size="13" fill="#1f2937">Drawn for fo = 4 fe: the emergent rays make angle β ≈ 4α with the axis, so m = β/α = fo/fe = 4.</text>
  <text x="20" y="356" font-size="13" fill="#1f2937">Tube length fo + fe; final image at infinity and inverted.</text>
</svg>
