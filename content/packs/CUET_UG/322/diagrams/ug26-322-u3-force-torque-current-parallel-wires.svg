<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" font-family="Arial, Helvetica, sans-serif">
  <!-- Panel (a): parallel currents attract -->
  <text x="190" y="26" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">(a) Currents in the same direction attract</text>
  <line x1="120" y1="60" x2="120" y2="300" stroke="#1f2937" stroke-width="3"/>
  <line x1="260" y1="60" x2="260" y2="300" stroke="#1f2937" stroke-width="3"/>
  <polygon points="120,76 113,92 127,92" fill="#1f2937"/>
  <polygon points="260,76 253,92 267,92" fill="#1f2937"/>
  <text x="86" y="80" font-size="15" font-weight="bold" fill="#1f2937">I1</text>
  <text x="272" y="80" font-size="15" font-weight="bold" fill="#1f2937">I2</text>
  <text x="112" y="320" font-size="14" fill="#1f2937">wire 1</text>
  <text x="252" y="320" font-size="14" fill="#1f2937">wire 2</text>
  <!-- field of wire 1 at wire 2: into the page -->
  <circle cx="282" cy="236" r="9" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <path d="M 276 230 L 288 242 M 288 230 L 276 242" stroke="#2563eb" stroke-width="1.8"/>
  <text x="296" y="234" font-size="13" fill="#2563eb">B1 at wire 2</text>
  <text x="296" y="250" font-size="13" fill="#2563eb">(into page)</text>
  <!-- forces -->
  <line x1="124" y1="170" x2="166" y2="170" stroke="#dc2626" stroke-width="3"/>
  <polygon points="180,170 164,162 164,178" fill="#dc2626"/>
  <line x1="256" y1="170" x2="214" y2="170" stroke="#dc2626" stroke-width="3"/>
  <polygon points="200,170 216,162 216,178" fill="#dc2626"/>
  <text x="134" y="158" font-size="15" font-weight="bold" fill="#dc2626">F</text>
  <text x="232" y="158" font-size="15" font-weight="bold" fill="#dc2626">F</text>
  <!-- separation -->
  <line x1="120" y1="342" x2="260" y2="342" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="120" y1="334" x2="120" y2="350" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="260" y1="334" x2="260" y2="350" stroke="#1f2937" stroke-width="1.5"/>
  <text x="190" y="362" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">d</text>

  <line x1="380" y1="40" x2="380" y2="350" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- Panel (b): antiparallel currents repel -->
  <text x="570" y="26" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">(b) Currents in opposite directions repel</text>
  <line x1="500" y1="60" x2="500" y2="300" stroke="#1f2937" stroke-width="3"/>
  <line x1="640" y1="60" x2="640" y2="300" stroke="#1f2937" stroke-width="3"/>
  <polygon points="500,76 493,92 507,92" fill="#1f2937"/>
  <polygon points="640,284 633,268 647,268" fill="#1f2937"/>
  <text x="466" y="80" font-size="15" font-weight="bold" fill="#1f2937">I1</text>
  <text x="652" y="290" font-size="15" font-weight="bold" fill="#1f2937">I2</text>
  <text x="492" y="320" font-size="14" fill="#1f2937">wire 1</text>
  <text x="632" y="320" font-size="14" fill="#1f2937">wire 2</text>
  <circle cx="662" cy="236" r="9" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <path d="M 656 230 L 668 242 M 668 230 L 656 242" stroke="#2563eb" stroke-width="1.8"/>
  <text x="676" y="234" font-size="13" fill="#2563eb">B1 at</text>
  <text x="676" y="250" font-size="13" fill="#2563eb">wire 2</text>
  <line x1="496" y1="170" x2="454" y2="170" stroke="#dc2626" stroke-width="3"/>
  <polygon points="440,170 456,162 456,178" fill="#dc2626"/>
  <line x1="644" y1="170" x2="686" y2="170" stroke="#dc2626" stroke-width="3"/>
  <polygon points="700,170 684,162 684,178" fill="#dc2626"/>
  <text x="458" y="158" font-size="15" font-weight="bold" fill="#dc2626">F</text>
  <text x="668" y="158" font-size="15" font-weight="bold" fill="#dc2626">F</text>
  <line x1="500" y1="342" x2="640" y2="342" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="500" y1="334" x2="500" y2="350" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="640" y1="334" x2="640" y2="350" stroke="#1f2937" stroke-width="1.5"/>
  <text x="570" y="362" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">d</text>
</svg>
