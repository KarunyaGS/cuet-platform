<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Arial, Helvetica, sans-serif">
  <!-- Panel (a): ohmic conductor, axes crossing at the origin -->
  <line x1="40" y1="165" x2="335" y2="165" stroke="#1f2937" stroke-width="2"/>
  <polygon points="345,165 333,159 333,171" fill="#1f2937"/>
  <line x1="190" y1="300" x2="190" y2="40" stroke="#1f2937" stroke-width="2"/>
  <polygon points="190,30 184,42 196,42" fill="#1f2937"/>
  <text x="340" y="190" font-size="14" fill="#1f2937" text-anchor="end">V (volt)</text>
  <text x="200" y="40" font-size="14" fill="#1f2937">I (ampere)</text>
  <text x="180" y="182" font-size="13" fill="#1f2937" text-anchor="end">O</text>
  <line x1="60" y1="269" x2="320" y2="61" stroke="#2563eb" stroke-width="2.5"/>
  <!-- slope triangle -->
  <line x1="230" y1="133" x2="290" y2="133" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="290" y1="133" x2="290" y2="85" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="260" y="150" font-size="13" fill="#dc2626" text-anchor="middle">ΔV</text>
  <text x="296" y="114" font-size="13" fill="#dc2626">ΔI</text>
  <text x="70" y="95" font-size="13" fill="#2563eb">slope = ΔI/ΔV = 1/R</text>
  <text x="190" y="335" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">(a) Ohmic conductor: I ∝ V</text>

  <!-- Panel (b): same metal wire at two temperatures -->
  <line x1="440" y1="280" x2="725" y2="280" stroke="#1f2937" stroke-width="2"/>
  <polygon points="735,280 723,274 723,286" fill="#1f2937"/>
  <line x1="440" y1="280" x2="440" y2="40" stroke="#1f2937" stroke-width="2"/>
  <polygon points="440,30 434,42 446,42" fill="#1f2937"/>
  <text x="730" y="303" font-size="14" fill="#1f2937" text-anchor="end">V (volt)</text>
  <text x="450" y="38" font-size="14" fill="#1f2937">I (ampere)</text>
  <text x="430" y="297" font-size="13" fill="#1f2937" text-anchor="end">O</text>
  <line x1="440" y1="280" x2="660" y2="97" stroke="#059669" stroke-width="2.5"/>
  <line x1="440" y1="280" x2="700" y2="150" stroke="#d97706" stroke-width="2.5"/>
  <text x="666" y="94" font-size="15" fill="#059669" font-weight="bold">T<tspan font-size="11" dy="4">1</tspan></text>
  <text x="706" y="150" font-size="15" fill="#d97706" font-weight="bold">T<tspan font-size="11" dy="4">2</tspan></text>
  <text x="458" y="72" font-size="13" fill="#1f2937">T<tspan font-size="10" dy="3">2</tspan><tspan dy="-3"> &gt; T</tspan><tspan font-size="10" dy="3">1</tspan><tspan dy="-3">: smaller slope, larger R</tspan></text>
  <text x="590" y="335" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">(b) Metal wire at two temperatures</text>
</svg>
