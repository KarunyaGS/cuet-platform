<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 455" width="660" height="455" font-family="Arial, Helvetica, sans-serif">
<rect x="60" y="150" width="540" height="250" fill="#dbeafe" opacity="0.55"/>
<line x1="60" y1="150" x2="600" y2="150" stroke="#1f2937" stroke-width="2"/>
<text x="70" y="140" font-size="14" fill="#1f2937" text-anchor="start">Air (n = 1)</text>
<text x="70" y="386" font-size="14" fill="#1f2937" text-anchor="start">Water (n = 4/3)</text>
<circle cx="300" cy="350" r="5" fill="#059669" stroke="#059669" stroke-width="1"/>
<text x="312" y="368" font-size="14" fill="#059669" text-anchor="start">O  (object)</text>
<line x1="300" y1="350" x2="321.0" y2="150" stroke="#2563eb" stroke-width="1.8"/><polygon points="310.5,250.0 303.9,261.4 314.6,262.5" fill="#2563eb"/>
<line x1="321.0" y1="150" x2="335.1" y2="50" stroke="#2563eb" stroke-width="1.8"/><polygon points="328.1,100.0 321.0,111.1 331.7,112.6" fill="#2563eb"/>
<line x1="300" y1="350" x2="342.5" y2="150" stroke="#2563eb" stroke-width="1.8"/><polygon points="321.3,250.0 313.5,260.6 324.0,262.9" fill="#2563eb"/>
<line x1="342.5" y1="150" x2="371.4" y2="50" stroke="#2563eb" stroke-width="1.8"/><polygon points="356.9,100.0 348.4,110.0 358.8,113.0" fill="#2563eb"/>
<line x1="321.0" y1="150" x2="300.6" y2="295.4" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="342.5" y1="150" x2="300.6" y2="295.4" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="300.6" cy="295.4" r="5" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<text x="288.55323493940557" y="300.42344441810224" font-size="14" fill="#dc2626" text-anchor="end">I  (apparent position)</text>
<ellipse cx="353.2" cy="36" rx="24" ry="12" fill="none" stroke="#1f2937" stroke-width="2"/>
<circle cx="353.2" cy="36" r="4" fill="#1f2937" stroke="#1f2937" stroke-width="1"/>
<text x="387.2294997624999" y="40" font-size="14" fill="#1f2937" text-anchor="start">Eye</text>
<line x1="150" y1="150" x2="150.0" y2="343.6" stroke="#1f2937" stroke-width="1.5"/><polygon points="150.0,350.0 153.6,342.0 146.4,342.0" fill="#1f2937"/>
<line x1="150" y1="350" x2="150.0" y2="156.4" stroke="#1f2937" stroke-width="1.5"/><polygon points="150.0,150.0 146.4,158.0 153.6,158.0" fill="#1f2937"/>
<text x="142" y="255.0" font-size="16" fill="#1f2937" text-anchor="end" font-weight="bold">h</text>
<line x1="200" y1="150" x2="200.0" y2="289.0" stroke="#1f2937" stroke-width="1.5"/><polygon points="200.0,295.4 203.6,287.4 196.4,287.4" fill="#1f2937"/>
<line x1="200" y1="295.42344441810224" x2="200.0" y2="156.4" stroke="#1f2937" stroke-width="1.5"/><polygon points="200.0,150.0 196.4,158.0 203.6,158.0" fill="#1f2937"/>
<text x="192" y="227.71172220905112" font-size="16" fill="#1f2937" text-anchor="end" font-weight="bold">h'</text>
<text x="470" y="70" font-size="14" fill="#1f2937" text-anchor="start">h = real depth</text>
<text x="470" y="92" font-size="14" fill="#1f2937" text-anchor="start">h' = apparent depth = h/n</text>
<text x="470" y="114" font-size="13" fill="#6b7280" text-anchor="start">(for rays close to the normal)</text>
<text x="20" y="28" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">Real and apparent depth</text>
<text x="30" y="424" font-size="13" fill="#6b7280" text-anchor="start">Emerging rays bend away from the normal, so the object seems nearer the surface: h' &lt; h.</text>
<text x="30" y="442" font-size="13" fill="#6b7280" text-anchor="start">Ray angles are exaggerated; apparent depth h/n holds for nearly vertical viewing.</text>
</svg>
