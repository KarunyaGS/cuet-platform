<line x1="600" y1="265" x2="389.6" y2="265.0" stroke="#dc2626" stroke-width="2.5"/><polygon points="380.0,265.0 392.0,270.4 392.0,259.6" fill="#dc2626"/>
<text x="490" y="254" font-size="14" fill="#dc2626" text-anchor="middle">net drift, opposite to E</text>
<text x="20" y="330" font-size="13" fill="#6b7280" text-anchor="start">Dots mark collisions with the lattice ions (green = start, red = end of the path). Path shapes are schematic;</text>
<text x="20" y="348" font-size="13" fill="#6b7280" text-anchor="start">the drift in (b) is exaggerated, since real drift speeds are tiny compared with the random thermal speeds.</text>
