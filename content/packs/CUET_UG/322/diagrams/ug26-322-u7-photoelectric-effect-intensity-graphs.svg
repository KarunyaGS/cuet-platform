<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Arial, Helvetica, sans-serif">
  <!-- panel (a) -->
  <line x1="80" y1="290" x2="342" y2="290" stroke="#1f2937" stroke-width="2"/>
  <polygon points="352,290 340,284 340,296" fill="#1f2937"/>
  <line x1="80" y1="290" x2="80" y2="62" stroke="#1f2937" stroke-width="2"/>
  <polygon points="80,52 74,64 86,64" fill="#1f2937"/>
  <text x="88" y="56" font-size="15" fill="#1f2937">Photocurrent i (μA)</text>
  <text x="352" y="314" font-size="14" fill="#1f2937" text-anchor="end">Intensity I (W m⁻²)</text>
  <text x="72" y="306" font-size="14" fill="#1f2937" text-anchor="end">O</text>
  <line x1="80" y1="290" x2="320" y2="96" stroke="#2563eb" stroke-width="2.5"/>
  <text x="196" y="232" font-size="14" fill="#2563eb">straight line through O:</text>
  <text x="196" y="250" font-size="14" fill="#2563eb">i ∝ I</text>
  <text x="96" y="100" font-size="13" fill="#1f2937">ν fixed (ν &gt; ν₀),</text>
  <text x="96" y="117" font-size="13" fill="#1f2937">A at a large positive</text>
  <text x="96" y="134" font-size="13" fill="#1f2937">potential (saturation)</text>
  <text x="215" y="350" font-size="15" fill="#1f2937" text-anchor="middle">(a) Photocurrent versus intensity</text>

  <!-- panel (b) -->
  <line x1="470" y1="290" x2="732" y2="290" stroke="#1f2937" stroke-width="2"/>
  <polygon points="742,290 730,284 730,296" fill="#1f2937"/>
  <line x1="470" y1="290" x2="470" y2="62" stroke="#1f2937" stroke-width="2"/>
  <polygon points="470,52 464,64 476,64" fill="#1f2937"/>
  <text x="478" y="56" font-size="15" fill="#1f2937">Stopping potential V₀ (volt)</text>
  <text x="742" y="314" font-size="14" fill="#1f2937" text-anchor="end">Intensity I (W m⁻²)</text>
  <text x="462" y="306" font-size="14" fill="#1f2937" text-anchor="end">O</text>
  <line x1="470" y1="140" x2="710" y2="140" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="470" y1="210" x2="710" y2="210" stroke="#059669" stroke-width="2.5"/>
  <text x="710" y="130" font-size="14" fill="#dc2626" text-anchor="end">frequency ν₂</text>
  <text x="710" y="200" font-size="14" fill="#059669" text-anchor="end">frequency ν₁</text>
  <text x="490" y="244" font-size="13" fill="#1f2937">ν₂ &gt; ν₁ : V₀ depends on ν,</text>
  <text x="490" y="261" font-size="13" fill="#1f2937">not on intensity</text>
  <text x="605" y="350" font-size="15" fill="#1f2937" text-anchor="middle">(b) Stopping potential versus intensity</text>
</svg>
