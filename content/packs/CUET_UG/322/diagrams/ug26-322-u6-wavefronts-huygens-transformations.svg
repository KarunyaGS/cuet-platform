<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Arial, Helvetica, sans-serif">
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1f2937">What a prism, a convex lens and a concave mirror do to a plane wavefront</text>
  <line x1="245" y1="60" x2="245" y2="330" stroke="#1f2937" stroke-width="0.8" stroke-dasharray="3 4"/>
  <line x1="485" y1="60" x2="485" y2="330" stroke="#1f2937" stroke-width="0.8" stroke-dasharray="3 4"/>
  <!-- (a) thin prism -->
  <polygon points="125,105 100,295 150,295" fill="#2563eb" fill-opacity="0.10" stroke="#1f2937" stroke-width="2"/>
  <line x1="40" y1="120" x2="40" y2="280" stroke="#2563eb" stroke-width="2"/>
  <line x1="65" y1="120" x2="65" y2="280" stroke="#2563eb" stroke-width="2"/>
  <line x1="206.9" y1="115" x2="183.1" y2="295" stroke="#2563eb" stroke-width="2"/>
  <line x1="231.9" y1="115" x2="208.1" y2="295" stroke="#2563eb" stroke-width="2"/>
  <line x1="25" y1="150" x2="119.1" y2="150" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="119.1" y1="150" x2="131" y2="150" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="131" y1="150" x2="228" y2="162.8" stroke="#dc2626" stroke-width="1.6"/>
  <polygon points="81.5,150 70.5,154.5 70.5,145.5" fill="#dc2626"/>
  <polygon points="203.8,159.6 192.3,162.6 193.4,153.7" fill="#dc2626"/>
  <line x1="25" y1="250" x2="105.9" y2="250" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="105.9" y1="250" x2="144.1" y2="250" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="144.1" y1="250" x2="228" y2="261" stroke="#dc2626" stroke-width="1.6"/>
  <polygon points="73.5,250 62.5,254.5 62.5,245.5" fill="#dc2626"/>
  <polygon points="202.8,257.7 191.3,260.7 192.5,251.8" fill="#dc2626"/>
  <text x="20" y="350" font-size="14" fill="#1f2937">(a) thin prism: the base side is</text>
  <text x="20" y="368" font-size="14" fill="#1f2937">delayed, so the wavefront tilts</text>
  <text x="20" y="386" font-size="14" fill="#1f2937">and the rays bend towards the base</text>
  <!-- (b) convex lens -->
  <path d="M340 110 Q360 200 340 290 Q320 200 340 110 Z" fill="#2563eb" fill-opacity="0.10" stroke="#1f2937" stroke-width="2"/>
  <line x1="275" y1="120" x2="275" y2="280" stroke="#2563eb" stroke-width="2"/>
  <line x1="300" y1="120" x2="300" y2="280" stroke="#2563eb" stroke-width="2"/>
  <path d="M392.5 151.8 A75 75 0 0 0 392.5 248.2" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M415.5 171.1 A45 45 0 0 0 415.5 228.9" fill="none" stroke="#2563eb" stroke-width="2"/>
  <line x1="262" y1="140" x2="340" y2="140" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="262" y1="200" x2="450" y2="200" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="262" y1="260" x2="340" y2="260" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="340" y1="140" x2="450" y2="200" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="340" y1="260" x2="450" y2="200" stroke="#dc2626" stroke-width="1.6"/>
  <polygon points="312,140 301,144.5 301,135.5" fill="#dc2626"/>
  <polygon points="312,200 301,204.5 301,195.5" fill="#dc2626"/>
  <polygon points="312,260 301,264.5 301,255.5" fill="#dc2626"/>
  <polygon points="395,170 383.2,168.7 387.5,160.8" fill="#dc2626"/>
  <polygon points="395,230 387.5,239.2 383.2,231.3" fill="#dc2626"/>
  <circle cx="450" cy="200" r="4" fill="#1f2937"/>
  <text x="446" y="226" font-size="14" fill="#1f2937">F</text>
  <text x="260" y="350" font-size="14" fill="#1f2937">(b) convex lens: the centre is</text>
  <text x="260" y="368" font-size="14" fill="#1f2937">delayed most, giving a converging</text>
  <text x="260" y="386" font-size="14" fill="#1f2937">spherical wavefront</text>
  <!-- (c) concave mirror -->
  <path d="M678.4 105 A220 220 0 0 1 678.4 295" fill="none" stroke="#1f2937" stroke-width="2.5"/>
  <path d="M681 110.5 l9 -6 M691.5 139.4 l9 -6 M697.9 169.4 l9 -6 M700 200 l9 -6 M697.9 230.6 l9 -6 M691.5 260.6 l9 -6 M681 289.5 l9 -6" stroke="#1f2937" stroke-width="1.3"/>
  <line x1="515" y1="110" x2="515" y2="290" stroke="#2563eb" stroke-width="2"/>
  <line x1="540" y1="110" x2="540" y2="290" stroke="#2563eb" stroke-width="2"/>
  <path d="M643.6 155 A70 70 0 0 1 643.6 245" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 3"/>
  <path d="M620.6 174.3 A40 40 0 0 1 620.6 225.7" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 3"/>
  <line x1="505" y1="130" x2="688.6" y2="130" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="505" y1="270" x2="688.6" y2="270" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="688.6" y1="130" x2="590" y2="200" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="688.6" y1="270" x2="590" y2="200" stroke="#dc2626" stroke-width="1.6"/>
  <polygon points="596.8,130 585.8,134.5 585.8,125.5" fill="#dc2626"/>
  <polygon points="596.8,270 585.8,274.5 585.8,265.5" fill="#dc2626"/>
  <polygon points="639.3,165 645.6,155 650.9,162.3" fill="#dc2626"/>
  <polygon points="639.3,235 650.9,237.7 645.6,245" fill="#dc2626"/>
  <circle cx="590" cy="200" r="4" fill="#1f2937"/>
  <text x="572" y="196" font-size="14" fill="#1f2937">F</text>
  <text x="500" y="350" font-size="14" fill="#1f2937">(c) concave mirror: the edges</text>
  <text x="500" y="368" font-size="14" fill="#1f2937">reflect first; the reflected (dashed)</text>
  <text x="500" y="386" font-size="14" fill="#1f2937">wavefront converges to F</text>
</svg>
