<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, Helvetica, sans-serif">
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1f2937">Proof of the law of reflection (Huygens' construction)</text>
  <!-- reflecting surface -->
  <line x1="40" y1="300" x2="600" y2="300" stroke="#1f2937" stroke-width="2.5"/>
  <path d="M60 300 l-10 12 M90 300 l-10 12 M120 300 l-10 12 M180 300 l-10 12 M210 300 l-10 12 M240 300 l-10 12 M270 300 l-10 12 M300 300 l-10 12 M330 300 l-10 12 M360 300 l-10 12 M390 300 l-10 12 M420 300 l-10 12 M480 300 l-10 12 M510 300 l-10 12 M540 300 l-10 12 M570 300 l-10 12 M600 300 l-10 12" stroke="#1f2937" stroke-width="1.3"/>
  <text x="44" y="292" font-size="14" fill="#1f2937">M</text>
  <text x="586" y="292" font-size="14" fill="#1f2937">N</text>
  <!-- normals -->
  <line x1="150" y1="110" x2="150" y2="300" stroke="#1f2937" stroke-width="1.1" stroke-dasharray="5 4"/>
  <line x1="450" y1="150" x2="450" y2="300" stroke="#1f2937" stroke-width="1.1" stroke-dasharray="5 4"/>
  <!-- wavelet from A -->
  <path d="M166.8 107.9 A192.8 192.8 0 0 1 336.3 250.1" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- incident rays -->
  <line x1="66.4" y1="200.4" x2="150" y2="300" stroke="#2563eb" stroke-width="1.6"/>
  <polygon points="112.4,255.2 101.9,249.7 108.8,243.9" fill="#2563eb"/>
  <line x1="287.5" y1="106.3" x2="450" y2="300" stroke="#2563eb" stroke-width="1.6"/>
  <polygon points="393.1,232.2 382.6,226.7 389.5,220.9" fill="#2563eb"/>
  <!-- incident wavefront AB -->
  <line x1="150" y1="300" x2="326" y2="152.3" stroke="#2563eb" stroke-width="3"/>
  <!-- reflected rays -->
  <line x1="150" y1="300" x2="318.9" y2="98.7" stroke="#dc2626" stroke-width="1.6"/>
  <polygon points="300.9,120.1 297.3,131.4 290.4,125.6" fill="#dc2626"/>
  <line x1="450" y1="300" x2="520.7" y2="215.7" stroke="#dc2626" stroke-width="1.6"/>
  <polygon points="499.5,241 495.9,252.3 489,246.5" fill="#dc2626"/>
  <!-- reflected wavefront CE -->
  <line x1="450" y1="300" x2="274" y2="152.3" stroke="#dc2626" stroke-width="3"/>
  <!-- right angles at B and E -->
  <path d="M318.4 158.7 L324.8 166.4 L332.5 159.9" fill="none" stroke="#1f2937" stroke-width="1.2"/>
  <path d="M267.5 159.9 L275.2 166.4 L281.6 158.7" fill="none" stroke="#1f2937" stroke-width="1.2"/>
  <!-- angle arcs -->
  <path d="M180.6 274.3 A40 40 0 0 1 190 300" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <text x="196" y="290" font-size="15" fill="#2563eb">i</text>
  <path d="M410 300 A40 40 0 0 1 419.4 274.3" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="396" y="290" font-size="15" fill="#dc2626">r</text>
  <!-- points -->
  <circle cx="150" cy="300" r="3.5" fill="#1f2937"/>
  <circle cx="450" cy="300" r="3.5" fill="#1f2937"/>
  <circle cx="326" cy="152.3" r="3.5" fill="#1f2937"/>
  <circle cx="274" cy="152.3" r="3.5" fill="#1f2937"/>
  <text x="142" y="324" font-size="15" fill="#1f2937">A</text>
  <text x="444" y="324" font-size="15" fill="#1f2937">C</text>
  <text x="332" y="146" font-size="15" fill="#1f2937">B</text>
  <text x="254" y="134" font-size="15" fill="#1f2937">E</text>
  <text x="366" y="190" font-size="13" fill="#2563eb">BC = vτ</text>
  <text x="160" y="222" font-size="13" fill="#dc2626">AE = vτ</text>
  <!-- legend -->
  <line x1="20" y1="350" x2="44" y2="350" stroke="#2563eb" stroke-width="3"/>
  <text x="50" y="355" font-size="13" fill="#1f2937">incident wavefront AB (B still has distance BC to travel)</text>
  <line x1="20" y1="372" x2="44" y2="372" stroke="#dc2626" stroke-width="3"/>
  <text x="50" y="377" font-size="13" fill="#1f2937">reflected wavefront CE, tangent from C to the wavelet from A</text>
  <line x1="20" y1="394" x2="44" y2="394" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="50" y="399" font-size="13" fill="#1f2937">secondary wavelet from A after time τ (radius vτ)</text>
  <text x="20" y="416" font-size="12" fill="#1f2937">Drawn to scale for i = 40°: right-angled triangles ABC and AEC share AC and have AE = BC, so i = r.</text>
</svg>
