  <text x="528" y="237" font-size="14" fill="#1f2937">bond broken by</text>
  <text x="528" y="254" font-size="14" fill="#1f2937">thermal energy</text>
  <text x="500" y="300" font-size="14" fill="#1f2937">Each Si atom shares its</text>
  <text x="500" y="318" font-size="14" fill="#1f2937">4 valence electrons with</text>
  <text x="500" y="336" font-size="14" fill="#1f2937">4 neighbours.</text>
  <text x="500" y="364" font-size="14" fill="#1f2937">Pure crystal: every broken</text>
  <text x="500" y="382" font-size="14" fill="#1f2937">bond gives one electron and</text>
  <text x="500" y="400" font-size="14" fill="#1f2937">one hole, so n<tspan dy="4" font-size="11">e</tspan><tspan dy="-4"> = n</tspan><tspan dy="4" font-size="11">h</tspan><tspan dy="-4"> = n</tspan><tspan dy="4" font-size="11">i</tspan></text>
