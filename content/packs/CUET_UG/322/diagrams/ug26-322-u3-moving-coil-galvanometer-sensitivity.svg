<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" font-family="Arial, Helvetica, sans-serif">
  <text x="320" y="24" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Deflection against current: a straight line through the origin</text>
  <!-- axes -->
  <line x1="80" y1="320" x2="590" y2="320" stroke="#1f2937" stroke-width="2"/>
  <polygon points="602,320 588,313 588,327" fill="#1f2937"/>
  <line x1="80" y1="320" x2="80" y2="60" stroke="#1f2937" stroke-width="2"/>
  <polygon points="80,48 73,62 87,62" fill="#1f2937"/>
  <text x="540" y="350" font-size="14" fill="#1f2937">I (mA)</text>
  <text x="92" y="56" font-size="14" fill="#1f2937">φ (rad)</text>
  <!-- ticks -->
  <g stroke="#1f2937" stroke-width="1.5">
    <line x1="280" y1="320" x2="280" y2="327"/>
    <line x1="480" y1="320" x2="480" y2="327"/>
    <line x1="73" y1="260" x2="80" y2="260"/>
    <line x1="73" y1="200" x2="80" y2="200"/>
    <line x1="73" y1="140" x2="80" y2="140"/>
    <line x1="73" y1="80" x2="80" y2="80"/>
  </g>
  <text x="80" y="342" font-size="13" fill="#1f2937" text-anchor="middle">0</text>
  <text x="280" y="342" font-size="13" fill="#1f2937" text-anchor="middle">0.5</text>
  <text x="480" y="342" font-size="13" fill="#1f2937" text-anchor="middle">1.0</text>
  <text x="66" y="265" font-size="13" fill="#1f2937" text-anchor="end">0.5</text>
  <text x="66" y="205" font-size="13" fill="#1f2937" text-anchor="end">1.0</text>
  <text x="66" y="145" font-size="13" fill="#1f2937" text-anchor="end">1.5</text>
  <text x="66" y="85" font-size="13" fill="#1f2937" text-anchor="end">2.0</text>
  <!-- grid guides -->
  <line x1="80" y1="200" x2="480" y2="200" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="480" y1="200" x2="480" y2="320" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="80" y1="80" x2="480" y2="80" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- lines -->
  <line x1="80" y1="320" x2="560" y2="176" stroke="#2563eb" stroke-width="3"/>
  <line x1="80" y1="320" x2="500" y2="68" stroke="#dc2626" stroke-width="3"/>
  <text x="500" y="250" font-size="13" font-weight="bold" fill="#2563eb">N turns:</text>
  <text x="500" y="266" font-size="13" fill="#2563eb">slope 1 rad per mA</text>
  <text x="104" y="114" font-size="13" font-weight="bold" fill="#dc2626">2N turns (same k, A, B):</text>
  <text x="104" y="130" font-size="13" fill="#dc2626">slope 2 rad per mA</text>
  <text x="320" y="375" font-size="13" fill="#1f2937" text-anchor="middle">Slope of the line = current sensitivity φ/I = NAB/k</text>
</svg>
