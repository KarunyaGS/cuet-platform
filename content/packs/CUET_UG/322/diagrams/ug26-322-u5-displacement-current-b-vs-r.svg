<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 400" width="690" height="400" font-family="Arial, Helvetica, sans-serif">
  <text x="22" y="190" font-size="14" fill="#1f2937" text-anchor="middle" transform="rotate(-90 22 190)">magnetic field, B (T)</text>
  <g transform="translate(30,0)">
  <!-- axes -->
  <line x1="80" y1="310" x2="610" y2="310" stroke="#1f2937" stroke-width="2"/>
  <polygon points="622,310 608,304 608,316" fill="#1f2937"/>
  <line x1="80" y1="310" x2="80" y2="50" stroke="#1f2937" stroke-width="2"/>
  <polygon points="80,38 74,52 86,52" fill="#1f2937"/>
  <text x="600" y="346" font-size="14" fill="#1f2937" text-anchor="end">distance from the axis of the plates, r (m)</text>
  <text x="72" y="328" font-size="14" fill="#1f2937" text-anchor="end">0</text>

  <!-- guide lines -->
  <line x1="220" y1="110" x2="220" y2="310" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="80" y1="110" x2="220" y2="110" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="80" y1="210" x2="360" y2="210" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="150" y1="210" x2="150" y2="310" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="360" y1="210" x2="360" y2="310" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- ticks and tick labels -->
  <g stroke="#1f2937" stroke-width="1.5">
    <line x1="150" y1="310" x2="150" y2="316"/>
    <line x1="220" y1="310" x2="220" y2="316"/>
    <line x1="360" y1="310" x2="360" y2="316"/>
    <line x1="500" y1="310" x2="500" y2="316"/>
  </g>
  <g font-size="14" fill="#1f2937" text-anchor="middle">
    <text x="150" y="332">R/2</text>
    <text x="220" y="332">R</text>
    <text x="360" y="332">2R</text>
    <text x="500" y="332">3R</text>
  </g>
  <text x="74" y="115" font-size="14" fill="#1f2937" text-anchor="end">B<tspan font-size="11" dy="3">max</tspan></text>
  <text x="74" y="215" font-size="14" fill="#1f2937" text-anchor="end">B<tspan font-size="11" dy="3">max</tspan><tspan dy="-3">/2</tspan></text>

  <!-- the curve: linear inside, 1/r outside -->
  <line x1="80" y1="310" x2="220" y2="110" stroke="#2563eb" stroke-width="2.5"/>
  <polyline fill="none" stroke="#2563eb" stroke-width="2.5" points="220.0,110.0 234.0,128.2 248.0,143.3 262.0,156.2 276.0,167.1 290.0,176.7 304.0,185.0 318.0,192.4 332.0,198.9 346.0,204.7 360.0,210.0 374.0,214.8 388.0,219.1 402.0,223.0 416.0,226.7 430.0,230.0 444.0,233.1 458.0,235.9 472.0,238.6 486.0,241.0 500.0,243.3 514.0,245.5 528.0,247.5 542.0,249.4 556.0,251.2 570.0,252.9 584.0,254.4"/>
  <circle cx="220" cy="110" r="4" fill="#dc2626"/>

  <!-- annotations -->
  <text x="228" y="98" font-size="14" fill="#dc2626">peak at the plate edge: B<tspan font-size="11" dy="3">max</tspan><tspan dy="-3"> = μ</tspan><tspan font-size="11" dy="3">0</tspan><tspan dy="-3">i</tspan><tspan font-size="11" dy="3">d</tspan><tspan dy="-3"> / (2πR)</tspan></text>
  <text x="158" y="262" font-size="14" fill="#1f2937">inside</text>
  <text x="158" y="280" font-size="14" fill="#1f2937">B ∝ r</text>
  <text x="430" y="200" font-size="14" fill="#1f2937">outside: B ∝ 1/r</text>
  <text x="80" y="378" font-size="13" fill="#4b5563">Circular plates of radius R, uniform E between them; B is drawn for points in the gap.</text>
  </g>
</svg>
