<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Arial, Helvetica, sans-serif">
  <!-- Row 1: like charges repel -->
  <text x="20" y="34" font-size="15" font-weight="bold" fill="#1f2937">(a) Like charges repel</text>
  <line x1="178" y1="90" x2="104" y2="90" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="92,90 106,83 106,97" fill="#dc2626"/>
  <line x1="462" y1="90" x2="536" y2="90" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="548,90 534,83 534,97" fill="#dc2626"/>
  <circle cx="200" cy="90" r="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="96" font-size="18" font-weight="bold" fill="#dc2626" text-anchor="middle">+</text>
  <circle cx="440" cy="90" r="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="440" y="96" font-size="18" font-weight="bold" fill="#dc2626" text-anchor="middle">+</text>
  <text x="200" y="58" font-size="15" fill="#1f2937" text-anchor="middle">q<tspan font-size="11" dy="4">1</tspan></text>
  <text x="440" y="58" font-size="15" fill="#1f2937" text-anchor="middle">q<tspan font-size="11" dy="4">2</tspan></text>
  <text x="122" y="76" font-size="15" fill="#dc2626" text-anchor="middle">F<tspan font-size="11" dy="4">12</tspan></text>
  <text x="520" y="76" font-size="15" fill="#dc2626" text-anchor="middle">F<tspan font-size="11" dy="4">21</tspan></text>
  <line x1="200" y1="128" x2="440" y2="128" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="200" y1="120" x2="200" y2="136" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="440" y1="120" x2="440" y2="136" stroke="#1f2937" stroke-width="1.5"/>
  <text x="320" y="148" font-size="15" fill="#1f2937" text-anchor="middle" font-style="italic">r</text>

  <!-- Row 2: unlike charges attract -->
  <text x="20" y="190" font-size="15" font-weight="bold" fill="#1f2937">(b) Unlike charges attract</text>
  <line x1="222" y1="246" x2="292" y2="246" stroke="#059669" stroke-width="2.5"/>
  <polygon points="304,246 290,239 290,253" fill="#059669"/>
  <line x1="418" y1="246" x2="348" y2="246" stroke="#059669" stroke-width="2.5"/>
  <polygon points="336,246 350,239 350,253" fill="#059669"/>
  <circle cx="200" cy="246" r="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="252" font-size="18" font-weight="bold" fill="#dc2626" text-anchor="middle">+</text>
  <circle cx="440" cy="246" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="252" font-size="20" font-weight="bold" fill="#2563eb" text-anchor="middle">−</text>
  <text x="200" y="214" font-size="15" fill="#1f2937" text-anchor="middle">q<tspan font-size="11" dy="4">1</tspan></text>
  <text x="440" y="214" font-size="15" fill="#1f2937" text-anchor="middle">q<tspan font-size="11" dy="4">2</tspan></text>
  <text x="262" y="232" font-size="15" fill="#059669" text-anchor="middle">F<tspan font-size="11" dy="4">12</tspan></text>
  <text x="378" y="232" font-size="15" fill="#059669" text-anchor="middle">F<tspan font-size="11" dy="4">21</tspan></text>
  <line x1="200" y1="284" x2="440" y2="284" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="200" y1="276" x2="200" y2="292" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="440" y1="276" x2="440" y2="292" stroke="#1f2937" stroke-width="1.5"/>
  <text x="320" y="304" font-size="15" fill="#1f2937" text-anchor="middle" font-style="italic">r</text>
  <text x="320" y="324" font-size="13" fill="#1f2937" text-anchor="middle">F₁₂ = force on q₁ due to q₂;  F₂₁ = −F₁₂ (equal and opposite)</text>
</svg>
