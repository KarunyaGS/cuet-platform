<text x="490" y="104" font-size="13" fill="#2563eb" text-anchor="end">rises in proportion to ν</text>
<text x="220" y="48" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold">X_C = 1/(2πνC)</text>
