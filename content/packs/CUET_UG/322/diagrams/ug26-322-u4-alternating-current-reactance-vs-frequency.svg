<text x="210" y="260" font-size="14" fill="#1f2937" text-anchor="middle">Below ν₀:</text>
<text x="210" y="278" font-size="14" fill="#1f2937" text-anchor="middle">X_C &gt; X_L</text>
<text x="490" y="260" font-size="14" fill="#1f2937" text-anchor="middle">Above ν₀:</text>
<text x="490" y="278" font-size="14" fill="#1f2937" text-anchor="middle">X_L &gt; X_C</text>
<text x="340" y="370" font-size="13" fill="#6b7280" text-anchor="middle">Illustrative curves; ν₀ = 1/(2π√(LC)) is the resonant frequency</text>
