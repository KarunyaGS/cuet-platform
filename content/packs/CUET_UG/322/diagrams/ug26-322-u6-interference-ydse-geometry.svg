<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial, Helvetica, sans-serif">
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1f2937">Young's double-slit experiment: geometry (not to scale)</text>
  <!-- source -->
  <circle cx="60" cy="200" r="5" fill="#d97706"/>
  <text x="40" y="226" font-size="15" fill="#d97706">S</text>
  <line x1="60" y1="200" x2="200" y2="160" stroke="#d97706" stroke-width="1.3"/>
  <line x1="60" y1="200" x2="200" y2="240" stroke="#d97706" stroke-width="1.3"/>
  <polygon points="144,176 134.7,183.3 132.2,174.7" fill="#d97706"/>
  <polygon points="144,224 132.2,225.3 134.7,216.7" fill="#d97706"/>
  <!-- slit screen -->
  <line x1="200" y1="50" x2="200" y2="154" stroke="#1f2937" stroke-width="4"/>
  <line x1="200" y1="166" x2="200" y2="234" stroke="#1f2937" stroke-width="4"/>
  <line x1="200" y1="246" x2="200" y2="350" stroke="#1f2937" stroke-width="4"/>
  <text x="176" y="156" font-size="14" fill="#1f2937">S1</text>
  <text x="176" y="252" font-size="14" fill="#1f2937">S2</text>
  <!-- d marker -->
  <line x1="164" y1="160" x2="164" y2="240" stroke="#1f2937" stroke-width="1.2"/>
  <polygon points="164,160 160,169 168,169" fill="#1f2937"/>
  <polygon points="164,240 160,231 168,231" fill="#1f2937"/>
  <text x="146" y="205" font-size="15" fill="#1f2937">d</text>
  <!-- viewing screen -->
  <line x1="640" y1="50" x2="640" y2="350" stroke="#1f2937" stroke-width="4"/>
  <text x="652" y="70" font-size="14" fill="#1f2937">screen</text>
  <!-- central line and line to P -->
  <line x1="200" y1="200" x2="640" y2="200" stroke="#1f2937" stroke-width="1.1" stroke-dasharray="5 4"/>
  <line x1="200" y1="200" x2="640" y2="90" stroke="#1f2937" stroke-width="1.1" stroke-dasharray="5 4"/>
  <path d="M270 200 A70 70 0 0 0 267.9 183" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="276" y="196" font-size="15" fill="#dc2626">θ</text>
  <!-- paths from slits to P -->
  <line x1="200" y1="160" x2="640" y2="90" stroke="#2563eb" stroke-width="2"/>
  <polygon points="420,125 409.8,131.2 408.4,122.3" fill="#2563eb"/>
  <line x1="200" y1="240" x2="640" y2="90" stroke="#2563eb" stroke-width="2"/>
  <polygon points="420,165 411,172.8 408.1,164.3" fill="#2563eb"/>
  <!-- arc from S1 centred at P marking path difference S2N -->
  <path d="M200 160 A445.5 445.5 0 0 0 218.3 233.8" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="200" y1="240" x2="218.3" y2="233.8" stroke="#059669" stroke-width="4"/>
  <text x="226" y="262" font-size="14" fill="#059669">N</text>
  <!-- points on screen -->
  <circle cx="640" cy="200" r="4" fill="#1f2937"/>
  <circle cx="640" cy="90" r="4" fill="#dc2626"/>
  <text x="650" y="206" font-size="15" fill="#1f2937">O</text>
  <text x="650" y="96" font-size="15" fill="#dc2626">P</text>
  <!-- y marker -->
  <line x1="672" y1="90" x2="672" y2="200" stroke="#1f2937" stroke-width="1.2"/>
  <polygon points="672,90 668,99 676,99" fill="#1f2937"/>
  <polygon points="672,200 668,191 676,191" fill="#1f2937"/>
  <text x="680" y="150" font-size="15" fill="#1f2937">y</text>
  <!-- D marker -->
  <line x1="200" y1="372" x2="640" y2="372" stroke="#1f2937" stroke-width="1.2"/>
  <polygon points="200,372 210,368 210,376" fill="#1f2937"/>
  <polygon points="640,372 630,368 630,376" fill="#1f2937"/>
  <text x="410" y="366" font-size="15" fill="#1f2937">D</text>
  <!-- notes -->
  <text x="250" y="300" font-size="13" fill="#059669">S2N = S2P − S1P (PN = PS1)</text>
  <text x="20" y="398" font-size="13" fill="#1f2937">For D ≫ d and small θ: path difference S2P − S1P ≈ d sin θ ≈ d tan θ = y d / D.</text>
  <text x="20" y="416" font-size="13" fill="#1f2937">Bright fringe when y d / D = nλ; dark fringe when y d / D = (n + ½)λ.</text>
</svg>
