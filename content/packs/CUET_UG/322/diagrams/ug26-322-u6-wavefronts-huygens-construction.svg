<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial, Helvetica, sans-serif">
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1f2937">Huygens' construction: new wavefront = forward envelope of secondary wavelets</text>
  <line x1="330" y1="50" x2="330" y2="350" stroke="#1f2937" stroke-width="0.8" stroke-dasharray="3 4"/>
  <!-- left: spherical wavefront -->
  <circle cx="60" cy="210" r="5" fill="#d97706"/>
  <text x="40" y="236" font-size="14" fill="#d97706">S</text>
  <path d="M117.9 141.1 A90 90 0 0 1 117.9 278.9" fill="none" stroke="#2563eb" stroke-width="2.2"/>
  <path d="M79.5 108.9 A50 50 0 0 1 156.2 173.2" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M120.4 126.6 A50 50 0 0 1 162.7 217.3" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M150 160 A50 50 0 0 1 150 260" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M162.7 202.7 A50 50 0 0 1 120.4 293.4" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M156.2 246.8 A50 50 0 0 1 79.5 311.1" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="117.9" cy="141.1" r="3" fill="#1f2937"/>
  <circle cx="141.6" cy="172" r="3" fill="#1f2937"/>
  <circle cx="150" cy="210" r="3" fill="#1f2937"/>
  <circle cx="141.6" cy="248" r="3" fill="#1f2937"/>
  <circle cx="117.9" cy="278.9" r="3" fill="#1f2937"/>
  <path d="M150 102.8 A140 140 0 0 1 150 317.2" fill="none" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="200" y1="210" x2="250" y2="210" stroke="#dc2626" stroke-width="1.6"/>
  <polygon points="250,210 239,214.5 239,205.5" fill="#dc2626"/>
  <line x1="167.2" y1="120" x2="201.7" y2="91.1" stroke="#dc2626" stroke-width="1.6"/>
  <polygon points="201.7,91.1 196.2,101.6 190.4,94.7" fill="#dc2626"/>
  <line x1="167.2" y1="300" x2="201.7" y2="328.9" stroke="#dc2626" stroke-width="1.6"/>
  <polygon points="201.7,328.9 190.4,325.3 196.2,318.4" fill="#dc2626"/>
  <text x="20" y="372" font-size="14" fill="#1f2937">(a) spherical wavefront from a point source</text>
  <!-- right: plane wavefront -->
  <line x1="430" y1="80" x2="430" y2="340" stroke="#2563eb" stroke-width="2.2"/>
  <path d="M430 50 A60 60 0 0 1 430 170" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M430 90 A60 60 0 0 1 430 210" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M430 130 A60 60 0 0 1 430 250" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M430 170 A60 60 0 0 1 430 290" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M430 210 A60 60 0 0 1 430 330" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="430" cy="110" r="3" fill="#1f2937"/>
  <circle cx="430" cy="150" r="3" fill="#1f2937"/>
  <circle cx="430" cy="190" r="3" fill="#1f2937"/>
  <circle cx="430" cy="230" r="3" fill="#1f2937"/>
  <circle cx="430" cy="270" r="3" fill="#1f2937"/>
  <line x1="490" y1="80" x2="490" y2="340" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="500" y1="130" x2="560" y2="130" stroke="#dc2626" stroke-width="1.6"/>
  <polygon points="560,130 549,134.5 549,125.5" fill="#dc2626"/>
  <line x1="500" y1="210" x2="560" y2="210" stroke="#dc2626" stroke-width="1.6"/>
  <polygon points="560,210 549,214.5 549,205.5" fill="#dc2626"/>
  <line x1="500" y1="290" x2="560" y2="290" stroke="#dc2626" stroke-width="1.6"/>
  <polygon points="560,290 549,294.5 549,285.5" fill="#dc2626"/>
  <line x1="430" y1="352" x2="490" y2="352" stroke="#1f2937" stroke-width="1.2"/>
  <polygon points="430,352 438,348.5 438,355.5" fill="#1f2937"/>
  <polygon points="490,352 482,348.5 482,355.5" fill="#1f2937"/>
  <text x="446" y="346" font-size="14" fill="#1f2937">vτ</text>
  <text x="400" y="74" font-size="14" fill="#2563eb">AB</text>
  <text x="484" y="74" font-size="14" fill="#dc2626">A'B'</text>
  <text x="350" y="372" font-size="14" fill="#1f2937">(b) plane wavefront</text>
  <!-- legend -->
  <line x1="20" y1="394" x2="44" y2="394" stroke="#2563eb" stroke-width="2.2"/>
  <text x="50" y="399" font-size="13" fill="#1f2937">wavefront at time t</text>
  <line x1="190" y1="394" x2="214" y2="394" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="220" y="399" font-size="13" fill="#1f2937">secondary wavelets, radius vτ</text>
  <line x1="420" y1="394" x2="444" y2="394" stroke="#dc2626" stroke-width="2.2"/>
  <text x="450" y="399" font-size="13" fill="#1f2937">new wavefront at time t + τ (envelope)</text>
  <text x="20" y="416" font-size="12" fill="#1f2937">Only the forward half of each wavelet is used; there is no backward wave.</text>
</svg>
