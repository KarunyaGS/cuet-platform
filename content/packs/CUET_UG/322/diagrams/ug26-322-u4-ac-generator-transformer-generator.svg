<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 385" font-family="Arial, Helvetica, sans-serif" fill="none">
  <!-- field magnets -->
  <rect x="40" y="70" width="100" height="185" fill="#fee2e2" stroke="#1f2937" stroke-width="2"/>
  <rect x="500" y="70" width="100" height="185" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
  <text x="90" y="172" text-anchor="middle" font-size="30" font-weight="bold" fill="#dc2626">N</text>
  <text x="550" y="172" text-anchor="middle" font-size="30" font-weight="bold" fill="#2563eb">S</text>

  <!-- field lines N to S -->
  <g stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="145" y1="100" x2="486" y2="100"/>
    <line x1="145" y1="145" x2="486" y2="145"/>
    <line x1="145" y1="190" x2="486" y2="190"/>
    <line x1="145" y1="235" x2="486" y2="235"/>
  </g>
  <g fill="#2563eb">
    <polygon points="496,100 485,95 485,105"/><polygon points="496,145 485,140 485,150"/><polygon points="496,190 485,185 485,195"/><polygon points="496,235 485,230 485,240"/>
  </g>
  <text x="470" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">B</text>

  <!-- axle -->
  <line x1="320" y1="32" x2="320" y2="356" stroke="#6b7280" stroke-width="3"/>
  <path d="M295,45 A25,8 0 0 0 345,45" stroke="#059669" stroke-width="2"/>
  <polygon points="346,36 340,47 351,47" fill="#059669"/>
  <text x="358" y="44" font-size="16" font-style="italic" fill="#059669">ω</text>
  <text x="320" y="20" text-anchor="middle" font-size="13" fill="#1f2937">axle turned by a turbine</text>

  <!-- armature coil (parallelogram), ends leave at the bottom near the axle -->
  <polyline points="310,228 250,215 250,85 390,115 390,245 330,232" stroke="#d97706" stroke-width="4" stroke-linejoin="round"/>
  <text x="196" y="164" text-anchor="middle" font-size="14" fill="#d97706">armature</text>
  <text x="196" y="181" text-anchor="middle" font-size="14" fill="#d97706">coil</text>

  <!-- leads to slip rings -->
  <line x1="310" y1="228" x2="310" y2="292" stroke="#d97706" stroke-width="2.5"/>
  <line x1="330" y1="232" x2="330" y2="332" stroke="#d97706" stroke-width="2.5"/>

  <!-- slip rings -->
  <ellipse cx="320" cy="300" rx="30" ry="9" fill="#e5e7eb" stroke="#1f2937" stroke-width="2.5"/>
  <ellipse cx="320" cy="340" rx="30" ry="9" fill="#e5e7eb" stroke="#1f2937" stroke-width="2.5"/>
  <text x="282" y="325" text-anchor="end" font-size="14" fill="#1f2937">slip rings</text>

  <!-- brushes -->
  <rect x="352" y="294" width="26" height="12" fill="#374151" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="352" y="334" width="26" height="12" fill="#374151" stroke="#1f2937" stroke-width="1.5"/>
  <text x="365" y="372" text-anchor="middle" font-size="14" fill="#1f2937">carbon brushes</text>

  <!-- external load -->
  <polyline points="378,300 470,300 470,302 462,307 478,313 462,319 478,325 462,331 470,336 470,340 378,340" stroke="#1f2937" stroke-width="2"/>
  <text x="488" y="318" font-size="14" fill="#1f2937">external</text>
  <text x="488" y="334" font-size="14" fill="#1f2937">load R</text>
  <text x="430" y="292" text-anchor="middle" font-size="13" fill="#dc2626">AC output</text>
</svg>
