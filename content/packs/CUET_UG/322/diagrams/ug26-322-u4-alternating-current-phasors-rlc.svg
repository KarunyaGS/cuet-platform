<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="Arial, Helvetica, sans-serif" fill="none">
  <line x1="290" y1="15" x2="290" y2="320" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="590" y1="15" x2="590" y2="320" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- ===== (a) resistor ===== -->
  <text x="140" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">(a) Pure resistor</text>
  <text x="140" y="52" text-anchor="middle" font-size="14" fill="#1f2937">V and I in phase</text>
  <line x1="30" y1="200" x2="265" y2="200" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="140" y1="320" x2="140" y2="75" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="140" y1="200" x2="233.5" y2="146" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="243.9,140.0 236.5,151.2 230.5,140.8" fill="#2563eb"/>
  <line x1="140" y1="200" x2="198.9" y2="166" stroke="#dc2626" stroke-width="3.5"/>
  <polygon points="209.3,160.0 201.9,171.2 195.9,160.8" fill="#dc2626"/>
  <text x="250" y="142" font-size="15" fill="#2563eb">V<tspan font-size="11" dy="4">m</tspan></text>
  <text x="192" y="151" text-anchor="middle" font-size="15" fill="#dc2626">I<tspan font-size="11" dy="4">m</tspan></text>
  <path d="M250.3,113.8 A140,140 0 0 0 220.3,85.3" stroke="#059669" stroke-width="1.8"/>
  <polygon points="212.9,80.2 223.2,81.2 217.4,89.4" fill="#059669"/>
  <text x="246" y="84" font-size="15" font-style="italic" fill="#059669">ω</text>

  <!-- ===== (b) inductor ===== -->
  <text x="440" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">(b) Pure inductor</text>
  <text x="440" y="52" text-anchor="middle" font-size="14" fill="#1f2937">I lags V by 90° (π/2)</text>
  <line x1="330" y1="200" x2="565" y2="200" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="440" y1="320" x2="440" y2="75" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="440" y1="200" x2="533.5" y2="146" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="543.9,140.0 536.5,151.2 530.5,140.8" fill="#2563eb"/>
  <line x1="440" y1="200" x2="474" y2="258.9" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="480.0,269.3 468.8,261.9 479.2,255.9" fill="#dc2626"/>
  <text x="550" y="142" font-size="15" fill="#2563eb">V<tspan font-size="11" dy="4">m</tspan></text>
  <text x="490" y="290" font-size="15" fill="#dc2626">I<tspan font-size="11" dy="4">m</tspan></text>
  <path d="M455.0,226.0 A30,30 0 0 0 466.0,185.0" stroke="#1f2937" stroke-width="1.5"/>
  <text x="484" y="219" font-size="13" fill="#1f2937">90°</text>
  <path d="M550.3,113.8 A140,140 0 0 0 520.3,85.3" stroke="#059669" stroke-width="1.8"/>
  <polygon points="512.9,80.2 523.2,81.2 517.4,89.4" fill="#059669"/>
  <text x="546" y="84" font-size="15" font-style="italic" fill="#059669">ω</text>

  <!-- ===== (c) capacitor ===== -->
  <text x="740" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">(c) Pure capacitor</text>
  <text x="740" y="52" text-anchor="middle" font-size="14" fill="#1f2937">I leads V by 90° (π/2)</text>
  <line x1="630" y1="200" x2="865" y2="200" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="740" y1="320" x2="740" y2="75" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="740" y1="200" x2="833.5" y2="146" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="843.9,140.0 836.5,151.2 830.5,140.8" fill="#2563eb"/>
  <line x1="740" y1="200" x2="706" y2="141.1" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="700.0,130.7 711.2,138.1 700.8,144.1" fill="#dc2626"/>
  <text x="842" y="166" font-size="15" fill="#2563eb">V<tspan font-size="11" dy="4">m</tspan></text>
  <text x="692" y="124" text-anchor="end" font-size="15" fill="#dc2626">I<tspan font-size="11" dy="4">m</tspan></text>
  <path d="M766.0,185.0 A30,30 0 0 0 725.0,174.0" stroke="#1f2937" stroke-width="1.5"/>
  <text x="752" y="157" text-anchor="middle" font-size="13" fill="#1f2937">90°</text>
  <path d="M850.3,113.8 A140,140 0 0 0 820.3,85.3" stroke="#059669" stroke-width="1.8"/>
  <polygon points="812.9,80.2 823.2,81.2 817.4,89.4" fill="#059669"/>
  <text x="846" y="84" font-size="15" font-style="italic" fill="#059669">ω</text>

  <text x="440" y="345" text-anchor="middle" font-size="13" fill="#1f2937">Phasors rotate anticlockwise at angular speed ω; the projection of each phasor on the vertical axis is the instantaneous value.</text>
</svg>
