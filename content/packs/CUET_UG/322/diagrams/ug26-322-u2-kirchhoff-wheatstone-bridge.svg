<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" font-family="Arial, Helvetica, sans-serif">
  <!-- Arm P: A to B -->
  <line x1="120" y1="210" x2="195.4" y2="157.2" stroke="#1f2937" stroke-width="2"/>
  <g transform="translate(220,140) rotate(-35)"><polyline points="-30,0 -25,-9 -15,9 -5,-9 5,9 15,-9 25,9 30,0" fill="none" stroke="#1f2937" stroke-width="2"/></g>
  <line x1="244.6" y1="122.8" x2="320" y2="70" stroke="#1f2937" stroke-width="2"/>
  <text x="200" y="112" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold">P</text>
  <!-- Arm Q: B to C -->
  <line x1="320" y1="70" x2="395.4" y2="122.8" stroke="#1f2937" stroke-width="2"/>
  <g transform="translate(420,140) rotate(35)"><polyline points="-30,0 -25,-9 -15,9 -5,-9 5,9 15,-9 25,9 30,0" fill="none" stroke="#1f2937" stroke-width="2"/></g>
  <line x1="444.6" y1="157.2" x2="520" y2="210" stroke="#1f2937" stroke-width="2"/>
  <text x="440" y="112" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold">Q</text>
  <!-- Arm R: A to D -->
  <line x1="120" y1="210" x2="195.4" y2="262.8" stroke="#1f2937" stroke-width="2"/>
  <g transform="translate(220,280) rotate(35)"><polyline points="-30,0 -25,-9 -15,9 -5,-9 5,9 15,-9 25,9 30,0" fill="none" stroke="#1f2937" stroke-width="2"/></g>
  <line x1="244.6" y1="297.2" x2="320" y2="350" stroke="#1f2937" stroke-width="2"/>
  <text x="200" y="322" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold">R</text>
  <!-- Arm S: D to C -->
  <line x1="320" y1="350" x2="395.4" y2="297.2" stroke="#1f2937" stroke-width="2"/>
  <g transform="translate(420,280) rotate(-35)"><polyline points="-30,0 -25,-9 -15,9 -5,-9 5,9 15,-9 25,9 30,0" fill="none" stroke="#1f2937" stroke-width="2"/></g>
  <line x1="444.6" y1="262.8" x2="520" y2="210" stroke="#1f2937" stroke-width="2"/>
  <text x="440" y="322" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold">S</text>

  <!-- Galvanometer arm B to D -->
  <line x1="320" y1="70" x2="320" y2="190" stroke="#1f2937" stroke-width="2"/>
  <circle cx="320" cy="210" r="20" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="320" y="216" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold">G</text>
  <line x1="320" y1="230" x2="320" y2="350" stroke="#1f2937" stroke-width="2"/>
  <polygon points="320,148 314,136 326,136" fill="#dc2626"/>
  <text x="330" y="140" font-size="15" fill="#dc2626">I<tspan font-size="11" dy="4">g</tspan></text>

  <!-- Current arrows in the arms -->
  <polygon points="165.4,178.2 154.1,193.5 147.2,183.6" fill="#d97706"/>
  <text x="128" y="172" font-size="15" fill="#d97706" text-anchor="end">I<tspan font-size="11" dy="4">1</tspan></text>
  <polygon points="489.4,188.6 471.2,183.2 478.1,173.3" fill="#d97706"/>
  <text x="500" y="172" font-size="15" fill="#d97706">I<tspan font-size="11" dy="4">1</tspan><tspan dy="-4"> − I</tspan><tspan font-size="11" dy="4">g</tspan></text>
  <polygon points="165.4,241.8 147.2,236.4 154.1,226.5" fill="#2563eb"/>
  <text x="128" y="262" font-size="15" fill="#2563eb" text-anchor="end">I<tspan font-size="11" dy="4">2</tspan></text>
  <polygon points="489.4,231.4 478.1,246.7 471.2,236.8" fill="#2563eb"/>
  <text x="500" y="262" font-size="15" fill="#2563eb">I<tspan font-size="11" dy="4">2</tspan><tspan dy="-4"> + I</tspan><tspan font-size="11" dy="4">g</tspan></text>

  <!-- Junction dots and labels -->
  <circle cx="120" cy="210" r="5" fill="#1f2937"/>
  <circle cx="320" cy="70" r="5" fill="#1f2937"/>
  <circle cx="520" cy="210" r="5" fill="#1f2937"/>
  <circle cx="320" cy="350" r="5" fill="#1f2937"/>
  <text x="100" y="204" font-size="17" fill="#1f2937" text-anchor="end" font-weight="bold">A</text>
  <text x="320" y="54" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold">B</text>
  <text x="540" y="204" font-size="17" fill="#1f2937" font-weight="bold">C</text>
  <text x="335" y="372" font-size="17" fill="#1f2937" font-weight="bold">D</text>

  <!-- Battery branch from A to C -->
  <line x1="120" y1="210" x2="60" y2="210" stroke="#1f2937" stroke-width="2"/>
  <line x1="60" y1="210" x2="60" y2="420" stroke="#1f2937" stroke-width="2"/>
  <line x1="60" y1="420" x2="310" y2="420" stroke="#1f2937" stroke-width="2"/>
  <line x1="310" y1="398" x2="310" y2="442" stroke="#1f2937" stroke-width="2"/>
  <line x1="324" y1="408" x2="324" y2="432" stroke="#1f2937" stroke-width="5"/>
  <line x1="324" y1="420" x2="580" y2="420" stroke="#1f2937" stroke-width="2"/>
  <line x1="580" y1="420" x2="580" y2="210" stroke="#1f2937" stroke-width="2"/>
  <line x1="580" y1="210" x2="520" y2="210" stroke="#1f2937" stroke-width="2"/>
  <text x="302" y="394" font-size="14" fill="#1f2937" text-anchor="end">+</text>
  <text x="317" y="465" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">ε</text>
  <polygon points="60,300 54,314 66,314" fill="#059669"/>
  <text x="48" y="312" font-size="15" fill="#059669" text-anchor="end">I</text>
  <text x="160" y="445" font-size="14" fill="#1f2937" text-anchor="middle">I = I<tspan font-size="10" dy="4">1</tspan><tspan dy="-4"> + I</tspan><tspan font-size="10" dy="4">2</tspan></text>
</svg>
