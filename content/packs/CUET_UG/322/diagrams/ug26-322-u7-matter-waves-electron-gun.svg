<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Arial, Helvetica, sans-serif">
  <!-- heater filament -->
  <polyline fill="none" stroke="#d97706" stroke-width="2.5" points="88,120 98,130 88,140 98,150 88,160 98,170 88,180 98,190 88,200"/>
  <text x="60" y="96" font-size="14" fill="#1f2937">Heated filament</text>

  <!-- cathode -->
  <rect x="110" y="115" width="10" height="90" fill="#1f2937"/>
  <text x="104" y="236" font-size="14" fill="#1f2937" text-anchor="end">Cathode (−)</text>

  <!-- anode with hole -->
  <rect x="300" y="95" width="10" height="55" fill="#1f2937"/>
  <rect x="300" y="170" width="10" height="55" fill="#1f2937"/>
  <text x="305" y="84" font-size="14" fill="#1f2937" text-anchor="middle">Anode (+) with a hole</text>

  <!-- accelerating electrons -->
  <g fill="#2563eb">
    <circle cx="140" cy="160" r="5"/>
    <circle cx="190" cy="160" r="5"/>
    <circle cx="250" cy="160" r="5"/>
  </g>
  <g stroke="#2563eb" stroke-width="2">
    <line x1="146" y1="160" x2="156" y2="160"/>
    <line x1="196" y1="160" x2="214" y2="160"/>
    <line x1="256" y1="160" x2="282" y2="160"/>
  </g>
  <g fill="#2563eb">
    <polygon points="163,160 155,155 155,165"/>
    <polygon points="221,160 213,155 213,165"/>
    <polygon points="289,160 281,155 281,165"/>
  </g>
  <text x="205" y="140" font-size="13" fill="#2563eb" text-anchor="middle">electrons speed up</text>

  <!-- emerging beam and its matter wave -->
  <line x1="320" y1="160" x2="720" y2="160" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="732,160 720,154 720,166" fill="#2563eb"/>
  <path d="M 340 160 C 355 136, 370 136, 385 160 C 400 184, 415 184, 430 160 C 445 136, 460 136, 475 160 C 490 184, 505 184, 520 160 C 535 136, 550 136, 565 160 C 580 184, 595 184, 610 160 C 625 136, 640 136, 655 160 C 670 184, 685 184, 700 160" fill="none" stroke="#059669" stroke-width="2.5"/>
  <!-- wavelength marker between two crests (x = 362.5 and 452.5) -->
  <line x1="362.5" y1="118" x2="362.5" y2="138" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="452.5" y1="118" x2="452.5" y2="138" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="370" y1="124" x2="445" y2="124" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="364,124 373,120 373,128" fill="#1f2937"/>
  <polygon points="451,124 442,120 442,128" fill="#1f2937"/>
  <text x="407.5" y="112" font-size="16" fill="#1f2937" text-anchor="middle">λ</text>
  <text x="560" y="112" font-size="14" fill="#059669" text-anchor="middle">matter wave of the moving electron</text>
  <text x="600" y="208" font-size="14" fill="#2563eb" text-anchor="middle">momentum p = mv</text>

  <!-- circuit -->
  <line x1="115" y1="205" x2="115" y2="300" stroke="#1f2937" stroke-width="2"/>
  <line x1="115" y1="300" x2="190" y2="300" stroke="#1f2937" stroke-width="2"/>
  <line x1="190" y1="288" x2="190" y2="312" stroke="#1f2937" stroke-width="4"/>
  <line x1="202" y1="278" x2="202" y2="322" stroke="#1f2937" stroke-width="2"/>
  <line x1="214" y1="288" x2="214" y2="312" stroke="#1f2937" stroke-width="4"/>
  <line x1="226" y1="278" x2="226" y2="322" stroke="#1f2937" stroke-width="2"/>
  <line x1="226" y1="300" x2="305" y2="300" stroke="#1f2937" stroke-width="2"/>
  <line x1="305" y1="300" x2="305" y2="225" stroke="#1f2937" stroke-width="2"/>
  <text x="176" y="292" font-size="15" fill="#1f2937" text-anchor="middle">−</text>
  <text x="240" y="292" font-size="15" fill="#1f2937" text-anchor="middle">+</text>
  <text x="208" y="345" font-size="14" fill="#1f2937" text-anchor="middle">Accelerating potential difference V</text>

  <!-- results box -->
  <rect x="430" y="232" width="300" height="118" rx="8" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb" stroke-width="1.5"/>
  <text x="445" y="256" font-size="14" fill="#1f2937">Starting from rest: K = ½mv² = eV</text>
  <text x="445" y="280" font-size="14" fill="#1f2937">p = √(2mK) = √(2meV)</text>
  <text x="445" y="304" font-size="14" fill="#1f2937">λ = h/p = h/√(2meV)</text>
  <text x="445" y="328" font-size="14" fill="#1f2937">λ ≈ 1.227/√V nm  (V in volt)</text>
</svg>
