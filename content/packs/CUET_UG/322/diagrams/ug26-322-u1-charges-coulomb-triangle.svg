<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Arial, Helvetica, sans-serif">
  <!-- triangle sides -->
  <line x1="320" y1="170" x2="210" y2="360.5" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="320" y1="170" x2="430" y2="360.5" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="210" y1="360.5" x2="430" y2="360.5" stroke="#1f2937" stroke-width="1.5"/>
  <text x="248" y="270" font-size="15" font-style="italic" fill="#1f2937" text-anchor="end">a</text>
  <text x="392" y="270" font-size="15" font-style="italic" fill="#1f2937">a</text>
  <text x="320" y="382" font-size="15" font-style="italic" fill="#1f2937" text-anchor="middle">a</text>
  <!-- parallelogram completion -->
  <line x1="359" y1="102.5" x2="320" y2="34.9" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="281" y1="102.5" x2="320" y2="34.9" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4"/>
  <!-- force due to B (along B to A, away from B) -->
  <line x1="329" y1="154.4" x2="353" y2="112.9" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="359,102.5 358.2,115.9 347.8,109.9" fill="#dc2626"/>
  <!-- force due to C (along C to A, away from C) -->
  <line x1="311" y1="154.4" x2="287" y2="112.9" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="281,102.5 292.2,109.9 281.8,115.9" fill="#2563eb"/>
  <!-- resultant -->
  <line x1="320" y1="152" x2="320" y2="48" stroke="#059669" stroke-width="2.5"/>
  <polygon points="320,35 313,49 327,49" fill="#059669"/>
  <!-- charges -->
  <circle cx="320" cy="170" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="320" y="175" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">+</text>
  <circle cx="210" cy="360.5" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="210" y="366" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">+</text>
  <circle cx="430" cy="360.5" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="430" y="366" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">+</text>
  <!-- labels -->
  <text x="296" y="196" font-size="15" fill="#1f2937" text-anchor="end">A (+q)</text>
  <text x="190" y="392" font-size="15" fill="#1f2937" text-anchor="middle">B (+q)</text>
  <text x="450" y="392" font-size="15" fill="#1f2937" text-anchor="middle">C (+q)</text>
  <text x="366" y="134" font-size="15" fill="#dc2626">F<tspan font-size="11" dy="4">AB</tspan></text>
  <text x="274" y="134" font-size="15" fill="#2563eb" text-anchor="end">F<tspan font-size="11" dy="4">AC</tspan></text>
  <text x="334" y="56" font-size="15" fill="#059669">F<tspan font-size="11" dy="4">net</tspan><tspan dy="-4"> = √3 F</tspan></text>
  <text x="320" y="418" font-size="13" fill="#1f2937" text-anchor="middle">F<tspan font-size="10" dy="3">AB</tspan><tspan dy="-3"> = F</tspan><tspan font-size="10" dy="3">AC</tspan><tspan dy="-3"> = F = kq²/a², 60° apart; F</tspan><tspan font-size="10" dy="3">net</tspan><tspan dy="-3"> = 2F cos 30° along the outward bisector</tspan></text>
</svg>
