<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" font-family="Arial, Helvetica, sans-serif">
<text x="20" y="28" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="start">Why a sin θ = λ gives the first minimum</text>
<rect x="120" y="60" width="12" height="50" fill="#1f2937"/><rect x="120" y="310" width="12" height="60" fill="#1f2937"/>
<line x1="40.0" y1="210.0" x2="112.0" y2="210.0" stroke="#1d4ed8" stroke-width="1.2"/><polygon points="112.0,210.0 103.7,206.5 103.7,213.5" fill="#1d4ed8"/>
<text x="24" y="196" font-size="12" fill="#1d4ed8" text-anchor="start">plane wave</text>
<line x1="108" y1="110" x2="108" y2="310" stroke="#b45309" stroke-width="1.5"/><line x1="108.0" y1="118.0" x2="108.0" y2="110.0" stroke="#b45309" stroke-width="1.5"/><polygon points="108.0,110.0 104.5,118.3 111.5,118.3" fill="#b45309"/>
<line x1="108.0" y1="302.0" x2="108.0" y2="310.0" stroke="#b45309" stroke-width="1.5"/><polygon points="108.0,310.0 111.5,301.7 104.5,301.7" fill="#b45309"/>
<text x="96" y="262" font-size="15" fill="#b45309" font-weight="bold" text-anchor="end">a</text>
<line x1="132" y1="110" x2="328.4" y2="197.4" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="138" y="104" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="start">A</text>
<line x1="132" y1="210" x2="328.4" y2="297.4" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="138" y="202" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="start">M</text>
<line x1="132" y1="310" x2="328.4" y2="397.4" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="138" y="326" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="start">B</text>
<line x1="132" y1="210" x2="262" y2="210" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="132" y1="210" x2="169.2" y2="126.5" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="132" y1="110" x2="169.2" y2="126.5" stroke="#b91c1c" stroke-width="4"/>
<text x="60" y="150" font-size="12" fill="#b91c1c" font-weight="bold" text-anchor="start">extra path of ray A</text>
<text x="60" y="166" font-size="12" fill="#b91c1c" text-anchor="start">= (a/2) sin θ</text>
<path d="M 222 210 A 90 90 0 0 1 214.2 246.6" fill="none" stroke="#1f2937" stroke-width="1.2"/><text x="230" y="236" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="start">θ</text>
<text x="400" y="105" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="start">Split the slit into two halves.</text>
<text x="400" y="130" font-size="13" fill="#1f2937" text-anchor="start">Rays from points a/2 apart (one in each half)</text>
<text x="400" y="148" font-size="13" fill="#1f2937" text-anchor="start">differ in path by (a/2) sin θ.</text>
<text x="400" y="180" font-size="13" fill="#1f2937" text-anchor="start">When (a/2) sin θ = λ/2 every such pair cancels,</text>
<text x="400" y="198" font-size="13" fill="#1f2937" text-anchor="start">so the whole slit gives zero intensity at that angle:</text>
<text x="400" y="232" font-size="18" fill="#15803d" font-weight="bold" text-anchor="start">a sin θ = λ</text>
<text x="400" y="262" font-size="13" fill="#15803d" text-anchor="start">General minima:  a sin θ = nλ  (n = ±1, ±2, ±3, …)</text>
<text x="400" y="292" font-size="13" fill="#b91c1c" text-anchor="start">n = 0 is NOT a minimum: it is the central maximum.</text>
</svg>
