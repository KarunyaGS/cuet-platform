<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Arial, Helvetica, sans-serif">
  <text x="410" y="22" font-size="14" fill="#1f2937" text-anchor="middle">Diode symbol: the arrow points in the direction of forward (conventional) current</text>
  <line x1="350" y1="48" x2="392" y2="48" stroke="#1f2937" stroke-width="2"/>
  <polygon points="392,36 392,60 414,48" fill="#1f2937"/>
  <line x1="415" y1="36" x2="415" y2="60" stroke="#1f2937" stroke-width="2.5"/>
  <line x1="415" y1="48" x2="458" y2="48" stroke="#1f2937" stroke-width="2"/>
  <text x="344" y="53" font-size="14" fill="#1f2937" text-anchor="end">p (anode)</text>
  <text x="464" y="53" font-size="14" fill="#1f2937">n (cathode)</text>
  <text x="200" y="92" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">(a) Forward bias</text>
  <rect x="80" y="100" width="240" height="50" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="188" y="100" width="24" height="50" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="200" y1="100" x2="200" y2="150" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="80" y="100" width="240" height="50" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="125" y="131" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">p</text>
  <text x="275" y="131" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">n</text>
  <text x="200" y="167" font-size="13" fill="#d97706" text-anchor="middle">narrow depletion layer</text>
  <polyline points="80,125 50,125 50,300 190,300" fill="none" stroke="#1f2937" stroke-width="2"/>
  <polyline points="320,125 350,125 350,175" fill="none" stroke="#1f2937" stroke-width="2"/>
  <polyline points="350,175 359,185 341,195 359,205 341,215 359,225 350,235" fill="none" stroke="#1f2937" stroke-width="2"/>
  <polyline points="350,235 350,300 210,300" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="366" y="210" font-size="14" fill="#1f2937">R</text>
  <line x1="190" y1="280" x2="190" y2="320" stroke="#1f2937" stroke-width="2"/>
  <line x1="210" y1="290" x2="210" y2="310" stroke="#1f2937" stroke-width="4"/>
  <text x="180" y="276" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">+</text>
  <text x="220" y="276" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">−</text>
  <text x="200" y="338" font-size="14" fill="#1f2937" text-anchor="middle">battery, voltage V</text>
  <line x1="50" y1="229" x2="50" y2="209" stroke="#dc2626" stroke-width="3"/>
  <polygon points="50,199 43,212 57,212" fill="#dc2626"/>
  <text x="40" y="220" font-size="14" fill="#dc2626" text-anchor="end">I (mA)</text>
  <text x="200" y="368" font-size="14" fill="#1f2937" text-anchor="middle">p to +, n to −: barrier falls to V<tspan dy="4" font-size="11">0</tspan><tspan dy="-4"> − V</tspan></text>
  <text x="200" y="388" font-size="14" fill="#1f2937" text-anchor="middle">large current, many mA (majority carriers)</text>
  <text x="620" y="92" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">(b) Reverse bias</text>
  <rect x="500" y="100" width="240" height="50" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="578" y="100" width="84" height="50" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="620" y1="100" x2="620" y2="150" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="500" y="100" width="240" height="50" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="545" y="131" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">p</text>
  <text x="695" y="131" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">n</text>
  <text x="620" y="167" font-size="13" fill="#d97706" text-anchor="middle">wide depletion layer</text>
  <polyline points="500,125 470,125 470,300 610,300" fill="none" stroke="#1f2937" stroke-width="2"/>
  <polyline points="740,125 770,125 770,175" fill="none" stroke="#1f2937" stroke-width="2"/>
  <polyline points="770,175 779,185 761,195 779,205 761,215 779,225 770,235" fill="none" stroke="#1f2937" stroke-width="2"/>
  <polyline points="770,235 770,300 630,300" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="786" y="210" font-size="14" fill="#1f2937">R</text>
  <line x1="610" y1="290" x2="610" y2="310" stroke="#1f2937" stroke-width="4"/>
  <line x1="630" y1="280" x2="630" y2="320" stroke="#1f2937" stroke-width="2"/>
  <text x="600" y="276" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">−</text>
  <text x="640" y="276" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">+</text>
  <text x="620" y="338" font-size="14" fill="#1f2937" text-anchor="middle">battery, voltage V</text>
  <line x1="770" y1="284" x2="770" y2="264" stroke="#dc2626" stroke-width="3"/>
  <polygon points="770,254 763,267 777,267" fill="#dc2626"/>
  <text x="782" y="275" font-size="14" fill="#dc2626" text-anchor="start">I (µA)</text>
  <text x="620" y="368" font-size="14" fill="#1f2937" text-anchor="middle">p to −, n to +: barrier rises to V<tspan dy="4" font-size="11">0</tspan><tspan dy="-4"> + V</tspan></text>
  <text x="620" y="388" font-size="14" fill="#1f2937" text-anchor="middle">tiny current, µA (minority carriers)</text>
  <line x1="410" y1="75" x2="410" y2="395" stroke="#d1d5db" stroke-width="1.5"/>
</svg>
