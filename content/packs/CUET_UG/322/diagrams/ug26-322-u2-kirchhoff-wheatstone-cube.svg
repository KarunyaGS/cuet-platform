<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" width="620" height="440" font-family="Arial, Helvetica, sans-serif">
  <!-- hidden edges (meeting at the back-bottom-left corner) -->
  <g stroke="#9ca3af" stroke-width="2" stroke-dasharray="7,5" fill="none">
    <line x1="150" y1="360" x2="260" y2="280"/>
    <line x1="260" y1="280" x2="480" y2="280"/>
    <line x1="260" y1="280" x2="260" y2="60"/>
  </g>
  <!-- visible edges -->
  <g stroke="#1f2937" stroke-width="2.2" fill="none">
    <polygon points="150,360 370,360 370,140 150,140"/>
    <line x1="370" y1="360" x2="480" y2="280"/>
    <line x1="480" y1="280" x2="480" y2="60"/>
    <line x1="370" y1="140" x2="480" y2="60"/>
    <line x1="150" y1="140" x2="260" y2="60"/>
    <line x1="260" y1="60" x2="480" y2="60"/>
  </g>
  <!-- current arrows: edges leaving A carry I/3 -->
  <polygon points="268.0,360.0 252.0,366.0 252.0,354.0" fill="#d97706"/>
  <polygon points="150.0,242.0 156.0,258.0 144.0,258.0" fill="#d97706"/>
  <polygon points="211.5,315.3 202.1,329.6 195.0,319.9" fill="#d97706"/>
  <!-- middle edges carry I/6 -->
  <polygon points="370.0,242.0 376.0,258.0 364.0,258.0" fill="#2563eb"/>
  <polygon points="431.5,315.3 422.1,329.6 415.0,319.9" fill="#2563eb"/>
  <polygon points="268.0,140.0 252.0,146.0 252.0,134.0" fill="#2563eb"/>
  <polygon points="211.5,95.3 202.1,109.6 195.0,99.9" fill="#2563eb"/>
  <polygon points="378.0,280.0 362.0,286.0 362.0,274.0" fill="#2563eb"/>
  <polygon points="260.0,162.0 266.0,178.0 254.0,178.0" fill="#2563eb"/>
  <!-- edges entering B carry I/3 -->
  <polygon points="431.5,95.3 422.1,109.6 415.0,99.9" fill="#059669"/>
  <polygon points="480.0,162.0 486.0,178.0 474.0,178.0" fill="#059669"/>
  <polygon points="378.0,60.0 362.0,66.0 362.0,54.0" fill="#059669"/>

  <!-- corners A and B with leads -->
  <circle cx="150" cy="360" r="6" fill="#1f2937"/>
  <circle cx="480" cy="60" r="6" fill="#1f2937"/>
  <line x1="90" y1="410" x2="150" y2="360" stroke="#1f2937" stroke-width="2"/>
  <polygon points="129.2,377.4 113.6,383.0 122.4,371.0" fill="#dc2626"/>
  <text x="102" y="372" font-size="16" fill="#dc2626" font-weight="bold">I</text>
  <line x1="480" y1="60" x2="545" y2="18" stroke="#1f2937" stroke-width="2"/>
  <polygon points="526.9,29.7 514.8,41.0 520.1,27.0" fill="#dc2626"/>
  <text x="532" y="50" font-size="16" fill="#dc2626" font-weight="bold">I</text>
  <text x="160" y="392" font-size="18" fill="#1f2937" font-weight="bold">A</text>
  <text x="500" y="80" font-size="18" fill="#1f2937" font-weight="bold">B</text>

  <!-- edge current labels -->
  <text x="260" y="388" font-size="15" fill="#d97706" text-anchor="middle">I/3</text>
  <text x="140" y="254" font-size="15" fill="#d97706" text-anchor="end">I/3</text>
  <text x="380" y="254" font-size="15" fill="#2563eb">I/6</text>
  <text x="292" y="132" font-size="15" fill="#2563eb">I/6</text>
  <text x="440" y="122" font-size="15" fill="#059669">I/3</text>
  <text x="490" y="176" font-size="15" fill="#059669">I/3</text>

  <text x="330" y="428" font-size="14" fill="#1f2937" text-anchor="middle">Each of the 12 edges has resistance R; current I enters at A and leaves at B</text>
</svg>
