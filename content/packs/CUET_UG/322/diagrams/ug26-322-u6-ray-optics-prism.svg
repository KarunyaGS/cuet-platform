<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Arial, Helvetica, sans-serif">
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1f2937">Refraction through a prism (A = 60°, n = 1.5, i = 50°)</text>
  <!-- prism -->
  <polygon points="380,70 229.9,330 530.1,330" fill="#2563eb" fill-opacity="0.08" stroke="#1f2937" stroke-width="2"/>
  <path d="M395 96 A30 30 0 0 1 365 96" fill="none" stroke="#1f2937" stroke-width="1.3"/>
  <text x="374" y="124" font-size="15" fill="#1f2937">A</text>
  <!-- normals -->
  <line x1="244.3" y1="165" x2="356.9" y2="230" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="514.6" y1="163.2" x2="402" y2="228.2" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- incident, refracted and emergent rays -->
  <line x1="145.2" y1="258.1" x2="304.9" y2="200" stroke="#2563eb" stroke-width="2"/>
  <polygon points="233.1,226.2 224.3,234.2 221.2,225.7" fill="#2563eb"/>
  <line x1="304.9" y1="200" x2="454" y2="198.2" stroke="#2563eb" stroke-width="2"/>
  <polygon points="386.9,199 376,203.6 375.9,194.6" fill="#2563eb"/>
  <line x1="454" y1="198.2" x2="635.5" y2="254.4" stroke="#2563eb" stroke-width="2"/>
  <polygon points="562.9,231.9 551,232.9 553.7,224.3" fill="#2563eb"/>
  <!-- extensions meeting inside the prism -->
  <line x1="304.9" y1="200" x2="451.4" y2="146.7" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="454" y1="198.2" x2="376.2" y2="174.1" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4 4"/>
  <!-- angle arcs -->
  <path d="M269.2 213 A38 38 0 0 1 272 181" fill="none" stroke="#dc2626" stroke-width="1.3"/>
  <text x="240" y="200" font-size="14" fill="#dc2626">i</text>
  <path d="M342.9 199.5 A38 38 0 0 1 337.8 219" fill="none" stroke="#dc2626" stroke-width="1.3"/>
  <text x="348" y="222" font-size="13" fill="#dc2626">r1</text>
  <path d="M421.1 217.2 A38 38 0 0 1 416 198.7" fill="none" stroke="#dc2626" stroke-width="1.3"/>
  <text x="394" y="222" font-size="13" fill="#dc2626">r2</text>
  <path d="M486.9 179.2 A38 38 0 0 1 490.3 209.4" fill="none" stroke="#dc2626" stroke-width="1.3"/>
  <text x="504" y="198" font-size="14" fill="#dc2626">e</text>
  <path d="M419.4 158.4 A46 46 0 0 1 420.1 187.7" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <text x="403" y="181" font-size="15" fill="#d97706">δ</text>
  <!-- labels -->
  <text x="120" y="280" font-size="14" fill="#1f2937">incident ray</text>
  <text x="560" y="280" font-size="14" fill="#1f2937">emergent ray</text>
  <text x="262" y="352" font-size="14" fill="#1f2937">base</text>
  <text x="560" y="90" font-size="13" fill="#1f2937">r1 = 30.7°, r2 = 29.3°</text>
  <text x="560" y="108" font-size="13" fill="#1f2937">r1 + r2 = A = 60°</text>
  <text x="560" y="126" font-size="13" fill="#1f2937">e = 47.2°</text>
  <text x="560" y="144" font-size="13" fill="#1f2937">δ = i + e − A = 37.2°</text>
  <text x="20" y="372" font-size="13" fill="#1f2937">Here i ≈ e and the ray inside is almost parallel to the base, so δ is very close to its minimum value (37.2°).</text>
</svg>
