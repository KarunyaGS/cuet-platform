<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Arial, Helvetica, sans-serif">
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1f2937">Light guided along an optical fibre by repeated total internal reflection</text>
  <!-- cladding and core -->
  <rect x="140" y="115" width="560" height="90" fill="#d97706" fill-opacity="0.12" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="140" y="135" width="560" height="50" fill="#2563eb" fill-opacity="0.10"/>
  <line x1="140" y1="135" x2="700" y2="135" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="140" y1="185" x2="700" y2="185" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="40" y1="160" x2="720" y2="160" stroke="#1f2937" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="34" y="176" font-size="12" fill="#1f2937">fibre axis</text>
  <!-- ray -->
  <polyline points="60,126.3 140,160 233.3,185 419.9,135 606.5,185 700,160 750,138.9" fill="none" stroke="#2563eb" stroke-width="2"/>
  <polygon points="108,146.5 96.1,146.4 99.6,138.1" fill="#2563eb"/>
  <polygon points="196,175 184.2,176.5 186.5,167.8" fill="#2563eb"/>
  <polygon points="345.3,155 335.8,162.2 333.5,153.5" fill="#2563eb"/>
  <polygon points="531.9,165 520.1,166.5 522.4,157.8" fill="#2563eb"/>
  <polygon points="662.6,170 653.1,177.2 650.8,168.5" fill="#2563eb"/>
  <polygon points="730,147.3 721.6,155.8 718.1,147.5" fill="#2563eb"/>
  <!-- normal at a reflection point -->
  <line x1="419.9" y1="100" x2="419.9" y2="175" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="380" y="95" font-size="13" fill="#1f2937">normal</text>
  <text x="430" y="152" font-size="13" fill="#dc2626">75°</text>
  <!-- labels -->
  <text x="150" y="250" font-size="14" fill="#1f2937">core: n1 = 1.50 (higher)</text>
  <line x1="230" y1="236" x2="300" y2="172" stroke="#1f2937" stroke-width="1"/>
  <text x="430" y="250" font-size="14" fill="#1f2937">cladding: n2 = 1.40 (lower)</text>
  <line x1="520" y1="236" x2="540" y2="198" stroke="#1f2937" stroke-width="1"/>
  <text x="20" y="282" font-size="13" fill="#1f2937">Angle of incidence at the core–cladding boundary = 75°, larger than the critical angle 69.0°, so no light leaks out.</text>
  <text x="24" y="112" font-size="13" fill="#1f2937">22.8° in air</text>
  <text x="20" y="304" font-size="13" fill="#1f2937">The ray enters the end face at 22.8° to the axis and travels at 15° to the axis inside the core.</text>
</svg>
