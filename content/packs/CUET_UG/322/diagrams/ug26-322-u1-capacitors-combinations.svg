<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="Arial, Helvetica, sans-serif">
  <!-- (a) series -->
  <text x="160" y="24" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">(a) Series</text>
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <polyline points="40,134 40,80 84,80"/>
    <line x1="92" y1="80" x2="144" y2="80"/>
    <line x1="152" y1="80" x2="204" y2="80"/>
    <polyline points="212,80 290,80 290,210 40,210 40,150"/>
  </g>
  <g stroke="#1f2937" stroke-width="3">
    <line x1="84" y1="64" x2="84" y2="96"/><line x1="92" y1="64" x2="92" y2="96"/>
    <line x1="144" y1="64" x2="144" y2="96"/><line x1="152" y1="64" x2="152" y2="96"/>
    <line x1="204" y1="64" x2="204" y2="96"/><line x1="212" y1="64" x2="212" y2="96"/>
  </g>
  <!-- battery -->
  <line x1="24" y1="134" x2="56" y2="134" stroke="#1f2937" stroke-width="2"/>
  <line x1="32" y1="150" x2="48" y2="150" stroke="#1f2937" stroke-width="4"/>
  <text x="62" y="147" font-size="14" fill="#1f2937">V</text>
  <g font-size="14" fill="#1f2937" text-anchor="middle">
    <text x="88" y="56">C₁</text><text x="148" y="56">C₂</text><text x="208" y="56">C₃</text>
  </g>
  <g font-size="12" fill="#6b7280" text-anchor="middle">
    <text x="88" y="114">V₁</text><text x="148" y="114">V₂</text><text x="208" y="114">V₃</text>
  </g>
  <g font-size="11" fill="#dc2626" text-anchor="end"><text x="82" y="102">+Q</text><text x="142" y="102">+Q</text><text x="202" y="102">+Q</text></g>
  <g font-size="11" fill="#2563eb"><text x="95" y="102">−Q</text><text x="155" y="102">−Q</text><text x="215" y="102">−Q</text></g>
  <text x="160" y="240" font-size="13" fill="#1f2937" text-anchor="middle">Same charge Q on each</text>
  <text x="160" y="258" font-size="13" fill="#1f2937" text-anchor="middle">V = V₁ + V₂ + V₃</text>
  <text x="160" y="280" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">1/C = 1/C₁ + 1/C₂ + 1/C₃</text>

  <!-- (b) parallel -->
  <text x="500" y="24" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">(b) Parallel</text>
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <polyline points="380,134 380,60 610,60"/>
    <polyline points="380,150 380,210 610,210"/>
    <line x1="460" y1="60" x2="460" y2="131"/><line x1="460" y1="139" x2="460" y2="210"/>
    <line x1="535" y1="60" x2="535" y2="131"/><line x1="535" y1="139" x2="535" y2="210"/>
    <line x1="610" y1="60" x2="610" y2="131"/><line x1="610" y1="139" x2="610" y2="210"/>
  </g>
  <g stroke="#1f2937" stroke-width="3">
    <line x1="444" y1="131" x2="476" y2="131"/><line x1="444" y1="139" x2="476" y2="139"/>
    <line x1="519" y1="131" x2="551" y2="131"/><line x1="519" y1="139" x2="551" y2="139"/>
    <line x1="594" y1="131" x2="626" y2="131"/><line x1="594" y1="139" x2="626" y2="139"/>
  </g>
  <line x1="364" y1="134" x2="396" y2="134" stroke="#1f2937" stroke-width="2"/>
  <line x1="372" y1="150" x2="388" y2="150" stroke="#1f2937" stroke-width="4"/>
  <text x="402" y="147" font-size="14" fill="#1f2937">V</text>
  <g font-size="14" fill="#1f2937">
    <text x="482" y="124">C₁</text><text x="557" y="124">C₂</text><text x="630" y="124">C₃</text>
  </g>
  <g font-size="12" fill="#6b7280">
    <text x="482" y="160">Q₁</text><text x="557" y="160">Q₂</text><text x="630" y="160">Q₃</text>
  </g>
  <text x="500" y="240" font-size="13" fill="#1f2937" text-anchor="middle">Same potential difference V across each</text>
  <text x="500" y="258" font-size="13" fill="#1f2937" text-anchor="middle">Q = Q₁ + Q₂ + Q₃</text>
  <text x="500" y="280" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">C = C₁ + C₂ + C₃</text>
  <text x="330" y="318" font-size="12" fill="#6b7280" text-anchor="middle">Battery symbol: long line = positive terminal, short thick line = negative terminal</text>
</svg>
