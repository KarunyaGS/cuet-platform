<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="Arial, Helvetica, sans-serif">
  <!-- shaded area between line and Q axis = energy -->
  <polygon points="80,270 80,70 460,70" fill="#dbeafe" stroke="none"/>
  <!-- strip at height q -->
  <rect x="80" y="160" width="197" height="12" fill="#93c5fd" stroke="#2563eb" stroke-width="1"/>
  <!-- axes -->
  <line x1="80" y1="270" x2="560" y2="270" stroke="#1f2937" stroke-width="2"/>
  <polygon points="570,270 558,264 558,276" fill="#1f2937"/>
  <line x1="80" y1="270" x2="80" y2="40" stroke="#1f2937" stroke-width="2"/>
  <polygon points="80,30 74,42 86,42" fill="#1f2937"/>
  <text x="560" y="320" font-size="14" fill="#1f2937" text-anchor="end">potential difference v (V)</text>
  <text x="92" y="36" font-size="14" fill="#1f2937">charge q (C)</text>
  <!-- line q = C v -->
  <line x1="80" y1="270" x2="480" y2="59.5" stroke="#dc2626" stroke-width="3"/>
  <line x1="460" y1="70" x2="460" y2="270" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,4"/>
  <circle cx="460" cy="70" r="4.5" fill="#dc2626"/>
  <text x="460" y="290" font-size="14" fill="#1f2937" text-anchor="middle">V</text>
  <text x="72" y="75" font-size="14" fill="#1f2937" text-anchor="end">Q</text>
  <text x="72" y="170" font-size="13" fill="#1f2937" text-anchor="end">q</text>
  <text x="386" y="150" font-size="14" font-weight="bold" fill="#dc2626">q = Cv (slope = C)</text>
  <text x="300" y="196" font-size="13" fill="#2563eb">strip: area = v dq = work to add dq</text>
  <text x="150" y="110" font-size="14" font-weight="bold" fill="#1f2937">shaded area = ½QV = U</text>
</svg>
