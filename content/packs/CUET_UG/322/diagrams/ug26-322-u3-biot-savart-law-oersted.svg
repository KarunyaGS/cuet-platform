<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="Arial, Helvetica, sans-serif">
  <!-- Panel (a): no current -->
  <text x="180" y="26" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">(a) Switch open: no current</text>
  <circle cx="180" cy="190" r="78" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="200" y="106" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">N</text>
  <text x="200" y="285" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">S</text>
  <text x="274" y="195" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E</text>
  <text x="86" y="195" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">W</text>
  <g transform="translate(180,190)">
    <polygon points="0,-62 9,0 -9,0" fill="#dc2626"/>
    <polygon points="0,62 9,0 -9,0" fill="#4b5563"/>
    <circle cx="0" cy="0" r="3" fill="#1f2937"/>
  </g>
  <rect x="175" y="62" width="10" height="250" fill="#d97706" fill-opacity="0.35" stroke="#d97706" stroke-width="1.5"/>
  <text x="180" y="52" font-size="13" fill="#d97706" text-anchor="middle">wire (just above the needle)</text>
  <text x="180" y="345" font-size="13" fill="#1f2937" text-anchor="middle">Needle lies along the wire (N-S)</text>

  <!-- divider -->
  <line x1="360" y1="40" x2="360" y2="335" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- Panel (b): current south to north -->
  <text x="540" y="26" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">(b) Switch closed: current S to N</text>
  <circle cx="540" cy="190" r="78" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="560" y="106" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">N</text>
  <text x="560" y="285" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">S</text>
  <text x="634" y="195" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E</text>
  <text x="446" y="195" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">W</text>
  <g transform="translate(540,190) rotate(-55)">
    <polygon points="0,-62 9,0 -9,0" fill="#dc2626"/>
    <polygon points="0,62 9,0 -9,0" fill="#4b5563"/>
    <circle cx="0" cy="0" r="3" fill="#1f2937"/>
  </g>
  <rect x="535" y="62" width="10" height="250" fill="#d97706" fill-opacity="0.35" stroke="#d97706" stroke-width="1.5"/>
  <!-- current arrow beside wire, pointing north -->
  <line x1="514" y1="106" x2="514" y2="74" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="514,62 507,76 521,76" fill="#2563eb"/>
  <text x="504" y="84" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="end">I (towards north)</text>
  <!-- field at needle points west -->
  <line x1="524" y1="246" x2="482" y2="246" stroke="#059669" stroke-width="2.5"/>
  <polygon points="470,246 484,239 484,253" fill="#059669"/>
  <text x="384" y="324" font-size="13" fill="#059669">B at the needle (below the wire) points west</text>
  <text x="540" y="350" font-size="13" fill="#1f2937" text-anchor="middle">North pole (red) swings towards the west</text>
</svg>
