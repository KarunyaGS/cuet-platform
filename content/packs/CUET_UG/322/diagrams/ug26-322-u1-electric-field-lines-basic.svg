<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="Arial, Helvetica, sans-serif">
  <!-- (a) isolated positive charge: lines radially outward -->
  <g stroke="#dc2626" stroke-width="1.8">
    <line x1="128.0" y1="140.0" x2="198.0" y2="140.0"/>
    <line x1="122.7" y1="127.3" x2="172.2" y2="77.8"/>
    <line x1="110.0" y1="122.0" x2="110.0" y2="52.0"/>
    <line x1="97.3" y1="127.3" x2="47.8" y2="77.8"/>
    <line x1="92.0" y1="140.0" x2="22.0" y2="140.0"/>
    <line x1="97.3" y1="152.7" x2="47.8" y2="202.2"/>
    <line x1="110.0" y1="158.0" x2="110.0" y2="228.0"/>
    <line x1="122.7" y1="152.7" x2="172.2" y2="202.2"/>
  </g>
  <g fill="#dc2626">
    <polygon points="176.0,140.0 166.0,145.0 166.0,135.0"/>
    <polygon points="156.7,93.3 153.1,103.9 146.1,96.9"/>
    <polygon points="110.0,74.0 115.0,84.0 105.0,84.0"/>
    <polygon points="63.3,93.3 73.9,96.9 66.9,103.9"/>
    <polygon points="44.0,140.0 54.0,135.0 54.0,145.0"/>
    <polygon points="63.3,186.7 66.9,176.1 73.9,183.1"/>
    <polygon points="110.0,206.0 105.0,196.0 115.0,196.0"/>
    <polygon points="156.7,186.7 146.1,183.1 153.1,176.1"/>
  </g>
  <circle cx="110" cy="140" r="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="110" y="146" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">+</text>
  <text x="110" y="262" font-size="14" fill="#1f2937" text-anchor="middle">(a) Isolated +q:</text>
  <text x="110" y="280" font-size="14" fill="#1f2937" text-anchor="middle">lines point outward</text>

  <!-- (b) isolated negative charge: lines radially inward -->
  <g stroke="#2563eb" stroke-width="1.8">
    <line x1="348.0" y1="140.0" x2="418.0" y2="140.0"/>
    <line x1="342.7" y1="127.3" x2="392.2" y2="77.8"/>
    <line x1="330.0" y1="122.0" x2="330.0" y2="52.0"/>
    <line x1="317.3" y1="127.3" x2="267.8" y2="77.8"/>
    <line x1="312.0" y1="140.0" x2="242.0" y2="140.0"/>
    <line x1="317.3" y1="152.7" x2="267.8" y2="202.2"/>
    <line x1="330.0" y1="158.0" x2="330.0" y2="228.0"/>
    <line x1="342.7" y1="152.7" x2="392.2" y2="202.2"/>
  </g>
  <g fill="#2563eb">
    <polygon points="368.0,140.0 378.0,135.0 378.0,145.0"/>
    <polygon points="356.9,113.1 360.4,102.5 367.5,109.6"/>
    <polygon points="330.0,102.0 325.0,92.0 335.0,92.0"/>
    <polygon points="303.1,113.1 292.5,109.6 299.6,102.5"/>
    <polygon points="292.0,140.0 282.0,145.0 282.0,135.0"/>
    <polygon points="303.1,166.9 299.6,177.5 292.5,170.4"/>
    <polygon points="330.0,178.0 335.0,188.0 325.0,188.0"/>
    <polygon points="356.9,166.9 367.5,170.4 360.4,177.5"/>
  </g>
  <circle cx="330" cy="140" r="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="330" y="147" font-size="18" font-weight="bold" fill="#2563eb" text-anchor="middle">−</text>
  <text x="330" y="262" font-size="14" fill="#1f2937" text-anchor="middle">(b) Isolated −q:</text>
  <text x="330" y="280" font-size="14" fill="#1f2937" text-anchor="middle">lines point inward</text>

  <!-- (c) uniform field -->
  <g stroke="#059669" stroke-width="1.8">
    <line x1="470" y1="70" x2="640" y2="70"/>
    <line x1="470" y1="105" x2="640" y2="105"/>
    <line x1="470" y1="140" x2="640" y2="140"/>
    <line x1="470" y1="175" x2="640" y2="175"/>
    <line x1="470" y1="210" x2="640" y2="210"/>
  </g>
  <g fill="#059669">
    <polygon points="566,70 554,64 554,76"/>
    <polygon points="566,105 554,99 554,111"/>
    <polygon points="566,140 554,134 554,146"/>
    <polygon points="566,175 554,169 554,181"/>
    <polygon points="566,210 554,204 554,216"/>
  </g>
  <text x="555" y="50" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">E</text>
  <text x="555" y="262" font-size="14" fill="#1f2937" text-anchor="middle">(c) Uniform field: parallel,</text>
  <text x="555" y="280" font-size="14" fill="#1f2937" text-anchor="middle">equally spaced lines</text>
</svg>
