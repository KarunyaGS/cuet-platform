  <!-- notes -->
  <text x="40" y="340" font-size="14" fill="#1f2937"><tspan fill="#dc2626" font-weight="bold">E</tspan> oscillates along y, <tspan fill="#2563eb" font-weight="bold">B</tspan> oscillates along z, and the wave travels along x: all three are mutually perpendicular.</text>
  <text x="40" y="362" font-size="14" fill="#1f2937">E and B reach their maxima and zeros at the same places and times (in phase).</text>
  <text x="40" y="384" font-size="13" fill="#4b5563">Amplitudes not to scale: in SI units B0 = E0/c, so B0 is numerically far smaller than E0.</text>
