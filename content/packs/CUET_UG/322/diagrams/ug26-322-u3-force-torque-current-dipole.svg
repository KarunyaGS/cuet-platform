<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Arial, Helvetica, sans-serif">
  <!-- Panel (a): loop face-on -->
  <text x="170" y="26" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">(a) Loop seen face-on</text>
  <circle cx="170" cy="190" r="95" fill="none" stroke="#1f2937" stroke-width="3"/>
  <polygon points="160,95 176,87 176,103" fill="#2563eb"/>
  <polygon points="75,200 67,184 83,184" fill="#2563eb"/>
  <polygon points="180,285 164,277 164,293" fill="#2563eb"/>
  <polygon points="265,180 257,196 273,196" fill="#2563eb"/>
  <text x="150" y="82" font-size="15" font-weight="bold" fill="#2563eb">I</text>
  <circle cx="170" cy="190" r="12" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
  <circle cx="170" cy="190" r="4" fill="#d97706"/>
  <text x="170" y="222" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">m out of the page</text>
  <text x="170" y="160" font-size="14" fill="#1f2937" text-anchor="middle">area A</text>
  <text x="170" y="320" font-size="13" fill="#1f2937" text-anchor="middle">Current anticlockwise as seen from here:</text>
  <text x="170" y="338" font-size="13" fill="#1f2937" text-anchor="middle">this face is a north pole; m = N I A</text>

  <line x1="345" y1="40" x2="345" y2="350" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- Panel (b): loop edge-on with field lines -->
  <text x="570" y="26" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">(b) Side view: field like a short bar magnet</text>
  <path d="M 500 165 C 560 165, 580 92, 500 86 C 420 92, 440 165, 500 165" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M 500 174 C 630 174, 650 38, 500 38 C 350 38, 370 174, 500 174" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M 500 195 C 560 195, 580 268, 500 274 C 420 268, 440 195, 500 195" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M 500 186 C 630 186, 650 322, 500 322 C 350 322, 370 186, 500 186" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="380" y1="180" x2="640" y2="180" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="508,38 522,31 522,45" fill="#2563eb"/>
  <polygon points="508,322 522,315 522,329" fill="#2563eb"/>
  <polygon points="652,180 638,173 638,187" fill="#2563eb"/>
  <!-- loop edge-on -->
  <ellipse cx="500" cy="180" rx="14" ry="72" fill="none" stroke="#1f2937" stroke-width="2.5"/>
  <circle cx="500" cy="108" r="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <circle cx="500" cy="108" r="3" fill="#1f2937"/>
  <circle cx="500" cy="252" r="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <path d="M 494 246 L 506 258 M 506 246 L 494 258" stroke="#1f2937" stroke-width="2"/>
  <!-- magnetic moment of the loop -->
  <line x1="500" y1="180" x2="552" y2="180" stroke="#d97706" stroke-width="4"/>
  <polygon points="566,180 550,172 550,188" fill="#d97706"/>
  <text x="540" y="168" font-size="14" font-weight="bold" fill="#d97706">m</text>
  <text x="424" y="200" font-size="14" font-weight="bold" fill="#dc2626">S face</text>
  <text x="530" y="214" font-size="14" font-weight="bold" fill="#dc2626">N face</text>
  <!-- equivalent bar magnet -->
  <rect x="680" y="168" width="50" height="24" fill="#2563eb"/>
  <rect x="730" y="168" width="50" height="24" fill="#dc2626"/>
  <text x="705" y="185" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">S</text>
  <text x="755" y="185" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">N</text>
  <line x1="690" y1="214" x2="756" y2="214" stroke="#d97706" stroke-width="3"/>
  <polygon points="770,214 756,207 756,221" fill="#d97706"/>
  <text x="730" y="240" font-size="13" fill="#1f2937" text-anchor="middle">equivalent</text>
  <text x="730" y="256" font-size="13" fill="#1f2937" text-anchor="middle">bar magnet</text>
  <text x="570" y="360" font-size="13" fill="#1f2937" text-anchor="middle">Top: current out of the page; bottom: into the page</text>
</svg>
