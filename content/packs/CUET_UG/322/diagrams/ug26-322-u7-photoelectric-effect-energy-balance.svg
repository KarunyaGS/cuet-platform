<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Arial, Helvetica, sans-serif">
<text x="20" y="28" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">Energy balance for one photoelectron: hν = φ₀ + K_max</text>
<line x1="70" y1="330" x2="70.0" y2="48.0" stroke="#1f2937" stroke-width="2"/><polygon points="70.0,40.0 65.5,50.0 74.5,50.0" fill="#1f2937"/>
<text x="40" y="185" font-size="14" fill="#1f2937" text-anchor="middle" transform="rotate(-90 40 185)">Energy of the electron</text>
<rect x="110" y="300" width="260" height="46" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5"/>
<text x="240" y="330" font-size="14" fill="#1f2937" text-anchor="middle">Metal: free electrons</text>
<line x1="110" y1="300" x2="370" y2="300" stroke="#1f2937" stroke-width="2.5"/>
<text x="380" y="305" font-size="13" fill="#1f2937" text-anchor="start">level of the most loosely bound electrons</text>
<line x1="110" y1="190" x2="370" y2="190" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 4"/>
<text x="380" y="195" font-size="13" fill="#d97706" text-anchor="start">vacuum level (just outside the metal)</text>
<line x1="110" y1="80" x2="370" y2="80" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 4"/>
<text x="380" y="85" font-size="13" fill="#059669" text-anchor="start">electron leaves with kinetic energy K_max</text>
<line x1="160" y1="300" x2="160.0" y2="96.4" stroke="#2563eb" stroke-width="3"/><polygon points="160.0,86.0 154.2,99.0 165.8,99.0" fill="#2563eb"/>
<text x="172" y="246" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold">photon</text>
<text x="172" y="264" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold">energy hν</text>
<line x1="290" y1="300" x2="290.0" y2="202.8" stroke="#d97706" stroke-width="3"/><polygon points="290.0,194.0 285.1,205.0 294.9,205.0" fill="#d97706"/>
<text x="300" y="250.0" font-size="14" fill="#d97706" text-anchor="start" font-weight="bold">φ₀ : work function, spent to escape</text>
<line x1="290" y1="190" x2="290.0" y2="92.8" stroke="#059669" stroke-width="3"/><polygon points="290.0,84.0 285.1,95.0 294.9,95.0" fill="#059669"/>
<text x="300" y="140.0" font-size="14" fill="#059669" text-anchor="start" font-weight="bold">K_max : kinetic energy left over</text>
<text x="20" y="392" font-size="13" fill="#6b7280" text-anchor="start">If hν &lt; φ₀ the electron cannot reach the vacuum level, so no emission occurs, however intense the light.</text>
<text x="20" y="412" font-size="13" fill="#6b7280" text-anchor="start">A more tightly bound electron loses extra energy inside the metal and leaves with less than K_max.</text>
</svg>
