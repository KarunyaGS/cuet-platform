<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="Arial, Helvetica, sans-serif">
  <!-- Panel (a): field lines of a long straight wire, current out of the page -->
  <text x="180" y="26" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">(a) Field lines and Amperian loop</text>
  <circle cx="180" cy="200" r="50" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="180" cy="200" r="90" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="8 5"/>
  <circle cx="180" cy="200" r="130" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <!-- anticlockwise arrowheads: top points left, bottom points right -->
  <polygon points="172,150 184,144 184,156" fill="#2563eb"/>
  <polygon points="188,250 176,244 176,256" fill="#2563eb"/>
  <polygon points="172,70 184,64 184,76" fill="#2563eb"/>
  <polygon points="188,330 176,324 176,336" fill="#2563eb"/>
  <!-- wire -->
  <circle cx="180" cy="200" r="13" fill="#fde68a" stroke="#1f2937" stroke-width="2"/>
  <circle cx="180" cy="200" r="3.5" fill="#1f2937"/>
  <text x="180" y="48" font-size="13" fill="#1f2937" text-anchor="middle">Current I at the centre flows out of the page</text>
  <!-- B tangent at 45 degrees on the Amperian loop -->
  <line x1="243.6" y1="136.4" x2="214" y2="106.8" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="205.5,98.3 210.2,114.1 220.6,103.7" fill="#dc2626"/>
  <text x="178" y="104" font-size="15" font-weight="bold" fill="#dc2626">B</text>
  <circle cx="243.6" cy="136.4" r="3" fill="#dc2626"/>
  <!-- radius r -->
  <line x1="180" y1="200" x2="116.4" y2="263.6" stroke="#059669" stroke-width="1.5"/>
  <text x="122" y="240" font-size="15" font-weight="bold" fill="#059669">r</text>
  <text x="180" y="358" font-size="13" fill="#059669" text-anchor="middle">Amperian loop: circle of radius r (dashed)</text>
  <text x="180" y="376" font-size="13" fill="#1f2937" text-anchor="middle">B · 2πr = μ0 I  so  B = μ0 I / 2πr</text>

  <!-- Panel (b): B versus r for a thick wire of radius a -->
  <text x="575" y="26" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">(b) B against r for a wire of radius a</text>
  <line x1="430" y1="320" x2="735" y2="320" stroke="#1f2937" stroke-width="2"/>
  <polygon points="745,320 731,313 731,327" fill="#1f2937"/>
  <line x1="430" y1="320" x2="430" y2="62" stroke="#1f2937" stroke-width="2"/>
  <polygon points="430,52 423,66 437,66" fill="#1f2937"/>
  <text x="440" y="60" font-size="14" fill="#1f2937">B (T)</text>
  <text x="700" y="345" font-size="14" fill="#1f2937">r (m)</text>
  <text x="420" y="338" font-size="14" fill="#1f2937">0</text>
  <!-- inside: straight line -->
  <line x1="430" y1="320" x2="510" y2="120" stroke="#dc2626" stroke-width="2.5"/>
  <!-- outside: 1/r -->
  <polyline points="510,120.0 520,142.2 530,160.0 540,174.5 550,186.7 560,196.9 570,205.7 580,213.3 590,220.0 600,225.9 610,231.1 620,235.8 630,240.0 640,243.8 650,247.3 660,250.4 670,253.3 680,256.0 690,258.5 700,260.7 710,262.9 720,264.8" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="510" y1="120" x2="510" y2="320" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="430" y1="120" x2="510" y2="120" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="505" y="338" font-size="14" fill="#1f2937">a</text>
  <text x="520" y="112" font-size="13" fill="#1f2937">maximum at the surface: μ0 I / 2πa</text>
  <text x="452" y="282" font-size="13" fill="#dc2626">B ∝ r</text>
  <text x="450" y="298" font-size="13" fill="#dc2626">(inside)</text>
  <text x="640" y="225" font-size="13" fill="#dc2626">B ∝ 1/r</text>
  <text x="640" y="208" font-size="13" fill="#dc2626">(outside)</text>
  <text x="580" y="376" font-size="13" fill="#1f2937" text-anchor="middle">Current spread uniformly over the cross-section</text>
</svg>
