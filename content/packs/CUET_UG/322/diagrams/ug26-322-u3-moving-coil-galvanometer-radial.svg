<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" font-family="Arial, Helvetica, sans-serif">
  <text x="360" y="26" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Top view of a moving coil galvanometer</text>
  <!-- pole pieces -->
  <path d="M 150 100 L 292.8 100 L 292.8 122.8 A 95 95 0 0 0 292.8 257.2 L 292.8 280 L 150 280 Z" fill="#fecaca" stroke="#1f2937" stroke-width="2"/>
  <path d="M 570 100 L 427.2 100 L 427.2 122.8 A 95 95 0 0 1 427.2 257.2 L 427.2 280 L 570 280 Z" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/>
  <text x="200" y="198" font-size="26" font-weight="bold" fill="#dc2626" text-anchor="middle">N</text>
  <text x="520" y="198" font-size="26" font-weight="bold" fill="#2563eb" text-anchor="middle">S</text>
  <text x="200" y="300" font-size="13" fill="#1f2937" text-anchor="middle">concave pole piece</text>
  <text x="520" y="300" font-size="13" fill="#1f2937" text-anchor="middle">concave pole piece</text>
  <!-- soft iron core -->
  <circle cx="360" cy="190" r="70" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
  <text x="392" y="160" font-size="13" fill="#1f2937" text-anchor="middle">soft iron</text>
  <text x="392" y="176" font-size="13" fill="#1f2937" text-anchor="middle">core</text>
  <!-- radial field lines in the gap -->
  <line x1="287.2" y1="128.9" x2="304.8" y2="143.7" stroke="#059669" stroke-width="1.8"/>
  <polygon points="303.3,142.4 292.4,139.8 298.9,132.1" fill="#059669"/>
  <line x1="270.7" y1="157.5" x2="292.3" y2="165.4" stroke="#059669" stroke-width="1.8"/>
  <polygon points="290.5,164.7 279.4,166.0 282.8,156.6" fill="#059669"/>
  <line x1="265.0" y1="190.0" x2="288.0" y2="190.0" stroke="#059669" stroke-width="1.8"/>
  <polygon points="286.0,190.0 276.0,195.0 276.0,185.0" fill="#059669"/>
  <line x1="270.7" y1="222.5" x2="292.3" y2="214.6" stroke="#059669" stroke-width="1.8"/>
  <polygon points="290.5,215.3 282.8,223.4 279.4,214.0" fill="#059669"/>
  <line x1="287.2" y1="251.1" x2="304.8" y2="236.3" stroke="#059669" stroke-width="1.8"/>
  <polygon points="303.3,237.6 298.9,247.9 292.4,240.2" fill="#059669"/>
  <line x1="415.2" y1="236.3" x2="432.8" y2="251.1" stroke="#059669" stroke-width="1.8"/>
  <polygon points="431.2,249.8 420.3,247.2 426.8,239.5" fill="#059669"/>
  <line x1="427.7" y1="214.6" x2="449.3" y2="222.5" stroke="#059669" stroke-width="1.8"/>
  <polygon points="447.4,221.8 436.3,223.1 439.7,213.7" fill="#059669"/>
  <line x1="432.0" y1="190.0" x2="455.0" y2="190.0" stroke="#059669" stroke-width="1.8"/>
  <polygon points="453.0,190.0 443.0,195.0 443.0,185.0" fill="#059669"/>
  <line x1="427.7" y1="165.4" x2="449.3" y2="157.5" stroke="#059669" stroke-width="1.8"/>
  <polygon points="447.4,158.2 439.7,166.3 436.3,156.9" fill="#059669"/>
  <line x1="415.2" y1="143.7" x2="432.8" y2="128.9" stroke="#059669" stroke-width="1.8"/>
  <polygon points="431.2,130.2 426.8,140.5 420.3,132.8" fill="#059669"/>
  <text x="600" y="150" font-size="13" fill="#059669">radial field</text>
  <text x="600" y="166" font-size="13" fill="#059669">in the gap</text>
  <!-- coil seen from above -->
  <line x1="288.1" y1="148.5" x2="431.9" y2="231.5" stroke="#d97706" stroke-width="4"/>
  <circle cx="288.1" cy="148.5" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <circle cx="288.1" cy="148.5" r="2.5" fill="#1f2937"/>
  <circle cx="431.9" cy="231.5" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <path d="M 426.4 226 L 437.4 237 M 437.4 226 L 426.4 237" stroke="#1f2937" stroke-width="2"/>
  <text x="380" y="248" font-size="13" font-weight="bold" fill="#d97706">coil</text>
  <!-- forces forming a couple -->
  <line x1="295.1" y1="136.4" x2="315.6" y2="100.9" stroke="#dc2626" stroke-width="3"/>
  <polygon points="322.6,88.7 321.7,104.4 309.5,97.4" fill="#dc2626"/>
  <text x="330" y="96" font-size="15" font-weight="bold" fill="#dc2626">F</text>
  <line x1="424.9" y1="243.6" x2="404.4" y2="279.1" stroke="#dc2626" stroke-width="3"/>
  <polygon points="397.4,291.3 398.3,275.6 410.5,282.6" fill="#dc2626"/>
  <text x="378" y="300" font-size="15" font-weight="bold" fill="#dc2626">F</text>
  <!-- notes -->
  <text x="30" y="345" font-size="13" fill="#1f2937">Field lines are radial, so the plane of the coil always contains B and the deflecting torque is NIAB at every angle.</text>
  <text x="30" y="365" font-size="13" fill="#1f2937">The two forces F form a couple; a spring (or suspension) supplies the restoring torque kφ.</text>
  <text x="30" y="383" font-size="13" fill="#1f2937">Coil sides: current out of the page on the left (dot), into the page on the right (cross).</text>
</svg>
