<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="Arial, Helvetica, sans-serif">
  <!-- (a) vacuum -->
  <text x="165" y="24" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">(a) No dielectric</text>
  <g stroke="#2563eb" stroke-width="1.6">
    <line x1="88" y1="65" x2="246" y2="65"/><line x1="88" y1="95" x2="246" y2="95"/><line x1="88" y1="125" x2="246" y2="125"/><line x1="88" y1="155" x2="246" y2="155"/><line x1="88" y1="185" x2="246" y2="185"/><line x1="88" y1="215" x2="246" y2="215"/><line x1="88" y1="245" x2="246" y2="245"/>
  </g>
  <g fill="#2563eb">
    <polygon points="172,65 161,60 161,70"/><polygon points="172,95 161,90 161,100"/><polygon points="172,125 161,120 161,130"/><polygon points="172,155 161,150 161,160"/><polygon points="172,185 161,180 161,190"/><polygon points="172,215 161,210 161,220"/><polygon points="172,245 161,240 161,250"/>
  </g>
  <rect x="78" y="45" width="10" height="220" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <rect x="246" y="45" width="10" height="220" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="70" y="160" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="end">+Q</text>
  <text x="264" y="160" font-size="15" font-weight="bold" fill="#2563eb">−Q</text>
  <text x="40" y="96" font-size="12" fill="#1f2937" text-anchor="middle">E = 0</text>
  <text x="292" y="96" font-size="12" fill="#1f2937" text-anchor="middle">E = 0</text>
  <line x1="88" y1="282" x2="246" y2="282" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="88" y1="274" x2="88" y2="290" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="246" y1="274" x2="246" y2="290" stroke="#1f2937" stroke-width="1.5"/>
  <text x="167" y="300" font-size="15" font-style="italic" fill="#1f2937" text-anchor="middle">d</text>
  <text x="167" y="322" font-size="14" fill="#1f2937" text-anchor="middle">E₀ = σ/ε₀,  C₀ = ε₀A/d</text>

  <!-- (b) dielectric filling the gap -->
  <text x="495" y="24" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">(b) Dielectric slab, constant K</text>
  <rect x="418" y="45" width="158" height="220" fill="#fef3c7" stroke="none"/>
  <g stroke="#2563eb" stroke-width="1.6">
    <line x1="418" y1="95" x2="576" y2="95"/><line x1="418" y1="155" x2="576" y2="155"/><line x1="418" y1="215" x2="576" y2="215"/>
  </g>
  <g fill="#2563eb">
    <polygon points="502,95 491,90 491,100"/><polygon points="502,155 491,150 491,160"/><polygon points="502,215 491,210 491,220"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">
    <text x="426" y="70">−</text><text x="426" y="130">−</text><text x="426" y="190">−</text><text x="426" y="250">−</text>
  </g>
  <g font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">
    <text x="568" y="70">+</text><text x="568" y="130">+</text><text x="568" y="190">+</text><text x="568" y="250">+</text>
  </g>
  <rect x="408" y="45" width="10" height="220" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <rect x="576" y="45" width="10" height="220" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="160" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="end">+Q</text>
  <text x="594" y="160" font-size="15" font-weight="bold" fill="#2563eb">−Q</text>
  <line x1="418" y1="282" x2="576" y2="282" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="418" y1="274" x2="418" y2="290" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="576" y1="274" x2="576" y2="290" stroke="#1f2937" stroke-width="1.5"/>
  <text x="497" y="300" font-size="15" font-style="italic" fill="#1f2937" text-anchor="middle">d</text>
  <text x="497" y="322" font-size="14" fill="#1f2937" text-anchor="middle">E = E₀/K,  C = Kε₀A/d</text>
