<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="Arial, Helvetica, sans-serif" fill="none">
  <!-- ===== series LCR circuit ===== -->
  <text x="210" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">(a) Series LCR circuit</text>
  <g stroke="#1f2937" stroke-width="2.2">
    <line x1="40" y1="90" x2="70" y2="90"/>
    <polyline points="70,90 75,80 85,100 95,80 105,100 115,80 125,100 130,90"/>
    <line x1="130" y1="90" x2="160" y2="90"/>
    <path d="M160,90 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0"/>
    <line x1="240" y1="90" x2="290" y2="90"/>
    <line x1="290" y1="70" x2="290" y2="110"/>
    <line x1="302" y1="70" x2="302" y2="110"/>
    <line x1="302" y1="90" x2="380" y2="90"/>
    <line x1="380" y1="90" x2="380" y2="300"/>
    <line x1="380" y1="300" x2="232" y2="300"/>
    <line x1="188" y1="300" x2="40" y2="300"/>
    <line x1="40" y1="300" x2="40" y2="90"/>
  </g>
  <circle cx="210" cy="300" r="22" fill="#ffffff" stroke="#1f2937" stroke-width="2.2"/>
  <path d="M196,300 q7,-14 14,0 q7,14 14,0" stroke="#1f2937" stroke-width="2"/>
  <text x="100" y="62" text-anchor="middle" font-size="16" font-style="italic" fill="#1f2937">R</text>
  <text x="200" y="62" text-anchor="middle" font-size="16" font-style="italic" fill="#1f2937">L</text>
  <text x="296" y="62" text-anchor="middle" font-size="16" font-style="italic" fill="#1f2937">C</text>
  <text x="100" y="130" text-anchor="middle" font-size="14" fill="#2563eb">V<tspan font-size="10" dy="4">R</tspan></text>
  <text x="200" y="130" text-anchor="middle" font-size="14" fill="#059669">V<tspan font-size="10" dy="4">L</tspan></text>
  <text x="296" y="130" text-anchor="middle" font-size="14" fill="#d97706">V<tspan font-size="10" dy="4">C</tspan></text>
  <polygon points="380,207 374,195 386,195" fill="#dc2626"/>
  <text x="392" y="205" font-size="15" font-style="italic" fill="#dc2626">i</text>
  <text x="210" y="345" text-anchor="middle" font-size="14" fill="#1f2937">source v = V<tspan font-size="10" dy="4">m</tspan><tspan dy="-4"> sin ωt</tspan></text>
  <text x="210" y="190" text-anchor="middle" font-size="13" fill="#6b7280">same current i in R, L and C</text>

  <!-- ===== phasor diagram ===== -->
  <line x1="440" y1="15" x2="440" y2="365" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="650" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">(b) Phasor diagram (V<tspan font-size="11" dy="4">L</tspan><tspan dy="-4"> &gt; V</tspan><tspan font-size="11" dy="4">C</tspan><tspan dy="-4">)</tspan></text>
  <!-- V_L - V_C construction -->
  <line x1="500" y1="160" x2="680" y2="160" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="680" y1="230" x2="680" y2="166" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="690" y="200" font-size="14" fill="#6b7280">V<tspan font-size="10" dy="4">L</tspan><tspan dy="-4"> − V</tspan><tspan font-size="10" dy="4">C</tspan></text>
  <!-- V_R along current -->
  <line x1="500" y1="230" x2="668" y2="230" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="680,230 668,224 668,236" fill="#2563eb"/>
  <text x="640" y="252" text-anchor="middle" font-size="14" fill="#2563eb">V<tspan font-size="10" dy="4">R</tspan><tspan dy="-4"> = IR</tspan></text>
  <!-- current (reference) -->
  <line x1="500" y1="230" x2="578" y2="230" stroke="#dc2626" stroke-width="4"/>
  <polygon points="590,230 578,224 578,236" fill="#dc2626"/>
  <text x="548" y="252" text-anchor="middle" font-size="14" fill="#dc2626">I</text>
  <!-- V_L up -->
  <line x1="500" y1="230" x2="500" y2="82" stroke="#059669" stroke-width="2.5"/>
  <polygon points="500,70 494,82 506,82" fill="#059669"/>
  <text x="510" y="82" font-size="14" fill="#059669">V<tspan font-size="10" dy="4">L</tspan><tspan dy="-4"> = IX</tspan><tspan font-size="10" dy="4">L</tspan></text>
  <!-- V_C down -->
  <line x1="500" y1="230" x2="500" y2="308" stroke="#d97706" stroke-width="2.5"/>
  <polygon points="500,320 494,308 506,308" fill="#d97706"/>
  <text x="510" y="318" font-size="14" fill="#d97706">V<tspan font-size="10" dy="4">C</tspan><tspan dy="-4"> = IX</tspan><tspan font-size="10" dy="4">C</tspan></text>
  <!-- resultant V -->
  <line x1="500" y1="230" x2="668.8" y2="164.3" stroke="#1f2937" stroke-width="3"/>
  <polygon points="680.0,160.0 671.0,169.9 666.6,158.8" fill="#1f2937"/>
  <text x="688" y="156" font-size="16" font-weight="bold" fill="#1f2937">V</text>
  <path d="M570,230 A70,70 0 0 0 565.2,204.6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="577" y="221" font-size="15" font-style="italic" fill="#1f2937">φ</text>
  <text x="650" y="352" text-anchor="middle" font-size="13" fill="#1f2937">V² = V<tspan font-size="9" dy="4">R</tspan><tspan font-size="9" dy="-10">2</tspan><tspan dy="6"> + (V</tspan><tspan font-size="9" dy="4">L</tspan><tspan dy="-4"> − V</tspan><tspan font-size="9" dy="4">C</tspan><tspan dy="-4">)²,  V leads I by φ</tspan></text>
</svg>
