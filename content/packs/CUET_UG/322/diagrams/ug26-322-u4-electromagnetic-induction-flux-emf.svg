<text x="40" y="110" font-size="14" fill="#1f2937" text-anchor="middle" transform="rotate(-90 40 110)">Flux Φ_B (Wb)</text>
<text x="668" y="155" font-size="14" fill="#1f2937" text-anchor="end">t (s)</text>
<polyline fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" points="100.0,150.0 300.0,70.0 500.0,70.0 600.0,150.0"/>
<line x1="100" y1="150" x2="100" y2="155" stroke="#1f2937" stroke-width="1.5"/>
<text x="100" y="170" font-size="13" fill="#1f2937" text-anchor="middle">0</text>
<line x1="200" y1="150" x2="200" y2="155" stroke="#1f2937" stroke-width="1.5"/>
<text x="200" y="170" font-size="13" fill="#1f2937" text-anchor="middle">1</text>
<line x1="300" y1="150" x2="300" y2="155" stroke="#1f2937" stroke-width="1.5"/>
<text x="300" y="170" font-size="13" fill="#1f2937" text-anchor="middle">2</text>
<line x1="400" y1="150" x2="400" y2="155" stroke="#1f2937" stroke-width="1.5"/>
<text x="400" y="170" font-size="13" fill="#1f2937" text-anchor="middle">3</text>
<line x1="500" y1="150" x2="500" y2="155" stroke="#1f2937" stroke-width="1.5"/>
<text x="500" y="170" font-size="13" fill="#1f2937" text-anchor="middle">4</text>
<line x1="600" y1="150" x2="600" y2="155" stroke="#1f2937" stroke-width="1.5"/>
<text x="600" y="170" font-size="13" fill="#1f2937" text-anchor="middle">5</text>
<text x="200" y="100" font-size="14" fill="#2563eb" text-anchor="middle">rising</text>
<text x="400" y="60" font-size="14" fill="#2563eb" text-anchor="middle">constant</text>
<text x="575.0" y="98" font-size="14" fill="#2563eb" text-anchor="start">falling</text>
<line x1="100" y1="330" x2="632.0" y2="330.0" stroke="#1f2937" stroke-width="2"/><polygon points="640.0,330.0 630.0,325.5 630.0,334.5" fill="#1f2937"/>
<line x1="100" y1="405" x2="100.0" y2="238.0" stroke="#1f2937" stroke-width="2"/><polygon points="100.0,230.0 95.5,240.0 104.5,240.0" fill="#1f2937"/>
<text x="40" y="320" font-size="14" fill="#1f2937" text-anchor="middle" transform="rotate(-90 40 320)">Induced emf ε (V)</text>
<text x="668" y="335" font-size="14" fill="#1f2937" text-anchor="end">t (s)</text>
<line x1="100" y1="352.5" x2="300" y2="352.5" stroke="#dc2626" stroke-width="3.5"/>
<line x1="300" y1="330" x2="500" y2="330" stroke="#dc2626" stroke-width="3.5"/>
<line x1="500" y1="285" x2="600" y2="285" stroke="#dc2626" stroke-width="3.5"/>
<line x1="300" y1="352.5" x2="300" y2="330" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="500" y1="330" x2="500" y2="285" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="100" y1="330" x2="100" y2="335" stroke="#1f2937" stroke-width="1.5"/>
<line x1="200" y1="330" x2="200" y2="335" stroke="#1f2937" stroke-width="1.5"/>
<line x1="300" y1="330" x2="300" y2="335" stroke="#1f2937" stroke-width="1.5"/>
<line x1="400" y1="330" x2="400" y2="335" stroke="#1f2937" stroke-width="1.5"/>
<text x="400" y="350" font-size="13" fill="#1f2937" text-anchor="middle">3</text>
<line x1="500" y1="330" x2="500" y2="335" stroke="#1f2937" stroke-width="1.5"/>
<text x="500" y="350" font-size="13" fill="#1f2937" text-anchor="middle">4</text>
<line x1="600" y1="330" x2="600" y2="335" stroke="#1f2937" stroke-width="1.5"/>
<text x="600" y="350" font-size="13" fill="#1f2937" text-anchor="middle">5</text>
<text x="200" y="374.5" font-size="14" fill="#dc2626" text-anchor="middle">ε negative, constant</text>
<text x="400" y="318" font-size="14" fill="#dc2626" text-anchor="middle">ε = 0</text>
<text x="550.0" y="275" font-size="14" fill="#dc2626" text-anchor="middle">ε positive, larger</text>
<text x="20" y="420" font-size="13" fill="#6b7280" text-anchor="start">Illustrative values. The flux rises slowly and then falls twice as fast, so the second emf</text>
<text x="20" y="438" font-size="13" fill="#6b7280" text-anchor="start">is twice as large and of opposite sign.</text>
