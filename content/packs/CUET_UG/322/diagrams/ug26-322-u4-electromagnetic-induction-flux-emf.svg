<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 455" width="700" height="455" font-family="Arial, Helvetica, sans-serif">
<text x="20" y="24" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">Faraday and Lenz: induced emf = − (rate of change of flux)</text>
