<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Arial, Helvetica, sans-serif">
  <!-- title formula -->
  <text x="380" y="30" font-size="16" fill="#1f2937" text-anchor="middle">While the capacitor charges:  i<tspan font-size="12" dy="4">d</tspan><tspan dy="-4"> = ε</tspan><tspan font-size="12" dy="4">0</tspan><tspan dy="-4"> dΦ</tspan><tspan font-size="12" dy="4">E</tspan><tspan dy="-4">/dt = I</tspan></text>

  <!-- wires -->
  <polyline points="302,160 110,160 110,330 365,330" fill="none" stroke="#1f2937" stroke-width="2"/>
  <polyline points="380,330 650,330 650,160 458,160" fill="none" stroke="#1f2937" stroke-width="2"/>

  <!-- battery: long line = + terminal (left), short line = - terminal (right) -->
  <line x1="365" y1="308" x2="365" y2="352" stroke="#1f2937" stroke-width="2.5"/>
  <line x1="380" y1="318" x2="380" y2="342" stroke="#1f2937" stroke-width="2.5"/>
  <text x="352" y="306" font-size="15" fill="#1f2937">+</text>
  <text x="386" y="314" font-size="15" fill="#1f2937">−</text>
  <text x="372" y="370" font-size="14" fill="#1f2937" text-anchor="middle">battery</text>

  <!-- capacitor plates -->
  <rect x="302" y="60" width="8" height="200" fill="#1f2937"/>
  <rect x="450" y="60" width="8" height="200" fill="#1f2937"/>
  <text x="306" y="52" font-size="15" fill="#1f2937" text-anchor="middle">+Q</text>
  <text x="454" y="52" font-size="15" fill="#1f2937" text-anchor="middle">−Q</text>

  <!-- surface charges -->
  <g font-size="13" fill="#dc2626" text-anchor="middle">
    <text x="318" y="84">+</text><text x="318" y="112">+</text><text x="318" y="140">+</text>
    <text x="318" y="190">+</text><text x="318" y="216">+</text><text x="318" y="244">+</text>
  </g>
  <g font-size="15" fill="#2563eb" text-anchor="middle">
    <text x="442" y="84">−</text><text x="442" y="112">−</text><text x="442" y="140">−</text>
    <text x="442" y="190">−</text><text x="442" y="216">−</text><text x="442" y="244">−</text>
  </g>

  <!-- electric field lines between plates (green) -->
  <g stroke="#059669" stroke-width="1.8">
    <line x1="328" y1="80" x2="424" y2="80"/>
    <line x1="328" y1="108" x2="424" y2="108"/>
    <line x1="328" y1="212" x2="424" y2="212"/>
    <line x1="328" y1="240" x2="424" y2="240"/>
  </g>
  <g fill="#059669">
    <polygon points="434,80 422,74 422,86"/>
    <polygon points="434,108 422,102 422,114"/>
    <polygon points="434,212 422,206 422,218"/>
    <polygon points="434,240 422,234 422,246"/>
  </g>
  <text x="380" y="232" font-size="14" fill="#059669" text-anchor="middle">E</text>
  <text x="380" y="100" font-size="14" fill="#059669" text-anchor="middle">E</text>

  <!-- displacement current (blue dashed) in the gap -->
  <line x1="328" y1="160" x2="420" y2="160" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 5"/>
  <polygon points="436,160 420,151 420,169" fill="#2563eb"/>
  <text x="378" y="146" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">i<tspan font-size="12" dy="4">d</tspan></text>

  <!-- conduction current arrows (red) -->
  <g fill="#dc2626">
    <polygon points="216,160 202,153 202,167"/>
    <polygon points="566,160 552,153 552,167"/>
    <polygon points="110,236 103,250 117,250"/>
    <polygon points="650,250 643,236 657,236"/>
    <polygon points="226,330 240,323 240,337"/>
    <polygon points="520,330 534,323 534,337"/>
  </g>
  <g font-size="16" fill="#dc2626" font-weight="bold">
    <text x="204" y="148">I</text>
    <text x="554" y="148">I</text>
    <text x="88" y="249">I</text>
    <text x="664" y="249">I</text>
    <text x="229" y="320">I</text>
    <text x="523" y="320">I</text>
  </g>

  <!-- legend -->
  <line x1="40" y1="396" x2="80" y2="396" stroke="#dc2626" stroke-width="2.5"/>
  <text x="88" y="401" font-size="14" fill="#1f2937">I : conduction current (charges move in the wires)</text>
  <line x1="420" y1="396" x2="460" y2="396" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="468" y="401" font-size="14" fill="#1f2937">i<tspan font-size="11" dy="3">d</tspan><tspan dy="-3"> : displacement current (no charge</tspan></text>
  <text x="468" y="419" font-size="14" fill="#1f2937">crosses the gap; E is growing)</text>
  <line x1="40" y1="416" x2="80" y2="416" stroke="#059669" stroke-width="2"/>
  <text x="88" y="421" font-size="14" fill="#1f2937">E : field between the plates, increasing</text>
</svg>
